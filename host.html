<html lang="en">

<style>
@font-face{font-family:"Playfair Display";font-style:normal;font-weight:400;font-display:swap;src:url(/assets/f/8a53e5ecdb.woff2) format("woff2");}
@font-face{font-family:"Playfair Display";font-style:normal;font-weight:700;font-display:swap;src:url(/assets/f/9401d0214a.woff2) format("woff2");}
@font-face{font-family:"Playfair Display";font-style:normal;font-weight:900;font-display:swap;src:url(/assets/f/0ba66220fb.woff2) format("woff2");}
@font-face{font-family:"Inter Tight";font-style:normal;font-weight:400;font-display:swap;src:url(/assets/f/2c20035257.woff2) format("woff2");}
@font-face{font-family:"Inter Tight";font-style:normal;font-weight:500;font-display:swap;src:url(/assets/f/5ab688ca8c.woff2) format("woff2");}
@font-face{font-family:"Inter Tight";font-style:normal;font-weight:700;font-display:swap;src:url(/assets/f/9e38e04780.woff2) format("woff2");}

<style>
:root{
  --bg:#FAF7F2; --surface:#FFFFFF; --text:#1B4332; --muted:#587263; --line:#E4DDCD;
  --field:#FBF9F4; --accent:#2D6A4F; --onaccent:#FAF7F2; --focus:#2D6A4F; --red:#B72323;
  --sans:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F2A20; --surface:#16382B; --text:#FAF7F2; --muted:#9DB8A9; --line:#26493B;
    --field:#12302A; --accent:#8FD0AE; --onaccent:#0F2A20; --focus:#8FD0AE; --red:#EA8888;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;color:var(--text);font-weight:700}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
.topbar{border-bottom:1px solid var(--line);padding:14px 0}
.tbrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tb{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.06em;color:var(--accent)}
.tb img{width:26px;height:auto}
.lnk{background:none;border:0;color:var(--muted);font-size:13px;padding:10px 6px;min-height:40px}
.lnk:hover{color:var(--red)}
.anav{display:flex;gap:8px;margin-top:10px}
.anav a{flex:1;display:flex;align-items:center;justify-content:center;min-height:40px;border-radius:999px;border:1px solid var(--line);text-decoration:none;color:var(--text);font-size:14px;font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:8px 14px;min-height:36px;border:1px solid var(--line);background:transparent;font-weight:500;text-decoration:none;color:var(--text);font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--accent);color:var(--onaccent);padding:10px 18px;border-radius:999px;font-size:14px;z-index:95;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
/* the desk */
.hd{max-width:430px;margin:0 auto;padding:0 18px 56px}
.hd h2{font-size:26px;margin:20px 0 4px;outline:none}
.hd .sub{color:var(--muted);font-size:14px;margin:0 0 14px;line-height:1.45}
.hd h3.sec{font-family:var(--sans);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 2px 8px}
.bigbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:999px;background:var(--accent);color:var(--onaccent);border:0;font:700 16px var(--sans);cursor:pointer;text-decoration:none}
.bigbtn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);margin-top:10px;font-weight:600}
.bigbtn[disabled]{opacity:.5;cursor:not-allowed}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.field small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.field input,.field select{font:inherit;font-size:16px;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-height:46px}
.pwrow{position:relative}.pwrow input{padding-right:64px}.pwrow button{position:absolute;right:6px;top:50%;transform:translateY(-50%);min-height:34px;border:0;background:transparent;color:var(--accent);font:600 13px var(--sans);padding:0 10px}
.err{color:var(--red);font-size:13px;font-weight:600;margin:0 0 12px}.err:empty{display:none}
.counter{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:12px 14px;margin:0 0 12px}
.counter .row{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px}
.counter b{font-family:var(--sans);font-weight:800;font-size:18px;font-variant-numeric:lining-nums tabular-nums}
.counter .bar{height:6px;border-radius:99px;background:var(--field);border:1px solid var(--line);margin-top:8px;overflow:hidden}.counter .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.counter.full .bar i{background:var(--red)}
.tcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:8px}
.tcard b{font-size:15px;overflow-wrap:anywhere}.tcard .m{grid-column:1;font-size:12.5px;color:var(--muted)}.tcard .btn{grid-row:1 / span 2;grid-column:2}
.st{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;border:1px solid var(--line);margin-left:6px;color:var(--muted);vertical-align:1px}
.st.open{border-color:var(--accent);color:var(--accent)}
.up{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;border:1px solid var(--accent);color:var(--accent);margin-left:6px;vertical-align:1px}
.back{display:inline-flex;align-items:center;min-height:40px;margin-top:10px;color:var(--accent);font-weight:700;background:none;border:0;padding:0;font-size:14px}
.linkbtn{background:none;border:0;color:var(--accent);font:600 14px var(--sans);padding:10px 0;min-height:44px}.linkbtn.danger{color:var(--red)}
details{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:14px;background:var(--surface)}summary{font-size:14px;font-weight:600;cursor:pointer;min-height:24px}details .field{margin:10px 0 0}
.qrc{border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:16px;margin:0 0 12px;text-align:center}
.qrc.edit{border-color:color-mix(in srgb,var(--red) 38%,var(--line))}
.qrc h3{font-family:var(--sans);font-size:16px;margin:0 0 2px}.qrc .why{font-size:12.5px;color:var(--muted);margin:0 0 12px;line-height:1.4}
.qrc .acts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.hd .tq-box svg{width:min(200px,58vw)}
.login{max-width:340px;margin:0 auto}
.login .brand{text-align:center;margin:26px 0 0}.login .brand img{width:48px}
.hint{font-size:12.5px;color:var(--muted);margin:14px 0 0;line-height:1.45;text-align:center}
</style>
<style>
.tq-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;display:flex;align-items:flex-end;justify-content:center}
.tq-sheet{background:var(--surface,#fff);color:var(--text,#111);width:100%;max-width:460px;border-radius:20px 20px 0 0;padding:20px 18px 22px;max-height:94vh;overflow:auto;text-align:center;font-family:var(--sans,sans-serif)}
@media(min-width:600px){.tq-ov{align-items:center}.tq-sheet{border-radius:20px}}
.tq-sheet h3{font-family:var(--display,serif);font-size:20px;margin:0 0 4px}
.tq-note{font-size:13.5px;color:var(--muted,#666);margin:0 0 12px;line-height:1.45}
.tq-chip{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 10px;margin-bottom:8px;border:1px solid}
.tq-ok{color:var(--accent,#2d6a4f);border-color:color-mix(in srgb,var(--accent,#2d6a4f) 40%,transparent);background:color-mix(in srgb,var(--accent,#2d6a4f) 12%,transparent)}
.tq-warn{color:var(--red,#b00);border-color:color-mix(in srgb,var(--red,#b00) 40%,transparent);background:color-mix(in srgb,var(--red,#b00) 11%,transparent)}
.tq-box{display:inline-block;background:#fff;padding:8px;border-radius:14px;border:1px solid var(--line,#ddd);line-height:0}
.tq-box svg{width:min(210px,60vw);height:auto;display:block}
.tq-cd{font:700 26px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.18em;margin:12px 0 2px;padding-left:.18em}
.tq-url{font-size:11.5px;color:var(--muted,#666);margin:4px 0 10px;line-height:1.4}.tq-url span{display:block;overflow-wrap:anywhere}
.tq-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.tq-b{font:inherit;font-size:13px;min-height:38px;padding:8px 14px;border-radius:999px;border:1px solid var(--line,#ddd);background:transparent;color:var(--text,#111);cursor:pointer}
.tq-b.tq-p{background:var(--accent,#2d6a4f);color:var(--onaccent,#fff);border-color:var(--accent,#2d6a4f);font-weight:700}
.tq-b:focus-visible{outline:2px solid var(--focus,#2d6a4f);outline-offset:2px}
.tq-printroot{display:none}
.tq-card{width:105mm;max-width:100%;min-height:148mm;margin:0 auto;background:#fff;color:#1B4332;padding:9mm 8mm;text-align:center;font-family:var(--sans,sans-serif);display:flex;flex-direction:column;align-items:center;justify-content:space-between;box-sizing:border-box}
.tq-card .tq-br{font:700 12px var(--sans,sans-serif);letter-spacing:.2em;text-transform:uppercase}
.tq-card .tq-tn{font:900 34px/1.1 var(--display,serif);margin:6px 0 2px}
.tq-card .tq-scan{font-size:14px;color:#587263;margin:0 0 10px}
.tq-card .tq-box{border-color:#E4DDCD;padding:6px}.tq-card .tq-box svg{width:62mm}
.tq-card .tq-cd{color:#1B4332;font-size:30px}
.tq-card .tq-how{font-size:12px;color:#587263;line-height:1.4;margin:0}.tq-card .tq-site{font-size:11px;color:#587263;margin-top:8px}
@media print{body.tq-printing>*:not(.tq-printroot){display:none!important}body.tq-printing .tq-printroot{display:block}@page{margin:8mm}}

</style>

  function top() { return '<div class="topbar"><div class="wrap"><div class="tbrow"><div class="tb"><img src="' + LOGO + '" alt="">' + esc(BRAND.toUpperCase()) + ' HOST DESK</div>' + (D ? '<button class="lnk" data-a="signout">Sign out</button>' : '') + '</div><nav class="anav" aria-label="Site"><a href="/index.html">Leaderboard</a><a href="/masuk.html">Table code</a></nav></div></div>'; }
  function loginView() {
    return '<main class="hd login"><h2 tabindex="-1">Host login</h2><p class="sub">For hosts the admin has set up. Make sessions and tables, and get their QR codes.</p>' + (S.note ? '<p class="sub" role="status">' + esc(S.note) + '</p>' : '')
      + '<div class="field"><label for="lg-n">Nickname</label><input id="lg-n" autocomplete="username" autocapitalize="none" spellcheck="false" value="' + esc(S.pre) + '"></div><div class="field"><label for="lg-p">Password</label><div class="pwrow"><input id="lg-p" type="password" autocomplete="current-password"><button type="button" data-a="showpw" aria-label="Show password">Show</button></div></div><p class="err" id="lg-e" role="alert">' + esc(S.err) + '</p>'
      + '<button class="bigbtn" data-a="login"' + (S.busy ? ' disabled' : '') + '>Log in</button><p class="hint">Forgot your password? Ask the admin to reset it.</p></main>';
  }
  function changeView() {
    return '<main class="hd"><h2 tabindex="-1">Choose your password</h2><p class="sub">The first password only got you in. Pick one that only you know.</p><div class="field"><label for="cp-1">New password</label><div class="pwrow"><input id="cp-1" type="password" autocomplete="new-password"><button type="button" data-a="showpw" aria-label="Show password">Show</button></div><small>At least 8 characters, and not part of your phone number.</small></div><div class="field"><label for="cp-2">Repeat it</label><input id="cp-2" type="password" autocomplete="new-password"></div><p class="err" id="cp-e" role="alert">' + esc(S.err) + '</p><button class="bigbtn" data-a="savepw"' + (S.busy ? ' disabled' : '') + '>Save and continue</button></main>';
  }
  function sesCard(s) {
    var up = s.date > todayLocal();
    return '<div class="tcard"><b>' + esc(s.label) + (up ? '<span class="up">Upcoming</span>' : '') + '</b><span class="m">' + esc(dtext(s.date)) + ' \u00b7 ' + s.tables.length + (s.tables.length === 1 ? ' table' : ' tables') + '</span><button class="btn" data-a="ses" data-id="' + esc(s.id) + '">Open</button></div>';
  }
  function homeView() {
    var made = D.made.tables, max = D.limits.tablesPerDay, full = made >= max;
    return '<main class="hd"><h2 tabindex="-1">Hi ' + esc(D.nickname) + '</h2><p class="sub">Make a session, add tables to it, then show the players their QR code.</p><div class="counter' + (full ? ' full' : '') + '"><div class="row"><span>Tables made today</span><span><b>' + made + '</b> of ' + max + '</span></div><div class="bar"><i style="width:' + Math.min(100, Math.round(made / max * 100)) + '%"></i></div></div>'
      + '<button class="bigbtn" data-a="new"' + (full ? ' disabled' : '') + '>+ New table</button>' + (full ? '<p class="err" style="margin-top:8px">You have made ' + max + ' tables today. You can make more tomorrow.</p>' : '') + '<button class="bigbtn ghost" data-a="newses">+ New session</button><h3 class="sec">My sessions</h3>'
      + (D.sessions.length ? D.sessions.map(sesCard).join('') : '<p class="sub">No sessions yet. Make one to start.</p>') + '</main>';
  }
  function sesView() {
    var s = findSes(S.ses); if (!s) { S.screen = 'home'; return homeView(); }
    var full = D.made.tables >= D.limits.tablesPerDay;
    return '<main class="hd"><button class="back" data-a="home">\u2039 My sessions</button><h2 tabindex="-1" style="margin-top:8px">' + esc(s.label) + '</h2><p class="sub">' + esc(dtext(s.date)) + (s.date > todayLocal() ? ' \u00b7 upcoming' : '') + '</p><button class="bigbtn" data-a="new"' + (full ? ' disabled' : '') + '>+ New table here</button><h3 class="sec">Tables</h3>'
      + (s.tables.length ? s.tables.slice().reverse().map(function (t) { return '<div class="tcard"><b>' + esc(t.label) + '<span class="st ' + (t.locked ? '' : 'open') + '">' + (t.locked ? 'Locked' : 'Open') + '</span></b><span class="m">made ' + esc(timeOf(t.createdAt)) + (t.hands ? ' \u00b7 ' + t.hands + ' hands recorded' : ' \u00b7 no hands yet') + '</span><button class="btn" data-a="codes" data-id="' + esc(t.id) + '">Codes and QR</button></div>'; }).join('') : '<p class="sub">No tables in this session yet.</p>')
      + '<div style="display:flex;gap:18px;margin-top:10px"><button class="linkbtn" data-a="rename">Rename session</button>' + (s.tables.length === 0 ? '<button class="linkbtn danger" data-a="delses">Delete session</button>' : '') + '</div></main>';
  }
  function newSesView() {
    return '<main class="hd"><button class="back" data-a="home">\u2039 My sessions</button><h2 tabindex="-1" style="margin-top:8px">New session</h2><p class="sub">' + (S.note ? esc(S.note) : 'A session groups the tables of one night or event. Any date works, so you can set one up ahead of time or record a past night.') + '</p><div class="field"><label for="ns-n">Session name</label><input id="ns-n" maxlength="40" placeholder="Friday night" autocomplete="off"></div><div class="field"><label for="ns-d">Date</label><input id="ns-d" type="date" value="' + esc(todayLocal()) + '"></div><p class="err" id="ns-e" role="alert">' + esc(S.err) + '</p><button class="bigbtn" data-a="mkses"' + (S.busy ? ' disabled' : '') + '>Create session</button></main>';
  }
  function nextName(sid) { var s = findSes(sid); return 'Table ' + ((s ? s.tables.length : 0) + 1); }
  function newTblView() {
    return '<main class="hd"><button class="back" data-a="' + (S.back || 'home') + '">\u2039 Back</button><h2 tabindex="-1" style="margin-top:8px">New table</h2><p class="sub">The scorekeeper can fill in the players on the scoreboard, so names here are optional.</p><div class="field"><label for="tn">Table name</label><input id="tn" value="' + esc(nextName(S.ses)) + '" maxlength="30" autocomplete="off"></div><div class="field"><label for="nt-s">Session</label><select id="nt-s">'
      + D.sessions.map(function (s) { return '<option value="' + esc(s.id) + '"' + (s.id === S.ses ? ' selected' : '') + '>' + esc(s.label) + ' (' + esc(dtext(s.date).replace(/^\w+ /, '')) + ')</option>'; }).join('') + '</select></div>'
      + '<details><summary>Add player names (optional)</summary>' + [1, 2, 3, 4].map(function (i) { return '<div class="field"><input id="np' + i + '" aria-label="Player ' + i + '" placeholder="Player ' + i + '" autocomplete="off" maxlength="40"></div>'; }).join('') + '</details><p class="err" id="nt-e" role="alert">' + esc(S.err) + '</p><button class="bigbtn" data-a="create"' + (S.busy ? ' disabled' : '') + '>Create table</button><button class="bigbtn ghost" data-a="' + (S.back || 'home') + '">Cancel</button></main>';
  }
  function origin() { return location.origin; }
  function qrCard(kind, t) {
    var host = kind === 'edit', url = origin() + '/scoreboard.html?' + (host ? 'code=' + t.code : 'view=' + t.viewCode);
    return '<div class="qrc' + (host ? ' edit' : '') + '"><span class="tq-chip ' + (host ? 'tq-warn' : 'tq-ok') + '">' + (host ? 'Only for the person keeping score' : 'For the players') + '</span><h3>' + (host ? 'Scorekeeper QR' : 'Players QR') + '</h3><p class="why">' + (host ? 'Opens the scoreboard so hands can be entered. Keep it on this phone.' : 'Opens the live table, read only. Put it on the table card.') + '</p><div class="tq-box">' + TBTQR.svg(url) + '</div><div class="tq-cd">' + esc(host ? t.code : t.viewCode) + '</div>' + TBTQR.addr(url) + '<div class="acts"><button class="btn" data-a="copy" data-u="' + esc(url) + '">Copy link</button>' + (navigator.share ? '<button class="btn" data-a="share" data-u="' + esc(url) + '">Share</button>' : '') + '</div></div>';
  }
  function codesView() {
    var o = findTbl(S.tbl); if (!o) { S.screen = 'home'; return homeView(); }
    var t = o.t, fresh = S.fresh;
    return '<main class="hd"><h2 tabindex="-1">' + esc(t.label) + (fresh ? ' is ready' : '') + '</h2><p class="sub">' + (fresh ? 'Show the players QR. Scan the scorekeeper QR on the phone that will keep score.' : esc(o.s.label) + ' \u00b7 made ' + esc(timeOf(t.createdAt))) + '</p>' + qrCard('view', t) + qrCard('edit', t)
      + '<button class="bigbtn" data-a="print" data-id="' + esc(t.id) + '">Print the table card</button>' + (!t.hands && !t.locked ? '<button class="linkbtn danger" style="display:block;margin:6px auto 0" data-a="deltable" data-id="' + esc(t.id) + '">Delete this table (no hands recorded)</button>' : '') + '<button class="bigbtn ghost" data-a="ses" data-id="' + esc(o.s.id) + '">Back to ' + esc(o.s.label) + '</button></main>';
  }
  function render() {
    var v = S.screen, body;
    if (v === 'boot') body = '<main class="hd"><p class="sub" style="margin-top:30px">Loading</p></main>';
    else if (!D && v !== 'login') body = loginView();
    else body = v === 'login' ? loginView() : v === 'change' ? changeView() : v === 'ses' ? sesView() : v === 'newses' ? newSesView() : v === 'new' ? newTblView() : v === 'codes' ? codesView() : homeView();
    app.innerHTML = (v === 'login' || (!D && v !== 'boot') ? top() : top()) + body;
    var f = app.querySelector('h2[tabindex]'); var inp = v === 'login' ? $('lg-n') : null;
    if (v === 'login') { var target = (S.pre && $('lg-p')) ? $('lg-p') : $('lg-n'); if (target) target.focus(); } else if (f && S.focusH) f.focus();
    S.focusH = false;
    var sel = $('nt-s'); if (sel) sel.addEventListener('change', function () { var tn = $('tn'); if (tn && /^Table \d+$/.test(tn.value)) tn.value = nextName(sel.value); });
  }
  function go(screen, extra) { S.screen = screen; S.err = ''; S.note = ''; S.focusH = true; if (extra) for (var k in extra) S[k] = extra[k]; render(); }
  function busy(on) { S.busy = on; document.querySelectorAll('.bigbtn[data-a]').forEach(function (b) { if (on) b.setAttribute('disabled', ''); else b.removeAttribute('disabled'); }); }
  var ACT = {
    showpw: function (el) { var i = el.parentNode.querySelector('input'); i.type = i.type === 'password' ? 'text' : 'password'; el.textContent = i.type === 'password' ? 'Show' : 'Hide'; el.setAttribute('aria-label', i.type === 'password' ? 'Show password' : 'Hide password'); },
    login: function () {
      var n = val('lg-n').trim(), p = val('lg-p'); S.pre = n; if (!n || !p) { $('lg-e').textContent = 'Enter your nickname and password.'; return; }
      busy(true); api('/api/host/login', 'POST', { nickname: n, password: p }).then(function (x) { busy(false); if (!x.ok) { S.err = x.j.error || 'Nickname or password is wrong.'; S.note = ''; render(); var pe = $('lg-p'); if (pe) pe.focus(); return; } S.pre = ''; S.err = ''; S.note = ''; return load().then(function () { S.focusH = true; render(); }); });
    },
    signout: function () { api('/api/host/logout', 'POST', {}).then(function () { D = null; S = { screen: 'login', err: '', note: '', busy: false, pre: '' }; render(); toast('Signed out'); }); },
    savepw: function () {
      var a = val('cp-1'), b = val('cp-2'); if (a.length < 8) { $('cp-e').textContent = 'Use at least 8 characters.'; $('cp-1').focus(); return; } if (a !== b) { $('cp-e').textContent = 'The two passwords do not match.'; $('cp-2').focus(); return; }
      busy(true); api('/api/host/password', 'POST', { next: a }).then(function (x) { busy(false); if (expired(x)) return; if (!x.ok) { S.err = x.j.error || 'Could not save the password.'; render(); $('cp-1').focus(); return; } toast('Password saved'); return load().then(function () { S.focusH = true; render(); }); });
    },
    home: function () { go('home'); }, newses: function () { go('newses'); },
    ses: function (el) { go('ses', { ses: el.dataset.id }); },
    new: function () { if (!D.sessions.length) { go('newses', { note: 'Make a session first, then add tables to it.' }); return; } var back = S.screen === 'ses' ? 'ses-back' : 'home'; if (!S.ses || !findSes(S.ses) || S.screen === 'home') { var today = todayLocal(), pick = D.sessions.filter(function (s) { return s.date === today; })[0] || D.sessions[0]; S.ses = pick.id; } go('new', { back: back }); },
    'ses-back': function () { go('ses'); },
    mkses: function () {
      var nm = val('ns-n').trim(), dt = val('ns-d'); if (!nm) { $('ns-e').textContent = 'Give the session a name.'; $('ns-n').focus(); return; } if (!dt) { $('ns-e').textContent = 'Pick a date.'; return; }
      busy(true); api('/api/host/sessions', 'POST', { label: nm, date: dt }).then(function (x) { busy(false); if (expired(x)) return; if (!x.ok) { S.err = x.j.error || 'Could not make the session.'; render(); return; } return load().then(function () { go('ses', { ses: x.j.id }); }); });
    },
    create: function () {
      var nm = val('tn').trim(), sid = val('nt-s'); if (!nm) { $('nt-e').textContent = 'Give the table a name.'; $('tn').focus(); return; }
      var names = [1, 2, 3, 4].map(function (i) { return val('np' + i).trim(); });
      busy(true); api('/api/host/tables', 'POST', { day_id: sid, label: nm, players: names }).then(function (x) { busy(false); if (expired(x)) return; if (!x.ok) { S.err = x.j.error || 'Could not make the table.'; render(); return; } return load().then(function () { S.ses = sid; S.fresh = true; go('codes', { tbl: x.j.id }); }); });
    },
    codes: function (el) { S.fresh = false; go('codes', { tbl: el.dataset.id }); },
    print: function (el) { var o = findTbl(el.dataset.id); if (o) TBTQR.card({ brand: BRAND, label: o.t.label, code: o.t.viewCode, url: origin() + '/scoreboard.html?view=' + o.t.viewCode }); },
    copy: function (el) { TBTQR.copy(el.dataset.u, function (ok) { toast(ok ? 'Link copied' : 'Could not copy'); }); },
    share: function (el) { try { navigator.share({ url: el.dataset.u }); } catch (e) { } },
    rename: function () { var s = findSes(S.ses); TBTQR.ask({ title: 'Rename session', label: 'Session name', input: s.label, ok: 'Save' }).then(function (v) { if (v == null || !String(v).trim()) return; api('/api/host/sessions/' + encodeURIComponent(s.id), 'PATCH', { label: v }).then(function (x) { if (expired(x)) return; if (!x.ok) { toast(x.j.error || 'Could not rename'); return; } load().then(function () { render(); toast('Session renamed'); }); }); }); },
    delses: function () { var s = findSes(S.ses); TBTQR.ask({ title: 'Delete this session?', text: 'It has no tables. Nothing is lost.', ok: 'Delete session' }).then(function (v) { if (!v) return; api('/api/host/sessions/' + encodeURIComponent(s.id), 'DELETE').then(function (x) { if (expired(x)) return; if (!x.ok) { toast(x.j.error || 'Could not delete'); return; } load().then(function () { go('home'); toast('Session deleted'); }); }); }); },
    deltable: function (el) { var o = findTbl(el.dataset.id); TBTQR.ask({ title: 'Delete this table?', text: 'No hands have been recorded on it. Its codes stop working.', ok: 'Delete table' }).then(function (v) { if (!v) return; api('/api/host/tables/' + encodeURIComponent(o.t.id), 'DELETE').then(function (x) { if (expired(x)) return; if (!x.ok) { toast(x.j.error || 'Could not delete'); return; } load().then(function () { go('ses', { ses: o.s.id }); toast('Table deleted'); }); }); }); },
  };
  document.addEventListener('click', function (e) { var el = e.target.closest && e.target.closest('[data-a]'); if (!el || el.disabled || !ACT[el.dataset.a]) return; e.preventDefault(); ACT[el.dataset.a](el); });
  document.addEventListener('keydown', function (e) { if (e.key !== 'Enter' || !e.target || !e.target.id) return; if (/^(lg-n|lg-p)$/.test(e.target.id)) { e.preventDefault(); ACT.login(); } else if (/^(cp-1|cp-2)$/.test(e.target.id)) { e.preventDefault(); ACT.savepw(); } else if (/^(ns-n|ns-d)$/.test(e.target.id)) { e.preventDefault(); ACT.mkses(); } else if (e.target.id === 'tn') { e.preventDefault(); ACT.create(); } });
  load().then(function () { render(); });
})();
</script>
</body>
</html>
