<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F2A20" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>TBT Admin &middot; Sesi</title>
<link rel="icon" type="image/png" href="/assets/i/0ba6198a03.png">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/assets/f/0ba66220fb.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/assets/f/2c20035257.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/assets/f/9e38e04780.woff2">
<style>
@font-face{font-family:"Playfair Display";font-style:normal;font-weight:400;font-display:swap;src:url(/assets/f/8a53e5ecdb.woff2) format("woff2");}
@font-face{font-family:"Playfair Display";font-style:normal;font-weight:700;font-display:swap;src:url(/assets/f/9401d0214a.woff2) format("woff2");}
@font-face{font-family:"Playfair Display";font-style:normal;font-weight:900;font-display:swap;src:url(/assets/f/0ba66220fb.woff2) format("woff2");}
@font-face{font-family:"Inter Tight";font-style:normal;font-weight:400;font-display:swap;src:url(/assets/f/2c20035257.woff2) format("woff2");}
@font-face{font-family:"Inter Tight";font-style:normal;font-weight:500;font-display:swap;src:url(/assets/f/5ab688ca8c.woff2) format("woff2");}
@font-face{font-family:"Inter Tight";font-style:normal;font-weight:700;font-display:swap;src:url(/assets/f/9e38e04780.woff2) format("woff2");}
</style>
<style>
:root{
  --bg:#FAF7F2; --surface:#FFFFFF; --text:#1B4332; --muted:#587263; --line:#E4DDCD;
  --field:#FBF9F4; --accent:#2D6A4F; --onaccent:#FAF7F2; --focus:#2D6A4F; --red:#B72323;
  --sans:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F2A20; --surface:#16382B; --text:#FAF7F2; --muted:#9DB8A9; --line:#26493B;
    --field:#12302A; --accent:#8FD0AE; --onaccent:#0F2A20; --focus:#8FD0AE; --red:#EA8888;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;color:var(--text);font-weight:700}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
.topbar{border-bottom:1px solid var(--line);padding:14px 0}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tb{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.06em;color:var(--accent)}
.tb img{width:26px;height:auto}
.lnk{background:none;border:0;color:var(--muted);font-size:13px;padding:4px 6px}
.lnk:hover{color:var(--red)}
main{padding:22px 0 70px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-bottom:6px}
.field input{font:inherit;font-size:16px;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.field input:focus-visible,button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.frow{display:flex;gap:12px;flex-wrap:wrap}
.frow .field{flex:1;min-width:130px}
.btn{display:inline-block;border-radius:999px;padding:9px 18px;border:1px solid var(--line);background:transparent;font-weight:500;text-decoration:none;color:var(--text);font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:700}
.btn.sm{padding:6px 12px;font-size:13px}
.dayrow{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;gap:10px}
.dayrow:hover strong{color:var(--accent)}
.meta{font-size:13px;color:var(--muted);margin-top:2px}
.tcard{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:var(--field)}
.th{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}
.cr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.cl{width:64px;font-size:13px;color:var(--muted)}
.code{font-family:var(--display);font-weight:900;font-size:20px;letter-spacing:.06em;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px 10px}
.login{max-width:300px;margin:90px auto;text-align:center}
.login img{width:48px;margin-bottom:12px}
.login input{font:inherit;font-size:16px;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--text);margin:14px 0;text-align:center}
.err{color:var(--red);font-size:13px;margin:6px 0}
.mb{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--accent);color:var(--onaccent);padding:10px 18px;border-radius:999px;font-size:14px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

/* navigation: the same bar on every admin page, with the current page marked */
.tbrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tbrow .lnk{padding:10px 6px;min-height:40px}
.anav{display:flex;gap:8px;margin-top:10px}
.anav a{flex:1;display:flex;align-items:center;justify-content:center;min-height:40px;border-radius:999px;border:1px solid var(--line);text-decoration:none;color:var(--text);font-size:14px;font-weight:500;white-space:nowrap}
.anav a[aria-current="page"]{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:700}
.btn.sm{padding:8px 14px;min-height:36px;display:inline-flex;align-items:center;justify-content:center}
.back{display:inline-flex;align-items:center;min-height:38px}
.topbar .wrap{display:block}
main .lnk,main .back{display:inline-flex;align-items:center;min-height:38px;padding:8px}
main .meta .lnk{padding:8px 6px!important}
main .meta a{display:inline-flex;align-items:center;min-height:38px}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
var LOGO='/assets/i/cfad30e8e7.png';
var password=sessionStorage.getItem('tbt-admin-pw')||'';
var authed=false,days=[],day=null,names=[],loginError='';
var nd={label:'',date:''};
var nt={label:'',p:['','','','']};

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function H(){return {'Authorization':'Bearer '+password,'Content-Type':'application/json'};}
function fmtDate(d){try{return new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});}catch(e){return d;}}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('show');},1800);}

function checkLogin(){
  if(!password)return Promise.resolve(false);
  return fetch('/api/admin/login',{method:'POST',headers:H()}).then(function(r){return r.ok;}).catch(function(){return false;});
}
function loadDays(){return fetch('/api/days').then(function(r){return r.ok?r.json():[];}).then(function(d){days=d;});}
// names already used in earlier sessions, offered as suggestions so spelling stays consistent
function loadNames(){
  return fetch('/api/overview').then(function(r){return r.ok?r.json():null;}).then(function(o){
    if(!o)return;var seen={};
    o.tables.forEach(function(t){t.players.forEach(function(p){var k=p.name.trim().toLowerCase();if(!seen[k])seen[k]=p.name;});});
    names=Object.keys(seen).map(function(k){return seen[k];}).sort(function(a,b){return a.localeCompare(b);});
  }).catch(function(){});
}
function openDay(id){
  return fetch('/api/days/'+encodeURIComponent(id),{headers:H()}).then(function(r){return r.ok?r.json():null;}).then(function(d){
    day=d;nt={label:d?'Meja '+(d.tables.length+1):'',p:['','','','']};render();window.scrollTo(0,0);
  });
}
function progText(t){
  if(!t.events)return 'Belum mulai';
  if(t.locked)return t.events+' hand, final (terkunci)';
  if(t.progress.done)return t.events+' hand, selesai';
  return t.events+' hand, ronde '+['East','South','West','North'][t.progress.wind];
}
var MODE_NAMES={casual:'Casual','default':'Default',tournament:'Tournament',custom:'Custom',mcr4:'MCR-4',mcr8:'MCR-8',mcrc:'MCR-Custom'};
function rulesLine(t){
  var r=t.rules;if(!r)return '';
  if(r.base!=null){var q=[modeLabel(t.mode),'base '+r.base,'min '+r.minPoint+' poin','dealer tidak mengulang'];if(r.seatRotation)q.push('rotasi kursi');return q.join(' \u00b7 ');}   // meja MCR
  var p=[modeLabel(t.mode),'min '+r.minPoint+' poin','streak '+r.maxStreak,r.start==null?'tanpa skor awal':'skor awal '+r.start];
  if(r.bankrupt)p.push('bankrupt');
  if(r.seatRotation)p.push('rotasi kursi');
  if(r.deadwall)p.push('deadwall');
  return p.join(' \u00b7 ');
}
function modeLabel(m){return MODE_NAMES[m||'casual']||'Casual';}
function unlockTable(code){
  if(!confirm('Buka kunci meja ini? Host bisa mengedit lagi sampai disimpan ulang.'))return;
  fetch('/api/lock/'+encodeURIComponent(code),{method:'DELETE',headers:H()}).then(function(r){if(!r.ok)throw new Error('x');return openDay(day.id);}).then(render).catch(function(){alert('Gagal membuka kunci.');});
}
function copyLink(kind,code){
  var url=location.origin+'/scoreboard.html?'+(kind==='host'?'code=':'view=')+code;
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(function(){toast('Link disalin');},function(){prompt('Salin link ini:',url);});
  else prompt('Salin link ini:',url);
}

function render(){
  var app=document.getElementById('app');
  if(!authed){
    app.innerHTML='<div class="login"><img src="'+LOGO+'" alt=""><h2>Admin</h2><input id="pw" type="password" placeholder="Password">'+(loginError?'<div class="err">'+loginError+'</div>':'')+'<button class="btn primary" style="width:100%" onclick="doLogin()">Masuk</button></div>';
    var pw=document.getElementById('pw');pw.onkeydown=function(e){if(e.key==='Enter')doLogin();};
    return;
  }
  app.innerHTML='<div class="topbar"><div class="wrap"><div class="tbrow"><div class="tb"><img src="'+LOGO+'" alt="">TBT ADMIN</div><button class="lnk" onclick="logout()">Keluar</button></div><nav class="anav" aria-label="Admin"><a href="/admin-daily.html" aria-current="page">Sesi</a><a href="/admin-pemain.html">Pemain</a><a href="/index.html" target="_blank" rel="noopener">Leaderboard &#8599;</a></nav></div></div><main class="wrap">'+(day?viewDay():viewDays())+'</main>';
}
function doLogin(){
  password=document.getElementById('pw').value;
  checkLogin().then(function(ok){
    if(!ok){loginError='Password salah.';render();return;}
    sessionStorage.setItem('tbt-admin-pw',password);authed=true;loginError='';
    return Promise.all([loadDays(),loadNames()]).then(render);
  });
}
function logout(){sessionStorage.removeItem('tbt-admin-pw');password='';authed=false;day=null;render();}

function viewDays(){
  return '<div class="card"><h3 style="margin-bottom:12px">Sesi baru</h3><div class="frow"><div class="field"><label>Nama sesi</label><input id="ndl" placeholder="Fun Tournament" value="'+esc(nd.label)+'" oninput="nd.label=this.value"></div><div class="field"><label>Tanggal</label><input id="ndd" type="date" value="'+esc(nd.date)+'" oninput="nd.date=this.value"></div></div><button class="btn primary" onclick="createDay()">Buat sesi</button></div>'
    +'<h3 style="margin:22px 0 4px">Semua sesi</h3>'
    +(days.length?days.map(function(d){return '<div class="dayrow" onclick="openDay(\''+esc(d.id)+'\')"><div><strong>'+esc(d.label)+'</strong><div class="meta">'+esc(fmtDate(d.date))+' \u00b7 '+d.table_count+' meja</div></div><span class="meta">\u203a</span></div>';}).join(''):'<div class="empty">Belum ada sesi.</div>');
}
function createDay(){
  if(!nd.label.trim()||!nd.date){alert('Nama sesi dan tanggal wajib diisi');return;}
  fetch('/api/days',{method:'POST',headers:H(),body:JSON.stringify(nd)}).then(function(r){return r.json();}).then(function(d){
    nd={label:'',date:''};return loadDays().then(function(){return d.id?openDay(d.id):render();});
  });
}
function viewDay(){
  var d=day;
  return '<button class="lnk" style="color:var(--accent);font-weight:700;padding:0 0 10px" onclick="day=null;render()">\u2039 Semua sesi</button>'
    +'<h2>'+esc(d.label)+'</h2><div class="meta" style="margin-bottom:14px">'+esc(fmtDate(d.date))+' \u00b7 <a href="/index.html?sesi='+encodeURIComponent(d.id)+'" target="_blank">Lihat halaman publik sesi ini</a> \u00b7 <button class="lnk" style="padding:0;color:var(--red)" onclick="delDay()">Hapus sesi</button></div>'
    +'<datalist id="pnames">'+names.map(function(n){return '<option value="'+esc(n)+'">';}).join('')+'</datalist>'
    +'<div class="card"><h3 style="margin-bottom:12px">Tambah meja</h3><div class="field"><label>Nama meja</label><input id="ntl" value="'+esc(nt.label)+'" oninput="nt.label=this.value"></div><div class="meta" style="margin:-4px 0 10px">Nama pemain boleh dikosongin, host bisa isi sendiri nanti dari scoreboard</div><div class="frow">'
    +[0,1,2,3].map(function(i){return '<div class="field"><label>Pemain '+(i+1)+' (opsional)</label><input id="ntp'+i+'" list="pnames" autocomplete="off" placeholder="Diisi host nanti" value="'+esc(nt.p[i])+'" oninput="nt.p['+i+']=this.value"></div>';}).join('')
    +'</div><button class="btn primary" onclick="createTable()">Buat meja</button></div>'
    +'<h3 style="margin:22px 0 10px">Meja</h3>'
    +(d.tables.length?d.tables.map(tableItem).join(''):'<div class="empty">Belum ada meja.</div>');
}
function tableItem(t){
  var base=location.origin+'/scoreboard.html?';
  return '<div class="tcard"><div class="th"><div><strong>'+esc(t.label)+'</strong> <span class="mb">'+esc(modeLabel(t.mode))+'</span><div class="meta">'+t.players.map(function(p){return esc(p.name);}).join(', ')+'</div><div class="meta">'+progText(t)+'</div><div class="meta">'+esc(rulesLine(t))+'</div></div><div>'+(t.locked?'<button class="lnk" onclick="unlockTable(\''+t.code+'\')">Buka kunci</button> ':'')+'<button class="lnk" onclick="delTable(\''+t.code+'\')">Hapus</button></div></div>'
    +'<div class="cr"><span class="cl">Host</span><span class="code">'+t.code+'</span><a class="btn sm" href="'+base+'code='+t.code+'" target="_blank">Buka</a><button class="btn sm" onclick="copyLink(\'host\',\''+t.code+'\')">Salin link</button></div>'
    +'<div class="cr"><span class="cl">Pemain</span><span class="code">'+t.view_code+'</span><a class="btn sm" href="'+base+'view='+t.view_code+'" target="_blank">Buka</a><button class="btn sm" onclick="copyLink(\'view\',\''+t.view_code+'\')">Salin link</button></div>'
    +'<div class="meta" style="margin-top:6px">Atau cukup kasih kodenya aja (host atau pemain), tinggal buka <a href="/masuk.html" target="_blank">'+location.origin+'/masuk.html</a> terus ketik kodenya</div></div>';
}
function createTable(){
  var p=nt.p.map(function(x){return x.trim();});
  if(!nt.label.trim()){alert('Nama meja wajib diisi');return;}
  fetch('/api/tables',{method:'POST',headers:H(),body:JSON.stringify({day_id:day.id,label:nt.label.trim(),players:p})}).then(function(r){return r.json().then(function(b){return {ok:r.ok,b:b};});}).then(function(x){
    if(!x.ok){alert(x.b.error||'Gagal membuat meja');return;}
    return Promise.all([openDay(day.id),loadDays(),loadNames()]).then(function(){render();});
  });
}
function delTable(code){
  if(!confirm('Hapus meja ini beserta semua skornya?'))return;
  fetch('/api/tables/'+code,{method:'DELETE',headers:H()}).then(function(){return Promise.all([openDay(day.id),loadDays()]);}).then(function(){render();});
}
function delDay(){
  if(!confirm('Hapus sesi ini beserta semua mejanya?'))return;
  fetch('/api/days/'+encodeURIComponent(day.id),{method:'DELETE',headers:H()}).then(function(){day=null;return loadDays();}).then(render);
}
(function(){
  if(!password){render();return;}
  checkLogin().then(function(ok){
    if(!ok){sessionStorage.removeItem('tbt-admin-pw');render();return;}
    authed=true;return Promise.all([loadDays(),loadNames()]).then(render);
  });
})();
</script>
</body>
</html>
