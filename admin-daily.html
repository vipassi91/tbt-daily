<html lang="en">
<head>

<title>TBT Admin &middot; Sessions</title>

@font-face{font-family:"Playfair Display";font-style:normal;font-weight:400;font-display:swap;src:url(/assets/f/8a53e5ecdb.woff2) format("woff2");}
@font-face{font-family:"Playfair Display";font-style:normal;font-weight:700;font-display:swap;src:url(/assets/f/9401d0214a.woff2) format("woff2");}
@font-face{font-family:"Playfair Display";font-style:normal;font-weight:900;font-display:swap;src:url(/assets/f/0ba66220fb.woff2) format("woff2");}
@font-face{font-family:"Inter Tight";font-style:normal;font-weight:400;font-display:swap;src:url(/assets/f/2c20035257.woff2) format("woff2");}
@font-face{font-family:"Inter Tight";font-style:normal;font-weight:500;font-display:swap;src:url(/assets/f/5ab688ca8c.woff2) format("woff2");}
@font-face{font-family:"Inter Tight";font-style:normal;font-weight:700;font-display:swap;src:url(/assets/f/9e38e04780.woff2) format("woff2");}

<style>
:root{
  --bg:#FAF7F2; --surface:#FFFFFF; --text:#1B4332; --muted:#587263; --line:#E4DDCD;
  --field:#FBF9F4; --accent:#2D6A4F; --onaccent:#FAF7F2; --focus:#2D6A4F; --red:#B72323;
  --sans:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F2A20; --surface:#16382B; --text:#FAF7F2; --muted:#9DB8A9; --line:#26493B;
    --field:#12302A; --accent:#8FD0AE; --onaccent:#0F2A20; --focus:#8FD0AE; --red:#EA8888;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;color:var(--text);font-weight:700}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
.topbar{border-bottom:1px solid var(--line);padding:14px 0}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tb{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.06em;color:var(--accent)}
.tb img{width:26px;height:auto}
.lnk{background:none;border:0;color:var(--muted);font-size:13px;padding:4px 6px}
.lnk:hover{color:var(--red)}
main{padding:22px 0 70px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-bottom:6px}
.field input{font:inherit;font-size:16px;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.field input:focus-visible,button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.frow{display:flex;gap:12px;flex-wrap:wrap}
.frow .field{flex:1;min-width:130px}
.btn{display:inline-block;border-radius:999px;padding:9px 18px;border:1px solid var(--line);background:transparent;font-weight:500;text-decoration:none;color:var(--text);font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:700}
.btn.sm{padding:6px 12px;font-size:13px}
.dayrow{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;gap:10px}
.dayrow:hover strong{color:var(--accent)}
.meta{font-size:13px;color:var(--muted);margin-top:2px}
.tcard{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:var(--field)}
.th{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}
.cr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.cl{width:64px;font-size:13px;color:var(--muted)}
.code{font-family:var(--display);font-weight:900;font-size:20px;letter-spacing:.06em;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px 10px}
.login{max-width:300px;margin:90px auto;text-align:center}
.login img{width:48px;margin-bottom:12px}
.login input{font:inherit;font-size:16px;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--text);margin:14px 0;text-align:center}
.err{color:var(--red);font-size:13px;margin:6px 0}
.mb{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--accent);color:var(--onaccent);padding:10px 18px;border-radius:999px;font-size:14px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

/* navigation: the same bar on every admin page, with the current page marked */
.tbrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tbrow .lnk{padding:10px 6px;min-height:40px}
.anav{display:flex;gap:8px;margin-top:10px}
.anav a{flex:1;display:flex;align-items:center;justify-content:center;min-height:40px;border-radius:999px;border:1px solid var(--line);text-decoration:none;color:var(--text);font-size:14px;font-weight:500;white-space:nowrap}
.anav a[aria-current="page"]{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:700}
.btn.sm{padding:8px 14px;min-height:36px;display:inline-flex;align-items:center;justify-content:center}
.back{display:inline-flex;align-items:center;min-height:38px}
.topbar .wrap{display:block}
main .lnk,main .back{display:inline-flex;align-items:center;min-height:38px;padding:8px}
main .meta .lnk{padding:8px 6px!important}
main .meta a{display:inline-flex;align-items:center;min-height:38px}

/* Fix players */
.fxo{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}.fxo[hidden]{display:none}
.fxs{background:var(--surface);color:var(--text);width:100%;max-width:520px;max-height:92vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;border:1px solid var(--line)}
@media (min-width:700px){.fxo{align-items:center}.fxs{border-radius:18px}}
.fxh{display:flex;justify-content:space-between;align-items:center;padding:12px 8px 12px 18px;border-bottom:1px solid var(--line)}.fxh h2{margin:0;font-family:var(--display);font-size:19px}
.fxx{border:0;background:none;font-size:26px;line-height:1;color:var(--muted);min-width:44px;min-height:44px;cursor:pointer}
.fxb{padding:16px 18px;overflow:auto}.fxb p{margin:0 0 12px;font-size:13.5px;line-height:1.5;color:var(--muted)}.fxb p b{color:var(--text)}
.fxr{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.fxn{flex:none;width:26px;height:26px;border-radius:50%;background:var(--field);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.fxc{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.fxin{width:100%;min-width:0;font:inherit;font-size:16px;font-weight:600;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}.fxin:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.fxtags{display:flex;flex-wrap:wrap;gap:4px 8px}.fxtag{font-size:11px;font-weight:600;color:var(--accent);white-space:nowrap}.fxtag.chg{color:var(--muted)}
.fxm{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:18px;cursor:pointer}.fxm[disabled]{opacity:.3;cursor:default}
.fxres{margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--field)}
.fxp{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px}.fxp b{font-variant-numeric:tabular-nums;white-space:nowrap}.fxp.chg b{color:var(--accent)}
.fxt{margin:10px 0 0;font-size:13px;line-height:1.5;color:var(--muted)}.fxt.warn{color:var(--red)}
.fxerr{margin-top:10px;color:var(--red);font-size:13px}
.fxf{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--line)}.fxf .btn{flex:1;text-align:center;min-height:44px;cursor:pointer}
.btn[disabled]{opacity:.4;cursor:default}
</style>
<style>
.tq-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;display:flex;align-items:flex-end;justify-content:center}
.tq-sheet{background:var(--surface,#fff);color:var(--text,#111);width:100%;max-width:460px;border-radius:20px 20px 0 0;padding:20px 18px 22px;max-height:94vh;overflow:auto;text-align:center;font-family:var(--sans,sans-serif)}
@media(min-width:600px){.tq-ov{align-items:center}.tq-sheet{border-radius:20px}}
.tq-sheet h3{font-family:var(--display,serif);font-size:20px;margin:0 0 4px}
.tq-note{font-size:13.5px;color:var(--muted,#666);margin:0 0 12px;line-height:1.45}
.tq-chip{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 10px;margin-bottom:8px;border:1px solid}
.tq-ok{color:var(--accent,#2d6a4f);border-color:color-mix(in srgb,var(--accent,#2d6a4f) 40%,transparent);background:color-mix(in srgb,var(--accent,#2d6a4f) 12%,transparent)}
.tq-warn{color:var(--red,#b00);border-color:color-mix(in srgb,var(--red,#b00) 40%,transparent);background:color-mix(in srgb,var(--red,#b00) 11%,transparent)}
.tq-box{display:inline-block;background:#fff;padding:8px;border-radius:14px;border:1px solid var(--line,#ddd);line-height:0}
.tq-box svg{width:min(210px,60vw);height:auto;display:block}
.tq-cd{font:700 26px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.18em;margin:12px 0 2px;padding-left:.18em}
.tq-url{font-size:11.5px;color:var(--muted,#666);margin:4px 0 10px;line-height:1.4}.tq-url span{display:block;overflow-wrap:anywhere}
.tq-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.tq-b{font:inherit;font-size:13px;min-height:38px;padding:8px 14px;border-radius:999px;border:1px solid var(--line,#ddd);background:transparent;color:var(--text,#111);cursor:pointer}
.tq-b.tq-p{background:var(--accent,#2d6a4f);color:var(--onaccent,#fff);border-color:var(--accent,#2d6a4f);font-weight:700}
.tq-b:focus-visible{outline:2px solid var(--focus,#2d6a4f);outline-offset:2px}
.tq-printroot{display:none}
.tq-card{width:105mm;max-width:100%;min-height:148mm;margin:0 auto;background:#fff;color:#1B4332;padding:9mm 8mm;text-align:center;font-family:var(--sans,sans-serif);display:flex;flex-direction:column;align-items:center;justify-content:space-between;box-sizing:border-box}
.tq-card .tq-br{font:700 12px var(--sans,sans-serif);letter-spacing:.2em;text-transform:uppercase}
.tq-card .tq-tn{font:900 34px/1.1 var(--display,serif);margin:6px 0 2px}
.tq-card .tq-scan{font-size:14px;color:#587263;margin:0 0 10px}
.tq-card .tq-box{border-color:#E4DDCD;padding:6px}.tq-card .tq-box svg{width:62mm}
.tq-card .tq-cd{color:#1B4332;font-size:30px}
.tq-card .tq-how{font-size:12px;color:#587263;line-height:1.4;margin:0}.tq-card .tq-site{font-size:11px;color:#587263;margin-top:8px}
@media print{body.tq-printing>*:not(.tq-printroot){display:none!important}body.tq-printing .tq-printroot{display:block}@page{margin:8mm}}

</style>
</head>

<script>
var LOGO='/assets/i/cfad30e8e7.png';
var password=sessionStorage.getItem('tbt-admin-pw')||'';
var authed=false,days=[],day=null,names=[],loginError='';
var nd={label:'',date:''};
var renaming=false,rnBusy=false,rnValue='';
var nt={label:'',p:['','','','']};

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function H(){return {'Authorization':'Bearer '+password,'Content-Type':'application/json'};}
function fmtDate(d){try{return new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});}catch(e){return d;}}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('show');},1800);}

function checkLogin(){
  if(!password)return Promise.resolve(false);
  return fetch('/api/admin/login',{method:'POST',headers:H()}).then(function(r){return r.ok;}).catch(function(){return false;});
}
function loadDays(){return fetch('/api/days',{headers:H()}).then(function(r){return r.ok?r.json():[];}).then(function(d){days=d;});}
// names already used in earlier sessions, offered as suggestions so spelling stays consistent
function loadNames(){
  return fetch('/api/overview').then(function(r){return r.ok?r.json():null;}).then(function(o){
    if(!o)return;var seen={};
    o.tables.forEach(function(t){t.players.forEach(function(p){var k=p.name.trim().toLowerCase();if(!seen[k])seen[k]=p.name;});});
    names=Object.keys(seen).map(function(k){return seen[k];}).sort(function(a,b){return a.localeCompare(b);});
  }).catch(function(){});
}
function openDay(id){
  return fetch('/api/days/'+encodeURIComponent(id),{headers:H()}).then(function(r){return r.ok?r.json():null;}).then(function(d){
    day=d;renaming=false;rnBusy=false;nt={label:d?'Table '+(d.tables.length+1):'',p:['','','','']};render();window.scrollTo(0,0);
  });
}
function progText(t){
  if(!t.events)return 'Not started';
  if(t.locked)return t.events+(t.events===1?' hand':' hands')+', final (locked)';
  if(t.progress.done)return t.events+(t.events===1?' hand':' hands')+', finished';
  return t.events+(t.events===1?' hand':' hands')+', '+['East','South','West','North'][t.progress.wind]+' round';
}
var MODE_NAMES={casual:'Casual','default':'Default',tournament:'Tournament',custom:'Custom',mcr4:'MCR-4',mcr8:'MCR-8',mcrc:'MCR-Custom'};
function rulesLine(t){
  var r=t.rules;if(!r)return '';
  if(r.base!=null){var q=[modeLabel(t.mode),'base '+r.base,'min '+r.minPoint+' points','no dealer repeat'];if(r.seatRotation)q.push('seat rotation');return q.join(' \u00b7 ');}   // meja MCR
  var p=[modeLabel(t.mode),'min '+r.minPoint+' points','streak '+r.maxStreak,r.start==null?'no starting score':'starting score '+r.start];
  if(r.bankrupt)p.push('bankrupt');
  if(r.seatRotation)p.push('seat rotation');
  if(r.deadwall)p.push('deadwall');
  return p.join(' \u00b7 ');
}
function modeLabel(m){return MODE_NAMES[m||'casual']||'Casual';}
function unlockTable(code){
  if(!confirm('Unlock this table? The host can edit it again until it is saved again.'))return;
  fetch('/api/lock/'+encodeURIComponent(code),{method:'DELETE',headers:H()}).then(function(r){if(!r.ok)throw new Error('x');return openDay(day.id);}).then(render).catch(function(){alert('Gagal membuka kunci.');});
}
function showQR(kind,code,label){
  var url=location.origin+'/scoreboard.html?'+(kind==='host'?'code=':'view=')+code;
  TBTQR.sheet({kind:kind==='host'?'edit':'view',title:kind==='host'?'Host QR, '+label:'Players QR, '+label,note:kind==='host'?'Opens the scoreboard so hands can be entered. Show it only to the person keeping score.':'Opens the live table, read only. Print the table card and put it on the table.',code:code,url:url,label:label,brand:'Tiles by Tiles'});
}
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-qr]');if(b)showQR(b.dataset.qr,b.dataset.code,b.dataset.label);});
function copyLink(kind,code){
  var url=location.origin+'/scoreboard.html?'+(kind==='host'?'code=':'view=')+code;
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(function(){toast('Link copied');},function(){prompt('Copy this link:',url);});
  else prompt('Copy this link:',url);
}

function render(){
  var app=document.getElementById('app');
  if(!authed){
    app.innerHTML='<div class="login"><img src="'+LOGO+'" alt=""><h2>Admin</h2><input id="pw" type="password" placeholder="Password">'+(loginError?'<div class="err">'+loginError+'</div>':'')+'<button class="btn primary" style="width:100%" onclick="doLogin()">Sign in</button></div>';
    var pw=document.getElementById('pw');pw.onkeydown=function(e){if(e.key==='Enter')doLogin();};
    return;
  }
  app.innerHTML='<div class="topbar"><div class="wrap"><div class="tbrow"><div class="tb"><img src="'+LOGO+'" alt="">TBT ADMIN</div><button class="lnk" onclick="logout()">Sign out</button></div><nav class="anav" aria-label="Admin"><a href="/admin-daily.html" aria-current="page">Sessions</a><a href="/admin-pemain.html">Players</a><a href="/index.html" target="_blank" rel="noopener">Leaderboard &#8599;</a></nav></div></div><main class="wrap">'+(day?viewDay():viewDays())+'</main>';
}
function doLogin(){
  password=document.getElementById('pw').value;
  checkLogin().then(function(ok){
    if(!ok){loginError='Wrong password.';render();return;}
    sessionStorage.setItem('tbt-admin-pw',password);authed=true;loginError='';
    return Promise.all([loadDays(),loadNames()]).then(render);
  });
}
function logout(){sessionStorage.removeItem('tbt-admin-pw');password='';authed=false;day=null;render();}

function viewDays(){
  return '<div class="card"><h3 style="margin-bottom:12px">New session</h3><div class="frow"><div class="field"><label>Session name</label><input id="ndl" placeholder="Fun Tournament" value="'+esc(nd.label)+'" oninput="nd.label=this.value"></div><div class="field"><label>Date</label><input id="ndd" type="date" value="'+esc(nd.date)+'" oninput="nd.date=this.value"></div></div><button class="btn primary" onclick="createDay()">Create session</button></div>'
    +'<h3 style="margin:22px 0 4px">All sessions</h3>'
    +(days.length?days.map(function(d){return '<div class="dayrow" onclick="openDay(\''+esc(d.id)+'\')"><div><strong>'+esc(d.label)+'</strong><div class="meta">'+esc(fmtDate(d.date))+' \u00b7 '+d.table_count+(d.table_count===1?' table':' tables')+(d.created_by_name?' \u00b7 by '+esc(d.created_by_name):'')+'</div></div><span class="meta">\u203a</span></div>';}).join(''):'<div class="empty">No sessions yet.</div>');
}
function createDay(){
  if(!nd.label.trim()||!nd.date){alert('A session name and a date are required');return;}
  fetch('/api/days',{method:'POST',headers:H(),body:JSON.stringify(nd)}).then(function(r){return r.json();}).then(function(d){
    nd={label:'',date:''};return loadDays().then(function(){return d.id?openDay(d.id):render();});
  });
}
function viewDay(){
  var d=day;
  return '<button class="lnk" style="color:var(--accent);font-weight:700;padding:0 0 10px" onclick="day=null;render()">\u2039 All sessions</button>'
    +(renaming?renameForm(d):'<h2>'+esc(d.label)+'</h2>')+'<div class="meta" style="margin-bottom:4px">'+esc(fmtDate(d.date))+(d.createdBy?' \u00b7 by '+esc(d.createdBy):'')+' \u00b7 <a href="/index.html?sesi='+encodeURIComponent(d.id)+'" target="_blank">View this session on the public page</a></div><div class="meta" style="margin-bottom:12px;display:flex;gap:18px">'+(renaming?'':'<button class="lnk" style="padding:10px 0;color:var(--accent)" onclick="startRename()">Rename</button>')+'<button class="lnk" style="padding:10px 0;color:var(--red)" onclick="delDay()">Delete session</button></div>'
    +'<datalist id="pnames">'+names.map(function(n){return '<option value="'+esc(n)+'">';}).join('')+'</datalist>'
    +'<div class="card"><h3 style="margin-bottom:12px">Add table</h3><div class="field"><label>Table name</label><input id="ntl" value="'+esc(nt.label)+'" oninput="nt.label=this.value"></div><div class="meta" style="margin:-4px 0 10px">Player names can be left empty. The host can fill them in later from the scoreboard.</div><div class="frow">'
    +[0,1,2,3].map(function(i){return '<div class="field"><label>Player '+(i+1)+' (optional)</label><input id="ntp'+i+'" list="pnames" autocomplete="off" placeholder="The host fills this in later" value="'+esc(nt.p[i])+'" oninput="nt.p['+i+']=this.value"></div>';}).join('')
    +'</div><button class="btn primary" onclick="createTable()">Create table</button></div>'
    +'<h3 style="margin:22px 0 10px">Tables</h3>'
    +(d.tables.length?d.tables.map(tableItem).join(''):'<div class="empty">No tables yet.</div>');
}
function tableItem(t){
  var base=location.origin+'/scoreboard.html?';
  return '<div class="tcard"><div class="th"><div><strong>'+esc(t.label)+'</strong> <span class="mb">'+esc(modeLabel(t.mode))+'</span>'+(t.createdBy?' <span class="mb">by '+esc(t.createdBy)+'</span>':'')+'<div class="meta">'+t.players.map(function(p){return esc(p.name);}).join(', ')+'</div><div class="meta">'+progText(t)+'</div><div class="meta">'+esc(rulesLine(t))+'</div></div><div>'+(t.locked?'<button class="lnk" onclick="unlockTable(\''+t.code+'\')">Unlock</button> ':'')+(t.events>0?'<button class="lnk" onclick="openFix(\''+t.code+'\')">Fix players</button> ':'')+'<button class="lnk" onclick="delTable(\''+t.code+'\')">Delete</button></div></div>'
    +'<div class="cr"><span class="cl">Host</span><span class="code">'+t.code+'</span><a class="btn sm" href="'+base+'code='+t.code+'" target="_blank">Open</a><button class="btn sm" onclick="copyLink(\'host\',\''+t.code+'\')">Copy link</button><button class="btn sm" data-qr="host" data-code="'+t.code+'" data-label="'+esc(t.label)+'">QR</button></div>'
    +'<div class="cr"><span class="cl">Players</span><span class="code">'+t.view_code+'</span><a class="btn sm" href="'+base+'view='+t.view_code+'" target="_blank">Open</a><button class="btn sm" onclick="copyLink(\'view\',\''+t.view_code+'\')">Copy link</button><button class="btn sm" data-qr="view" data-code="'+t.view_code+'" data-label="'+esc(t.label)+'">QR</button></div>'
    +'<div class="meta" style="margin-top:6px">Or just share the code (host or players), then open <a href="/masuk.html" target="_blank">'+location.origin+'/masuk.html</a> and type the code</div></div>';
}
function createTable(){
  var p=nt.p.map(function(x){return x.trim();});
  if(!nt.label.trim()){alert('A table name is required');return;}
  fetch('/api/tables',{method:'POST',headers:H(),body:JSON.stringify({day_id:day.id,label:nt.label.trim(),players:p})}).then(function(r){return r.json().then(function(b){return {ok:r.ok,b:b};});}).then(function(x){
    if(!x.ok){alert(x.b.error||'Could not create the table');return;}
    return Promise.all([openDay(day.id),loadDays(),loadNames()]).then(function(){render();});
  });
}
function delTable(code){
  if(!confirm('Delete this table and all its scores?'))return;
  fetch('/api/tables/'+code,{method:'DELETE',headers:H()}).then(function(){return Promise.all([openDay(day.id),loadDays()]);}).then(function(){render();});
}
// Rename the session. The name lives only on the session, so every page that shows it picks the new one up.
function renameForm(d){
  return '<div class="field" style="max-width:420px;margin-bottom:10px"><label for="rnl">Session name</label><input id="rnl" value="'+esc(rnValue)+'" maxlength="80" autocomplete="off" oninput="rnValue=this.value" onkeydown="rnKey(event)"></div>'
    +'<div style="display:flex;gap:8px;margin:0 0 14px"><button type="button" class="btn primary sm" onclick="saveRename()"'+(rnBusy?' disabled':'')+'>Save</button><button type="button" class="btn sm" onclick="cancelRename()">Cancel</button></div>';
}
function startRename(){renaming=true;rnBusy=false;rnValue=day.label;render();var i=document.getElementById('rnl');if(i){i.focus();i.select();}}
function cancelRename(){renaming=false;rnBusy=false;render();}
function rnKey(e){if(e.key==='Enter'){e.preventDefault();saveRename();}else if(e.key==='Escape'){e.preventDefault();cancelRename();}}
function saveRename(){
  if(rnBusy)return;var v=rnValue.replace(/\s+/g,' ').trim();
  if(!v){alert('A session name is required');return;}
  if(v===day.label){cancelRename();return;}
  rnBusy=true;render();
  fetch('/api/days/'+encodeURIComponent(day.id),{method:'PATCH',headers:H(),body:JSON.stringify({label:v})})
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
    .then(function(x){
      rnBusy=false;
      if(!x.ok){alert((x.j&&x.j.error)||'Could not rename the session');render();var i2=document.getElementById('rnl');if(i2)i2.focus();return;}
      day.label=x.j.label;days.forEach(function(d){if(d.id===day.id)d.label=x.j.label;});renaming=false;render();toast('Session renamed');
    }).catch(function(){rnBusy=false;alert('Connection failed, please try again');render();});
}
function delDay(){
  if(!confirm('Delete this session and all its tables?'))return;
  fetch('/api/days/'+encodeURIComponent(day.id),{method:'DELETE',headers:H()}).then(function(){day=null;return loadDays();}).then(render);
}

var fx=null;
function signed(n){return n>0?'+'+n:n<0?'\u2212'+Math.abs(n):'0';}
function openFix(code){
  var t=((day&&day.tables)||[]).filter(function(x){return x.code===code;})[0];if(!t)return;
  var nm=t.players.map(function(p){return p.name;});
  fx={code:code,label:t.label,names:nm,edited:nm.slice(),order:[0,1,2,3],preview:null,busy:false,err:''};
  renderFix();var b=document.getElementById('fxClose');if(b)b.focus();
}
function closeFix(){fx=null;renderFix();}
function fixMove(j,dir){
  if(!fx||fx.busy)return;var k=j+dir;if(k<0||k>3)return;
  var o=fx.order,tmp=o[j];o[j]=o[k];o[k]=tmp;fx.preview=null;fx.err='';renderFix();
  var again=document.querySelector('#fixModal [data-mv="'+k+'|'+dir+'"]');if(again&&!again.disabled)again.focus();
}
function fixName(o,v){
  if(!fx||fx.busy)return;
  var el=document.querySelector('#fixModal [data-nm="'+o+'"]'),pos=el?el.selectionStart:null;
  fx.edited[o]=v;fx.preview=null;fx.err='';renderFix();
  var again=document.querySelector('#fixModal [data-nm="'+o+'"]');if(again){again.focus();if(pos!==null)again.setSelectionRange(pos,pos);}
}
function fixCall(apply){
  fx.busy=true;fx.err='';renderFix();
  return fetch('/api/admin/table-order',{method:'POST',headers:H(),body:JSON.stringify({code:fx.code,order:fx.order,names:fx.order.map(function(o){return fx.edited[o];}),apply:apply})}).then(function(r){return r.json().then(function(b){return {ok:r.ok,b:b};});}).then(function(x){
    fx.busy=false;
    if(!x.ok){fx.err=x.b.message||x.b.error||'Failed';renderFix();return null;}
    return x.b;
  }).catch(function(){fx.busy=false;fx.err='Could not reach the server.';renderFix();return null;});
}
function fixPreview(){fixCall(false).then(function(b){if(b){fx.preview=b.summary;renderFix();}});}
function fixApply(){
  if(!fx||!fx.preview)return;
  if(!confirm('Save the changes? Scores and the leaderboard change too. A table that was already saved stays locked.'))return;
  fixCall(true).then(function(b){if(!b)return;fx=null;renderFix();return openDay(day.id).then(function(){render();toast('Players updated');});});
}
function renderFix(){
  var el=document.getElementById('fixModal');
  if(!fx){el.hidden=true;el.innerHTML='';document.removeEventListener('keydown',fixKey);return;}
  var namesChanged=fx.names.some(function(n,o){return fx.edited[o]!==n;});
  var changed=fx.order.join()!=='0,1,2,3'||namesChanged,pv=fx.preview;
  var rows=fx.order.map(function(o,j){var edited=fx.edited[o]!==fx.names[o];return '<div class="fxr"><span class="fxn">'+(j+1)+'</span><div class="fxc"><input type="text" class="fxin" maxlength="16" autocomplete="off" data-nm="'+o+'" value="'+esc(fx.edited[o])+'" aria-label="Name at seat '+(j+1)+'" oninput="fixName('+o+',this.value)"'+(fx.busy?' disabled':'')+'>'
    +(j===0||edited?'<span class="fxtags">'+(j===0?'<span class="fxtag">first dealer</span>':'')+(edited?'<span class="fxtag chg">changed</span>':'')+'</span>':'')+'</div>'
    +'<button type="button" class="fxm" aria-label="Move up '+esc(fx.edited[o]||'')+'" data-mv="'+j+'|-1" onclick="fixMove('+j+',-1)"'+(j===0||fx.busy?' disabled':'')+'>\u2191</button>'
    +'<button type="button" class="fxm" aria-label="Move down '+esc(fx.edited[o]||'')+'" data-mv="'+j+'|1" onclick="fixMove('+j+',1)"'+(j===3||fx.busy?' disabled':'')+'>\u2193</button></div>';}).join('');
  var res='';
  if(pv){
    var d1=pv.dealerChanged===0?'The dealer does not change in any hand.':'The dealer differs in <b>'+pv.dealerChanged+'</b> of '+pv.hands+' hands.';
    var warn='',rn='';
    if(pv.renamed&&pv.renamed.length){
      rn='<p class="fxt" style="margin:10px 0 0"><b>Names:</b></p>'+pv.renamed.map(function(r){return '<div class="fxp"><span>'+esc(r.from)+' \u2192 '+esc(r.to)+'</span><b style="white-space:normal;text-align:right">'+(pv.registryOn?(r.registered?'registered player: '+esc(r.registered):'not registered, counted as a guest'):'')+'</b></div>';}).join('');
      if(pv.linksDropped)rn+='<p class="fxt">'+pv.linksDropped+' seat link(s) to registered players no longer apply because the name was changed. You can link them again in the Players admin.</p>';
    }
    if(pv.firstDealerChanged)warn+='<p class="fxt warn">The first dealer changes from '+esc(pv.firstDealerBefore)+' to '+esc(pv.firstDealerAfter)+'.</p>';
    if(pv.doneBefore&&!pv.doneAfter)warn+='<p class="fxt warn">With this order the game no longer finishes. Check the order.</p>';
    else if(pv.lateAfter!==pv.lateBefore)warn+='<p class="fxt warn">'+pv.lateAfter+' hand(s) fall after the game ended and are not counted (before: '+pv.lateBefore+').</p>';
    res='<div class="fxres"><div class="fxt" style="margin:0 0 6px">Net score of each person, before and after:</div>'+pv.people.map(function(p){return '<div class="fxp'+(p.before!==p.after?' chg':'')+'"><span>'+esc(p.name)+'</span><b>'+signed(p.before)+' \u2192 '+signed(p.after)+'</b></div>';}).join('')+'<p class="fxt">'+d1+'</p>'+rn+warn+'</div>';
  }
  el.innerHTML='<div class="fxs"><div class="fxh"><h2 id="fxT">Fix players</h2><button type="button" class="fxx" id="fxClose" aria-label="Close" onclick="closeFix()">&times;</button></div>'
    +'<div class="fxb"><p>Table <b>'+esc(fx.label)+'</b>. Use the arrows to fix the seating order (seat 1 is the first dealer, East), and tap a name to change its spelling. Every hand moves with its person, then the dealer, the winds and the scores are worked out again from the first hand.</p>'
    +rows+res+(fx.err?'<div class="fxerr" role="alert">'+esc(fx.err)+'</div>':'')+'</div>'
    +'<div class="fxf"><button type="button" class="btn" onclick="closeFix()">Cancel</button><button type="button" class="btn" onclick="fixPreview()"'+(!changed||fx.busy?' disabled':'')+'>See the effect</button><button type="button" class="btn primary" onclick="fixApply()"'+(!pv||fx.busy?' disabled':'')+'>Save</button></div></div>';
  el.hidden=false;document.addEventListener('keydown',fixKey);
}
function fixKey(e){if(e.key==='Escape')closeFix();}
(function(){
  if(!password){render();return;}
  checkLogin().then(function(ok){
    if(!ok){sessionStorage.removeItem('tbt-admin-pw');render();return;}
    authed=true;return Promise.all([loadDays(),loadNames()]).then(render);
  });
})();
</script>
</body>
</html>
