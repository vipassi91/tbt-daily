<script>
/* If the page's own script does not start (a broken or half-uploaded file, a very old browser), the page would stay empty or dead. After 4 seconds it says so, with the first error, and offers a reload.
   It stays quiet when the script did run and is only waiting for the server (the navigation script sets window.__tbtNav), unless an error was seen and nothing is drawn. */
(function(){var errs=[];function note(m){if(m)errs.push(String(m).slice(0,160));}
window.addEventListener('error',function(e){note((e&&e.message)||(e&&e.error)||'error');});
window.addEventListener('unhandledrejection',function(e){note('promise: '+((e&&e.reason&&e.reason.message)||(e&&e.reason)||'rejected'));});
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
setTimeout(function(){var a=document.getElementById('app');if(!a)return;if(window.__tbtNav&&(a.children.length||!errs.length))return;
a.innerHTML='<div role="alert" style="max-width:420px;margin:72px auto;padding:0 20px;font:16px/24px \'Inter Tight\',system-ui,sans-serif;color:var(--text,#1B4332)"><h1 style="font:900 28px/1.15 \'Playfair Display\',Georgia,serif;margin:0 0 12px">Can\u2019t load this page</h1><p style="margin:0 0 16px;color:var(--muted,#587263)">Something stopped the page from starting. Reload it, or go back to the leaderboard.</p><p style="display:flex;gap:8px;margin:0 0 16px"><button type="button" onclick="location.reload()" style="min-height:44px;padding:0 16px;border-radius:16px;border:0;background:var(--accent,#2D6A4F);color:var(--onaccent,#fff);font:500 14px \'Inter Tight\',system-ui,sans-serif;cursor:pointer">Reload</button><a href="/leaderboard" style="display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:16px;border:1px solid var(--line,#E4DDCD);color:var(--text,#1B4332);font:500 14px \'Inter Tight\',system-ui,sans-serif;text-decoration:none">Leaderboard</a></p><p style="margin:0;font-size:12px;line-height:16px;color:var(--muted,#587263)">Code: '+esc(errs[0]||'the page script did not run')+'</p></div>';},4000);})();
</script>

function checkLogin(){
  if(!password)return Promise.resolve(false);
  return fetch('/api/admin/login',{method:'POST',headers:H()}).then(function(r){return r.ok;}).catch(function(){return false;});
}
function loadText(){
  return fetch('/api/admin/home',{headers:H()}).then(function(r){if(!r.ok)throw new Error('x');return r.json();}).then(function(d){
    text=copy(d.text);saved=copy(d.text);defaults=d.defaults;loadError='';
  }).catch(function(){loadError='Can’t load the homepage text. Check your connection and reload.';});
}
function doLogin(){
  password=document.getElementById('pw').value;
  checkLogin().then(function(ok){
    if(!ok){loginError='Wrong password.';render();return;}
    sessionStorage.setItem('tbt-admin-pw',password);authed=true;loginError='';
    return loadText().then(render);
  });
}
function logout(){sessionStorage.removeItem('tbt-admin-pw');password='';authed=false;render();}

function count(v,rec,max){var n=v.length;return '<span class="hp-cnt'+(n>rec?' over':'')+'">'+n+'/'+rec+'</span>';}
function fieldHtml(f){
  var v=text[f[0]]||'',big=f[0]==='intro'||f[0]==='desc';
  return '<div class="field"><label for="f_'+f[0]+'">'+f[1]+count(v,f[2],f[3])+'</label><p class="hp-help">'+f[4]+'</p>'
    +(big?'<textarea id="f_'+f[0]+'" data-k="'+f[0]+'" rows="3" maxlength="'+f[3]+'">'+esc(v)+'</textarea>':'<input id="f_'+f[0]+'" data-k="'+f[0]+'" maxlength="'+f[3]+'" value="'+esc(v)+'">')+'</div>';
}
function previewHtml(){
  return '<div class="hp-kick">'+esc(text.kick)+'</div><div class="hp-h1">'+headlineHtml(text)+'</div><p class="hp-intro">'+esc(text.intro)+'</p>';
}
function serpHtml(){
  var t=text.title.length>60?text.title.slice(0,58)+'…':text.title,d=text.desc.length>155?text.desc.slice(0,153)+'…':text.desc;
  return '<div class="serp-u">tilesbytiles.id</div><div class="serp-t">'+esc(t)+'</div><div class="serp-d">'+esc(d)+'</div>';
}
function warnHtml(){
  return text.hl&&(text.l1+' '+text.l2).indexOf(text.hl)<0?'The red word is not in the headline or the second line, so nothing turns red.':'';
}
function render(){
  var app=document.getElementById('app');
  if(!authed){
    app.innerHTML='<div class="login"><img src="'+LOGO+'" alt=""><h2>Admin</h2><input id="pw" type="password" placeholder="Password">'+(loginError?'<div class="err">'+loginError+'</div>':'')+'<button class="btn primary" style="width:100%" onclick="doLogin()">Sign in</button></div>';
    var pw=document.getElementById('pw');pw.onkeydown=function(e){if(e.key==='Enter')doLogin();};
    return;
  }
  var top='<div class="topbar"><div class="wrap"><div class="tbrow"><div class="tb"><img src="'+LOGO+'" alt="">TBT ADMIN</div><button class="lnk" onclick="logout()">Sign out</button></div><nav class="anav" aria-label="Admin"><a href="/admin-daily.html">Sessions</a><a href="/admin-pemain.html">Players</a><a href="/admin-events">Events</a><a href="/admin-home" aria-current="page">Homepage</a><a href="/leaderboard" target="_blank" rel="noopener">Leaderboard &#8599;</a></nav></div></div>';
  if(!text){app.innerHTML=top+'<main class="wrap"><div class="empty">'+(loadError||'Loading…')+'</div></main>';return;}
  var dirty=!same(text,saved);
  app.innerHTML=top+'<main class="wrap"><h2>Homepage text</h2><p class="meta" style="margin:6px 0 16px">The words at the top of the home page, and what Google shows for it. Saved words show on the home page within a minute, no upload needed.</p>'
    +'<div class="card"><div class="meta" style="margin:0 0 8px">Start from a suggestion</div><div class="hp-chips">'+SUGGEST.map(function(s,i){return '<button type="button" class="hp-chip" data-sug="'+i+'">'+esc(s.name)+'</button>';}).join('')+'</div></div>'
    +'<div class="hp-pv" aria-label="Preview"><div class="hp-pvk">Preview</div><div id="pv">'+previewHtml()+'</div></div>'
    +'<div class="card"><h3 style="margin-bottom:12px">Headline</h3>'+FIELDS.map(fieldHtml).join('')+'<p class="err" id="hlWarn">'+warnHtml()+'</p></div>'
    +'<div class="card"><h3 style="margin-bottom:12px">On Google</h3>'+SEO.map(fieldHtml).join('')+'<div class="serp" id="serp">'+serpHtml()+'</div></div>'
    +'<div class="hp-acts"><button type="button" class="btn primary" id="save" onclick="save()"'+(dirty&&!busy?'':' disabled')+'>'+(busy?'Saving…':'Save')+'</button><button type="button" class="btn" id="undo" onclick="undo()"'+(dirty&&!busy?'':' disabled')+'>Undo changes</button><a class="btn" href="/" target="_blank" rel="noopener">See the home page &#8599;</a></div>'
    +'<p class="meta" style="margin-top:16px">Need the original words back? Pick “Surabaya search” above and save.</p></main>';
}
// typing updates the preview, the counters and the buttons without redrawing the field being typed in
function refreshParts(){
  document.getElementById('pv').innerHTML=previewHtml();
  document.getElementById('serp').innerHTML=serpHtml();
  document.getElementById('hlWarn').textContent=warnHtml();
  FIELDS.concat(SEO).forEach(function(f){var el=document.querySelector('label[for="f_'+f[0]+'"] .hp-cnt');if(el){var n=(text[f[0]]||'').length;el.textContent=n+'/'+f[2];el.classList.toggle('over',n>f[2]);}});
  var dirty=!same(text,saved);document.getElementById('save').disabled=!dirty||busy;document.getElementById('undo').disabled=!dirty||busy;
}
document.addEventListener('input',function(e){var k=e.target&&e.target.dataset&&e.target.dataset.k;if(!k||!text)return;text[k]=e.target.value;refreshParts();});
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-sug]');if(!b)return;var s=copy(SUGGEST[+b.dataset.sug]);delete s.name;text=s;render();});
function undo(){text=copy(saved);render();}
function save(){
  if(!text.l1.trim()){toast('The headline cannot be empty.');return;}
  busy=true;render();
  fetch('/api/admin/home',{method:'POST',headers:H(),body:JSON.stringify(text)}).then(function(r){return r.json().catch(function(){return {};}).then(function(j){return {ok:r.ok,j:j};});}).then(function(r){
    busy=false;
    if(!r.ok){toast(r.j.error||'Could not save. Please try again.');render();return;}
    text=copy(r.j.text);saved=copy(r.j.text);render();toast('Saved. The home page shows it within a minute.');
  }).catch(function(){busy=false;render();toast('No connection. Please try again.');});
}
checkLogin().then(function(ok){authed=ok;if(ok)return loadText();}).then(render);
render();
</script>
</body>
</html>
