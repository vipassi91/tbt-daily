<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
@font-face{font-family:"Playfair Display";font-style:normal;font-weight:400;font-display:swap;src:url(/assets/f/8a53e5ecdb.woff2) format("woff2");}
@font-face{font-family:"Playfair Display";font-style:normal;font-weight:700;font-display:swap;src:url(/assets/f/9401d0214a.woff2) format("woff2");}
@font-face{font-family:"Playfair Display";font-style:normal;font-weight:900;font-display:swap;src:url(/assets/f/0ba66220fb.woff2) format("woff2");}
@font-face{font-family:"Inter Tight";font-style:normal;font-weight:400;font-display:swap;src:url(/assets/f/2c20035257.woff2) format("woff2");}
@font-face{font-family:"Inter Tight";font-style:normal;font-weight:500;font-display:swap;src:url(/assets/f/5ab688ca8c.woff2) format("woff2");}
@font-face{font-family:"Inter Tight";font-style:normal;font-weight:700;font-display:swap;src:url(/assets/f/9e38e04780.woff2) format("woff2");}
</style>
<style>
:root{
  --bg:#FAF7F2; --surface:#FFFFFF; --text:#1B4332; --muted:#587263; --line:#E4DDCD;
  --field:#FBF9F4; --accent:#2D6A4F; --onaccent:#FAF7F2; --focus:#2D6A4F; --red:#B72323;
  --sans:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F2A20; --surface:#16382B; --text:#FAF7F2; --muted:#9DB8A9; --line:#26493B;
    --field:#12302A; --accent:#8FD0AE; --onaccent:#0F2A20; --focus:#8FD0AE; --red:#EA8888;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
h1{font-family:var(--display);margin:0;color:var(--text);font-weight:900}
.box{max-width:320px;width:100%;text-align:center}
.box img{width:52px;height:auto;margin-bottom:16px}
.brand{font-size:12px;letter-spacing:.16em;font-weight:700;color:var(--accent);margin-bottom:14px}
h1{font-size:24px;margin-bottom:8px}
.hint{font-size:14px;color:var(--muted);margin-bottom:22px;line-height:1.5}
input{font:inherit;font-size:26px;letter-spacing:.28em;text-align:center;text-transform:uppercase;width:100%;padding:14px 8px 14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--text)}
input:focus{outline:none;border-color:var(--accent)}
button{font:inherit;width:100%;margin-top:14px;border-radius:999px;padding:13px;border:none;background:var(--accent);color:var(--onaccent);font-weight:700;font-size:15px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.err{color:var(--red);font-size:13px;margin-top:12px;min-height:16px}
.back{display:flex;align-items:center;justify-content:center;min-height:44px;margin-top:10px;color:var(--accent);font-size:14px;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="box">
  <img src="/assets/i/cfad30e8e7.png" alt="">
  <div class="brand">TILES BY TILES</div>
  <h1>Enter your code</h1>
  <p class="hint">Type the code your host or admin gave you. We'll take you straight to your table.</p>
  <input id="code" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="Enter the code">
  <button id="go" type="button">Continue</button>
  <div class="err" id="err"></div>
  <a class="back" href="index.html">&lsaquo; Leaderboard</a>
</div>
<script>
var input = document.getElementById('code');
var btn = document.getElementById('go');
var err = document.getElementById('err');
input.focus();

function go(){
  var code = input.value.trim().toUpperCase();
  if(!code){ err.textContent = 'Type a code first.'; return; }
  btn.disabled = true; err.textContent = '';
  fetch('/api/resolve/' + encodeURIComponent(code))
    .then(function(r){ if(!r.ok) throw new Error('notfound'); return r.json(); })
    .then(function(data){
      var param = data.type === 'host' ? 'code' : 'view';
      location.href = 'scoreboard.html?' + param + '=' + encodeURIComponent(data.code);
    })
    .catch(function(){
      err.textContent = "That code doesn't match anything. Check it with your host.";
      btn.disabled = false;
    });
}
btn.addEventListener('click', go);
input.addEventListener('keydown', function(e){ if(e.key === 'Enter') go(); });
</script>
</body>
</html>
