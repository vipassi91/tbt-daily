/* TBT Hanzi: the one font family for every Chinese character on the site (KaiTi). Latin text, numbers and everything else keep their own fonts.
   The files are fetched only by a page that really shows one of these characters. KaiTi has all the Traditional characters the site uses (East, Green dragon and the closing character included).
   The font is the WOFF2 copy of KaiTi (5 MB), which every browser that loads web fonts can read.
   Declared once here; the pages carry no copies of their own. */
@font-face{font-family:"TBT Hanzi";font-style:normal;font-weight:100 900;font-display:swap;unicode-range:U+3400-4DBF,U+4E00-9FFF,U+F900-FAFF;src:url(/assets/f/KaiTi_1.woff2) format("woff2");}
:root{--kai:"TBT Hanzi",KaiTi,"Kaiti SC",STKaiti,BiauKai,"KaiTi_GB2312",serif}

<style>
:root{
  --bg:#FAF7F2; --surface:#FFFFFF; --text:#1B4332; --muted:#587263; --line:#E4DDCD;
  --field:#FBF9F4; --accent:#2D6A4F; --onaccent:#FAF7F2; --focus:#2D6A4F; --red:#B72323; --gold:#B8912E;
  --sans:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F2A20; --surface:#16382B; --text:#FAF7F2; --muted:#9DB8A9; --line:#26493B;
    --field:#12302A; --accent:#8FD0AE; --onaccent:#0F2A20; --focus:#8FD0AE; --red:#EA8888; --gold:#E0C171;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;color:var(--text);font-variant-numeric:lining-nums}
button{font:inherit;cursor:pointer;color:inherit}
a{color:inherit}
.han{font-family:var(--kai);font-weight:400;-webkit-text-stroke:.03em currentColor;color:var(--red)}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px 60px}
.upd{font-size:12px;line-height:16px;color:var(--muted);margin-top:8px;min-height:16px}
.upd .allp{color:var(--accent);font-weight:700;text-decoration:none}.upd .allp:hover{text-decoration:underline}.upd .allp:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.seg{display:flex;gap:8px;margin:16px 0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 16px;margin-bottom:12px;overflow:hidden}

.row.first .rn{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}

.btn.primary{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:500}

/* ranks 1 to 4: a quiet marker, never a box. Every row keeps the same shape; the place is shown by a slim bar
   and a faint tint, a ring round the number, and a small flat gem after the name:
   1 Diamond, 2 Ruby, 3 Jade, 4 Pearl. Tied players share the rank and so the gem. */
/* ranks 1 to 4 everywhere: 1 Diamond, 2 Ruby, 3 Jade, 4 Pearl. One set of colours for the ring, the bar, the tint and the gem. */
:root{--c1:#9FB8E8;--c2:#D62828;--c3:#2D6A4F;--c4:#C9BCA7;--t1:rgba(159,184,232,.16);--t2:rgba(214,40,40,.08);--t3:rgba(45,106,79,.12);--t4:rgba(201,188,167,.20);--g-d1:#6F90DB;--g-d2:#CFDEF9;--g-r1:#D62828;--g-r2:#FDE8E8;--g-j1:#2D6A4F;--g-j2:#B7D4C0;--g-p1:#EDE7DB;--g-p2:#B5A68B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c2:#E04646;--c3:#6FAE8E;--c4:#E8E1D8;--t1:rgba(159,184,232,.14);--t2:rgba(224,70,70,.12);--t3:rgba(111,174,142,.15);--t4:rgba(232,225,216,.10);--g-d1:#9FB8E8;--g-d2:#E8F1FF;--g-r1:#E04646;--g-j1:#6FAE8E;--g-j2:#E6F1E8;--g-p1:#E8E1D8;--g-p2:#C9BCA7}}
.gn{flex:none;display:inline-flex}.gn svg{width:15px;height:15px;display:block}
.gi-diamond .a{fill:var(--g-d1)}.gi-diamond .b{fill:var(--g-d2)}
.gi-ruby .a{fill:var(--g-r1)}.gi-ruby .b{fill:var(--g-r2);opacity:.5}
.gi-jade .a{fill:var(--g-j1)}.gi-jade .b{fill:var(--g-j2);opacity:.6}.gi-jade .c{fill:none;stroke:var(--g-j2);stroke-width:.9;stroke-linecap:round;opacity:.7}
.gi-pearl .a{fill:var(--g-p1);stroke:var(--g-p2);stroke-width:1.2}.gi-pearl .b{fill:#fff;opacity:.9}

.row{position:relative}
.row.m::before{content:"";position:absolute;left:-16px;right:-16px;top:0;bottom:0;background:linear-gradient(90deg,var(--mt),transparent 70%);opacity:.5;pointer-events:none}
.row.m::after{content:"";position:absolute;left:-16px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--mc)}
.row.m>*{position:relative;z-index:1}
.row.m .rn{background:transparent;border:2px solid var(--mc);color:var(--text)}
.row.r1{--mc:var(--c1);--mt:var(--t1)}
.row.r2{--mc:var(--c2);--mt:var(--t2)}
.row.r3{--mc:var(--c3);--mt:var(--t3)}

.rname .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* the same slim bar as the scoreboard: small logo and name on the left, a way into a table on the right */
.brandbar{border-bottom:1px solid var(--line);background:var(--surface)}
.brandin{max-width:1120px;margin:0 auto;padding:8px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brandmark{display:flex;align-items:center;gap:10px;min-width:0;min-height:40px;text-decoration:none;color:inherit}
.brandmark img{height:28px;width:auto;display:block;flex:none}
.brandname{font-family:var(--display);font-weight:900;font-size:14px;letter-spacing:.07em;text-transform:uppercase;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.backlink{display:inline-flex;align-items:center;gap:8px;min-height:40px;flex:none;color:var(--accent);font-size:14px;font-weight:500;text-decoration:none;white-space:nowrap}
/* a row of the board opens that player's page (only players who have an open page) */
.rlink,.row>.rlink,.row.m>.rlink{position:absolute;left:0;top:0;right:0;bottom:0;z-index:2;border-radius:12px}   /* .row.m>* makes the children of the top rows relative: this must win over it */
.rlink:hover{background:rgba(127,127,127,.07)}
.rlink:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
/* small round choice buttons (used by the format choice of the share window) */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 4px}
.chips button{border-radius:999px;padding:6px 14px;min-height:44px;border:1px solid var(--line);background:var(--field);font-size:14px}

.chips button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
/* header: title on the left, the two filters on the right (under the title on phones) */

.n-dd:focus-visible,.n-o:focus-visible,.n-tabs button:focus-visible,.n-share:focus-visible,.n-ls:focus-visible,.dcard:focus-visible,.n-cust .go:focus-visible,.n-cust input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.n-o{display:flex;align-items:center;width:100%;min-height:44px;padding:0 12px;border:0;background:none;border-radius:10px;font-size:15px;text-align:left}
.n-o.on{background:var(--field);font-weight:500}.n-o .c{margin-left:auto;padding-left:12px;font-size:13px;color:var(--muted);font-weight:400}.n-o .ck{margin-left:10px;color:var(--accent);display:flex}

.n-cust .err{margin-top:8px;font-size:13px;color:var(--red)}.n-cust .go{margin-top:12px;width:100%;min-height:48px;border-radius:16px;border:0;background:var(--accent);color:var(--onaccent);font-weight:500;font-size:15px}

.n-dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}.n-dl .dcard{margin:0}

/* If the page's own script does not start (a broken or half-uploaded file, a very old browser), the page would stay empty or dead. After 4 seconds it says so, with the first error, and offers a reload.
   It stays quiet when the script did run and is only waiting for the server (the navigation script sets window.__tbtNav), unless an error was seen and nothing is drawn. */
(function(){var errs=[];function note(m){if(m)errs.push(String(m).slice(0,160));}
window.addEventListener('error',function(e){note((e&&e.message)||(e&&e.error)||'error');});
window.addEventListener('unhandledrejection',function(e){note('promise: '+((e&&e.reason&&e.reason.message)||(e&&e.reason)||'rejected'));});
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
setTimeout(function(){var a=document.getElementById('app');if(!a)return;if(window.__tbtNav&&(a.children.length||!errs.length))return;
a.innerHTML='<div role="alert" style="max-width:420px;margin:72px auto;padding:0 20px;font:16px/24px \'Inter Tight\',system-ui,sans-serif;color:var(--text,#1B4332)"><h1 style="font:900 28px/1.15 \'Playfair Display\',Georgia,serif;margin:0 0 12px">Can\u2019t load this page</h1><p style="margin:0 0 16px;color:var(--muted,#587263)">Something stopped the page from starting. Reload it, or go back to the leaderboard.</p><p style="display:flex;gap:8px;margin:0 0 16px"><button type="button" onclick="location.reload()" style="min-height:44px;padding:0 16px;border-radius:16px;border:0;background:var(--accent,#2D6A4F);color:var(--onaccent,#fff);font:500 14px \'Inter Tight\',system-ui,sans-serif;cursor:pointer">Reload</button><a href="/leaderboard" style="display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:16px;border:1px solid var(--line,#E4DDCD);color:var(--text,#1B4332);font:500 14px \'Inter Tight\',system-ui,sans-serif;text-decoration:none">Leaderboard</a></p><p style="margin:0;font-size:12px;line-height:16px;color:var(--muted,#587263)">Code: '+esc(errs[0]||'the page script did not run')+'</p></div>';},4000);})();
</script>

var MODE_LABEL={casual:'Casual','default':'Default',tournament:'Tournament',custom:'Custom',mcr4:'MCR-4',mcr8:'MCR-8',mcrc:'MCR-Custom'};
var MODE_ORDER=['default','casual','tournament','custom','mcr4','mcr8','mcrc'];
function isMcrMode(k){return k==='mcr4'||k==='mcr8'||k==='mcrc';}
// Which mode filter a table answers to. "All modes" leaves the MCR modes out (their scores are on another scale, so mixing
// them in would make the ranking meaningless); "MCR" is both MCR modes added together; MCR-4 and MCR-8 stand alone.
function modeMatch(t,m){var k=modeOf(t);return m==='all'?!isMcrMode(k):m==='mcr'?isMcrMode(k):k===m;}
function filterLabel(m){return m==='all'?'All modes':m==='mcr'?'MCR':(MODE_LABEL[m]||m);}
function modeOf(t){return t.mode||'casual';}
// one short line describing how a table was played
function rulesLine(t){
  var r=t.rules;if(!r)return '';
  if(r.base!=null){var q=[MODE_LABEL[modeOf(t)]||'MCR','base '+r.base,'min '+r.minPoint+' pts','dealer never repeats'];if(r.seatRotation)q.push('seat rotation');return q.join(' \u00b7 ');}   // an MCR table
  var p=[MODE_LABEL[modeOf(t)]||'Casual',r.minPoint+'+ pts to win','streak '+r.maxStreak,r.start==null?'no start score':'start '+r.start];
  if(r.bankrupt)p.push('bankrupt');
  if(r.seatRotation)p.push('seat rotation');
  if(r.deadwall)p.push('deadwall');
  return p.join(' \u00b7 ');
}

// ---- dates and periods ----
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function pad2(n){return ('0'+n).slice(-2);}
function localISO(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function todayStr(){return window.TBT_TODAY||localISO(new Date());}   // TBT_TODAY: a fixed date, used by tests
function currentSeason(){return todayStr().slice(0,7);}   // a season is a calendar month for now
function monthLabel(ym){return (MONTHS[+ym.slice(5,7)-1]||ym)+' '+ym.slice(0,4);}
function shortDate(ds,withYear){return (+ds.slice(8,10))+' '+MONTHS[+ds.slice(5,7)-1].slice(0,3)+(withYear?' '+ds.slice(0,4):'');}
function daysInMonth(ym){return new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate();}
function addDays(ds,n){var d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+n);return localISO(d);}
function mondayOf(ds){var d=new Date(ds+'T00:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return localISO(d);}   // weeks start on Monday
function periodOk(ds){
  var p=S.period;
  if(p==='all')return true;
  if(p==='today')return ds===todayStr();
  if(p==='yesterday')return ds===addDays(todayStr(),-1);
  if(p==='week'){var m=mondayOf(todayStr());return ds>=m&&ds<=addDays(m,6);}
  if(p==='lastweek'){var m0=mondayOf(todayStr());return ds>=addDays(m0,-7)&&ds<=addDays(m0,-1);}   // the Monday to Sunday before this one
  if(p==='custom')return (!S.from||ds>=S.from)&&(!S.to||ds<=S.to);
  return ds.slice(0,7)===p;
}
function seasons(){   // months that have games, newest first, and always the current one
  var seen={};seen[currentSeason()]=1;
  DATA.tables.forEach(function(t){if(t.events>0){var d=dayOf(t.day_id);if(d&&/^\d{4}-\d{2}/.test(d.date))seen[d.date.slice(0,7)]=1;}});
  return Object.keys(seen).sort().reverse();
}
function periodLabel(){
  var p=S.period;
  if(p==='all')return 'All time';if(p==='today')return 'Today';if(p==='yesterday')return 'Yesterday';if(p==='week')return 'This week';if(p==='lastweek')return 'Last week';
  if(p==='custom'){return shortDate(S.from,S.from.slice(0,4)!==S.to.slice(0,4))+' \u2013 '+shortDate(S.to,true);}
  return monthLabel(p);
}
function periodParam(){return S.period==='custom'?S.from+'_'+S.to:S.period;}
function setPeriodParam(v){
  if(v==='all'||v==='today'||v==='yesterday'||v==='week'||v==='lastweek'){S.period=v;return true;}
  if(/^\d{4}-(0[1-9]|1[0-2])$/.test(v)){S.period=v;return true;}
  var m=/^(\d{4}-\d{2}-\d{2})_(\d{4}-\d{2}-\d{2})$/.exec(v);
  if(m&&m[1]<=m[2]){S.period='custom';S.from=m[1];S.to=m[2];return true;}
  return false;
}
// ---- modes ----
function modesInData(){var seen={};DATA.tables.forEach(function(t){if(t.events>0)seen[modeOf(t)]=true;});return MODE_ORDER.filter(function(k){return seen[k];});}
function effMode(){var ms=modesInData();if(ms.length<2)return ms.length&&isMcrMode(ms[0])?'mcr':'all';return S.mode;}   // with a single mode played there is nothing to filter
function modeOk(t){return modeMatch(t,effMode());}
function modeLabel(){return filterLabel(effMode());}
// the Default mode may have no games yet in the period: open on all modes rather than on an empty board
function autoMode(){
  if(!S.loaded||S.modeSet||S.mode!==DEFAULT_MODE)return;
  var inP=DATA.tables.filter(function(t){var d=dayOf(t.day_id);return t.events>0&&d&&periodOk(d.date);});
  if(inP.some(function(t){return modeOf(t)==='default';}))return;
  // nothing in Default: all modes, unless only MCR tables were played in the period, which is then what opens
  S.mode=(!inP.some(function(t){return !isMcrMode(modeOf(t));})&&inP.some(function(t){return isMcrMode(modeOf(t));}))?'mcr':'all';
}
// ---- the address keeps the filters, so a shared link opens the same view ----
function readUrl(){
  try{
    var q=new URLSearchParams(location.search);
    S.tab='total';S.day=null;S.menu=null;
    if(q.get('sesi')){S.tab='sessions';S.day=q.get('sesi');S.dmode='all';}
    else if(q.get('tab')==='sessions')S.tab='sessions';
    S.period=currentSeason();var p=q.get('p');if(p)setPeriodParam(p);
    S.mode=DEFAULT_MODE;S.modeSet=false;var m=q.get('m');if(m&&(m==='all'||m==='mcr'||MODE_LABEL[m])){S.mode=m;S.modeSet=true;}
  }catch(e){S.period=currentSeason();}
}
readUrl();
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function keyOf(n){return String(n).trim().toLowerCase().replace(/\s+/g,' ');}
function fmtDate(d){try{return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});}catch(e){return d;}}
function fmtNet(n){var r=Math.round(n*10)/10;return (r>0?'+':r<0?'\u2212':'')+Math.abs(r);}
function fmtLg(n){return (Math.round(n*10)/10).toFixed(1);}
function dayOf(id){for(var i=0;i<DATA.days.length;i++)if(DATA.days[i].id===id)return DATA.days[i];return null;}
// one entry per person across the given tables; names match ignoring case and extra spaces
function aggregate(tables){
  var map={};
  tables.forEach(function(t){
    var d=dayOf(t.day_id),date=d?d.date:'';
    t.players.forEach(function(p){
      if(p.placeholder||p.guest)return;   // an unnamed seat and a guest (not in the player registry) are not on the per-person board
      var k=p.key||keyOf(p.name),m=map[k]||(map[k]={name:p.name,stamp:date,games:0,net:0,lg:0,firsts:0,wins:0,hands:0,wf:0,winds:0,nofx:false,pid:''});
      if(date>m.stamp){m.name=p.name;m.stamp=date;}   // show the spelling from the latest session
      m.games++;m.net+=p.netTotal;m.lg+=p.leagueScore;m.wins+=p.wins;if(p.rank===1)m.firsts++;
      if(p.reg)m.pid=p.key;   // a registered player whose page is open: the key is the id that opens it
      if(p.windFirsts===undefined||t.winds===undefined)m.nofx=true;else{m.hands+=t.hands;m.wf+=p.windFirsts;m.winds+=t.winds;}   // a table whose statistics are not renewed yet has no wind-round facts
    });
  });
  return Object.keys(map).map(function(k){var m=map[k];return {name:m.name,games:m.games,net:m.net,league:m.lg/m.games,firsts:m.firsts,wins:m.wins,hands:m.hands,windFirsts:m.wf,winds:m.winds,facts:!m.nofx,pid:m.pid};});
}
// On the main board: the wind rounds a player has played and how many of them they finished first.
// (A table whose statistics are not renewed yet has no wind-round facts: it shows the old games line until its turn comes.)
function totalSub(p){
  if(p.facts&&p.winds)return p.winds+(p.winds===1?' wind round':' wind rounds')+' \u00b7 '+p.windFirsts+(p.windFirsts===1?' first place':' first places');
  return p.games+(p.games===1?' game':' games')+' \u00b7 '+p.firsts+(p.firsts===1?' first place':' first places');
}
// On a session's board: in how many of the wind rounds the player finished first, and the share of hands won.
function sessionSub(p){
  if(!p.facts||!p.winds||!p.hands)return '';
  return '1st in '+p.windFirsts+'/'+p.winds+' rounds \u00b7 '+Math.round(p.wins/p.hands*100)+'% win rate';
}
function rankList(list){
  var key=(SHOW_RATING&&S.metric==='league')?'league':'net',other=key==='net'?'league':'net';
  var sorted=list.slice().sort(function(a,b){return b[key]-a[key]||b[other]-a[other]||a.name.localeCompare(b.name);});
  var prev=null,prevRank=0;
  return sorted.map(function(p,i){var v=Math.round(p[key]*10)/10,rank=(prev!==null&&v===prev)?prevRank:i+1;prev=v;prevRank=rank;return {p:p,v:v,rank:rank,key:key};});
}

    pearl: [['p', 'M12 3.4a8.6 8.6 0 1 0 0 17.2 8.6 8.6 0 1 0 0-17.2z', 'a'], ['e', 9, 8.8, 3, 2, -30, 'b']]

  var COL = {
    diamond: { a: ['#6F90DB', '#9FB8E8'], b: ['#CFDEF9', '#E8F1FF'], bo: 1 },
    ruby: { a: ['#D62828', '#E04646'], b: ['#FDE8E8', '#FDE8E8'], bo: .5 },

  function icon(rank) { var k = KEY[rank]; if (!k) return ''; return '<span class="gn" role="img" aria-label="' + esc(NAME[rank]) + '"><svg class="gi gi-' + k + '" viewBox="0 0 24 24" aria-hidden="true">' + svgShapes(k) + '</svg></span>'; }

function newPlayer(){var e=V.ev,p={name:'',wa:'',ig:'',level:null,sessions:[]};var open=e.sessions.filter(function(s){return s.open&&s.left>0;});if(e.sessions.length===1&&open.length===1)p.sessions=[open[0].id];return p;}

function byId(id){for(var i=0;i<V.ev.sessions.length;i++)if(V.ev.sessions[i].id===id)return V.ev.sessions[i];return null;}
function draftTotal(){return V.draft.players.reduce(function(t,p){return t+p.sessions.reduce(function(u,id){var s=byId(id);return u+(s?s.price:0);},0);},0);}
function demand(id){return V.draft.players.filter(function(p){return p.sessions.indexOf(id)>=0;}).length;}
function pcard(p,i){
  var e=V.ev,multi=e.sessions.length>1;
  var none=p.level&&e.sessions.every(function(s){return s.levels.length&&s.levels.indexOf(p.level)<0;});
  var picks=e.sessions.map(function(s){
    var on=p.sessions.indexOf(s.id)>=0,room=s.left-demand(s.id)+(on?1:0),lvOk=!p.level||!s.levels.length||s.levels.indexOf(p.level)>=0,off=!on&&(!s.open||room<=0||!lvOk);
    var why=!s.open?'Booking closed':(s.left===0?'Full':(!lvOk?'For '+lvls(s.levels)+' only':(room<=0?'No seat left for one more':win(s)+' · '+rp(s.price))));

    +'<div class="e-f"><div class="e-g2"><div><label class="l" for="pn'+i+'">Name *</label><input class="e-in" id="pn'+i+'" data-f="name" data-i="'+i+'" value="'+esc(p.name)+'" maxlength="40" autocomplete="'+(i?'off':'name')+'"></div>'
    +'<div><label class="l" for="pw'+i+'">WhatsApp *</label><input class="e-in" id="pw'+i+'" type="tel" inputmode="tel" placeholder="0812..." data-f="wa" data-i="'+i+'" value="'+esc(p.wa)+'" autocomplete="'+(i?'off':'tel')+'"></div></div>'
    +'<label class="l" for="pi'+i+'">Instagram</label><input class="e-in" id="pi'+i+'" placeholder="username" autocapitalize="none" data-f="ig" data-i="'+i+'" value="'+esc(p.ig)+'">'

function check(){
  var e=V.ev,d=V.draft;
  for(var i=0;i<d.players.length;i++){var p=d.players[i],who=i===0?'You':'Player '+(i+1);
    if(!p.name.trim())return who+': name is required.';

    if(e.sessions.every(function(s){return s.levels.length&&s.levels.indexOf(p.level)<0;}))return who+': no session in this event is for '+lvl(p.level)+'.';

function submit(){
  var d=V.draft,m=check();d.err=m;

    .then(function(r){return r.json().catch(function(){return {};}).then(function(j){return {ok:r.ok,j:j};});})
    .then(function(r){

      if(!r.ok||!r.j.token){d.err=r.j.error||'Could not book. Please try again.';render();var er=document.getElementById('eErr');if(er)er.scrollIntoView({block:'center'});if(r.j.error&&/full|left|took/.test(r.j.error))refreshSeats();return;}
      var first=V.ev.sessions.filter(function(s){return d.players.some(function(p){return p.sessions.indexOf(s.id)>=0;});})[0];
      remember(r.j.token,V.ev.title,first?first.start:'');

}

document.addEventListener('change',function(ev){var t=ev.target,a=t.dataset&&t.dataset.x;
  if(a==='psess'){var p=V.draft.players[+t.dataset.i],v=t.dataset.v,k=p.sessions.indexOf(v);if(t.checked&&k<0)p.sessions.push(v);if(!t.checked&&k>=0)p.sessions.splice(k,1);render();}
  else if(a==='consent'){V.draft.consent=t.checked;if(t.checked&&/consent/.test(V.draft.err)){V.draft.err='';var er=document.getElementById('eErr');if(er)er.textContent='';}}

document.addEventListener('click',function(ev){
  var b=ev.target.closest?ev.target.closest('[data-x]'):null;if(!b)return;var a=b.dataset.x;
  if(b.tagName==='INPUT')return;
  if(a==='close'){if(ev.target===b)closeSheet();return;}
  if(a==='filter'){V.filter=b.dataset.v;render();}
  else if(a==='scope'){if(V.scope!==b.dataset.v){V.scope=b.dataset.v;loadList();}}
  else if(a==='book'){location.hash='book';window.scrollTo(0,0);}
  else if(a==='toevent'){ev.preventDefault();history.pushState(null,'',location.pathname);go();window.scrollTo(0,0);}

  else if(a==='prm'){V.draft.players.splice(+b.dataset.i,1);render();}
  else if(a==='plvl'){var p=V.draft.players[+b.dataset.i];p.level=b.dataset.v;if(V.ev.sessions.length>1)p.sessions=p.sessions.filter(function(id){var s=byId(id);return s&&(!s.levels.length||s.levels.indexOf(p.level)>=0);});else{var s0=V.ev.sessions[0];p.sessions=(s0.open&&s0.left>0&&(!s0.levels.length||s0.levels.indexOf(p.level)>=0))?[s0.id]:[];}render();}
  else if(a==='pay'){V.pay=b.dataset.v;V.draft.err='';render();}
  else if(a==='submit')submit();
  else if(a==='copy')copyText(b.dataset.v);
  else if(a==='marked')bookingAction('transferred');
  else if(a==='cancel')sheet('<h3>Cancel this booking?</h3><p class="e-small e-muted" style="margin:0 0 12px">Every seat in it goes back to the event. '+(V.bk.pay==='transfer'&&V.bk.status!=='held'?'For a refund, message the admin after cancelling.':'')+'</p><div class="e-acts"><button type="button" class="e-btn dng" data-x="cancelok">Cancel booking</button><button type="button" class="e-btn" data-x="close">Keep it</button></div>');
  else if(a==='cancelok'){closeSheet();bookingAction('cancel');}
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&document.querySelector('.e-dim'))closeSheet();});
TBTNAV.boot({});
go();
</script>
</body>
</html>
