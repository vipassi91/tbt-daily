<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F2A20" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Daftar pemain | Tiles by Tiles</title>
<link rel="icon" type="image/png" href="/assets/i/0ba6198a03.png">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/assets/f/0ba66220fb.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/assets/f/2c20035257.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/assets/f/9e38e04780.woff2">
<style>
@font-face{font-family:"Playfair Display";font-style:normal;font-weight:400;font-display:swap;src:url(/assets/f/8a53e5ecdb.woff2) format("woff2");}
@font-face{font-family:"Playfair Display";font-style:normal;font-weight:700;font-display:swap;src:url(/assets/f/9401d0214a.woff2) format("woff2");}
@font-face{font-family:"Playfair Display";font-style:normal;font-weight:900;font-display:swap;src:url(/assets/f/0ba66220fb.woff2) format("woff2");}
@font-face{font-family:"Inter Tight";font-style:normal;font-weight:400;font-display:swap;src:url(/assets/f/2c20035257.woff2) format("woff2");}
@font-face{font-family:"Inter Tight";font-style:normal;font-weight:500;font-display:swap;src:url(/assets/f/5ab688ca8c.woff2) format("woff2");}
@font-face{font-family:"Inter Tight";font-style:normal;font-weight:700;font-display:swap;src:url(/assets/f/9e38e04780.woff2) format("woff2");}
</style>
<style>
:root{
  --bg:#FAF7F2; --surface:#FFFFFF; --text:#1B4332; --muted:#587263; --line:#E4DDCD;
  --field:#FBF9F4; --accent:#2D6A4F; --onaccent:#FAF7F2; --focus:#2D6A4F; --red:#B72323;
  --sans:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F2A20; --surface:#16382B; --text:#FAF7F2; --muted:#9DB8A9; --line:#26493B;
    --field:#12302A; --accent:#8FD0AE; --onaccent:#0F2A20; --focus:#8FD0AE; --red:#EA8888;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;justify-content:center;padding:28px 18px}
h1{font-family:var(--display);margin:0 0 8px;color:var(--text);font-weight:900;font-size:24px}
.box{max-width:420px;width:100%}
.box>img{display:block;width:52px;height:auto;margin:0 auto 16px}
.brand{text-align:center;font-size:12px;letter-spacing:.16em;font-weight:700;color:var(--accent);margin-bottom:14px}
h1,.hint{text-align:center}
.hint{font-size:14px;color:var(--muted);margin:0 0 22px;line-height:1.5}
.f label{display:block;font-size:13px;font-weight:700;margin:14px 0 5px}
.f .sub{font-size:12px;color:var(--muted);margin:0 0 6px;line-height:1.4}
.f input[type=text],.f input[type=tel]{font:inherit;font-size:16px;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--text)}
.f input:focus{outline:none;border-color:var(--accent)}
.ck,.f .ck{display:flex;gap:10px;align-items:flex-start;margin:18px 0 0;font-size:13px;font-weight:400;color:var(--muted);line-height:1.45}
.ck input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--accent)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
button{font:inherit;width:100%;margin-top:20px;border-radius:999px;padding:13px;border:none;background:var(--accent);color:var(--onaccent);font-weight:700;font-size:15px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.err{color:var(--red);font-size:13px;margin-top:12px;min-height:16px;text-align:center}
.done{text-align:center;padding:24px 8px;line-height:1.55}
.done b{display:block;font-family:var(--display);font-size:22px;margin-bottom:8px}
.done span{color:var(--muted);font-size:14px}
.lk{display:flex;align-items:center;justify-content:center;min-height:44px;margin-top:14px;color:var(--accent);font-size:14px;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="box">
  <img src="/assets/i/cfad30e8e7.png" alt="">
  <div class="brand">TILES BY TILES</div>
  <h1>Daftar sebagai pemain</h1>
  <p class="hint">Isi data di bawah. Admin akan mengecek, lalu namamu masuk ke leaderboard.</p>
  <div id="view"></div>
</div>
<script>
var T=new URLSearchParams(location.search).get('t')||'';
var view=document.getElementById('view');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function closed(){view.innerHTML='<div class="done"><b>Link tidak berlaku</b><span>Link pendaftaran ini sudah ditutup atau salah. Minta link terbaru ke admin.</span><a class="lk" href="index.html">Lihat leaderboard</a></div>';}
function showForm(names){
  var opts=names.map(function(n){return '<option value="'+esc(n)+'">';}).join('');
  view.innerHTML='<div class="f">'
    +'<label for="nick">Nama panggilan *</label><p class="sub">Ini yang tampil di leaderboard.</p><input id="nick" type="text" maxlength="30" autocomplete="off">'
    +'<label for="tname">Namamu di papan skor</label><p class="sub">Kalau sudah pernah main, pilih nama yang biasa ditulis di meja supaya game-mu ikut terhubung. Boleh dikosongkan.</p><input id="tname" type="text" maxlength="40" list="names" autocomplete="off"><datalist id="names">'+opts+'</datalist>'
    +'<label for="full">Nama lengkap</label><input id="full" type="text" maxlength="60" autocomplete="name">'
    +'<label for="wa">Nomor WhatsApp *</label><input id="wa" type="tel" inputmode="tel" placeholder="0812..." autocomplete="tel">'
    +'<label for="ig">Username Instagram</label><input id="ig" type="text" placeholder="username" autocomplete="off" autocapitalize="none">'
    +'<div class="hp" aria-hidden="true"><input id="hp" type="text" tabindex="-1" autocomplete="off"></div>'
    +'<label class="ck"><input id="consent" type="checkbox"><span>Saya setuju data ini disimpan admin untuk pendaftaran. Nomor WhatsApp dan Instagram tidak ditampilkan di leaderboard.</span></label>'
    +'<button id="send" type="button">Kirim pendaftaran</button><div class="err" id="err"></div></div>';
  document.getElementById('send').addEventListener('click',submit);
}
function val(id){return document.getElementById(id).value;}
function submit(){
  var err=document.getElementById('err'),btn=document.getElementById('send');
  err.textContent='';
  if(!val('nick').trim()){err.textContent='Nama panggilan wajib diisi.';return;}
  if(!val('wa').trim()){err.textContent='Nomor WhatsApp wajib diisi.';return;}
  if(!document.getElementById('consent').checked){err.textContent='Centang persetujuan dulu.';return;}
  btn.disabled=true;
  fetch('/api/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({t:T,nickname:val('nick'),tableName:val('tname'),fullName:val('full'),whatsapp:val('wa'),instagram:val('ig'),website:val('hp'),consent:true})})
    .then(function(r){return r.json().catch(function(){return {};}).then(function(j){return {ok:r.ok,body:j};});})
    .then(function(r){
      if(!r.ok){err.textContent=r.body.error||'Gagal mengirim. Coba lagi.';btn.disabled=false;return;}
      view.innerHTML='<div class="done"><b>Terima kasih!</b><span>Pendaftaranmu sudah terkirim. Admin akan mengeceknya. Setelah disetujui, namamu muncul di leaderboard.</span><a class="lk" href="index.html">Lihat leaderboard</a></div>';
    })
    .catch(function(){err.textContent='Tidak ada koneksi. Coba lagi.';btn.disabled=false;});
}
fetch('/api/signup?t='+encodeURIComponent(T)).then(function(r){return r.json();}).then(function(d){if(d.open)showForm(d.names||[]);else closed();}).catch(closed);
</script>
</body>
</html>
