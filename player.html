<style>
:root{
  --bg:#FAF7F2; --surface:#FFFFFF; --text:#1B4332; --muted:#587263; --line:#E4DDCD;
  --field:#FBF9F4; --accent:#2D6A4F; --onaccent:#FAF7F2; --focus:#2D6A4F; --red:#B72323; --gold:#B8912E;

  --display:"Playfair Display",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F2A20; --surface:#16382B; --text:#FAF7F2; --muted:#9DB8A9; --line:#26493B;

}
*{box-sizing:border-box}

.wrap{max-width:1120px;margin:0 auto;padding:0 20px 60px}
.upd{font-size:12px;line-height:16px;color:var(--muted);margin-top:8px;min-height:16px}
.seg{display:flex;gap:8px;margin:16px 0}
.seg button{flex:1;border-radius:999px;padding:10px 12px;border:1px solid var(--line);background:transparent;font-weight:500;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 16px;margin-bottom:12px;overflow:hidden}

.rm{flex:1;min-width:0}

.sub{font-size:18px;margin:20px 0 12px}

.prow:first-of-type{border-top:0}

.btn.primary{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:500}

/* ranks 1 to 4: a quiet marker, never a box. Every row keeps the same shape; the place is shown by a slim bar
   and a faint tint in the medal colour, a ring round the number (filled for first place) and a small crown
   beside the champion's name. Gold, silver, bronze and the brand green. */
:root{--m2:#8E98A6;--m3:#A8703E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--m2:#BAC3CF;--m3:#D49A66}}
.row{position:relative}
.row.m::before{content:"";position:absolute;left:-16px;right:-16px;top:0;bottom:0;background:linear-gradient(90deg,var(--mt),transparent 70%);opacity:.5;pointer-events:none}
.row.m::after{content:"";position:absolute;left:-16px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--mc)}
.row.m>*{position:relative;z-index:1}
.row.m .rn{background:transparent;border:2px solid var(--mc);color:var(--text)}
.row.r1{--mc:var(--gold);--mt:rgba(201,162,74,.16)}
.row.r2{--mc:var(--m2);--mt:rgba(150,160,176,.15)}
.row.r3{--mc:var(--m3);--mt:rgba(190,122,66,.15)}
.row.r4{--mc:var(--accent);--mt:rgba(95,180,138,.13)}
.row.r1 .rn{background:var(--mc);color:#2B2108}
.rname .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rname .crown{flex:none;width:16px;height:11px;color:var(--gold)}
#t10Modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:16px}
#t10Modal[hidden]{display:none}
.t10box{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:18px;width:100%;max-width:460px;padding:16px}

.t10head h3{font-size:20px}
.t10x{border:0;background:transparent;font-size:28px;line-height:1;padding:2px 8px}

.t10row{margin:12px 0 8px;font-size:12px;line-height:16px;color:var(--muted);font-weight:500;letter-spacing:0;text-transform:none}

.t10acts{display:flex;gap:12px;margin-top:16px}
.t10acts button{flex:1;border-radius:16px;padding:12px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.t10acts button.pri{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.t10acts button[hidden]{display:none}
.t10st{min-height:18px;font-size:13px;color:var(--muted);text-align:center;margin-top:8px}
.back{display:inline-flex;align-items:center;min-height:40px;padding:0;margin-bottom:4px}

/* the same slim bar as the scoreboard: small logo and name on the left, a way into a table on the right */
.brandbar{border-bottom:1px solid var(--line);background:var(--surface)}
.brandin{max-width:1120px;margin:0 auto;padding:8px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brandmark{display:flex;align-items:center;gap:10px;min-width:0;min-height:40px;text-decoration:none;color:inherit}
.brandmark img{height:28px;width:auto;display:block;flex:none}
.brandname{font-family:var(--display);font-weight:900;font-size:14px;letter-spacing:.07em;text-transform:uppercase;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.backlink{display:inline-flex;align-items:center;gap:8px;min-height:40px;flex:none;color:var(--accent);font-size:14px;font-weight:700;text-decoration:none;white-space:nowrap}
/* a row of the board opens that player's page (only players who have an open page) */
.rlink{position:absolute;left:0;top:0;right:0;bottom:0;border-radius:12px}

/* small round choice buttons (used by the format choice of the share window) */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 4px}

.chips button[aria-pressed="true"]{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:700}
.chips button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
/* header: title on the left, the two filters on the right (under the title on phones) */
.n-head{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"t f";align-items:start;gap:16px;padding:24px 0 12px}
.n-head .t{grid-area:t}.n-head h1{font-size:32px;line-height:1.15;font-weight:900}

.n-anchor{position:relative;display:block}
.n-dd{display:inline-flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:44px;padding:0 12px 0 16px;border-radius:16px;border:1px solid var(--line);background:var(--field);font-size:14px;font-weight:500;white-space:nowrap}
.n-dd .l{display:flex;align-items:center;gap:8px;min-width:0}.n-dd .l span{overflow:hidden;text-overflow:ellipsis}

.n-dd:focus-visible,.n-o:focus-visible,.n-tabs button:focus-visible,.n-share:focus-visible,.n-ls:focus-visible,.dcard:focus-visible,.n-cust .go:focus-visible,.n-cust input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.n-g{font-size:12px;line-height:16px;letter-spacing:0;text-transform:none;color:var(--muted);padding:12px 12px 4px;font-weight:500}
.n-o{display:flex;align-items:center;width:100%;min-height:44px;padding:0 12px;border:0;background:none;border-radius:10px;font-size:15px;text-align:left}
.n-o.on{background:var(--field);font-weight:500}.n-o .c{margin-left:auto;padding-left:12px;font-size:13px;color:var(--muted);font-weight:400}.n-o .ck{margin-left:10px;color:var(--accent);display:flex}

.n-cust{padding:6px 12px 10px}.n-cust .r{display:grid;grid-template-columns:1fr 1fr;gap:12px}.n-cust label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.n-cust input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--text);padding:0 12px;font:inherit;font-size:15px;color-scheme:light dark}
.n-cust .err{margin-top:8px;font-size:13px;color:var(--red)}.n-cust .go{margin-top:12px;width:100%;min-height:48px;border-radius:16px;border:0;background:var(--accent);color:var(--onaccent);font-weight:500;font-size:15px}
.n-dim{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.58);z-index:30}
.n-sheet{position:fixed;left:0;right:0;bottom:0;max-height:85vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;border-top:1px solid var(--line);padding:12px 16px calc(24px + env(safe-area-inset-bottom,0px));z-index:31}
.n-grab{width:42px;height:4px;border-radius:9px;background:var(--line);margin:2px auto 8px}.n-st{font-family:var(--display);font-weight:900;font-size:19px;padding:6px 12px 2px}
/* season progress, the numbers strip, tabs */
.n-prog{margin:0 0 16px}.n-prog .bar{height:4px;border-radius:9px;background:var(--line);overflow:hidden}.n-prog .bar i{display:block;height:100%;border-radius:9px;background:var(--accent)}
.n-prog .lab{display:flex;justify-content:space-between;font-size:12px;line-height:16px;color:var(--muted);margin-top:8px}

.n-strip>div{padding:12px 8px;text-align:center;border-left:1px solid var(--line);min-width:0}.n-strip>div:first-child{border-left:0}
.n-strip b{display:block;font-family:var(--display);font-weight:900;font-size:22px;line-height:1.1;font-variant-numeric:lining-nums tabular-nums}.n-strip span{display:block;font-size:12px;color:var(--muted);margin-top:4px;line-height:16px}
.n-tabs{display:flex;gap:24px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.n-tabs button{background:none;border:0;padding:0 4px;min-height:44px;font-size:15px;font-weight:500;color:var(--muted);position:relative}
.n-tabs button.on{color:var(--text)}.n-tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:var(--accent)}
.n-ch{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:4px 0 8px;font-size:13px;color:var(--muted)}

/* sessions and the side column */
.n-dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}.n-dl .dcard{margin:0}
.n-side .card{padding:16px}.n-side h3{font-size:16px;margin:0 0 4px}
.n-ls{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left}.n-side h3+.n-ls{border-top:0}
.n-ls .d{flex:none;width:48px;text-align:center;font-size:12px;color:var(--muted);line-height:1.2}.n-ls .d b{display:block;font-family:var(--display);font-size:20px;color:var(--text);font-weight:900;font-variant-numeric:lining-nums}

/* TBT Hanzi: the one font family for every Chinese character on the site (KaiTi). Latin text, numbers and everything else keep their own fonts.
   The files are fetched only by a page that really shows one of these characters. KaiTi has all the Traditional characters the site uses (East, Green dragon and the closing character included).
   The font is the WOFF2 copy of KaiTi (5 MB), which every browser that loads web fonts can read.
   Declared once here; the pages carry no copies of their own. */
@font-face{font-family:"TBT Hanzi";font-style:normal;font-weight:100 900;font-display:swap;unicode-range:U+3400-4DBF,U+4E00-9FFF,U+F900-FAFF;src:url(/assets/f/KaiTi_1.woff2) format("woff2");}
:root{--kai:"TBT Hanzi",KaiTi,"Kaiti SC",STKaiti,BiauKai,"KaiTi_GB2312",serif}

/* ranks 1 to 4 everywhere: 1 Diamond, 2 Ruby, 3 Jade, 4 Pearl. One set of colours for the ring, the bar, the tint and the gem. */
:root{--c1:#9FB8E8;--c2:#D62828;--c3:#2D6A4F;--c4:#C9BCA7;--t1:rgba(159,184,232,.16);--t2:rgba(214,40,40,.08);--t3:rgba(45,106,79,.12);--t4:rgba(201,188,167,.20);--g-d1:#6F90DB;--g-d2:#CFDEF9;--g-r1:#D62828;--g-r2:#FDE8E8;--g-j1:#2D6A4F;--g-j2:#B7D4C0;--g-p1:#EDE7DB;--g-p2:#B5A68B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c2:#E04646;--c3:#6FAE8E;--c4:#E8E1D8;--t1:rgba(159,184,232,.14);--t2:rgba(224,70,70,.12);--t3:rgba(111,174,142,.15);--t4:rgba(232,225,216,.10);--g-d1:#9FB8E8;--g-d2:#E8F1FF;--g-r1:#E04646;--g-j1:#6FAE8E;--g-j2:#E6F1E8;--g-p1:#E8E1D8;--g-p2:#C9BCA7}}
.gn{flex:none;display:inline-flex}.gn svg{width:15px;height:15px;display:block}
.gi-diamond .a{fill:var(--g-d1)}.gi-diamond .b{fill:var(--g-d2)}
.gi-ruby .a{fill:var(--g-r1)}.gi-ruby .b{fill:var(--g-r2);opacity:.5}
.gi-jade .a{fill:var(--g-j1)}.gi-jade .b{fill:var(--g-j2);opacity:.6}.gi-jade .c{fill:none;stroke:var(--g-j2);stroke-width:.9;stroke-linecap:round;opacity:.7}
.gi-pearl .a{fill:var(--g-p1);stroke:var(--g-p2);stroke-width:1.2}.gi-pearl .b{fill:#fff;opacity:.9}

.tn-field:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.tn-field svg{flex:none;width:20px;height:20px}
.tn-field input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font:inherit;font-size:16px;outline:none;padding:11px 0;-webkit-appearance:none;appearance:none}
.tn-field input::placeholder{color:var(--muted)}
.tn-field input::-webkit-search-cancel-button{display:none}
.tn-x{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer}
.tn-x[hidden]{display:none}
.tn-sbtn,.tn-mbtn{display:inline-flex;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer;align-items:center;justify-content:center;flex:none;padding:0}
.tn-sbtn svg,.tn-mbtn svg{width:18px;height:18px}
.tn-sbtn:focus-visible,.tn-mbtn:focus-visible,.tn-x:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
/* the results of a search */
.tn-res{margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.tn-res[hidden]{display:none}
.tn-hd .tn-res{position:absolute;left:12px;right:12px;top:62px;z-index:40;margin:0}
.tn-item{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:8px 16px;border-top:1px solid var(--line);background:transparent;color:var(--text);text-align:left;font:inherit;text-decoration:none;cursor:pointer;box-sizing:border-box}
.tn-item:first-child{border-top:0}.tn-item:hover,.tn-item:focus-visible{background:var(--field)}
.tn-item:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.tn-item>span:first-child{flex:1;min-width:0}.tn-item b{display:block;font-size:15px;overflow-wrap:anywhere}.tn-item small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.tn-tag{flex:none;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);white-space:nowrap}
.tn-go{flex:none;width:18px;height:18px;color:var(--muted)}
.tn-note{padding:10px 16px 12px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
.tn-none{padding:16px}.tn-none b{display:block;font-size:16px;margin-bottom:4px}.tn-none p{margin:0 0 10px;color:var(--muted);font-size:14px;line-height:1.45}
.tn-sug{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:16px;border:1px solid var(--accent);background:transparent;color:var(--accent);font:500 14px var(--sans);text-decoration:none;cursor:pointer}
.tn-also{margin:12px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tn-also h3{margin:0;padding:12px 16px 8px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.02em}

.tn-panel{position:absolute;left:0;right:0;top:100%;z-index:45;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 18px 30px rgba(0,0,0,.28);padding:6px 12px 14px}
.tn-panel[hidden]{display:none}
.tn-panel a{display:flex;align-items:center;gap:14px;min-height:50px;padding:0 10px;border-radius:12px;color:var(--text);font:500 15px var(--sans);text-decoration:none}
.tn-panel a svg{width:22px;height:22px;color:var(--muted);flex:none}.tn-panel a .tn-go{margin-left:auto;width:18px;height:18px}

.tn-adm h4{margin:12px 12px 4px;font:500 12px/16px var(--sans);letter-spacing:0;text-transform:none;color:var(--muted)}
.tn-adm a{min-height:44px;font-weight:500;color:var(--muted);font-size:14px}.tn-adm a svg{opacity:.8}
.tn-dim{position:fixed;inset:0;z-index:44;background:rgba(0,0,0,.42)}.tn-dim[hidden]{display:none}
/* This is me, on a player's page: one small line under the title, never squeezed into the title column */
.tn-this-row{margin:-2px 0 12px}
.tn-this{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font:700 13.5px var(--sans);white-space:nowrap;cursor:pointer}
.tn-this svg{width:16px;height:16px;flex:none}
.tn-this[aria-pressed="true"]{background:var(--accent);color:var(--onaccent)}
.tn-this:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tn-saved{font-size:12px;line-height:1.4;color:var(--muted);margin:6px 0 0}
/* the leaderboard rows that open a page show an arrow */
.row.lk .rv{margin-right:24px}
.row.lk .rlink::after{content:"";position:absolute;right:12px;top:50%;width:8px;height:8px;margin-top:-4px;border-right:2px solid var(--muted);border-top:2px solid var(--muted);transform:rotate(45deg);opacity:.7}
/* phones: the name stays, a search icon opens the search over the header */
@media (max-width:719px){
  .tn-hd .brandname{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.15;overflow-wrap:anywhere}
  .tn-hd.searching .brandmark,.tn-hd.searching .tn-sbtn,.tn-hd.searching .tn-mbtn,.tn-hd.searching .tn-gap{display:none}
  .tn-hd.searching .tn-search{display:block;flex:1}
}
/* from 720px the search is a field in the header all the time, and the menu opens as a small card under the button */
@media (min-width:720px){
  .tn-gap{display:none}.tn-sbtn{display:none}
  .tn-search{display:block;flex:1;max-width:520px;margin-left:auto}
  .tn-hd .tn-res{left:auto;right:calc(max(0px,(100% - 1120px) / 2) + 76px);width:min(480px,calc(100% - 40px));top:62px}
  .tn-panel{left:auto;right:max(12px,calc((100% - 1120px) / 2 + 20px));top:calc(100% + 4px);width:320px;border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 40px rgba(0,0,0,.28)}
  .tn-dim{background:rgba(0,0,0,.18)}
}

    y+=212;});

  var rh=y>1300?72:86;rows=rows.slice(0,Math.max(1,Math.floor((1680-y)/rh)));

  x.textAlign='center';x.fillStyle=th.ink;x.font='italic 700 40px '+WPF;x.fillText('Play. Learn. Connect.',540,1720);x.textAlign='left';}
function wrPagesFor(D){var p=[pCover,pGames,pStyle];D.fams.forEach(function(F){p.push(pFam(F));});if(D.fams.some(function(F){return (F.bestNight&&F.bestNight.net>0)||F.worst||wrUp(F);}))p.push(pMoments);if(D.buddy||D.rival)p.push(pPeople);p.push(pSum);return p;}
function wrDraw(){var x=WR.cv.getContext('2d');WR.cv.width=1080;WR.cv.height=1920;x.textBaseline='alphabetic';WR.pages[WR.at](x,WR.D,WR.at+1);if(WR.im)WR.im.src=WR.cv.toDataURL('image/png');
  var el=document.getElementById('wrapModal');var dots=el.querySelector('.wr-dots');if(dots)dots.innerHTML=WR.pages.map(function(_,i){return '<i class="'+(i===WR.at?'on':'')+'"></i>';}).join('');
  var pv=el.querySelector('[data-wr="prev"]'),nx=el.querySelector('[data-wr="next"]');if(pv)pv.disabled=WR.at===0;if(nx)nx.disabled=WR.at===WR.pages.length-1;}
function wrOpen(){
  var el=document.getElementById('wrapModal'),D=wrData();WR.D=D;WR.pages=wrPagesFor(D);WR.at=0;
  el.innerHTML='<div class="wr-s"><div class="wr-h"><h2 id="wrT">'+esc(D.month)+' Wrapped</h2><button type="button" class="wr-x" data-wr="close" aria-label="Close">×</button></div>'
    +'<div class="wr-c"><button type="button" class="wr-nav" data-wr="prev" aria-label="Previous page">‹</button><canvas width="1080" height="1920"></canvas><img alt="'+esc(D.name)+', '+esc(D.month)+' Wrapped"><button type="button" class="wr-nav" data-wr="next" aria-label="Next page">›</button></div><div class="wr-dots" aria-hidden="true"></div>'
    +(wrTouch()?'<p class="wr-tip">Tip: press and hold the picture to save it.</p>':'')
    +'<div class="wr-f"><button type="button" data-wr="save1">Save</button>'+(wrCanShare()?'<button type="button" data-wr="share">Share</button>':'')+'<button type="button" class="p" data-wr="saveall">Save all '+WR.pages.length+'</button></div></div>';
  el.hidden=false;WR.cv=el.querySelector('canvas');WR.im=el.querySelector('.wr-c img');
  var srcs=[LOGO,avUrl(D.avatar)].concat(wrMascotSrcs(D)).concat(['/assets/a/'+D.style[3]+'.svg?v='+AV_V]);D.fams.forEach(function(F){if(F.best&&F.best.bh.t){var tl=F.best.bh.t;(tl.h||[]).concat(tl.w!=null?[tl.w]:[]).concat([].concat.apply([],(tl.m||[]).map(function(m){return [m[1],m[1]+1,m[1]+2];}))).forEach(function(t){if(WR_TILE[t])srcs.push(WR_TILE[t]);});}});
  var fonts=document.fonts&&document.fonts.load?Promise.all(['900 96px "Playfair Display"','italic 700 40px "Playfair Display"','400 30px "Inter Tight"','700 30px "Inter Tight"'].map(function(f){return document.fonts.load(f);})).catch(function(){}):Promise.resolve();
  wrDraw();
  Promise.all([fonts,wrRank(D),wrPV()].concat(srcs.map(wrLoad))).then(function(){if(!el.hidden)wrDraw();});
  var sx=null;WR.im.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;},{passive:true});
  WR.im.addEventListener('touchend',function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>40)wrGo(dx<0?1:-1);});
}
function wrGo(d){var n=WR.at+d;if(n<0||n>=WR.pages.length)return;WR.at=n;wrDraw();}
function wrBlob(i){return new Promise(function(res){var c=document.createElement('canvas');c.width=1080;c.height=1920;WR.pages[i](c.getContext('2d'),WR.D,i+1);c.toBlob(function(b){res(b);},'image/png');});}
function wrTouch(){return !!(window.matchMedia&&matchMedia('(pointer:coarse)').matches);}
function wrCanShare(){try{return !!(navigator.canShare&&navigator.canShare({files:[new File([new Blob(['x'],{type:'image/png'})],'x.png',{type:'image/png'})]}));}catch(e){return false;}}
// Save: a download (Android puts it in Download, which the gallery shows); Share: the phone's share sheet, for a story or a chat
function wrName(i){return 'tbt-wrapped-'+S.period+'-'+slugOf(WR.D.name)+'-'+(i+1)+'.png';}
function wrSave(all){
  var idx=all?WR.pages.map(function(_,i){return i;}):[WR.at];
  Promise.all(idx.map(wrBlob)).then(function(bs){
    bs.forEach(function(b,k){setTimeout(function(){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=wrName(idx[k]);document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);},k*350);});
    toast(all?'Saving '+bs.length+' pictures':'Picture saved');
  });
}
function wrShare(){wrBlob(WR.at).then(function(b){var f=new File([b],wrName(WR.at),{type:'image/png'});navigator.share({files:[f],title:WR.D.month+' Wrapped'}).catch(function(){});});}
document.getElementById('wrapModal').addEventListener('click',function(e){var b=e.target.closest?e.target.closest('[data-wr]'):null;if(e.target.id==='wrapModal'||(b&&b.dataset.wr==='close')){this.hidden=true;this.innerHTML='';return;}if(!b)return;var a=b.dataset.wr;if(a==='prev')wrGo(-1);else if(a==='next')wrGo(1);else if(a==='save1')wrSave(false);else if(a==='share')wrShare();else if(a==='saveall')wrSave(true);});
document.addEventListener('keydown',function(e){var el=document.getElementById('wrapModal');if(!el||el.hidden)return;if(e.key==='Escape'){el.hidden=true;el.innerHTML='';}else if(e.key==='ArrowRight')wrGo(1);else if(e.key==='ArrowLeft')wrGo(-1);});

function share(){
  var url=location.origin+location.pathname,title=S.data.player.nickname+' | Tiles by Tiles';
  if(navigator.share){navigator.share({title:title,url:url}).catch(function(){});return;}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(function(){toast('Link copied');},function(){toast(url);});return;}
  toast(url);

document.addEventListener('keydown',function(e){
  if(S.pf.sheet&&e.key==='Escape'){e.preventDefault();pfClose();return;}
  var gk=e.target.closest?e.target.closest('.pp-game[role="button"]'):null;if(gk&&(e.key==='Enter'||e.key===' ')){e.preventDefault();toggleGame(+gk.dataset.i);return;}

});
window.addEventListener('resize',function(){if(S.menu)render();});
function load(){
  S.status='loading';render();
  if(!ID){S.status='closed';render();return;}
  S.err='';
  // only the server's own "not available" answer closes the page; any other failure (a 404 from a missing service, an error, no connection) is shown as a failure
  fetch('/api/overview?player='+encodeURIComponent(ID)).then(function(r){
    if(r.status===404)return r.json().then(function(j){if(j&&j.error==='not_available'){S.status='closed';render();return null;}S.err='404-no-service';throw new Error('x');},function(){S.err='404-no-service';throw new Error('x');});
    if(!r.ok){S.err=String(r.status);throw new Error('x');}
    return r.json();
  }).then(function(d){
    if(!d)return;
    if(!d.player){S.err='old-service';throw new Error('x');}   // the server answered with the whole leaderboard: it does not have the player service yet
    S.data=d;S.status='ok';readUrl();autoPeriod();autoMode();
    try{render();}catch(e){S.err='render';S.status='error';try{console.error(e);}catch(x){}render();}
  }).catch(function(){if(!S.err)S.err='network';S.status='error';render();});
}
