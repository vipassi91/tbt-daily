<style>
:root{
  --bg:#FAF7F2; --surface:#FFFFFF; --text:#1B4332; --muted:#587263; --line:#E4DDCD;
  --field:#FBF9F4; --accent:#2D6A4F; --onaccent:#FAF7F2; --focus:#2D6A4F; --red:#B72323;
  --sans:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F2A20; --surface:#16382B; --text:#FAF7F2; --muted:#9DB8A9; --line:#26493B;
    --field:#12302A; --accent:#8FD0AE; --onaccent:#0F2A20; --focus:#8FD0AE; --red:#EA8888;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;color:var(--text);font-weight:700}
h2{font-size:28px;line-height:1.15;overflow-wrap:anywhere}
h3{font-size:18px;line-height:1.3;overflow-wrap:anywhere}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
.topbar{border-bottom:1px solid var(--line);padding:12px 0}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tb{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.06em;color:var(--accent)}
.tb img{width:26px;height:auto}
.lnk{background:none;border:0;color:var(--muted);font-size:13px;padding:4px 6px}
.lnk:hover{color:var(--red)}
main{padding:24px 0 72px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-bottom:8px}
.field input{font:inherit;font-size:16px;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
.field input:focus-visible,button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.frow{display:flex;gap:12px;flex-wrap:wrap}
.frow .field{flex:1;min-width:130px}
.btn{display:inline-block;border-radius:16px;padding:8px 16px;line-height:20px;border:1px solid var(--line);background:transparent;font-weight:500;text-decoration:none;color:var(--text);font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:500}
.btn.sm{padding:6px 12px;font-size:13px}

.dayrow:hover strong{color:var(--accent)}
.meta{font-size:13px;color:var(--muted);margin-top:2px}
.tcard{border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;background:var(--field)}
.th{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:8px}
.cr{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.cl{width:64px;font-size:13px;color:var(--muted)}

.login{max-width:300px;margin:88px auto;text-align:center}
.login img{width:48px;margin-bottom:12px}
.login input{font:inherit;font-size:16px;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--text);margin:16px 0;text-align:center}
.err{color:var(--red);font-size:13px;margin:6px 0}
.mb{display:inline-block;font-size:12px;line-height:18px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:0 8px;margin-left:8px;vertical-align:middle}
.empty{padding:24px;text-align:center;color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--accent);color:var(--onaccent);padding:8px 16px;line-height:24px;border-radius:999px;font-size:14px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

/* navigation: the same bar on every admin page, with the current page marked */
.tbrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tbrow .lnk{padding:10px 6px;min-height:40px}

.back{display:inline-flex;align-items:center;min-height:38px}
.topbar .wrap{display:block}
main .lnk,main .back{display:inline-flex;align-items:center;min-height:38px;padding:8px}

.fxc{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.fxin{width:100%;min-width:0;font:inherit;font-size:16px;font-weight:700;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px}.fxin:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.fxtags{display:flex;flex-wrap:wrap;gap:4px 8px}.fxtag{font-size:12px;font-weight:500;color:var(--accent);white-space:nowrap}.fxtag.chg{color:var(--muted)}
.fxm{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:18px;cursor:pointer}.fxm[disabled]{opacity:.3;cursor:default}
.fxres{margin-top:16px;border:1px solid var(--line);border-radius:16px;padding:12px 16px;background:var(--field)}
.fxp{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-size:14px}.fxp b{font-variant-numeric:tabular-nums;white-space:nowrap}.fxp.chg b{color:var(--accent)}
.fxt{margin:12px 0 0;font-size:13px;line-height:20px;color:var(--muted)}.fxt.warn{color:var(--red)}
.fxerr{margin-top:12px;color:var(--red);font-size:13px}
.fxf{display:flex;gap:12px;padding:16px 20px;border-top:1px solid var(--line)}.fxf .btn{flex:1;text-align:center;min-height:44px;cursor:pointer}
.btn[disabled]{opacity:.4;cursor:default}
</style>

<script>
/* If the page's own script does not start (a broken or half-uploaded file, a very old browser), the page would stay empty or dead. After 4 seconds it says so, with the first error, and offers a reload.
   It stays quiet when the script did run and is only waiting for the server (the navigation script sets window.__tbtNav), unless an error was seen and nothing is drawn. */
(function(){var errs=[];function note(m){if(m)errs.push(String(m).slice(0,160));}
window.addEventListener('error',function(e){note((e&&e.message)||(e&&e.error)||'error');});
window.addEventListener('unhandledrejection',function(e){note('promise: '+((e&&e.reason&&e.reason.message)||(e&&e.reason)||'rejected'));});
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
setTimeout(function(){var a=document.getElementById('app');if(!a)return;if(window.__tbtNav&&(a.children.length||!errs.length))return;
a.innerHTML='<div role="alert" style="max-width:420px;margin:72px auto;padding:0 20px;font:16px/24px \'Inter Tight\',system-ui,sans-serif;color:var(--text,#1B4332)"><h1 style="font:900 28px/1.15 \'Playfair Display\',Georgia,serif;margin:0 0 12px">Can\u2019t load this page</h1><p style="margin:0 0 16px;color:var(--muted,#587263)">Something stopped the page from starting. Reload it, or go back to the leaderboard.</p><p style="display:flex;gap:8px;margin:0 0 16px"><button type="button" onclick="location.reload()" style="min-height:44px;padding:0 16px;border-radius:16px;border:0;background:var(--accent,#2D6A4F);color:var(--onaccent,#fff);font:500 14px \'Inter Tight\',system-ui,sans-serif;cursor:pointer">Reload</button><a href="/leaderboard" style="display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:16px;border:1px solid var(--line,#E4DDCD);color:var(--text,#1B4332);font:500 14px \'Inter Tight\',system-ui,sans-serif;text-decoration:none">Leaderboard</a></p><p style="margin:0;font-size:12px;line-height:16px;color:var(--muted,#587263)">Code: '+esc(errs[0]||'the page script did not run')+'</p></div>';},4000);})();
</script>

.hits{margin-top:6px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.hit{display:flex;flex-direction:column;align-items:flex-start;width:100%;padding:8px 12px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left}
.hit:first-child{border-top:0}.hit:hover{background:var(--field)}
.hchips{display:flex;flex-wrap:wrap;gap:6px}
.hchip{display:inline-flex;align-items:center;gap:2px;padding:4px 4px 4px 12px;border-radius:999px;background:var(--accent);color:var(--onaccent);font-weight:700;font-size:14px}
.hchip button{width:28px;height:28px;border-radius:50%;border:0;background:transparent;color:var(--onaccent);font-size:18px;line-height:1;padding:0}
</style>
<style>.danger-zone{margin-top:28px;border-color:color-mix(in srgb,var(--red) 35%,var(--line))}.danger-zone h3{color:var(--red)}</style>
<style id="daycss">.dayrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;border:1px dashed var(--line);border-radius:14px;padding:10px 12px;margin:0 0 14px}.note{border-left:3px solid var(--gold,#b8912e);padding:8px 12px;background:rgba(184,145,46,.08);border-radius:0 12px 12px 0;font-size:13px;margin:12px 0}.drow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:12px 0}.dtbls{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}@media(min-width:640px){.dtbls{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(min-width:980px){.dtbls{grid-template-columns:repeat(3,minmax(0,1fr))}}.dtb{border:1px solid var(--line);border-radius:16px;background:var(--surface,var(--card));padding:12px 14px;min-width:0}.dtb h3{font-size:17px;display:flex;justify-content:space-between;align-items:center;margin:0;font-variant-numeric:lining-nums}.dtb h3 .bad{color:var(--red);font-weight:700}.mrow{display:flex;justify-content:space-between;align-items:center;margin:6px 0 4px}.modesel{font-size:12px;padding:3px 6px;border-radius:8px;border:1px solid var(--line);background:var(--field,transparent);font-weight:700;color:var(--accent);width:auto}.seat{display:flex;gap:8px;align-items:center;padding:6px 0;font-size:14px;border-top:1px solid var(--line)}.seat .nm{flex:1;min-width:0}.seat .w{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--field,transparent);border:1px solid var(--line);color:var(--red);font-family:"TBT Hanzi",KaiTi,serif}.seat select{width:auto;font-size:13px;padding:4px 6px;border-radius:8px;border:1px solid var(--line);background:var(--field,transparent)}.dtb>.seat:first-child{border-top:0}.dayrow a.chip{text-decoration:none}.chip .cm{font-weight:800}.pl .pla{order:2;display:flex;gap:2px;flex:none}.pl .pla .x{order:0}.pl .x.mv{color:var(--accent)}.dtb .tag{font-family:inherit}.seat .unp{color:#9a7618}.dlinks{display:flex;gap:6px;margin-top:10px}.dlinks .btn{flex:1;min-height:36px;padding:0 8px;font-size:13px;white-space:nowrap}</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<div class="toast" id="toast"></div>
<script>window.__tbtNav=true;   /* tells the safety message in the head that this script did run */

var LOGO='/assets/i/cfad30e8e7.png';
var password=sessionStorage.getItem('tbt-admin-pw')||'';
var authed=false,loginError='';
var ROLE='admin',ME='';
function BASE(){return ROLE==='host'?'/api/host':'/api/admin';}
var A={hostOptions:[],add:null,events:null,defaults:{banks:[],contactWa:'',place:''},err:'',view:'list',id:null,ev:null,edit:null,busy:false,ses:'all',open:{},rm:null};
var LEVELS=[['first','First timer'],['beg','Beginner'],['cas','Casual'],['int','Intermediate'],['adv','Advanced']];
var TYPES=[['cls','Class'],['open','Open Play'],['tour','Tournament'],['other','Event']];
var MODES=[['default','Default'],['casual','Casual'],['tournament','Tournament'],['custom','Custom'],['mcr4','MCR-4'],['mcr8','MCR-8'],['mcrc','MCR-Custom'],['chicken','Chicken Hand']];
var STATUS={held:['Not transferred yet','grey'],review:['Transferred: check bank','gold'],rejected:['Transfer not found','red'],confirmed:['Confirmed','ok'],venue:['Pays at the venue','gold'],expired:['Expired','red'],cancelled:['Cancelled','red']};
var MON3=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DAY3=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'],BULAN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function H(){return ROLE==='host'?{'Content-Type':'application/json','X-TBT':'host'}:{'Authorization':'Bearer '+password,'Content-Type':'application/json'};}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('show');},2400);}
function pad2(n){return ('0'+n).slice(-2);}
function rp(n){return n===0?'Free':'Rp '+Number(n).toLocaleString('id-ID');}
function rpCode(n){var s=rp(n);return s.slice(0,-2)+'<u>'+s.slice(-2)+'</u>';}
function lvl(k){for(var i=0;i<LEVELS.length;i++)if(LEVELS[i][0]===k)return LEVELS[i][1];return k;}
function typeName(k){for(var i=0;i<TYPES.length;i++)if(TYPES[i][0]===k)return TYPES[i][1];return 'Event';}
function modeName(k){for(var i=0;i<MODES.length;i++)if(MODES[i][0]===k)return MODES[i][1];return k;}
function dP(s){return {y:+s.slice(0,4),m:+s.slice(5,7)-1,d:+s.slice(8,10),hm:s.slice(11,16)};}
function shortDate(s){var p=dP(s);return DAY3[new Date(p.y,p.m,p.d).getDay()]+' '+p.d+' '+MON3[p.m];}
function idDate(s){var p=dP(s);return HARI[new Date(p.y,p.m,p.d).getDay()]+' '+p.d+' '+BULAN[p.m]+', jam '+p.hm.replace(':','.');}
function when(iso){if(!iso)return '';var d=new Date(Date.parse(iso)+7*3600e3);return DAY3[d.getUTCDay()]+' '+d.getUTCDate()+' '+MON3[d.getUTCMonth()]+', '+pad2(d.getUTCHours())+':'+pad2(d.getUTCMinutes());}
function waNum(n){var d=String(n||'').replace(/\D/g,'');if(d.charAt(0)==='0')d='62'+d.slice(1);return d;}
function showWa(n){var d=String(n||'');return d.indexOf('62')===0?'0'+d.slice(2):d;}
function copyText(v,label){try{navigator.clipboard.writeText(v).then(function(){toast(label||'Copied');},function(){prompt('Copy this:',v);});}catch(e){prompt('Copy this:',v);}}
function api(method,url,body){return fetch(url,{method:method,headers:H(),credentials:'same-origin',body:body?JSON.stringify(body):undefined}).then(function(r){return r.json().catch(function(){return {};}).then(function(j){if(!r.ok)throw new Error(j.error||'Something went wrong');return j;});});}

// ---- sign in ----
function checkLogin(){if(!password)return Promise.resolve(false);return fetch('/api/admin/login',{method:'POST',headers:H()}).then(function(r){return r.ok;}).catch(function(){return false;});}
function doLogin(){password=document.getElementById('pw').value;checkLogin().then(function(ok){if(!ok){loginError='Wrong password.';render();return;}sessionStorage.setItem('tbt-admin-pw',password);authed=true;loginError='';go();});}
function logout(){if(ROLE==='host'){location.href='/host.html';return;}sessionStorage.removeItem('tbt-admin-pw');password='';authed=false;render();}
// a host who is signed in on the Host desk comes in without the admin password
function hostLogin(){return fetch('/api/host/me',{credentials:'same-origin'}).then(function(r){return r.ok?r.json():null;}).then(function(d){if(d&&d.nickname&&!d.mustChange){ROLE='host';ME=d.nickname;return true;}return false;}).catch(function(){return false;});}

// ---- the address keeps the view: #new, #edit=<id>, #bookings=<id>
function go(){
  var h=location.hash.slice(1),m;A.err='';
  if(h==='new'){if(ROLE==='host'){location.hash='';return;}A.view='edit';A.id=null;A.edit=null;loadList().then(function(){A.edit=blankEvent();render();});return;}
  if((m=/^edit=(\w+)$/.exec(h))){A.view='edit';A.id=m[1];A.edit=null;render();loadOne(m[1]).then(function(){A.edit=toForm(A.ev);render();});return;}
  if((m=/^add=(\w+)$/.exec(h))){A.view='add';A.id=m[1];A.add=null;A.find={};if(!A.ev||A.ev.id!==m[1]){A.ev=null;render();loadOne(m[1]).then(function(){render();});}else render();return;}
  if((m=/^day=(\w+)\.(\w+)$/.exec(h))){A.view='day';A.id=m[1];A.day=null;render();loadDay(m[1],m[2]);return;}
  if((m=/^bookings=(\w+)$/.exec(h))){A.view='bookings';A.id=m[1];if(!A.ev||A.ev.id!==m[1]){A.ev=null;A.ses='all';}render();loadOne(m[1]).then(render);return;}
  A.view='list';render();loadList().then(render);
}
window.addEventListener('hashchange',function(){if(authed){go();window.scrollTo(0,0);}});
function loadList(){return api('GET',BASE()+'/events').then(function(d){A.events=d.events;A.defaults=d.defaults||A.defaults;A.hostOptions=d.hostOptions||[];}).catch(function(e){A.err=e.message;});}
function loadOne(id){return api('GET',BASE()+'/events/'+encodeURIComponent(id)).then(function(d){A.ev=d;}).catch(function(e){A.err=e.message;render();});}

function topBar(){if(ROLE==='host')return '<div class="topbar"><div class="wrap"><div class="tbrow"><div class="tb"><img src="'+LOGO+'" alt="">TBT HOST DESK</div><span class="meta">'+esc(ME)+'</span></div><nav class="anav" aria-label="Host"><a href="/host.html">Sessions</a><a href="/admin-events" aria-current="page">Events</a><a href="/leaderboard" target="_blank" rel="noopener">Leaderboard &#8599;</a></nav></div></div>';return '<div class="topbar"><div class="wrap"><div class="tbrow"><div class="tb"><img src="'+LOGO+'" alt="">TBT ADMIN</div><button class="lnk" onclick="logout()">Sign out</button></div><nav class="anav" aria-label="Admin"><a href="/admin-daily.html">Sessions</a><a href="/admin-pemain.html">Players</a><a href="/admin-events" aria-current="page">Events</a><a href="/admin-home">Homepage</a><a href="/leaderboard" target="_blank" rel="noopener">Leaderboard &#8599;</a></nav></div></div>';}
function render(){
  var app=document.getElementById('app');
  if(!authed){
    app.innerHTML='<div class="login"><img src="'+LOGO+'" alt=""><h2>Admin</h2><input id="pw" type="password" placeholder="Password">'+(loginError?'<div class="err">'+loginError+'</div>':'')+'<button class="btn primary" style="width:100%" onclick="doLogin()">Sign in</button><p class="meta" style="margin-top:16px">Hosting an event? <a href="/host.html">Sign in on the Host desk</a>, then open Events.</p></div>';
    var pw=document.getElementById('pw');pw.onkeydown=function(e){if(e.key==='Enter')doLogin();};return;
  }
  var y=window.scrollY,f=document.activeElement,fid=f&&f.id,pos=null;try{pos=f&&f.selectionStart;}catch(e){}
  app.innerHTML=topBar()+'<main class="wrap">'+(A.view==='edit'?vEdit():(A.view==='add'?vAdd():(A.view==='day'?vDay():(A.view==='bookings'?vBookings():vList()))))+'</main>';
  if(fid){var n=document.getElementById(fid);if(n){n.focus();try{if(pos!=null)n.setSelectionRange(pos,pos);}catch(e){}}}
  window.scrollTo(0,y);
}

// ---- the list ----
function vList(){
  if(A.err&&!A.events)return '<div class="empty">'+esc(A.err)+'</div>';
  if(!A.events)return '<div class="empty">Loading…</div>';
  return (ROLE==='host'?'<div class="ah"><h2>Events you host</h2></div><p class="meta" style="margin:4px 0 16px">Events the admin asked you to host. You can manage their bookings, payments and details.</p>':'<div class="ah"><h2>Events</h2><a class="btn primary" href="#new">+ New event</a></div><p class="meta" style="margin:4px 0 16px">Classes, open play, tournaments. Bookings, transfers and refunds per event.</p>')
    +(A.events.length?A.events.map(function(e){
      var cap=0,tk=0,modes=[];e.sessions.forEach(function(s){cap+=s.seats;tk+=s.taken;if(modes.indexOf(s.mode)<0)modes.push(s.mode);});
      var rev=e.bookings.review||0;
      return '<div class="card"><div><span class="tag">'+typeName(e.type)+'</span> '+(e.status==='draft'?'<span class="tag grey">Draft</span>':'<span class="tag ok">Published</span>')+'</div><h3 style="margin-top:6px">'+esc(e.title)+'</h3>'
        +'<div class="meta">'+(e.sessions[0]?shortDate(e.sessions[0].start)+' '+e.sessions[0].start.slice(0,4)+' · ':'')+e.sessions.length+' session'+(e.sessions.length===1?'':'s')+' · '+tk+'/'+cap+' seats · '+modes.map(modeName).join(', ')+'</div>'
        +(rev?'<div class="note">'+rev+' transfer'+(rev===1?'':'s')+' to check</div>':'')+(e.refunds?'<div class="note">'+e.refunds+' refund'+(e.refunds===1?'':'s')+' to send</div>':'')
        +'<div class="acts"><a class="btn primary" href="#bookings='+e.id+'">Bookings</a><a class="btn" href="#edit='+e.id+'">Edit</a>'+(e.status==='published'?'<a class="btn" href="/events/'+e.id+'/'+e.slug+'" target="_blank" rel="noopener">Event page &#8599;</a>':'')+'</div></div>';
    }).join(''):'<div class="empty">'+(ROLE==='host'?'No events to host yet. The admin picks the hosts of each event.':'No events yet. Make the first one.')+'</div>');
}

// ---- making and editing an event ----
function today(){var d=new Date(Date.now()+7*3600e3+7*86400e3);return d.getUTCFullYear()+'-'+pad2(d.getUTCMonth()+1)+'-'+pad2(d.getUTCDate());}
function blankSession(){return {id:'',date:today(),time:'19:00',hours:'3',seats:'16',price:'50000',levels:[],mode:'default',taken:0};}
function blankEvent(){var d=A.defaults||{};return {id:'',type:'open',title:'',place:d.place||'',about:'',contactWa:showWa(d.contactWa||''),banks:[(d.banks||[])[0]||{bank:'',number:'',name:''},(d.banks||[])[1]||{bank:'',number:'',name:''}],venuePay:false,fours:false,showGoing:true,closeHours:'2',status:'draft',hosts:[],sessions:[blankSession()]};}
function toForm(e){if(!e)return null;return {id:e.id,type:e.type,title:e.title,place:e.place,about:e.about,contactWa:showWa(e.contactWa),banks:[e.banks[0]||{bank:'',number:'',name:''},e.banks[1]||{bank:'',number:'',name:''}],venuePay:e.venuePay,fours:e.fours,showGoing:e.showGoing,closeHours:String(e.closeHours),status:e.status,hosts:(e.hosts||[]).slice(),
  sessions:e.sessions.map(function(s){return {id:s.id,date:s.start.slice(0,10),time:s.start.slice(11,16),hours:String(s.hours),seats:String(s.seats),price:String(s.price),levels:s.levels.slice(),mode:s.mode,taken:s.taken};})};}
function inp(id,val,attrs){return '<input id="'+id+'" data-e="'+id+'" value="'+esc(val)+'"'+(attrs||'')+'>';}
function tg(key,label,sub){var on=!!A.edit[key];return '<div class="toggle"><div><b>'+label+'</b><div class="meta">'+sub+'</div></div><label class="sw"><input type="checkbox" data-t="'+key+'"'+(on?' checked':'')+' aria-label="'+esc(label)+'"><span></span></label></div>';}
function vEdit(){
  var e=A.edit;
  if(A.err&&!e)return '<a class="back" href="#">&lsaquo; Events</a><div class="empty">'+esc(A.err)+'</div>';
  if(!e)return '<div class="empty">Loading…</div>';
  var ses=e.sessions.map(function(s,i){
    var all=!s.levels.length;
    return '<div class="ses"><div class="ah" style="margin-bottom:8px"><b>Session '+(i+1)+'</b>'+(s.taken?'<span class="meta">'+s.taken+' booked, cannot be removed</span>':(e.sessions.length>1?'<button type="button" class="btn sm" data-a="srm" data-i="'+i+'">Remove</button>':''))+'</div>'
      +'<div class="sg"><div class="field"><label for="s'+i+'date">Date</label>'+inp('s'+i+'date',s.date,' type="date"')+'</div><div class="field"><label for="s'+i+'time">Start</label>'+inp('s'+i+'time',s.time,' type="time"')+'</div>'
      +'<div class="field"><label for="s'+i+'hours">Hours</label>'+inp('s'+i+'hours',s.hours,' type="number" min="0.5" max="24" step="0.5"')+'</div><div class="field"><label for="s'+i+'seats">Seats</label>'+inp('s'+i+'seats',s.seats,' type="number" min="1" max="400" step="'+(e.fours?4:1)+'"')+'</div>'
      +'<div class="field"><label for="s'+i+'price">Price (Rp)</label>'+inp('s'+i+'price',s.price,' type="number" min="0" step="1000"')+'</div>'
      +'<div class="field"><label for="s'+i+'mode">Game mode</label><select id="s'+i+'mode" data-e="s'+i+'mode">'+MODES.map(function(m){return '<option value="'+m[0]+'"'+(m[0]===s.mode?' selected':'')+'>'+m[1]+'</option>';}).join('')+'</select></div></div>'
      +'<div class="meta" style="margin:4px 0 6px">Levels '+(all?'(all levels)':'')+'</div><div class="chips">'+LEVELS.map(function(l){var on=all||s.levels.indexOf(l[0])>=0;return '<button type="button" class="chip" data-a="slv" data-i="'+i+'" data-v="'+l[0]+'" aria-pressed="'+on+'">'+l[1]+'</button>';}).join('')+'</div></div>';
  }).join('');
  return '<a class="back" href="#">&lsaquo; Events</a><h2 style="margin:4px 0 16px">'+(e.id?'Edit event':'New event')+'</h2>'
    +'<div class="card"><div class="meta" style="margin-bottom:6px">Kind of event</div><div class="chips">'+TYPES.map(function(t){return '<button type="button" class="chip" data-a="type" data-v="'+t[0]+'" aria-pressed="'+(e.type===t[0])+'">'+t[1]+'</button>';}).join('')+'</div>'
    +'<div class="field" style="margin-top:14px"><label for="title">Title</label>'+inp('title',e.title,' maxlength="80" placeholder="Friday Night Mabar"')+'</div>'
    +'<div class="field"><label for="place">Place</label>'+inp('place',e.place,' maxlength="120" placeholder="Four Winds Citraland, Surabaya"')+'</div>'
    +'<div class="field"><label for="about">About</label><textarea id="about" data-e="about" rows="4" maxlength="2000">'+esc(e.about)+'</textarea></div></div>'
    +'<div class="card"><div class="ah"><h3>Sessions</h3><button type="button" class="btn sm" data-a="sadd">+ Add session</button></div><p class="meta" style="margin:4px 0 0">Times are Surabaya time. The game mode is what the session plays and what its tables start with on the event day.</p>'+ses+'</div>'
    +'<div class="card"><h3>Payment</h3><p class="meta" style="margin:4px 0 8px">Bookers transfer the total plus a unique code (Rp 1 to 99) and write the booking note. No receipt is uploaded: you check the bank statement.</p>'
    +[0,1].map(function(k){var b=e.banks[k];return '<div class="meta" style="margin:10px 0 4px">Bank account '+(k+1)+(k?' (optional)':'')+'</div><div class="bg"><div class="field">'+inp('b'+k+'bank',b.bank,' placeholder="BCA" maxlength="30" aria-label="Bank"')+'</div><div class="field">'+inp('b'+k+'number',b.number,' placeholder="Account number" inputmode="numeric" maxlength="30" aria-label="Account number"')+'</div><div class="field">'+inp('b'+k+'name',b.name,' placeholder="Account name" maxlength="60" aria-label="Account name"')+'</div></div>';}).join('')
    +tg('venuePay','Pay at the venue for TBT players','Only when every player in the booking is registered with TBT')+'</div>'
    +(ROLE==='admin'?hostsCard(e):'')
    +'<div class="card"><h3>Rules for booking</h3>'+tg('fours','Seats in fours','For tournaments with no standby: seats in multiples of 4')+tg('showGoing','Show who is coming','Nicknames of registered players only; guests are just counted')
    +'<div class="field" style="margin-top:12px"><label for="closeHours">Booking closes, hours before each session</label>'+inp('closeHours',e.closeHours,' type="number" min="0" max="72" step="0.5"')+'</div>'
    +'<div class="field"><label for="contactWa">Contact on WhatsApp (for questions)</label>'+inp('contactWa',e.contactWa,' type="tel" inputmode="tel" placeholder="0812..."')+'</div></div>'
    +'<div class="err" id="err">'+esc(A.err)+'</div>'
    +'<div class="acts"><button type="button" class="btn primary" data-a="save" data-v="published"'+(A.busy?' disabled':'')+'>'+(e.status==='published'?'Save':'Publish')+'</button><button type="button" class="btn" data-a="save" data-v="draft"'+(A.busy?' disabled':'')+'>'+(e.status==='published'?'Unpublish (draft)':'Save as draft')+'</button></div>'
    +(e.id&&ROLE==='admin'?'<div class="card danger-zone"><h3>Delete this event</h3><p class="meta" style="margin:4px 0 10px">The event, its sessions and its booking list are deleted for good, and booking links stop working. Games already on the leaderboard are not touched. To only hide it from the site, use '+(e.status==='published'?'Unpublish':'Save as draft')+' instead.</p><button type="button" class="btn danger" data-a="del">Delete event</button></div>':'');
}
// deleting: only when no booking is still active and no refund is waiting, so no seat or money is lost from view
function activeCount(){var l=(A.ev&&A.ev.bookingList)||[];return l.filter(function(b){return ['held','review','rejected','confirmed','venue'].indexOf(b.status)>=0;}).length;}
function refundCount(){var l=(A.ev&&A.ev.bookingList)||[];return l.filter(function(b){return b.refund>0;}).length;}
function askDelete(){
  var e=A.ev,act=activeCount(),rf=refundCount(),old=(e.bookingList||[]).length-act;
  if(act||rf){sheet('<h3>This event can\u2019t be deleted yet</h3><p class="meta" style="margin:4px 0 10px">'+(act?act+' booking'+(act===1?' is':'s are')+' still active (reserved, paid or paying at the venue). Remove '+(act===1?'it':'them')+' first, so nobody is left holding a seat.':'')+(act&&rf?' ':'')+(rf?rf+' refund'+(rf===1?' is':'s are')+' still waiting. Send '+(rf===1?'it':'them')+' and mark Refund sent first.':'')+'</p><p class="meta">To hide the event from the site now, use Unpublish.</p><div class="acts"><a class="btn primary" href="#bookings='+e.id+'" data-a="close">Open bookings</a><button type="button" class="btn" data-a="close">Close</button></div>');return;}

  var hits=q?(A.ev.registry||[]).filter(function(r){return used.indexOf(r.id)<0&&(r.nickname+' '+r.fullName).toLowerCase().indexOf(ql)>=0;}).slice(0,5):[];
  var want={};A.add.players.forEach(function(x){x.sessions.forEach(function(id){want[id]=(want[id]||0)+1;});});
  return '<div class="card"><div class="ah"><h3>Player '+(i+1)+'</h3>'+(i?'<button type="button" class="btn sm" data-a="aprm" data-i="'+i+'">Remove</button>':'')+'</div>'
    +(p.registryId?'<div class="regpick"><span class="tag ok">TBT: '+esc(p.nick)+'</span><span class="meta">Their registered WhatsApp and Instagram are used</span><button type="button" class="lnk" data-a="aunpick" data-i="'+i+'">Change</button></div>'
      :'<div class="field" style="margin-top:10px"><label for="af'+i+'">Find a TBT player</label><input id="af'+i+'" data-find="'+i+'" placeholder="Nickname or name" value="'+esc(q)+'" autocomplete="off">'
        +(hits.length?'<div class="hits">'+hits.map(function(r){return '<button type="button" class="hit" data-a="apick" data-i="'+i+'" data-v="'+esc(r.id)+'"><b>'+esc(r.nickname)+'</b>'+(r.fullName&&r.fullName!==r.nickname?'<span class="meta">'+esc(r.fullName)+'</span>':'')+'</button>';}).join('')+'</div>':(q?'<p class="meta">Not in the player list: fill in below as a guest.</p>':''))+'</div>')
    +'<div class="frow"><div class="field"><label for="an'+i+'">Name *</label><input id="an'+i+'" data-af="name" data-i="'+i+'" value="'+esc(p.name)+'" maxlength="40"></div>'
    +(p.registryId?'':'<div class="field"><label for="aw'+i+'">WhatsApp</label><input id="aw'+i+'" type="tel" inputmode="tel" data-af="wa" data-i="'+i+'" value="'+esc(p.wa)+'" placeholder="0812..."></div>')+'</div>'
    +(p.registryId?'':'<div class="field"><label for="ai'+i+'">Instagram</label><input id="ai'+i+'" data-af="ig" data-i="'+i+'" value="'+esc(p.ig)+'" placeholder="username" autocapitalize="none"></div>')
    +'<div class="meta" style="margin-bottom:6px">Level (optional)</div><div class="chips">'+LEVELS.map(function(l){return '<button type="button" class="chip" data-a="alvl" data-i="'+i+'" data-v="'+l[0]+'" aria-pressed="'+(p.level===l[0])+'">'+l[1]+'</button>';}).join('')+'</div>'
    +'<div class="meta" style="margin:12px 0 2px">Coming to *</div>'+A.ev.sessions.map(function(s){var on=p.sessions.indexOf(s.id)>=0,room=s.seats-s.taken-(want[s.id]||0)+(on?1:0),off=!on&&room<=0&&!A.add.over;
      return '<label class="pick'+(off?' off':'')+'"><input type="checkbox" data-as="'+s.id+'" data-i="'+i+'"'+(on?' checked':'')+(off?' disabled':'')+'><span><b>'+shortDate(s.start)+' '+s.start.slice(11,16)+' · '+esc(modeName(s.mode))+'</b><br><span class="meta">'+(s.taken>=s.seats?'Full ('+s.taken+'/'+s.seats+')':(s.seats-s.taken)+' left')+' · '+rp(s.price)+'</span></span></label>';}).join('')+'</div>';
}
function vAdd(){
  var e=A.ev;
  if(A.err&&!e)return '<a class="back" href="#">&lsaquo; Events</a><div class="empty">'+esc(A.err)+'</div>';
  if(!e)return '<div class="empty">Loading…</div>';
  if(!A.add)A.add={src:'wa',players:[newAP()],pay:'paid',paid:'',note:'',over:false,err:''};
  var d=A.add,t=addTotal(),seats=d.players.reduce(function(a,p){return a+p.sessions.length;},0);
  var pays=[['paid','Already paid'],['link','Send transfer link'],['venue','Pay at the venue'],['free','Free (complimentary)']];
  var why={paid:'Confirmed straight away. Write what was paid.',link:'Made like an online booking: seats held 2 hours, a unique code and a transfer note. Then send the link on WhatsApp.',venue:'Seats kept until the event; mark it paid at the door. Guests are fine here: the member-only rule is for online bookings.',free:'Confirmed, nothing to pay. For invited guests, partners or teachers.'}[d.pay];
  return '<a class="back" href="#bookings='+e.id+'">&lsaquo; '+esc(e.title)+'</a><h2 style="margin:4px 0 4px">Add a booking</h2><p class="meta" style="margin:0 0 14px">For people who booked by WhatsApp, Instagram DM or at the door.</p>'
    +'<div class="card"><div class="meta" style="margin-bottom:6px">Booked through</div><div class="chips">'+[['wa','WhatsApp'],['ig','Instagram DM'],['walk','Walk-in'],['other','Other']].map(function(x){return '<button type="button" class="chip" data-a="asrc" data-v="'+x[0]+'" aria-pressed="'+(d.src===x[0])+'">'+x[1]+'</button>';}).join('')+'</div></div>'
    +d.players.map(addCard).join('')

    +'<div class="card"><h3>Payment</h3><div class="chips" style="margin-top:8px">'+pays.map(function(x){return '<button type="button" class="chip" data-a="apay" data-v="'+x[0]+'" aria-pressed="'+(d.pay===x[0])+'">'+x[1]+'</button>';}).join('')+'</div><p class="meta" style="margin:8px 0 0">'+why+'</p>'
    +(d.pay==='paid'?'<div class="field" style="margin-top:10px"><label for="apaid">Amount received (Rp)</label><input id="apaid" data-ad="paid" inputmode="numeric" value="'+esc(d.paid===''?String(t):d.paid)+'"></div>':'')+'</div>'
    +'<div class="card"><div class="toggle" style="border-top:0;margin-top:0;padding-top:0"><div><b>Allow over the seat limit</b><div class="meta">For a walk-in when the session is full. The session then shows more seats taken than it has.</div></div><label class="sw"><input type="checkbox" id="aover"'+(d.over?' checked':'')+' aria-label="Allow over the seat limit"><span></span></label></div>'
    +'<div class="field" style="margin-top:8px"><label for="anote">Note (only admin and hosts see it)</label><input id="anote" data-ad="note" value="'+esc(d.note)+'" maxlength="200" placeholder="e.g. paid cash to Andre"></div></div>'
    +'<div class="err" id="aerr">'+esc(d.err)+'</div>'
    +'<div class="acts"><button type="button" class="btn primary" data-a="asave"'+(A.busy?' disabled':'')+'>'+(A.busy?'Adding…':'Add booking · '+seats+' seat'+(seats===1?'':'s')+' · '+(d.pay==='free'?'Free':rp(t)))+'</button><a class="btn" href="#bookings='+e.id+'">Cancel</a></div>';

function saveAdd(){
  var d=A.add;d.err='';
  for(var i=0;i<d.players.length;i++){var p=d.players[i];if(!p.name.trim()){d.err='Player '+(i+1)+': name is required.';render();return;}if(!p.sessions.length){d.err='Player '+(i+1)+': pick a session.';render();return;}}
  A.busy=true;render();
  var t=addTotal();
  api('POST',BASE()+'/events/'+encodeURIComponent(A.ev.id),{source:d.src,pay:d.pay,paid:d.pay==='paid'?(d.paid===''?t:d.paid):undefined,over:d.over,note:d.note,
    players:d.players.map(function(p){return {name:p.name,wa:p.wa,ig:p.ig,level:p.level,sessions:p.sessions,registryId:p.registryId||undefined};})})
  .then(function(b){A.busy=false;A.add=null;A.open={};A.open[b.id]=true;location.hash='bookings='+A.ev.id;
    loadOne(A.ev.id).then(function(){render();var x=findB(b.id)||b;waSheet(x,x.status==='held'?'held':(x.status==='venue'?'venue':'confirm'));});})
  .catch(function(e){A.busy=false;d.err=e.message;render();var er=document.getElementById('aerr');if(er)er.scrollIntoView({block:'center'});});
}
// ---- event day: the booked players of one session go to scoreboard tables ----
var WIND=['東','南','西','北'],DAY_MODES=MODES.filter(function(m){return m[0]!=='chicken';}),LORDER={adv:0,int:1,cas:2,beg:3,first:4};
function keyOf(n){return String(n||'').trim().toLowerCase().replace(/\s+/g,' ');}
function loadDay(evId,sesId){
  return api('GET',BASE()+'/events/'+encodeURIComponent(evId)+'/day?session='+encodeURIComponent(sesId)).then(function(d){
    var seated={};((d.day&&d.day.tables)||[]).forEach(function(t){t.players.forEach(function(n){if(n)seated[keyOf(n)]=1;});});
    d.waiting=d.players.filter(function(p){return !seated[keyOf(p.table)];});
    A.day=d;arrange('order');render();
  }).catch(function(e){A.err=e.message;A.day={error:e.message};render();});
}
function tableCount(){return Math.max(1,Math.ceil(A.day.waiting.length/4));}
function arrange(how){
  var d=A.day,arr=d.waiting.slice();
  if(how==='level')arr.sort(function(x,y){return (LORDER[x.level]==null?5:LORDER[x.level])-(LORDER[y.level]==null?5:LORDER[y.level]);});
  else if(how==='shuffle'){for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=arr[i];arr[i]=arr[j];arr[j]=t;}}
  d.how=how;d.at={};arr.forEach(function(p,i){d.at[p.id]=Math.floor(i/4);});d.order=arr.map(function(p){return p.id;});
  var n=tableCount(),def=DAY_MODES.some(function(m){return m[0]===d.session.mode;})?d.session.mode:'casual';
  d.modes=d.modes||[];for(var k=0;k<n;k++)if(!d.modes[k])d.modes[k]=def;
}
function dayPlayer(id){var l=A.day.players;for(var i=0;i<l.length;i++)if(l[i].id===id)return l[i];return null;}
function unpaid(p){return p.status==='held'||p.status==='rejected'||p.status==='review'?' · <b class="unp">Not paid yet</b>':(p.status==='venue'?' · Pays at venue':'');}
function seatHtml(p,i,n,t){
  return '<div class="seat"><span class="w">'+(i<4?WIND[i]:'+')+'</span><span class="nm"><b>'+esc(p.table)+'</b> '+(p.registryId?'':'<span class="tag grey">Guest</span>')
    +'<br><span class="meta">'+(p.level?lvl(p.level):'Level not given')+(p.registryId&&p.table!==p.name?' · '+esc(p.name):'')+unpaid(p)+'</span></span>'
    +(n>1?'<select data-mv="'+p.id+'" aria-label="Move '+esc(p.table)+'">'+Array.from({length:n},function(_,k){return '<option value="'+k+'"'+(k===t?' selected':'')+'>T'+(k+1)+'</option>';}).join('')+'</select>':'')+'</div>';
}
function madeTable(t){
  var url=location.origin+'/scoreboard.html?';
  return '<div class="dtb"><h3><span>'+esc(t.label)+'</span><span class="tag">'+esc(t.code)+'</span></h3><div class="meta" style="margin:2px 0 6px">'+esc(modeName(t.mode))+(t.mode==='casual'?' mode':'')+'</div>'
    +t.players.map(function(n,i){var empty=!n||/^Player [1-4]$/.test(n);return '<div class="seat"><span class="w">'+WIND[i]+'</span><span class="nm">'+(empty?'<span class="meta">Empty seat</span>':'<b>'+esc(n)+'</b>')+'</span></div>';}).join('')
    +'<div class="dlinks"><button type="button" class="btn sm" data-a="dcopy" data-v="'+esc(url+'code='+t.code)+'" data-l="Scorekeeper link copied">Scorekeeper link</button><button type="button" class="btn sm" data-a="dcopy" data-v="'+esc(url+'view='+t.viewCode)+'" data-l="Players link copied">Players link</button></div></div>';
}
function vDay(){
  var d=A.day,back='<a class="back" href="#bookings='+A.id+'">&lsaquo; Bookings</a>';
  if(!d)return back+'<div class="empty">Loading…</div>';
  if(d.error)return back+'<div class="empty">'+esc(d.error)+'</div>';
  var s=d.session,e=d.event,day=d.day,chicken=s.mode==='chicken';
  var head=back+'<h2 style="margin:4px 0 4px">Event day</h2><p class="meta" style="margin:0 0 12px">'+esc(e.title)+' · '+shortDate(s.start)+' · '+s.start.slice(11,16)+' · '+(chicken?'Chicken Hand':modeName(s.mode)+' mode')+'</p>';
  var reg=d.players.filter(function(p){return p.registryId;}).length;
  var count='<b style="color:var(--text)">'+d.players.length+' booked</b> · '+reg+' TBT player'+(reg===1?'':'s')+', '+(d.players.length-reg)+' guest'+(d.players.length-reg===1?'':'s');
  if(chicken)return head+'<div class="note">Chicken Hand sessions are not on the leaderboard, so no scoreboard tables are made. Seat the players as you like; the list below is everyone booked.</div>'
    +'<p class="meta" style="margin:12px 0 8px">'+count+'</p><div class="dtb">'+(d.players.length?d.players.map(function(p,i){return '<div class="seat"><span class="w">'+(i+1)+'</span><span class="nm"><b>'+esc(p.table)+'</b> '+(p.registryId?'':'<span class="tag grey">Guest</span>')+'<br><span class="meta">'+(p.level?lvl(p.level):'Level not given')+unpaid(p)+'</span></span></div>';}).join(''):'<div class="meta">Nobody has booked this session yet.</div>')+'</div>'
    +'<div class="acts"><button type="button" class="btn" data-a="dlist">Copy player list</button></div>';
  var out=head;
  if(day&&day.tables.length){
    out+='<div class="card" style="margin-bottom:14px"><b>Session “'+esc(day.label)+'” has '+day.tables.length+' table'+(day.tables.length===1?'':'s')+'.</b><p class="meta" style="margin:4px 0 0">It is on the leaderboard like any other session. The names are already in the seats and registered players are linked. '+(ROLE==='host'?'Print the QR cards from your Host desk.':'Print the QR cards from the Host desk or open them in Sessions.')+'</p></div>'
      +'<div class="dtbls">'+day.tables.map(madeTable).join('')+'</div>';
  }
  if(!d.waiting.length){
    out+=d.players.length?(day?'<p class="meta" style="margin:14px 0">Everyone booked is at a table.</p>':''):'<div class="empty">Nobody has booked this session yet.</div>';
    return out+'<div class="acts"><button type="button" class="btn" data-a="dreload">Refresh</button></div>';
  }
  var n=tableCount(),tables='',over=false;
  for(var t=0;t<n;t++){
    var at=d.order.filter(function(id){return d.at[id]===t;}).map(dayPlayer);if(at.length>4)over=true;
    tables+='<div class="dtb"><h3><span>Table '+((day?day.tables.length:0)+t+1)+'</span><span class="meta'+(at.length>4?' bad':'')+'">'+at.length+'/4</span></h3>'
      +'<div class="mrow"><span class="meta">Game mode</span><select class="modesel" data-tm="'+t+'" aria-label="Game mode of table '+(t+1)+'">'+DAY_MODES.map(function(m){return '<option value="'+m[0]+'"'+(m[0]===d.modes[t]?' selected':'')+'>'+m[1]+'</option>';}).join('')+'</select></div>'
      +(at.length?at.map(function(p,i){return seatHtml(p,i,n,t);}).join(''):'<div class="meta" style="padding:8px 0">Empty. Move players here or leave it; empty tables are skipped.</div>')+'</div>';
  }
  var made=d.order.length?Array.from({length:n},function(_,k){return k;}).filter(function(k){return d.order.some(function(id){return d.at[id]===k;});}).length:0;
  out+=(day?'<h3 style="margin:22px 0 4px">Not at a table yet</h3>':'')
    +'<div class="note">'+(day?'These players booked but are not at a table. Make more tables for them below.':'Make the leaderboard session and tables from the bookings. Scoring, table codes and the leaderboard work exactly as they do today, and each table may have its own game mode.')+(ROLE==='host'?' Event day tables do not count toward your 24 tables a day.':'')+'</div>'
    +'<div class="drow"><span class="meta">'+(day?d.waiting.length+' not seated':count)+'</span><div class="chips">'+[['level','Group by level'],['shuffle','Shuffle'],['order','Booking order']].map(function(x){return '<button type="button" class="chip" data-a="darr" data-v="'+x[0]+'" aria-pressed="'+(d.how===x[0])+'">'+x[1]+'</button>';}).join('')+'</div></div>'
    +'<div class="dtbls">'+tables+'</div>'
    +(over?'<div class="err" style="margin-top:10px">A table has more than 4 players. Move someone first.</div>':'')
    +'<div class="acts" style="margin-top:14px"><button type="button" class="btn primary" data-a="dmake"'+(A.busy||over||!made?' disabled':'')+'>'+(A.busy?'Making tables…':(day?'Add '+made+' table'+(made===1?'':'s'):'Create session and '+made+' table'+(made===1?'':'s')))+'</button><button type="button" class="btn" data-a="dreload">Refresh</button></div>';
  return out;
}
function makeDay(){
  var d=A.day,n=tableCount(),tables=[];
  for(var t=0;t<n;t++){var ids=d.order.filter(function(id){return d.at[id]===t;});if(ids.length)tables.push({mode:d.modes[t],players:ids});}
  A.busy=true;render();
  api('POST',BASE()+'/events/'+encodeURIComponent(d.event.id)+'/day',{sessionId:d.session.id,tables:tables}).then(function(r){
    A.busy=false;d.modes=null;toast(r.day.tables.length+' tables on the leaderboard session');return loadDay(d.event.id,d.session.id);
  }).catch(function(e){A.busy=false;render();toast(e.message);});
}
function dayList(){var d=A.day;return [d.event.title+' · '+shortDate(d.session.start)+' '+d.session.start.slice(11,16)].concat(d.players.map(function(p,i){return (i+1)+'. '+p.table+(p.registryId?'':' [guest]')+(p.level?' · '+lvl(p.level):'');})).join('\n');}
function playerList(){
  var e=A.ev,out=[e.title];
  e.sessions.forEach(function(s){
    out.push('');out.push(shortDate(s.start)+' '+s.start.slice(11,16)+' ('+modeName(s.mode)+') '+s.taken+'/'+s.seats);
    var n=0;e.bookingList.forEach(function(b){if(['held','review','rejected','confirmed','venue'].indexOf(b.status)<0)return;b.players.forEach(function(p){if(p.sessions.indexOf(s.id)<0)return;n++;
      out.push(n+'. '+(p.registered?p.nickname:p.name)+(p.registered&&p.nickname!==p.name?' ('+p.name+')':'')+(p.registered?'':' [guest]')+' · '+lvl(p.level)+' · '+showWa(p.wa)+(p.ig?' · @'+p.ig:'')+' · '+(STATUS[b.status]||[b.status])[0]);});});
  });
  return out.join('\n');
}
function act(id,body,then){
  A.busy=true;
  api('POST',BASE()+'/bookings/'+encodeURIComponent(id),body).then(function(b){
    A.busy=false;var l=A.ev.bookingList;for(var i=0;i<l.length;i++)if(l[i].id===id)l[i]=b;A.open[id]=true;
    return loadOne(A.ev.id).then(function(){render();if(then)then(A.ev.bookingList.filter(function(x){return x.id===id;})[0]||b);});
  }).catch(function(e){A.busy=false;toast(e.message);});
}

// ---- input and clicks ----
function setField(id,v){
  var e=A.edit,m;if(!e)return;
  if((m=/^s(\d+)(date|time|hours|seats|price|mode)$/.exec(id)))e.sessions[+m[1]][m[2]]=v;
  else if((m=/^b(\d)(bank|number|name)$/.exec(id)))e.banks[+m[1]][m[2]]=v;
  else if(['title','place','about','contactWa','closeHours'].indexOf(id)>=0)e[id]=v;
}
document.addEventListener('input',function(ev){var t=ev.target;if(t.dataset&&t.dataset.e)setField(t.dataset.e,t.value);
  if(t.dataset&&t.dataset.find!==undefined&&A.add){A.find[t.dataset.find]=t.value;render();return;}
  if(t.dataset&&t.dataset.af!==undefined&&A.add){A.add.players[+t.dataset.i][t.dataset.af]=t.value;}
  if(t.dataset&&t.dataset.ad!==undefined&&A.add){A.add[t.dataset.ad]=t.value;}
  if(t.id==='watx'){var g=document.getElementById('wago');if(g)g.href=g.href.split('?')[0]+'?text='+encodeURIComponent(t.value);}});
document.addEventListener('change',function(ev){var t=ev.target;
  if(t.dataset&&t.dataset.as!==undefined&&A.add){var pp=A.add.players[+t.dataset.i],k=pp.sessions.indexOf(t.dataset.as);if(t.checked&&k<0)pp.sessions.push(t.dataset.as);if(!t.checked&&k>=0)pp.sessions.splice(k,1);render();return;}
  if(t.id==='aover'&&A.add){A.add.over=t.checked;render();return;}
  if(t.dataset&&t.dataset.mvs&&A.mv){var k2=A.mv.sel.indexOf(t.dataset.mvs);if(t.checked&&k2<0)A.mv.sel.push(t.dataset.mvs);if(!t.checked&&k2>=0)A.mv.sel.splice(k2,1);mvDraw();return;}
  if(t.id==='mvover'&&A.mv){A.mv.over=t.checked;mvDraw();return;}
  if(t.dataset&&t.dataset.mv&&A.day){A.day.at[t.dataset.mv]=+t.value;A.day.how='';render();return;}
  if(t.dataset&&t.dataset.tm!==undefined&&A.day){A.day.modes[+t.dataset.tm]=t.value;return;}if(t.dataset&&t.dataset.e)setField(t.dataset.e,t.value);if(t.dataset&&t.dataset.t&&A.edit){A.edit[t.dataset.t]=t.checked;if(t.dataset.t==='fours')render();}});
document.addEventListener('click',function(ev){
  var b=ev.target.closest?ev.target.closest('[data-a]'):null;if(!b)return;var a=b.dataset.a,e=A.edit;
  if(a==='close'){if(ev.target===b||b.tagName==='BUTTON'||b.tagName==='A')closeSheet();return;}
  if(a==='type'){e.type=b.dataset.v;if(e.type==='tour'&&!e.id)e.fours=true;render();}
  else if(a==='sadd'){var last=e.sessions[e.sessions.length-1],s=blankSession();if(last){s.date=last.date;s.time=last.time;s.hours=last.hours;s.seats=last.seats;s.price=last.price;s.levels=last.levels.slice();s.mode=last.mode;}e.sessions.push(s);render();}
  else if(a==='srm'){e.sessions.splice(+b.dataset.i,1);render();}
  else if(a==='slv'){var se=e.sessions[+b.dataset.i],v=b.dataset.v,cur=se.levels.length?se.levels.slice():LEVELS.map(function(l){return l[0];}),k=cur.indexOf(v);if(k>=0)cur.splice(k,1);else cur.push(v);
    if(!cur.length){toast('Keep at least one level');return;}se.levels=cur.length===LEVELS.length?[]:LEVELS.map(function(l){return l[0];}).filter(function(x){return cur.indexOf(x)>=0;});render();}
  else if(a==='save')save(b.dataset.v);
  else if(a==='del')askDelete();
  else if(a==='delok')doDelete();
  else if(a==='ses'){A.ses=b.dataset.v;render();}
  else if(a==='tgl'){A.open[b.dataset.id]=!A.open[b.dataset.id];render();}
  else if(a==='reload'){loadOne(A.ev.id).then(function(){render();toast('Up to date');});}
  else if(a==='list')copyText(playerList(),'Player list copied');
  else if(a==='copy')copyText(b.dataset.v,'Booking link copied');
  else if(a==='copytx'){var tx=document.getElementById('watx');copyText(tx?tx.value:'','Message copied');}
  else if(a==='hrm'){e.hosts=e.hosts.filter(function(x){return x!==b.dataset.v;});render();}
  else if(a==='hadd'){var hp=document.getElementById('hostPick');if(hp&&hp.value){e.hosts.push(hp.value);render();}}
  else if(a==='asrc'){A.add.src=b.dataset.v;render();}
  else if(a==='apay'){A.add.pay=b.dataset.v;render();}
  else if(a==='apadd'){A.add.players.push(newAP());render();}
  else if(a==='aprm'){A.add.players.splice(+b.dataset.i,1);render();}
  else if(a==='alvl'){var ap=A.add.players[+b.dataset.i];ap.level=ap.level===b.dataset.v?'':b.dataset.v;render();}
  else if(a==='apick'){var ap2=A.add.players[+b.dataset.i],r=regById(b.dataset.v);ap2.registryId=r.id;ap2.nick=r.nickname;ap2.name=r.fullName||r.nickname;ap2.wa='';ap2.ig='';A.find[b.dataset.i]='';render();}
  else if(a==='aunpick'){var ap3=A.add.players[+b.dataset.i];ap3.registryId='';ap3.nick='';render();}
  else if(a==='asave')saveAdd();
  else if(a==='darr'){arrange(b.dataset.v);render();}
  else if(a==='dmake')makeDay();
  else if(a==='dreload'){loadDay(A.day.event.id,A.day.session.id).then(function(){toast('Up to date');});}
  else if(a==='dcopy')copyText(b.dataset.v,b.dataset.l);
  else if(a==='dlist')copyText(dayList(),'Player list copied');
  else if(a==='wa'){var bk=findB(b.dataset.id);if(bk)waSheet(bk,b.dataset.k);}
  else if(a==='act'){var v2=b.dataset.v;act(b.dataset.id,{action:v2},function(x){if(v2==='confirm')waSheet(x,'confirm');else if(v2==='notfound')waSheet(x,'reject');else toast('Marked as refunded');});}
  else if(a==='rmb'){var bk2=findB(b.dataset.id),paid=bk2.status==='confirmed'||bk2.status==='review';A.rm={reason:'Asked to cancel'};
    sheet('<h3>Remove this booking?</h3><p class="meta" style="margin:4px 0 10px">'+esc(bk2.players.map(function(p){return p.name;}).join(', '))+'. '+seatsOf(bk2)+' seat'+(seatsOf(bk2)===1?' goes':'s go')+' back to the event. The booking stays in the list as Cancelled.</p><div class="meta" style="font-weight:700;color:var(--text);margin-bottom:6px">Reason</div><div class="chips">'+['Asked to cancel','No-show','Duplicate booking','Other'].map(function(r,i){return '<button type="button" class="chip" data-a="rmr" data-v="'+r+'" aria-pressed="'+(i===0)+'">'+r+'</button>';}).join('')+'</div>'
      +(paid?'<label class="ck"><input type="checkbox" id="rmref" checked><span>'+(bk2.status==='review'?'They say they transferred '+rp(bk2.toTransfer)+'.':'They paid '+rp(bk2.pay==='transfer'?bk2.total+bk2.code:bk2.total)+'.')+' Note a refund to send.</span></label>':'')
      +'<div class="acts"><button type="button" class="btn danger" data-a="rmbok" data-id="'+bk2.id+'">Remove booking</button><button type="button" class="btn" data-a="close">Keep it</button></div>');}
  else if(a==='rmr'){A.rm.reason=b.dataset.v;[].forEach.call(document.querySelectorAll('[data-a=rmr]'),function(x){x.setAttribute('aria-pressed',String(x===b));});}
  else if(a==='rmbok'){var rf=document.getElementById('rmref');closeSheet();act(b.dataset.id,{action:'remove',reason:A.rm.reason,refund:!!(rf&&rf.checked)},function(x){waSheet(x,'cancel');});}
  else if(a==='rmp'){var bk3=findB(b.dataset.id),p=bk3.players.filter(function(x){return x.id===b.dataset.p;})[0],cost=p.sessions.reduce(function(t,id){var s=sById(id);return t+(s?s.price:0);},0),paid2=bk3.status==='confirmed'||bk3.status==='review';
    sheet('<h3>Remove '+esc(p.name)+'?</h3><p class="meta" style="margin:4px 0 10px">'+p.sessions.length+' seat'+(p.sessions.length===1?' goes':'s go')+' back to the event. The rest of the booking stays. New total: <b>'+rp(bk3.total-cost)+'</b>.'+(bk3.status==='held'||bk3.status==='rejected'?' They will see the new amount to transfer.':'')+'</p>'
      +(paid2?'<label class="ck"><input type="checkbox" id="rmref" checked><span>Already paid for. Note a refund of '+rp(cost)+'.</span></label>':'')
      +'<div class="acts"><button type="button" class="btn danger" data-a="rmpok" data-id="'+bk3.id+'" data-p="'+p.id+'">Remove '+esc(p.name.split(' ')[0])+'</button><button type="button" class="btn" data-a="close">Keep</button></div>');}
  else if(a==='mvp'){var bk4=findB(b.dataset.id);mvSheet(bk4,bk4.players.filter(function(x){return x.id===b.dataset.p;})[0]);}
  else if(a==='mvok')mvSave();
  else if(a==='rmpok'){var rf2=document.getElementById('rmref');closeSheet();act(b.dataset.id,{action:'removePlayer',player:b.dataset.p,refund:!!(rf2&&rf2.checked)},function(x){waSheet(x,'rmp');});}
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&document.querySelector('.dim'))closeSheet();});
function findB(id){var l=A.ev?A.ev.bookingList:[];for(var i=0;i<l.length;i++)if(l[i].id===id)return l[i];return null;}

checkLogin().then(function(ok){if(ok){authed=true;go();return;}return hostLogin().then(function(h){authed=h;if(h)go();else render();});});
render();
</script>
</body>
</html>
