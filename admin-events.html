<script>
/* If the page's own script does not start (a broken or half-uploaded file, a very old browser), the page would stay empty or dead. After 4 seconds it says so, with the first error, and offers a reload.
   It stays quiet when the script did run and is only waiting for the server (the navigation script sets window.__tbtNav), unless an error was seen and nothing is drawn. */
(function(){var errs=[];function note(m){if(m)errs.push(String(m).slice(0,160));}
window.addEventListener('error',function(e){note((e&&e.message)||(e&&e.error)||'error');});
window.addEventListener('unhandledrejection',function(e){note('promise: '+((e&&e.reason&&e.reason.message)||(e&&e.reason)||'rejected'));});
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
setTimeout(function(){var a=document.getElementById('app');if(!a)return;if(window.__tbtNav&&(a.children.length||!errs.length))return;
a.innerHTML='<div role="alert" style="max-width:420px;margin:72px auto;padding:0 20px;font:16px/24px \'Inter Tight\',system-ui,sans-serif;color:var(--text,#1B4332)"><h1 style="font:900 28px/1.15 \'Playfair Display\',Georgia,serif;margin:0 0 12px">Can\u2019t load this page</h1><p style="margin:0 0 16px;color:var(--muted,#587263)">Something stopped the page from starting. Reload it, or go back to the leaderboard.</p><p style="display:flex;gap:8px;margin:0 0 16px"><button type="button" onclick="location.reload()" style="min-height:44px;padding:0 16px;border-radius:16px;border:0;background:var(--accent,#2D6A4F);color:var(--onaccent,#fff);font:500 14px \'Inter Tight\',system-ui,sans-serif;cursor:pointer">Reload</button><a href="/leaderboard" style="display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:16px;border:1px solid var(--line,#E4DDCD);color:var(--text,#1B4332);font:500 14px \'Inter Tight\',system-ui,sans-serif;text-decoration:none">Leaderboard</a></p><p style="margin:0;font-size:12px;line-height:16px;color:var(--muted,#587263)">Code: '+esc(errs[0]||'the page script did not run')+'</p></div>';},4000);})();
</script>

var A={events:null,defaults:{banks:[],contactWa:'',place:''},err:'',view:'list',id:null,ev:null,edit:null,busy:false,ses:'all',open:{},rm:null};
var LEVELS=[['first','First timer'],['beg','Beginner'],['cas','Casual'],['int','Intermediate'],['adv','Advanced']];
var TYPES=[['cls','Class'],['open','Open Play'],['tour','Tournament'],['other','Event']];
var MODES=[['default','Default'],['casual','Casual'],['tournament','Tournament'],['custom','Custom'],['mcr4','MCR-4'],['mcr8','MCR-8'],['mcrc','MCR-Custom']];
var STATUS={held:['Not transferred yet','grey'],review:['Transferred: check bank','gold'],rejected:['Transfer not found','red'],confirmed:['Confirmed','ok'],venue:['Pays at the venue','gold'],expired:['Expired','red'],cancelled:['Cancelled','red']};
var MON3=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DAY3=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'],BULAN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function H(){return {'Authorization':'Bearer '+password,'Content-Type':'application/json'};}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('show');},2400);}
function pad2(n){return ('0'+n).slice(-2);}
function rp(n){return n===0?'Free':'Rp '+Number(n).toLocaleString('id-ID');}
function rpCode(n){var s=rp(n);return s.slice(0,-2)+'<u>'+s.slice(-2)+'</u>';}
function lvl(k){for(var i=0;i<LEVELS.length;i++)if(LEVELS[i][0]===k)return LEVELS[i][1];return k;}
function typeName(k){for(var i=0;i<TYPES.length;i++)if(TYPES[i][0]===k)return TYPES[i][1];return 'Event';}
function modeName(k){for(var i=0;i<MODES.length;i++)if(MODES[i][0]===k)return MODES[i][1];return k;}
function dP(s){return {y:+s.slice(0,4),m:+s.slice(5,7)-1,d:+s.slice(8,10),hm:s.slice(11,16)};}
function shortDate(s){var p=dP(s);return DAY3[new Date(p.y,p.m,p.d).getDay()]+' '+p.d+' '+MON3[p.m];}
function idDate(s){var p=dP(s);return HARI[new Date(p.y,p.m,p.d).getDay()]+' '+p.d+' '+BULAN[p.m]+', jam '+p.hm.replace(':','.');}
function when(iso){if(!iso)return '';var d=new Date(Date.parse(iso)+7*3600e3);return DAY3[d.getUTCDay()]+' '+d.getUTCDate()+' '+MON3[d.getUTCMonth()]+', '+pad2(d.getUTCHours())+':'+pad2(d.getUTCMinutes());}
function waNum(n){var d=String(n||'').replace(/\D/g,'');if(d.charAt(0)==='0')d='62'+d.slice(1);return d;}
function showWa(n){var d=String(n||'');return d.indexOf('62')===0?'0'+d.slice(2):d;}
function copyText(v,label){try{navigator.clipboard.writeText(v).then(function(){toast(label||'Copied');},function(){prompt('Copy this:',v);});}catch(e){prompt('Copy this:',v);}}
function api(method,url,body){return fetch(url,{method:method,headers:H(),body:body?JSON.stringify(body):undefined}).then(function(r){return r.json().catch(function(){return {};}).then(function(j){if(!r.ok)throw new Error(j.error||'Something went wrong');return j;});});}

// ---- sign in ----
function checkLogin(){if(!password)return Promise.resolve(false);return fetch('/api/admin/login',{method:'POST',headers:H()}).then(function(r){return r.ok;}).catch(function(){return false;});}
function doLogin(){password=document.getElementById('pw').value;checkLogin().then(function(ok){if(!ok){loginError='Wrong password.';render();return;}sessionStorage.setItem('tbt-admin-pw',password);authed=true;loginError='';go();});}
function logout(){sessionStorage.removeItem('tbt-admin-pw');password='';authed=false;render();}

// ---- the address keeps the view: #new, #edit=<id>, #bookings=<id>
function go(){
  var h=location.hash.slice(1),m;A.err='';
  if(h==='new'){A.view='edit';A.id=null;A.edit=null;loadList().then(function(){A.edit=blankEvent();render();});return;}
  if((m=/^edit=(\w+)$/.exec(h))){A.view='edit';A.id=m[1];A.edit=null;render();loadOne(m[1]).then(function(){A.edit=toForm(A.ev);render();});return;}
  if((m=/^bookings=(\w+)$/.exec(h))){A.view='bookings';A.id=m[1];if(!A.ev||A.ev.id!==m[1]){A.ev=null;A.ses='all';}render();loadOne(m[1]).then(render);return;}
  A.view='list';render();loadList().then(render);
}
window.addEventListener('hashchange',function(){if(authed){go();window.scrollTo(0,0);}});
function loadList(){return api('GET','/api/admin/events').then(function(d){A.events=d.events;A.defaults=d.defaults||A.defaults;}).catch(function(e){A.err=e.message;});}
function loadOne(id){return api('GET','/api/admin/events/'+encodeURIComponent(id)).then(function(d){A.ev=d;}).catch(function(e){A.err=e.message;render();});}

function topBar(){return '<div class="topbar"><div class="wrap"><div class="tbrow"><div class="tb"><img src="'+LOGO+'" alt="">TBT ADMIN</div><button class="lnk" onclick="logout()">Sign out</button></div><nav class="anav" aria-label="Admin"><a href="/admin-daily.html">Sessions</a><a href="/admin-pemain.html">Players</a><a href="/admin-events" aria-current="page">Events</a><a href="/admin-home">Homepage</a><a href="/leaderboard" target="_blank" rel="noopener">Leaderboard &#8599;</a></nav></div></div>';}
function render(){
  var app=document.getElementById('app');
  if(!authed){
    app.innerHTML='<div class="login"><img src="'+LOGO+'" alt=""><h2>Admin</h2><input id="pw" type="password" placeholder="Password">'+(loginError?'<div class="err">'+loginError+'</div>':'')+'<button class="btn primary" style="width:100%" onclick="doLogin()">Sign in</button></div>';
    var pw=document.getElementById('pw');pw.onkeydown=function(e){if(e.key==='Enter')doLogin();};return;
  }
  var y=window.scrollY,f=document.activeElement,fid=f&&f.id,pos=null;try{pos=f&&f.selectionStart;}catch(e){}
  app.innerHTML=topBar()+'<main class="wrap">'+(A.view==='edit'?vEdit():(A.view==='bookings'?vBookings():vList()))+'</main>';
  if(fid){var n=document.getElementById(fid);if(n){n.focus();try{if(pos!=null)n.setSelectionRange(pos,pos);}catch(e){}}}
  window.scrollTo(0,y);
}

// ---- the list ----
function vList(){
  if(A.err&&!A.events)return '<div class="empty">'+esc(A.err)+'</div>';
  if(!A.events)return '<div class="empty">Loading…</div>';
  return '<div class="ah"><h2>Events</h2><a class="btn primary" href="#new">+ New event</a></div><p class="meta" style="margin:4px 0 16px">Classes, open play, tournaments. Bookings, transfers and refunds per event.</p>'
    +(A.events.length?A.events.map(function(e){
      var cap=0,tk=0,modes=[];e.sessions.forEach(function(s){cap+=s.seats;tk+=s.taken;if(modes.indexOf(s.mode)<0)modes.push(s.mode);});
      var rev=e.bookings.review||0;
      return '<div class="card"><div><span class="tag">'+typeName(e.type)+'</span> '+(e.status==='draft'?'<span class="tag grey">Draft</span>':'<span class="tag ok">Published</span>')+'</div><h3 style="margin-top:6px">'+esc(e.title)+'</h3>'
        +'<div class="meta">'+(e.sessions[0]?shortDate(e.sessions[0].start)+' '+e.sessions[0].start.slice(0,4)+' · ':'')+e.sessions.length+' session'+(e.sessions.length===1?'':'s')+' · '+tk+'/'+cap+' seats · '+modes.map(modeName).join(', ')+'</div>'
        +(rev?'<div class="note">'+rev+' transfer'+(rev===1?'':'s')+' to check</div>':'')+(e.refunds?'<div class="note">'+e.refunds+' refund'+(e.refunds===1?'':'s')+' to send</div>':'')
        +'<div class="acts"><a class="btn primary" href="#bookings='+e.id+'">Bookings</a><a class="btn" href="#edit='+e.id+'">Edit</a>'+(e.status==='published'?'<a class="btn" href="/events/'+e.id+'/'+e.slug+'" target="_blank" rel="noopener">Event page &#8599;</a>':'')+'</div></div>';
    }).join(''):'<div class="empty">No events yet. Make the first one.</div>');
}

// ---- making and editing an event ----
function today(){var d=new Date(Date.now()+7*3600e3+7*86400e3);return d.getUTCFullYear()+'-'+pad2(d.getUTCMonth()+1)+'-'+pad2(d.getUTCDate());}
function blankSession(){return {id:'',date:today(),time:'19:00',hours:'3',seats:'16',price:'50000',levels:[],mode:'default',taken:0};}
function blankEvent(){var d=A.defaults||{};return {id:'',type:'open',title:'',place:d.place||'',about:'',contactWa:showWa(d.contactWa||''),banks:[(d.banks||[])[0]||{bank:'',number:'',name:''},(d.banks||[])[1]||{bank:'',number:'',name:''}],venuePay:false,fours:false,showGoing:true,closeHours:'2',status:'draft',sessions:[blankSession()]};}
function toForm(e){if(!e)return null;return {id:e.id,type:e.type,title:e.title,place:e.place,about:e.about,contactWa:showWa(e.contactWa),banks:[e.banks[0]||{bank:'',number:'',name:''},e.banks[1]||{bank:'',number:'',name:''}],venuePay:e.venuePay,fours:e.fours,showGoing:e.showGoing,closeHours:String(e.closeHours),status:e.status,
  sessions:e.sessions.map(function(s){return {id:s.id,date:s.start.slice(0,10),time:s.start.slice(11,16),hours:String(s.hours),seats:String(s.seats),price:String(s.price),levels:s.levels.slice(),mode:s.mode,taken:s.taken};})};}
function inp(id,val,attrs){return '<input id="'+id+'" data-e="'+id+'" value="'+esc(val)+'"'+(attrs||'')+'>';}
function tg(key,label,sub){var on=!!A.edit[key];return '<div class="toggle"><div><b>'+label+'</b><div class="meta">'+sub+'</div></div><label class="sw"><input type="checkbox" data-t="'+key+'"'+(on?' checked':'')+' aria-label="'+esc(label)+'"><span></span></label></div>';}
function vEdit(){
  var e=A.edit;
  if(A.err&&!e)return '<a class="back" href="#">&lsaquo; Events</a><div class="empty">'+esc(A.err)+'</div>';
  if(!e)return '<div class="empty">Loading…</div>';
  var ses=e.sessions.map(function(s,i){
    var all=!s.levels.length;
    return '<div class="ses"><div class="ah" style="margin-bottom:8px"><b>Session '+(i+1)+'</b>'+(s.taken?'<span class="meta">'+s.taken+' booked, cannot be removed</span>':(e.sessions.length>1?'<button type="button" class="btn sm" data-a="srm" data-i="'+i+'">Remove</button>':''))+'</div>'
      +'<div class="sg"><div class="field"><label for="s'+i+'date">Date</label>'+inp('s'+i+'date',s.date,' type="date"')+'</div><div class="field"><label for="s'+i+'time">Start</label>'+inp('s'+i+'time',s.time,' type="time"')+'</div>'
      +'<div class="field"><label for="s'+i+'hours">Hours</label>'+inp('s'+i+'hours',s.hours,' type="number" min="0.5" max="24" step="0.5"')+'</div><div class="field"><label for="s'+i+'seats">Seats</label>'+inp('s'+i+'seats',s.seats,' type="number" min="1" max="400" step="'+(e.fours?4:1)+'"')+'</div>'
      +'<div class="field"><label for="s'+i+'price">Price (Rp)</label>'+inp('s'+i+'price',s.price,' type="number" min="0" step="1000"')+'</div>'
      +'<div class="field"><label for="s'+i+'mode">Leaderboard mode</label><select id="s'+i+'mode" data-e="s'+i+'mode">'+MODES.map(function(m){return '<option value="'+m[0]+'"'+(m[0]===s.mode?' selected':'')+'>'+m[1]+'</option>';}).join('')+'</select></div></div>'
      +'<div class="meta" style="margin:4px 0 6px">Levels '+(all?'(all levels)':'')+'</div><div class="chips">'+LEVELS.map(function(l){var on=all||s.levels.indexOf(l[0])>=0;return '<button type="button" class="chip" data-a="slv" data-i="'+i+'" data-v="'+l[0]+'" aria-pressed="'+on+'">'+l[1]+'</button>';}).join('')+'</div></div>';
  }).join('');
  return '<a class="back" href="#">&lsaquo; Events</a><h2 style="margin:4px 0 16px">'+(e.id?'Edit event':'New event')+'</h2>'
    +'<div class="card"><div class="meta" style="margin-bottom:6px">Kind of event</div><div class="chips">'+TYPES.map(function(t){return '<button type="button" class="chip" data-a="type" data-v="'+t[0]+'" aria-pressed="'+(e.type===t[0])+'">'+t[1]+'</button>';}).join('')+'</div>'
    +'<div class="field" style="margin-top:14px"><label for="title">Title</label>'+inp('title',e.title,' maxlength="80" placeholder="Friday Night Mabar"')+'</div>'
    +'<div class="field"><label for="place">Place</label>'+inp('place',e.place,' maxlength="120" placeholder="Four Winds Citraland, Surabaya"')+'</div>'
    +'<div class="field"><label for="about">About</label><textarea id="about" data-e="about" rows="4" maxlength="2000">'+esc(e.about)+'</textarea></div></div>'
    +'<div class="card"><div class="ah"><h3>Sessions</h3><button type="button" class="btn sm" data-a="sadd">+ Add session</button></div><p class="meta" style="margin:4px 0 0">Times are Surabaya time. The mode is what the event-day tables start with; each table can still change it.</p>'+ses+'</div>'
    +'<div class="card"><h3>Payment</h3><p class="meta" style="margin:4px 0 8px">Bookers transfer the total plus a unique code (Rp 1 to 99) and write the booking note. No receipt is uploaded: you check the bank statement.</p>'
    +[0,1].map(function(k){var b=e.banks[k];return '<div class="meta" style="margin:10px 0 4px">Bank account '+(k+1)+(k?' (optional)':'')+'</div><div class="bg"><div class="field">'+inp('b'+k+'bank',b.bank,' placeholder="BCA" maxlength="30" aria-label="Bank"')+'</div><div class="field">'+inp('b'+k+'number',b.number,' placeholder="Account number" inputmode="numeric" maxlength="30" aria-label="Account number"')+'</div><div class="field">'+inp('b'+k+'name',b.name,' placeholder="Account name" maxlength="60" aria-label="Account name"')+'</div></div>';}).join('')
    +tg('venuePay','Pay at the venue for TBT players','Only when every player in the booking is registered with TBT')+'</div>'
    +'<div class="card"><h3>Rules for booking</h3>'+tg('fours','Seats in fours','For tournaments with no standby: seats in multiples of 4')+tg('showGoing','Show who is coming','Nicknames of registered players only; guests are just counted')
    +'<div class="field" style="margin-top:12px"><label for="closeHours">Booking closes, hours before each session</label>'+inp('closeHours',e.closeHours,' type="number" min="0" max="72" step="0.5"')+'</div>'
    +'<div class="field"><label for="contactWa">Contact on WhatsApp (for questions)</label>'+inp('contactWa',e.contactWa,' type="tel" inputmode="tel" placeholder="0812..."')+'</div></div>'
    +'<div class="err" id="err">'+esc(A.err)+'</div>'
    +'<div class="acts"><button type="button" class="btn primary" data-a="save" data-v="published"'+(A.busy?' disabled':'')+'>'+(e.status==='published'?'Save':'Publish')+'</button><button type="button" class="btn" data-a="save" data-v="draft"'+(A.busy?' disabled':'')+'>'+(e.status==='published'?'Unpublish (draft)':'Save as draft')+'</button></div>';
}
function formToApi(st){
  var e=A.edit;
  return {id:e.id||undefined,type:e.type,title:e.title,place:e.place,about:e.about,contactWa:e.contactWa,banks:e.banks.filter(function(b){return b.bank||b.number;}),venuePay:e.venuePay,fours:e.fours,showGoing:e.showGoing,closeHours:e.closeHours,status:st,
    sessions:e.sessions.map(function(s){return {id:s.id||undefined,start:s.date+'T'+s.time,hours:s.hours,seats:s.seats,price:s.price,levels:s.levels.length?s.levels:LEVELS.map(function(l){return l[0];}),mode:s.mode};})};
}
function save(st){
  A.err='';A.busy=true;render();
  api('POST','/api/admin/events',formToApi(st)).then(function(d){A.busy=false;toast(st==='published'?'Saved and published':'Saved as draft');A.events=null;location.hash='bookings='+d.id;})
    .catch(function(e){A.busy=false;A.err=e.message;render();var er=document.getElementById('err');if(er)er.scrollIntoView({block:'center'});});
}

// ---- bookings of one event ----
function sById(id){var s=A.ev.sessions;for(var i=0;i<s.length;i++)if(s[i].id===id)return s[i];return null;}
function seatsOf(b){return b.players.reduce(function(a,p){return a+p.sessions.length;},0);}
function first(b){return (b.contact&&b.contact.name||'').split(' ')[0];}
function link(b){return location.origin+'/b/'+b.token;}
function firstSession(b){var all=[];b.players.forEach(function(p){all=all.concat(p.sessions);});var ss=all.map(sById).filter(Boolean).sort(function(x,y){return x.start.localeCompare(y.start);});return ss[0]||A.ev.sessions[0];}
function waText(b,kind){
  var e=A.ev,s=firstSession(b),place=(e.place||'').split(',')[0];
  if(kind==='confirm')return 'Hai '+first(b)+'! Booking kamu buat '+e.title+' udah confirmed ya. Sampai ketemu '+idDate(s.start)+(place?' di '+place:'')+'. Datang 15 menit lebih awal ya biar santai. Detail booking: '+link(b);
  if(kind==='reject')return 'Hai '+first(b)+', transfer buat booking '+e.title+' belum kelihatan di rekening kami nih. Boleh dicek lagi? Nominalnya '+rp(b.toTransfer)+' (pakai kode unik ya), dengan berita '+b.note+'. Kursinya masih kami tahan 2 jam lagi kok. '+link(b);
  if(kind==='venue')return 'Hai '+first(b)+'! Kursi kamu buat '+e.title+' udah aman ya, bayarnya nanti di venue ('+rp(b.total)+'). Sampai ketemu '+idDate(s.start)+'! Detail: '+link(b);
  if(kind==='cancel')return 'Hai '+first(b)+', booking kamu buat '+e.title+' udah kami batalkan ya'+(b.reason?' ('+b.reason.toLowerCase()+')':'')+'.'+(b.refund?' Refund '+rp(b.refund)+' bakal kami transfer balik, boleh kirim nomor rekening kamu di sini ya.':'')+' Semoga ketemu di event berikutnya!';
  if(kind==='rmp')return 'Hai '+first(b)+', '+(b.removed[b.removed.length-1]||'teman kamu')+' udah kami keluarkan dari booking '+e.title+' ya. '+(b.refund?'Refund '+rp(b.refund)+' bakal kami transfer balik, kirim nomor rekening kamu di sini ya.':(b.status==='held'||b.status==='rejected'?'Total transfer sekarang '+rp(b.toTransfer)+' dengan berita '+b.note+'. '+link(b):'Total sekarang '+rp(b.total)+'.'));
  if(kind==='held')return 'Hai '+first(b)+'! Ini link booking kamu buat '+e.title+': '+link(b)+' . Transfer '+rp(b.toTransfer)+' dengan berita '+b.note+' ya, kursinya kami tahan sampai '+when(b.holdUntil).split(', ')[1]+' WIB.';
  return 'Hai '+first(b)+'! Ini admin TBT soal booking '+e.title+' kamu. Detail: '+link(b);
}
function waSheet(b,kind){
  var c=b.contact||{name:'',wa:''},txt=waText(b,kind);
  sheet('<h3>WhatsApp to '+esc(c.name)+'</h3><p class="meta" style="margin:4px 0 10px">'+esc(showWa(c.wa))+'. Change the message if you like, then open WhatsApp to send it.</p><textarea id="watx" rows="7">'+esc(txt)+'</textarea><div class="acts"><a class="btn primary" id="wago" href="https://wa.me/'+waNum(c.wa)+'?text='+encodeURIComponent(txt)+'" target="_blank" rel="noopener">Open WhatsApp</a><button type="button" class="btn" data-a="close">Close</button></div>');
}
function sheet(html){document.getElementById('layer').innerHTML='<div class="dim" data-a="close"><div class="sheet" role="dialog" aria-modal="true">'+html+'</div></div>';}
function closeSheet(){document.getElementById('layer').innerHTML='';}
function bkRow(b){
  var open=!!A.open[b.id],st=STATUS[b.status]||[b.status,'grey'],active=['held','review','rejected','confirmed','venue'].indexOf(b.status)>=0,seats=seatsOf(b);
  var head='<button type="button" class="bk-h" data-a="tgl" data-id="'+b.id+'" aria-expanded="'+open+'"><span class="who"><b>'+esc(b.contact?b.contact.name:'')+(b.players.length>1?' +'+(b.players.length-1):'')+'</b><span class="meta">'+seats+' seat'+(seats===1?'':'s')+' · '+(b.pay==='venue'?'pays at venue':(b.pay==='free'?'free':rp(b.toTransfer)))+' · TBT-'+esc(b.ref)+'</span></span><span class="bk-tags"><span class="tag '+st[1]+'">'+st[0]+'</span>'+(b.refund?'<span class="tag gold">Refund to send</span>':'')+'</span></button>';
  if(!open)return '<div class="bk">'+head+'</div>';
  var body='<div class="bk-b">'+b.players.map(function(p){
    return '<div class="pl">'+(b.players.length>1&&active?'<button type="button" class="x" data-a="rmp" data-id="'+b.id+'" data-p="'+p.id+'">Remove</button>':'')+'<div class="n"><b>'+esc(p.name)+'</b> '+(p.registered?'<span class="tag ok">TBT: '+esc(p.nickname)+'</span>':'<span class="tag grey">Guest</span>')
      +'<small><a href="https://wa.me/'+waNum(p.wa)+'" target="_blank" rel="noopener">'+esc(showWa(p.wa))+'</a>'+(p.ig?' · <a href="https://instagram.com/'+encodeURIComponent(p.ig)+'" target="_blank" rel="noopener">@'+esc(p.ig)+'</a>':'')+' · '+lvl(p.level)+'</small><small>'+p.sessions.map(function(id){var s=sById(id);return s?shortDate(s.start)+' '+s.start.slice(11,16)+' '+modeName(s.mode):'';}).join(', ')+'</small></div></div>';
  }).join('')
    +'<div class="kv"><span>Booked</span><span>'+when(b.createdAt)+'</span></div>'
    +(b.pay==='transfer'?'<div class="kv"><span>'+(b.status==='confirmed'?'Paid':(b.status==='cancelled'||b.status==='expired'?'Booked for':'Look for this transfer'))+'</span><span class="amt">'+rpCode(b.toTransfer)+'</span></div>'+(b.paidAmount&&b.paidAmount!==b.total+b.code?'<div class="kv"><span>Total now</span><span>'+rp(b.total)+'</span></div>':'')+'<div class="kv"><span>Transfer note</span><span><b>'+esc(b.note)+'</b></span></div>'
      :'<div class="kv"><span>'+(b.pay==='venue'?'To pay at the venue':'Price')+'</span><span><b>'+rp(b.total)+'</b></span></div>')
    +(b.markedAt?'<div class="kv"><span>Marked transferred</span><span>'+when(b.markedAt)+'</span></div>':'')
    +(b.holdUntil&&(b.status==='held'||b.status==='rejected')?'<div class="kv"><span>Seats held until</span><span>'+when(b.holdUntil)+' WIB</span></div>':'')
    +(b.removed.length?'<div class="kv"><span>Taken out</span><span>'+b.removed.map(esc).join(', ')+'</span></div>':'')
    +(b.reason?'<div class="kv"><span>Reason</span><span>'+esc(b.reason)+'</span></div>':'')
    +(b.refund?'<div class="kv"><span>Refund to send</span><span><b style="color:#B8912E">'+rp(b.refund)+'</b></span></div>':'');
  var a='';
  if(b.status==='review')a='<button type="button" class="btn primary" data-a="act" data-v="confirm" data-id="'+b.id+'">Money is in: confirm</button><button type="button" class="btn danger" data-a="act" data-v="notfound" data-id="'+b.id+'">Not found</button>';
  else if(b.status==='venue')a='<button type="button" class="btn primary" data-a="act" data-v="confirm" data-id="'+b.id+'">Mark paid</button><button type="button" class="btn" data-a="wa" data-k="venue" data-id="'+b.id+'">WhatsApp note</button>';
  else if(b.status==='held'||b.status==='rejected')a='<button type="button" class="btn" data-a="wa" data-k="'+(b.status==='held'?'held':'reject')+'" data-id="'+b.id+'">Send booking link</button><button type="button" class="btn" data-a="act" data-v="confirm" data-id="'+b.id+'">Confirm anyway</button>';
  else if(b.status==='confirmed')a='<button type="button" class="btn primary" data-a="wa" data-k="confirm" data-id="'+b.id+'">Send confirmation</button>';
  else if(b.status==='cancelled')a='<button type="button" class="btn" data-a="wa" data-k="cancel" data-id="'+b.id+'">Send message</button>';
  if(b.refund)a='<button type="button" class="btn primary" data-a="act" data-v="refunded" data-id="'+b.id+'">Refund sent</button>'+a;
  a+='<button type="button" class="btn" data-a="copy" data-v="'+esc(link(b))+'">Copy booking link</button>';
  if(active)a+='<button type="button" class="btn danger" data-a="rmb" data-id="'+b.id+'">Remove booking</button>';
  return '<div class="bk">'+head+body+'<div class="acts">'+a+'</div></div></div>';
}
function vBookings(){
  var e=A.ev;
  if(A.err&&!e)return '<a class="back" href="#">&lsaquo; Events</a><div class="empty">'+esc(A.err)+'</div>';
  if(!e)return '<div class="empty">Loading…</div>';
  var list=e.bookingList.filter(function(b){return A.ses==='all'||b.players.some(function(p){return p.sessions.indexOf(A.ses)>=0;});});
  var order={review:0,venue:1,held:2,rejected:3,confirmed:4,cancelled:5,expired:6};
  list.sort(function(x,y){return (x.refund?-1:0)-(y.refund?-1:0)||order[x.status]-order[y.status]||y.createdAt.localeCompare(x.createdAt);});
  var cnt=function(k){return e.bookingList.filter(function(b){return b.status===k;}).length;},cap=0,tk=0;e.sessions.forEach(function(s){cap+=s.seats;tk+=s.taken;});
  return '<a class="back" href="#">&lsaquo; Events</a><div class="ah" style="margin-top:4px"><h2>'+esc(e.title)+'</h2>'+(e.status==='draft'?'<span class="tag grey">Draft</span>':'')+'</div><p class="meta" style="margin:4px 0 12px">Bookings · <a href="#edit='+e.id+'">Edit event</a>'+(e.status==='published'?' · <a href="/events/'+e.id+'/'+e.slug+'" target="_blank" rel="noopener">Event page &#8599;</a>':'')+'</p>'
    +'<div class="stat"><div><b>'+tk+'/'+cap+'</b><span>Seats</span></div><div><b>'+cnt('review')+'</b><span>To check</span></div><div><b>'+(cnt('held')+cnt('rejected')+cnt('venue'))+'</b><span>Not paid</span></div><div><b>'+cnt('confirmed')+'</b><span>Confirmed</span></div></div>'
    +(e.sessions.length>1?'<div class="chips" style="margin:12px 0">'+[['all','All sessions']].concat(e.sessions.map(function(s){return [s.id,shortDate(s.start)+' '+s.start.slice(11,16)+' · '+s.taken+'/'+s.seats];})).map(function(t){return '<button type="button" class="chip" data-a="ses" data-v="'+t[0]+'" aria-pressed="'+(A.ses===t[0])+'">'+t[1]+'</button>';}).join('')+'</div>':'<div style="height:12px"></div>')
    +(list.length?list.map(bkRow).join(''):'<div class="empty">No bookings yet.</div>')
    +'<div class="acts"><button type="button" class="btn" data-a="list">Copy player list</button><button type="button" class="btn" data-a="reload">Refresh</button></div>';
}
function playerList(){
  var e=A.ev,out=[e.title];
  e.sessions.forEach(function(s){
    out.push('');out.push(shortDate(s.start)+' '+s.start.slice(11,16)+' ('+modeName(s.mode)+') '+s.taken+'/'+s.seats);
    var n=0;e.bookingList.forEach(function(b){if(['held','review','rejected','confirmed','venue'].indexOf(b.status)<0)return;b.players.forEach(function(p){if(p.sessions.indexOf(s.id)<0)return;n++;
      out.push(n+'. '+(p.registered?p.nickname:p.name)+(p.registered&&p.nickname!==p.name?' ('+p.name+')':'')+(p.registered?'':' [guest]')+' · '+lvl(p.level)+' · '+showWa(p.wa)+(p.ig?' · @'+p.ig:'')+' · '+(STATUS[b.status]||[b.status])[0]);});});
  });
  return out.join('\n');
}
function act(id,body,then){
  A.busy=true;
  api('POST','/api/admin/bookings/'+encodeURIComponent(id),body).then(function(b){
    A.busy=false;var l=A.ev.bookingList;for(var i=0;i<l.length;i++)if(l[i].id===id)l[i]=b;A.open[id]=true;
    return loadOne(A.ev.id).then(function(){render();if(then)then(A.ev.bookingList.filter(function(x){return x.id===id;})[0]||b);});
  }).catch(function(e){A.busy=false;toast(e.message);});
}

// ---- input and clicks ----
function setField(id,v){
  var e=A.edit,m;if(!e)return;
  if((m=/^s(\d+)(date|time|hours|seats|price|mode)$/.exec(id)))e.sessions[+m[1]][m[2]]=v;
  else if((m=/^b(\d)(bank|number|name)$/.exec(id)))e.banks[+m[1]][m[2]]=v;
  else if(['title','place','about','contactWa','closeHours'].indexOf(id)>=0)e[id]=v;
}
document.addEventListener('input',function(ev){var t=ev.target;if(t.dataset&&t.dataset.e)setField(t.dataset.e,t.value);
  if(t.id==='watx'){var g=document.getElementById('wago');if(g)g.href=g.href.split('?')[0]+'?text='+encodeURIComponent(t.value);}});
document.addEventListener('change',function(ev){var t=ev.target;if(t.dataset&&t.dataset.e)setField(t.dataset.e,t.value);if(t.dataset&&t.dataset.t&&A.edit){A.edit[t.dataset.t]=t.checked;if(t.dataset.t==='fours')render();}});
document.addEventListener('click',function(ev){
  var b=ev.target.closest?ev.target.closest('[data-a]'):null;if(!b)return;var a=b.dataset.a,e=A.edit;
  if(a==='close'){if(ev.target===b||b.tagName==='BUTTON')closeSheet();return;}
  if(a==='type'){e.type=b.dataset.v;if(e.type==='tour'&&!e.id)e.fours=true;render();}
  else if(a==='sadd'){var last=e.sessions[e.sessions.length-1],s=blankSession();if(last){s.date=last.date;s.time=last.time;s.hours=last.hours;s.seats=last.seats;s.price=last.price;s.levels=last.levels.slice();s.mode=last.mode;}e.sessions.push(s);render();}
  else if(a==='srm'){e.sessions.splice(+b.dataset.i,1);render();}
  else if(a==='slv'){var se=e.sessions[+b.dataset.i],v=b.dataset.v,cur=se.levels.length?se.levels.slice():LEVELS.map(function(l){return l[0];}),k=cur.indexOf(v);if(k>=0)cur.splice(k,1);else cur.push(v);
    if(!cur.length){toast('Keep at least one level');return;}se.levels=cur.length===LEVELS.length?[]:LEVELS.map(function(l){return l[0];}).filter(function(x){return cur.indexOf(x)>=0;});render();}
  else if(a==='save')save(b.dataset.v);
  else if(a==='ses'){A.ses=b.dataset.v;render();}
  else if(a==='tgl'){A.open[b.dataset.id]=!A.open[b.dataset.id];render();}
  else if(a==='reload'){loadOne(A.ev.id).then(function(){render();toast('Up to date');});}
  else if(a==='list')copyText(playerList(),'Player list copied');
  else if(a==='copy')copyText(b.dataset.v,'Booking link copied');
  else if(a==='wa'){var bk=findB(b.dataset.id);if(bk)waSheet(bk,b.dataset.k);}
  else if(a==='act'){var v2=b.dataset.v;act(b.dataset.id,{action:v2},function(x){if(v2==='confirm')waSheet(x,'confirm');else if(v2==='notfound')waSheet(x,'reject');else toast('Marked as refunded');});}
  else if(a==='rmb'){var bk2=findB(b.dataset.id),paid=bk2.status==='confirmed'||bk2.status==='review';A.rm={reason:'Asked to cancel'};
    sheet('<h3>Remove this booking?</h3><p class="meta" style="margin:4px 0 10px">'+esc(bk2.players.map(function(p){return p.name;}).join(', '))+'. '+seatsOf(bk2)+' seat'+(seatsOf(bk2)===1?' goes':'s go')+' back to the event. The booking stays in the list as Cancelled.</p><div class="meta" style="font-weight:700;color:var(--text);margin-bottom:6px">Reason</div><div class="chips">'+['Asked to cancel','No-show','Duplicate booking','Other'].map(function(r,i){return '<button type="button" class="chip" data-a="rmr" data-v="'+r+'" aria-pressed="'+(i===0)+'">'+r+'</button>';}).join('')+'</div>'
      +(paid?'<label class="ck"><input type="checkbox" id="rmref" checked><span>'+(bk2.status==='review'?'They say they transferred '+rp(bk2.toTransfer)+'.':'They paid '+rp(bk2.pay==='transfer'?bk2.total+bk2.code:bk2.total)+'.')+' Note a refund to send.</span></label>':'')
      +'<div class="acts"><button type="button" class="btn danger" data-a="rmbok" data-id="'+bk2.id+'">Remove booking</button><button type="button" class="btn" data-a="close">Keep it</button></div>');}
  else if(a==='rmr'){A.rm.reason=b.dataset.v;[].forEach.call(document.querySelectorAll('[data-a=rmr]'),function(x){x.setAttribute('aria-pressed',String(x===b));});}
  else if(a==='rmbok'){var rf=document.getElementById('rmref');closeSheet();act(b.dataset.id,{action:'remove',reason:A.rm.reason,refund:!!(rf&&rf.checked)},function(x){waSheet(x,'cancel');});}
  else if(a==='rmp'){var bk3=findB(b.dataset.id),p=bk3.players.filter(function(x){return x.id===b.dataset.p;})[0],cost=p.sessions.reduce(function(t,id){var s=sById(id);return t+(s?s.price:0);},0),paid2=bk3.status==='confirmed'||bk3.status==='review';
    sheet('<h3>Remove '+esc(p.name)+'?</h3><p class="meta" style="margin:4px 0 10px">'+p.sessions.length+' seat'+(p.sessions.length===1?' goes':'s go')+' back to the event. The rest of the booking stays. New total: <b>'+rp(bk3.total-cost)+'</b>.'+(bk3.status==='held'||bk3.status==='rejected'?' They will see the new amount to transfer.':'')+'</p>'
      +(paid2?'<label class="ck"><input type="checkbox" id="rmref" checked><span>Already paid for. Note a refund of '+rp(cost)+'.</span></label>':'')
      +'<div class="acts"><button type="button" class="btn danger" data-a="rmpok" data-id="'+bk3.id+'" data-p="'+p.id+'">Remove '+esc(p.name.split(' ')[0])+'</button><button type="button" class="btn" data-a="close">Keep</button></div>');}
  else if(a==='rmpok'){var rf2=document.getElementById('rmref');closeSheet();act(b.dataset.id,{action:'removePlayer',player:b.dataset.p,refund:!!(rf2&&rf2.checked)},function(x){waSheet(x,'rmp');});}
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&document.querySelector('.dim'))closeSheet();});
function findB(id){var l=A.ev?A.ev.bookingList:[];for(var i=0;i<l.length;i++)if(l[i].id===id)return l[i];return null;}

checkLogin().then(function(ok){authed=ok;if(ok)go();else render();});
render();
</script>
