<style>
:root{
  --bg:#FAF7F2; --surface:#FFFFFF; --text:#1B4332; --muted:#587263; --line:#E4DDCD;
  --field:#FBF9F4; --accent:#2D6A4F; --onaccent:#FAF7F2; --focus:#2D6A4F; --red:#B72323; --gold:#B8912E;
  --sans:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --kai:KaiTi,"Kaiti SC",STKaiti,BiauKai,"KaiTi_GB2312","TBT Hanzi",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F2A20; --surface:#16382B; --text:#FAF7F2; --muted:#9DB8A9; --line:#26493B;
    --field:#12302A; --accent:#8FD0AE; --onaccent:#0F2A20; --focus:#8FD0AE; --red:#EA8888; --gold:#E0C171;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;color:var(--text);font-variant-numeric:lining-nums}
button{font:inherit;cursor:pointer;color:inherit}
a{color:inherit}
.han{font-family:var(--kai);font-weight:400;-webkit-text-stroke:.03em currentColor;color:var(--red)}
.wrap{max-width:560px;margin:0 auto;padding:0 18px 60px}
.top{text-align:left;padding:22px 0 6px}
.top h1{font-size:30px;font-weight:900;margin:0}
.upd{font-size:12px;color:var(--muted);margin-top:6px;min-height:15px}
.seg{display:flex;gap:6px;margin:14px 0}
.seg button{flex:1;border-radius:999px;padding:10px 12px;border:1px solid var(--line);background:transparent;font-weight:500;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 4px}
.chips button{border-radius:999px;padding:8px 14px;border:1px solid var(--line);background:var(--field);font-size:14px}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .l{font-size:12px;color:var(--muted)}
.stat .v{font-family:var(--display);font-weight:900;font-size:26px;margin-top:2px;font-variant-numeric:lining-nums tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 16px;margin-bottom:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.rn{width:32px;height:32px;flex:none;border-radius:999px;display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-variant-numeric:tabular-nums lining-nums;font-weight:700;background:var(--field);border:1px solid var(--line)}
.row.first .rn{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.rm{flex:1;min-width:0}
.rname{display:flex;align-items:center;gap:7px;min-width:0;font-weight:700}
.rsub{font-size:13px;color:var(--muted);margin-top:2px}
.rv{font-family:var(--display);font-weight:900;font-size:22px;font-variant-numeric:lining-nums tabular-nums}
.neg{color:var(--red)}
.empty{color:var(--muted);text-align:center;padding:26px 0;font-size:15px}
.dcard{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.dname{font-family:var(--display);font-weight:700;font-size:18px;font-variant-numeric:lining-nums}
.dmeta{font-size:13px;color:var(--muted);margin-top:2px}
.chev{font-size:24px;color:var(--muted)}
.back{background:none;border:0;color:var(--accent);font-weight:700;padding:6px 0;margin-bottom:6px}
.dtitle{font-size:26px;font-weight:900}
.sub{font-size:18px;margin:18px 0 10px}
.tcard{padding:14px 16px}
.thead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.tname{font-family:var(--display);font-weight:700;font-size:18px;font-variant-numeric:lining-nums}
.tprog{font-size:13px;color:var(--muted);text-align:right}
.prow{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:15px}
.prow:first-of-type{border-top:0}
.mbadge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:2px 8px;margin-left:8px;vertical-align:middle}
.pr{width:22px;color:var(--muted);font-family:var(--sans);font-weight:700;font-variant-numeric:tabular-nums lining-nums}
.pn{flex:1}
.pv{font-family:var(--display);font-weight:700;font-variant-numeric:lining-nums tabular-nums}
.btn{display:inline-block;margin-top:10px;border-radius:999px;padding:9px 18px;border:1px solid var(--line);background:transparent;text-decoration:none;font-weight:500;font-size:14px}
.btn.primary{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:700}

/* ranks 1 to 4: a quiet marker, never a box. Every row keeps the same shape; the place is shown by a slim bar
   and a faint tint in the medal colour, a ring round the number (filled for first place) and a small crown
   beside the champion's name. Gold, silver, bronze and the brand green. */
:root{--m2:#8E98A6;--m3:#A8703E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--m2:#BAC3CF;--m3:#D49A66}}
.row{position:relative}
.row.m::before{content:"";position:absolute;left:-16px;right:-16px;top:0;bottom:0;background:linear-gradient(90deg,var(--mt),transparent 70%);pointer-events:none}
.row.m::after{content:"";position:absolute;left:-16px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--mc)}
.row.m>*{position:relative;z-index:1}
.row.m .rn{background:transparent;border:2px solid var(--mc);color:var(--text)}
.row.r1{--mc:var(--gold);--mt:rgba(201,162,74,.16)}
.row.r2{--mc:var(--m2);--mt:rgba(150,160,176,.15)}
.row.r3{--mc:var(--m3);--mt:rgba(190,122,66,.15)}
.row.r4{--mc:var(--accent);--mt:rgba(95,180,138,.13)}
.row.r1 .rn{background:var(--mc);color:#2B2108}
.rname .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rname .crown{flex:none;width:16px;height:11px;color:var(--gold)}
.sharebar{display:flex;justify-content:flex-end;margin:2px 0 8px}
.sharebar button{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:700}
#t10Modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:16px}
#t10Modal[hidden]{display:none}
.t10box{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:18px;width:100%;max-width:460px;padding:16px}
.t10head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.t10head h3{font-size:20px}
.t10x{border:0;background:transparent;font-size:28px;line-height:1;padding:2px 8px}
.t10prev{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:12px}
.t10prev canvas{display:block;width:100%;height:auto;border-radius:8px}
.t10row{margin:12px 0 6px;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.t10sw{display:flex;gap:10px;flex-wrap:wrap}
.t10sw button{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);padding:0}
.t10sw button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.t10acts{display:flex;gap:10px;margin-top:16px}
.t10acts button{flex:1;border-radius:999px;padding:13px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.t10acts button.pri{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.t10acts button[hidden]{display:none}
.t10st{min-height:18px;font-size:13px;color:var(--muted);text-align:center;margin-top:8px}

/* navigation: a way into a table from the leaderboard, comfortable tap sizes */
.chips button{padding:10px 14px}
.sharebar button{min-height:40px}
.back{display:inline-flex;align-items:center;min-height:40px;padding:0;margin-bottom:4px}

/* the same slim bar as the scoreboard: small logo and name on the left, a way into a table on the right */
.brandbar{border-bottom:1px solid var(--line);background:var(--surface)}
.brandin{max-width:560px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brandmark{display:flex;align-items:center;gap:10px;min-width:0;min-height:40px;text-decoration:none;color:inherit}
.brandmark img{height:28px;width:auto;display:block;flex:none}
.brandname{font-family:var(--display);font-weight:900;font-size:14px;letter-spacing:.07em;text-transform:uppercase;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.backlink{display:inline-flex;align-items:center;gap:7px;min-height:40px;flex:none;color:var(--accent);font-size:14px;font-weight:700;text-decoration:none;white-space:nowrap}

<body>
<div id="app"></div>
<script>
var LOGO='/assets/i/cfad30e8e7.png';
var WINDS=[['\u6771','East'],['\u5357','South'],['\u897F','West'],['\u5317','North']];
var DATA={days:[],tables:[]};
var S={tab:'total',period:'all',metric:'net',mode:'all',day:null,loaded:false,failed:false,updated:null};
// The rating (formerly League Score) is hidden until its formula is settled. Set SHOW_RATING to true to bring the toggle back.
var SHOW_RATING=false,RATING_LABEL='TBT Rating';
var MODE_LABEL={casual:'Casual','default':'Default',tournament:'Tournament',custom:'Custom'};
function modeOf(t){return t.mode||'casual';}
// one short line describing how a table was played
function rulesLine(t){
  var r=t.rules;if(!r)return '';
  var p=[MODE_LABEL[modeOf(t)]||'Casual',r.minPoint+'+ pts to win','streak '+r.maxStreak,r.start==null?'no start score':'start '+r.start];
  if(r.bankrupt)p.push('bankrupt');
  if(r.seatRotation)p.push('seat rotation');
  if(r.deadwall)p.push('deadwall');
  return p.join(' \u00b7 ');
}
function modeOk(t){return S.mode==='all'||modeOf(t)===S.mode;}
// mode filter chips: shown when more than one mode has been played (or while a filter is active, so it can be cleared)
function modeChips(){
  var seen={};DATA.tables.forEach(function(t){if(t.events>0)seen[modeOf(t)]=true;});
  var keys=['casual','default','tournament','custom'].filter(function(k){return seen[k];});
  if(keys.length<2&&S.mode==='all')return '';
  return chips('mode',[['all','All modes']].concat(keys.map(function(k){return [k,MODE_LABEL[k]];})),S.mode);
}
try{
  var q=new URLSearchParams(location.search);
  if(q.get('sesi')){S.tab='sessions';S.day=q.get('sesi');}
  else if(q.get('tab')==='sessions')S.tab='sessions';
}catch(e){}

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function keyOf(n){return String(n).trim().toLowerCase().replace(/\s+/g,' ');}
function fmtDate(d){try{return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});}catch(e){return d;}}
function fmtNet(n){var r=Math.round(n*10)/10;return (r>0?'+':r<0?'\u2212':'')+Math.abs(r);}
function fmtLg(n){return (Math.round(n*10)/10).toFixed(1);}
function dayOf(id){for(var i=0;i<DATA.days.length;i++)if(DATA.days[i].id===id)return DATA.days[i];return null;}
function inPeriod(dateStr,p){
  if(p==='all')return true;
  var d=new Date(dateStr+'T00:00:00'),now=new Date();
  if(p==='month')return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();
  var start=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  start.setDate(start.getDate()-((start.getDay()+6)%7));   // weeks start on Monday
  var end=new Date(start);end.setDate(end.getDate()+7);
  return d>=start&&d<end;
}
// one entry per person across the given tables; names match ignoring case and extra spaces
function aggregate(tables){
  var map={};
  tables.forEach(function(t){
    var d=dayOf(t.day_id),date=d?d.date:'';
    t.players.forEach(function(p){
      if(p.placeholder||p.guest)return;   // an unnamed seat and a guest (not in the player registry) are not on the per-person board
      var k=p.key||keyOf(p.name),m=map[k]||(map[k]={name:p.name,stamp:date,games:0,net:0,lg:0,firsts:0,wins:0,hands:0,wf:0,winds:0,nofx:false});
      if(date>m.stamp){m.name=p.name;m.stamp=date;}   // show the spelling from the latest session
      m.games++;m.net+=p.netTotal;m.lg+=p.leagueScore;m.wins+=p.wins;if(p.rank===1)m.firsts++;
      if(p.windFirsts===undefined||t.winds===undefined)m.nofx=true;else{m.hands+=t.hands;m.wf+=p.windFirsts;m.winds+=t.winds;}   // a table whose statistics are not renewed yet has no wind-round facts
    });
  });
  return Object.keys(map).map(function(k){var m=map[k];return {name:m.name,games:m.games,net:m.net,league:m.lg/m.games,firsts:m.firsts,wins:m.wins,hands:m.hands,windFirsts:m.wf,winds:m.winds,facts:!m.nofx};});
}
// On a session's board: in how many of the wind rounds the player finished first, and the share of hands won.
function sessionSub(p){
  if(!p.facts||!p.winds||!p.hands)return '';
  return '1st in '+p.windFirsts+'/'+p.winds+' rounds \u00b7 '+Math.round(p.wins/p.hands*100)+'% win rate';
}
function rankList(list){
  var key=(SHOW_RATING&&S.metric==='league')?'league':'net',other=key==='net'?'league':'net';
  var sorted=list.slice().sort(function(a,b){return b[key]-a[key]||b[other]-a[other]||a.name.localeCompare(b.name);});
  var prev=null,prevRank=0;
  return sorted.map(function(p,i){var v=Math.round(p[key]*10)/10,rank=(prev!==null&&v===prev)?prevRank:i+1;prev=v;prevRank=rank;return {p:p,v:v,rank:rank,key:key};});
}
var CROWN='<svg class="crown" viewBox="0 0 100 70" aria-hidden="true"><path fill="currentColor" stroke="currentColor" stroke-width="6" stroke-linejoin="round" d="M8 48L4 20L28 38L50 8L72 38L96 20L92 48Z"/><circle cx="4" cy="18" r="6" fill="currentColor"/><circle cx="50" cy="5" r="6" fill="currentColor"/><circle cx="96" cy="18" r="6" fill="currentColor"/><rect x="8" y="55" width="84" height="11" rx="4" fill="currentColor"/></svg>';
// Ranks 1 to 4 stand out: gold with a crown, silver, bronze, jade. Tied players share the rank and so the look.
function board(list,session){
  if(!list.length)return '<p class="empty">No games recorded yet.</p>';
  var html='';
  rankList(list).forEach(function(r){
    var p=r.p,v=r.v,rank=r.rank,key=r.key;
    html+='<div class="row'+(rank<=4?' m r'+rank:'')+'"><div class="rn">'+rank+'</div><div class="rm"><div class="rname"><span class="nm">'+esc(p.name)+'</span>'+(rank===1?CROWN:'')+'</div><div class="rsub">'+((session&&sessionSub(p))||(p.games+(p.games===1?' game':' games')+' \u00b7 '+p.firsts+(p.firsts===1?' first place':' first places')))+'</div></div><div class="rv'+(key==='net'&&v<0?' neg':'')+'">'+(key==='net'?fmtNet(p.net):fmtLg(p.league))+'</div></div>';
  });
  return '<div class="card">'+html+'</div>';
}
// What the Share top 10 card shows: the top ten of the board that is on screen right now.
var PERIOD_LABEL={week:'This week',month:'This month',all:'All time'};
function modeLabel(){return S.mode==='all'?'All modes':(MODE_LABEL[S.mode]||S.mode);}
function shareBar(list,sub,sub2,session){
  if(!list.length){S.card=null;return '';}
  S.card={title:'Top 10',sub:sub,sub2:sub2,rows:rankList(list).slice(0,10).map(function(r){var p=r.p;return {name:p.name,games:p.games,firsts:p.firsts,meta:session?sessionSub(p):'',rank:r.rank,text:r.key==='net'?fmtNet(p.net):fmtLg(p.league),neg:r.key==='net'&&r.v<0};})};
  return '<div class="sharebar"><button type="button" data-share="1"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg>Share top 10</button></div>';
}
function seg(name,opts,cur){return '<div class="seg">'+opts.map(function(o){return '<button type="button" data-set="'+name+'" data-v="'+o[0]+'" aria-pressed="'+(cur===o[0])+'">'+o[1]+'</button>';}).join('')+'</div>';}
function chips(name,opts,cur){return '<div class="chips">'+opts.map(function(o){return '<button type="button" data-set="'+name+'" data-v="'+o[0]+'" aria-pressed="'+(cur===o[0])+'">'+o[1]+'</button>';}).join('')+'</div>';}
function played(fn){return DATA.tables.filter(function(t){return t.events>0&&fn(t);});}
function progress(t){
  if(!t.events)return 'Not started';
  if(t.locked)return 'Final \u2713';
  if(t.progress.done)return 'Finished';
  var w=WINDS[t.progress.wind];
  return 'In progress \u00b7 <span class="han">'+w[0]+'</span> '+w[1];
}

function viewTotal(){
  var ts=played(function(t){var d=dayOf(t.day_id);return d&&inPeriod(d.date,S.period)&&modeOk(t);});
  var agg=aggregate(ts),ids={};ts.forEach(function(t){ids[t.day_id]=1;});
  return '<div class="stats"><div class="stat"><div class="l">Sessions</div><div class="v">'+Object.keys(ids).length+'</div></div>'
    +'<div class="stat"><div class="l">Tables</div><div class="v">'+ts.length+'</div></div>'
    +'<div class="stat"><div class="l">Players</div><div class="v">'+agg.length+'</div></div></div>'
    +chips('period',[['week','This week'],['month','This month'],['all','All time']],S.period)
    +modeChips()
    +(SHOW_RATING?seg('metric',[['net','Net points'],['league',RATING_LABEL]],S.metric):'')
    +shareBar(agg,PERIOD_LABEL[S.period],modeLabel()+(SHOW_RATING&&S.metric==='league'?' \u00b7 '+RATING_LABEL:''))
    +board(agg);
}
function tableCard(t){
  var h='<div class="card tcard"><div class="thead"><div class="tname">'+esc(t.label)+'<span class="mbadge">'+esc(MODE_LABEL[modeOf(t)]||'Casual')+'</span></div><div class="tprog">'+progress(t)+'</div></div>';
  if(t.rules)h+='<div class="dmeta" style="margin-bottom:6px">'+esc(rulesLine(t))+'</div>';
  if(t.events){
    t.players.slice().sort(function(a,b){return a.rank-b.rank||b.netTotal-a.netTotal;}).forEach(function(p){
      h+='<div class="prow"><span class="pr">'+p.rank+'</span><span class="pn">'+esc(p.name)+(p.guest?' <span class="mbadge">guest</span>':'')+'</span><span class="pv'+(p.netTotal<0?' neg':'')+'">'+fmtNet(p.netTotal)+'</span></div>';
    });
  }else h+='<div class="dmeta">'+t.players.map(function(p){return esc(p.name);}).join(', ')+'</div>';
  if(t.view_code)h+='<a class="btn primary" href="scoreboard.html?view='+encodeURIComponent(t.view_code)+'&from='+encodeURIComponent(t.day_id)+'">Open table</a>';
  return h+'</div>';
}
function viewDay(id){
  var d=dayOf(id);
  if(!d)return '<button type="button" class="back" data-back="1">\u2039 All sessions</button><p class="empty">Session not found.</p>';
  var ts=DATA.tables.filter(function(t){return t.day_id===id;});
  return '<button type="button" class="back" data-back="1">\u2039 All sessions</button><h2 class="dtitle">'+esc(d.label)+'</h2><div class="dmeta" style="margin-bottom:6px">'+esc(fmtDate(d.date))+'</div>'
    +modeChips()
    +(SHOW_RATING?seg('metric',[['net','Net points'],['league',RATING_LABEL]],S.metric):'')
    +(function(){var dl=aggregate(ts.filter(function(t){return t.events>0&&modeOk(t);}));return shareBar(dl,d.label,fmtDate(d.date)+(S.mode==='all'?'':' \u00b7 '+modeLabel()),true)+board(dl,true);})()
    +'<h3 class="sub">Tables</h3>'
    +(ts.length?ts.map(tableCard).join(''):'<p class="empty">No tables yet.</p>');
}
function viewSessions(){
  if(S.day)return viewDay(S.day);
  if(!DATA.days.length)return '<p class="empty">No sessions yet.</p>';
  return DATA.days.map(function(d){
    var n=DATA.tables.filter(function(t){return t.day_id===d.id;}).length;
    return '<button type="button" class="dcard" data-day="'+esc(d.id)+'"><div><div class="dname">'+esc(d.label)+'</div><div class="dmeta">'+esc(fmtDate(d.date))+' \u00b7 '+n+(n===1?' table':' tables')+'</div></div><span class="chev">\u203a</span></button>';
  }).join('');
}
var NAV=false;   // set when the visitor moves to another view, so Back can step back through the views
function viewUrl(){return S.tab==='sessions'?(S.day?'?sesi='+encodeURIComponent(S.day):'?tab=sessions'):location.pathname;}
function render(){
  var body;
  if(!S.loaded&&S.failed)body='<p class="empty">Can\u2019t load the leaderboard right now.</p><div style="text-align:center"><button type="button" class="btn primary" data-refresh="1">Try again</button></div>';
  else if(!S.loaded)body='<p class="empty">Loading\u2026</p>';
  else body=S.tab==='total'?viewTotal():viewSessions();
  var upd=S.updated?'Updated '+('0'+S.updated.getHours()).slice(-2)+':'+('0'+S.updated.getMinutes()).slice(-2):'';
  document.getElementById('app').innerHTML='<header class="brandbar"><div class="brandin"><a class="brandmark" href="index.html" aria-label="Tiles by Tiles leaderboard"><img src="'+LOGO+'" alt="" width="23" height="28"><span class="brandname">Tiles by Tiles</span></a><a class="backlink" href="masuk.html"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>Enter table code</a></div></header><div class="wrap"><div class="top"><h1>Leaderboard</h1><div class="upd">'+upd+'</div></div>'
    +seg('tab',[['total','Total'],['sessions','Sessions']],S.tab)+body+'</div>';
  try{var nu=viewUrl();if(NAV&&nu!==location.pathname+location.search)history.pushState({v:1},'',nu);else history.replaceState(history.state,'',nu);}catch(e){}
  NAV=false;
}
document.getElementById('app').addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('button'):null;if(!b)return;
  if(b.dataset.set){var moved=(b.dataset.set==='tab'&&S.tab!==b.dataset.v);S[b.dataset.set]=b.dataset.v;if(b.dataset.set==='tab')S.day=null;NAV=moved;render();}
  else if(b.dataset.day){S.day=b.dataset.day;NAV=true;render();window.scrollTo(0,0);}
  else if(b.dataset.back){if(history.state&&history.state.v)history.back();else{S.day=null;render();}}
  else if(b.dataset.share){if(window.openTop10Card&&S.card)window.openTop10Card(S.card);}
  else if(b.dataset.refresh){load();}
});
function load(){
  return fetch('/api/overview').then(function(r){if(!r.ok)throw new Error('bad');return r.json();}).then(function(o){
    DATA=o;S.loaded=true;S.failed=false;S.updated=new Date();render();
  }).catch(function(){S.failed=true;if(!S.loaded)render();});
}
window.addEventListener('popstate',function(){
  try{var qq=new URLSearchParams(location.search);S.tab='total';S.day=null;
    if(qq.get('sesi')){S.tab='sessions';S.day=qq.get('sesi');}else if(qq.get('tab')==='sessions')S.tab='sessions';}catch(e){}
  render();window.scrollTo(0,0);
});
render();load();
setInterval(function(){if(!document.hidden)load();},30000);   // stays fresh on a venue screen
</script>
<script>
/* Share top 10: a card in the same family as the scoreboard story and the share-hand card
   (same five styles, fonts, backdrop, logo header, crown and footer). It shows the top ten of the
   board that is on screen, and is drawn on a canvas so it can be saved or shared as a picture. */
(function(){
  var PLAY='"Playfair Display",Georgia,"Times New Roman",serif';
  var INTER='"Inter Tight","Helvetica Neue",Arial,sans-serif';
  var KAI='KaiTi,"Kaiti SC",STKaiti,BiauKai,"KaiTi_GB2312","TBT Hanzi",serif';
  var CREAM='#FAF7F2',RED='#B72323';
  var HANDLE='@tiles.by.tiles',TAGLINE='Play. Learn. Connect.';
  var WINDS=['\u6771','\u5357','\u897F','\u5317'];
  var LOGO_ASPECT=217/260;
  var FORMATS={story:{W:1080,H:1920,label:'Story 9:16'},portrait:{W:1080,H:1350,label:'Post 4:5'}};
  var THEMES={
    midnight:{label:'Midnight',bg1:'#1C2C4E',bg2:'#0A1226',text:CREAM,muted:'rgba(250,247,242,.72)',line:'rgba(250,247,242,.3)',loss:'#F2A09A',wm:.06,bloom:'rgba(170,190,255,.12)',vig:'rgba(0,0,12,.36)',grain:.12,sw:'linear-gradient(160deg,#1C2C4E,#0A1226)'},
    red:{label:'Red',bg1:'#8B1A1A',bg2:'#3A0A0A',text:CREAM,muted:'rgba(250,247,242,.74)',line:'rgba(250,247,242,.32)',loss:'#F6B3AB',wm:.06,bloom:'rgba(255,190,150,.14)',vig:'rgba(20,0,0,.42)',grain:.12,sw:'linear-gradient(160deg,#8B1A1A,#3A0A0A)'},
    forest:{label:'Forest',bg1:'#1F4B39',bg2:'#0D231A',text:CREAM,muted:'rgba(250,247,242,.72)',line:'rgba(250,247,242,.3)',loss:'#F2A09A',wm:.06,bloom:'rgba(255,255,235,.11)',vig:'rgba(0,0,0,.32)',grain:.12,sw:'linear-gradient(160deg,#1F4B39,#0D231A)'},
    black:{label:'Black',bg1:'#2A2A2A',bg2:'#080808',text:CREAM,muted:'rgba(250,247,242,.72)',line:'rgba(250,247,242,.3)',loss:'#F2A09A',wm:.06,bloom:'rgba(255,255,255,.09)',vig:'rgba(0,0,0,.5)',grain:.13,sw:'linear-gradient(160deg,#2A2A2A,#080808)'},
    cream:{label:'Cream',light:true,bg1:'#FAF7F2',bg2:'#EBE1CE',text:'#1B4332',muted:'rgba(27,67,50,.7)',line:'rgba(45,106,79,.4)',loss:RED,wm:.075,bloom:'rgba(255,255,255,.6)',vig:'rgba(110,80,30,.16)',grain:.09,sw:'linear-gradient(160deg,#FAF7F2,#EBE1CE)'}
  };
  // ranks 1 to 4: gold, silver, bronze, jade (the same colours as the board on the page)
  var MEDAL=[null,
    {a:'#F6DE9A',b:'#C9962B',ink:'#3A2804',edge:'#E5B84C'},
    {a:'#F1F4F8',b:'#8D97A6',ink:'#222A33',edge:'#C3CAD5'},
    {a:'#E9B98A',b:'#9C5E2B',ink:'#3A1F0A',edge:'#CF8A55'},
    {a:'#9BD9B6',b:'#2D6A4F',ink:'#0B2A1B',edge:'#5FB48A'}];
  var st={format:'story',theme:'forest'};
  var card=null,modal=null,canvas=null,ctx=null,logoImg=null,assets=null,W=1080,H=1920,NOISE=null;

  function $(id){return document.getElementById(id);}
  function rgba(hex,a){var n=parseInt(hex.slice(1),16);return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')';}
  function spacing(px){if(ctx&&'letterSpacing' in ctx)ctx.letterSpacing=px+'px';}
  function fit(text,maxW,weight,fam,start,min){
    var s=start;
    while(s>min){ctx.font=weight+' '+s+'px '+fam;if(ctx.measureText(text).width<=maxW)break;s-=2;}
    ctx.font=weight+' '+s+'px '+fam;
    return s;
  }
  function rr(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
  }
  function crown(cx,top,w,color){
    var s=w/100;
    ctx.save();
    ctx.translate(cx-w/2,top);ctx.scale(s,s);
    ctx.fillStyle=color;ctx.strokeStyle=color;ctx.lineJoin='round';ctx.lineWidth=6;
    ctx.beginPath();
    ctx.moveTo(8,48);ctx.lineTo(4,20);ctx.lineTo(28,38);ctx.lineTo(50,8);
    ctx.lineTo(72,38);ctx.lineTo(96,20);ctx.lineTo(92,48);ctx.closePath();
    ctx.fill();ctx.stroke();
    [[4,18],[50,5],[96,18]].forEach(function(p){ctx.beginPath();ctx.arc(p[0],p[1],6,0,Math.PI*2);ctx.fill();});
    rr(8,55,84,11,4);ctx.fill();
    ctx.restore();
  }
  // KaiTi, semibold: regular weight plus a fine same-colour stroke, so the look holds on every device
  function kai(glyph,x,y,size,color,align,base){
    ctx.save();
    ctx.font='400 '+size+'px '+KAI;
    ctx.textAlign=align||'left';ctx.textBaseline=base||'alphabetic';
    ctx.fillStyle=color;ctx.strokeStyle=color;ctx.lineWidth=size*0.03;ctx.lineJoin='round';
    spacing(0);
    ctx.strokeText(glyph,x,y);ctx.fillText(glyph,x,y);
    ctx.restore();
  }
  function hline(x1,x2,y,color,w,alpha){
    ctx.save();ctx.globalAlpha=alpha==null?1:alpha;ctx.strokeStyle=color;ctx.lineWidth=w;
    ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x2,y);ctx.stroke();ctx.restore();
  }
  function noisePattern(){
    if(NOISE)return NOISE;
    var c=document.createElement('canvas');c.width=c.height=256;
    var x=c.getContext('2d'),d=x.createImageData(256,256),s=12345;
    for(var i=0;i<d.data.length;i+=4){
      s=(s*1664525+1013904223)>>>0;
      var v=s>>>24;
      d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;
    }
    x.putImageData(d,0,0);
    NOISE=ctx.createPattern(c,'repeat');
    return NOISE;
  }
  function background(t){
    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,t.bg1);g.addColorStop(1,t.bg2);
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    var b=ctx.createRadialGradient(W/2,120,0,W/2,120,1000);
    b.addColorStop(0,t.bloom);b.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=b;ctx.fillRect(0,0,W,H);
    var v=ctx.createRadialGradient(W/2,H*0.46,H*0.28,W/2,H*0.46,H*0.82);
    v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,t.vig);
    ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
    // all four winds, huge and barely there, bleeding off the corners: the backdrop of the whole-game scoreboard
    var wc=document.createElement('canvas');wc.width=W;wc.height=H;
    var sv=ctx;ctx=wc.getContext('2d');
    var px=[.84,.84,.16,.16],py=[.78,.22,.22,.78];
    WINDS.forEach(function(w,i){kai(w,W*px[i],H*py[i],860*(H/1920),t.text,'center','middle');});
    ctx=sv;
    ctx.save();ctx.globalAlpha=t.wm;ctx.drawImage(wc,0,0);ctx.restore();
    ctx.save();ctx.globalCompositeOperation='overlay';ctx.globalAlpha=t.grain;
    ctx.fillStyle=noisePattern();ctx.fillRect(0,0,W,H);
    ctx.restore();
  }

  function draw(){
    if(!card||!canvas)return;
    var fm=FORMATS[st.format]||FORMATS.story;
    W=fm.W;H=fm.H;
    if(canvas.width!==W)canvas.width=W;
    if(canvas.height!==H)canvas.height=H;
    ctx=canvas.getContext('2d');
    var t=THEMES[st.theme]||THEMES.forest;
    var isStory=st.format==='story';
    var rows=card.rows.slice(0,10),n=rows.length,mx=90,x1=W-mx,cx=W/2;
    background(t);
    ctx.textBaseline='alphabetic';ctx.textAlign='left';spacing(0);

    // the same frame as the scoreboard card: header pinned to the top safe zone, footer to the bottom
    var TOP=isStory?256:64,tH=isStory?204:132,headerGap=isStory?46:30;
    var footLh=56,FOOT_TOP=isStory?1468:H-(footLh+58+56);
    var tW=tH*LOGO_ASPECT;
    if(logoImg)ctx.drawImage(logoImg,mx,TOP,tW,tH);
    var tx=mx+tW+(isStory?44:34),tmax=W-mx-tx;
    var title=card.title||'Top 10',sub=card.sub||'',sub2=card.sub2||'';
    if(isStory){
      var b1=TOP+69,b2=TOP+134,b3=TOP+189;
      fit(title,tmax,900,PLAY,76,38);
      ctx.fillStyle=t.text;ctx.fillText(title,tx,b1);
      var ly=b2;
      if(sub){fit(sub,tmax,400,PLAY,34,22);ctx.fillStyle=t.muted;ctx.fillText(sub,tx,b2);ly=b3;}
      if(sub2){fit(sub2,tmax,400,PLAY,34,22);ctx.fillStyle=sub?t.text:t.muted;ctx.fillText(sub2,tx,ly);}
    }else{
      var ts=fit(title,tmax,900,PLAY,60,26);
      var lh2=ts+30,by2=TOP+tH/2-lh2/2+ts*0.78;
      ctx.fillStyle=t.text;ctx.fillText(title,tx,by2);
      var line2=[sub,sub2].filter(Boolean).join('   \u00b7   ');
      if(line2){fit(line2,tmax,400,PLAY,34,18);ctx.fillStyle=t.muted;ctx.fillText(line2,tx,by2+lh2*0.62);}
    }

    // the ranking: a fixed row height so the card always has the same rhythm, centred when fewer than ten
    var zoneTop=TOP+tH+headerGap,zoneBottom=FOOT_TOP-(isStory?36:30);
    hline(mx,x1,zoneTop-14,t.text,2.5,.95);
    var rowH=Math.min(100,Math.floor((zoneBottom-zoneTop-12)/10));
    var by=zoneTop+6+Math.max(0,((zoneBottom-zoneTop-12)-rowH*n)/2);
    var pal=t.light?['#B8912E','#8A94A3','#A8703E','#2D6A4F']:['#E5C36B','#C7CFDA','#D79B68','#7CCBA0'];
    rows.forEach(function(r,i){
      var y=by+i*rowH,cy=y+rowH/2,top4=r.rank<=4,col=top4?pal[r.rank-1]:null,bx=mx+34,br=26;
      // the same hairline between every row
      if(i>0)hline(mx,x1,y,t.text,2,.14);
      if(top4){
        // a slim bar and a faint tint in the medal colour: marks the place without boxing the row
        var gt=ctx.createLinearGradient(mx-16,0,x1+16,0);
        gt.addColorStop(0,rgba(col,t.light?.17:.14));gt.addColorStop(.75,rgba(col,0));
        ctx.fillStyle=gt;ctx.fillRect(mx-16,y+2,(x1-mx)+32,rowH-4);
        ctx.fillStyle=col;rr(mx-16,y+13,5,rowH-26,2.5);ctx.fill();
      }
      // rank ring, filled for first place
      ctx.beginPath();ctx.arc(bx,cy,br,0,Math.PI*2);
      if(top4){if(r.rank===1){ctx.fillStyle=col;ctx.fill();}ctx.lineWidth=3;ctx.strokeStyle=col;ctx.stroke();}
      else{ctx.lineWidth=2.5;ctx.strokeStyle=t.line;ctx.stroke();}
      ctx.textAlign='center';ctx.textBaseline='middle';spacing(0);
      ctx.font='700 '+(r.rank>=10?27:32)+'px '+INTER;
      ctx.fillStyle=r.rank===1?'#2B2108':(top4?t.text:t.muted);
      ctx.fillText(String(r.rank),bx,cy+1);
      // net score at the right, name and games to its left, a small crown after the champion's name
      var nx=bx+br+26;
      ctx.textAlign='right';ctx.textBaseline='middle';
      ctx.font='700 44px '+INTER;
      var sw=ctx.measureText(r.text).width;
      ctx.fillStyle=r.neg?t.loss:t.text;ctx.fillText(r.text,x1-8,cy);
      var maxW=(x1-8-sw)-nx-28-(r.rank===1?46:0);
      var meta=r.meta||(r.games+(r.games===1?' game':' games')+' \u00b7 '+r.firsts+(r.firsts===1?' first place':' first places'));
      ctx.textAlign='left';
      fit(r.name,maxW,700,INTER,38,20);
      var nw=ctx.measureText(r.name).width;
      ctx.fillStyle=t.text;ctx.fillText(r.name,nx,cy-14);
      if(r.rank===1)crown(nx+nw+26,cy-14-11,34,col);
      fit(meta,maxW,400,INTER,25,16);
      ctx.fillStyle=t.muted;ctx.fillText(meta,nx,cy+23);
    });

    // footer, as on the scoreboard card
    if(isStory){
      if(logoImg)ctx.drawImage(logoImg,cx-92*LOGO_ASPECT/2,FOOT_TOP,92*LOGO_ASPECT,92);
      ctx.textAlign='center';ctx.textBaseline='middle';
      if(HANDLE){ctx.font='400 34px '+INTER;spacing(2);ctx.fillStyle=t.text;ctx.fillText(HANDLE,cx,FOOT_TOP+92+42);spacing(0);}
      if(TAGLINE){fit(TAGLINE,W-2*mx,400,INTER,34,20);ctx.fillStyle=t.muted;ctx.fillText(TAGLINE,cx,FOOT_TOP+92+88);}
    }else{
      ctx.font='400 34px '+INTER;spacing(2);
      var fw=HANDLE?ctx.measureText(HANDLE).width:0,gapL=HANDLE?16:0,lw=footLh*LOGO_ASPECT,rowW=lw+gapL+fw,x0=cx-rowW/2;
      if(logoImg)ctx.drawImage(logoImg,x0,FOOT_TOP,lw,footLh);
      if(HANDLE){ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillStyle=t.text;ctx.fillText(HANDLE,x0+lw+gapL,FOOT_TOP+footLh/2);}
      spacing(0);
      if(TAGLINE){ctx.textAlign='center';ctx.textBaseline='middle';fit(TAGLINE,W-2*mx,400,INTER,28,18);ctx.fillStyle=t.muted;ctx.fillText(TAGLINE,cx,FOOT_TOP+footLh+30);}
    }
  }

  /* ---------- loading what the card needs: the fonts and the logo ---------- */
  function loadAssets(){
    if(assets)return assets;
    var fonts=(document.fonts&&document.fonts.load)?Promise.all([
      document.fonts.load('900 76px "Playfair Display"'),document.fonts.load('700 40px "Playfair Display"'),document.fonts.load('400 34px "Playfair Display"'),
      document.fonts.load('400 34px "Inter Tight"'),document.fonts.load('700 34px "Inter Tight"'),
      document.fonts.load('400 48px "TBT Hanzi"',WINDS.join(''))
    ]).catch(function(){}):Promise.resolve();
    var logo=new Promise(function(res){
      var im=new Image(),done=false;
      function fin(v){if(!done){done=true;res(v);}}
      im.onload=function(){fin(im);};im.onerror=function(){fin(null);};
      setTimeout(function(){fin(im.complete&&im.naturalWidth?im:null);},2500);
      im.src=LOGO;
    });
    assets=Promise.all([fonts,logo]).then(function(r){logoImg=r[1];});
    return assets;
  }

  /* ---------- the window ---------- */
  function status(msg){var el=$('t10Status');if(el)el.textContent=msg||'';}
  function toBlob(){return new Promise(function(res){try{canvas.toBlob(function(b){res(b);},'image/png');}catch(e){res(null);}});}
  function isIOS(){return /iP(hone|ad|od)/.test(navigator.userAgent||'')||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);}
  // Save goes straight to the phone: a download on Android and desktop, the share sheet on iPhone and iPad
  // (that is where "Save Image" puts it in Photos), a new tab only when the browser blocks the download.
  async function save(){
    status('');
    var blob=await toBlob();
    if(!blob){status('Could not create the image. Try again.');return;}
    var file=null;
    try{file=new File([blob],'top10.png',{type:'image/png'});}catch(e){file=null;}
    if(isIOS()&&file&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file]});return;}
      catch(err){if(err&&err.name==='AbortError')return;}
    }
    var url=URL.createObjectURL(blob);
    try{
      var a=document.createElement('a');
      a.href=url;a.download='top10.png';
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      setTimeout(function(){URL.revokeObjectURL(url);},4000);
      status('Saved. Check your gallery or Downloads.');
    }catch(err){
      var opened=null;
      try{opened=window.open(url,'_blank');}catch(e){opened=null;}
      if(opened){status('Opened the image in a new tab. Press and hold it, then choose Save or Download image.');setTimeout(function(){URL.revokeObjectURL(url);},60000);}
      else{status('Could not save the image here. Try the Share button instead.');URL.revokeObjectURL(url);}
    }
  }
  async function share(){
    status('');
    try{
      var blob=await toBlob();
      if(!blob){status('Could not create the image. Try again.');return;}
      var file=new File([blob],'top10.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file]});
      else status('Sharing is not available here. Use Save image instead.');
    }catch(err){
      if(err&&err.name==='AbortError')return;
      status('Sharing is not available here. Use Save image instead.');
    }
  }
  function syncControls(){
    Array.prototype.forEach.call(document.querySelectorAll('#t10Fmt button'),function(b){b.setAttribute('aria-pressed',b.dataset.f===st.format?'true':'false');});
    Array.prototype.forEach.call(document.querySelectorAll('#t10Themes button'),function(b){b.setAttribute('aria-pressed',b.dataset.t===st.theme?'true':'false');});
  }
  function close(){if(modal){modal.hidden=true;document.body.style.overflow='';}}
  function build(){
    if(modal)return;
    modal=document.createElement('div');modal.id='t10Modal';modal.hidden=true;
    modal.innerHTML='<div class="t10box" role="dialog" aria-label="Share top 10"><div class="t10head"><h3>Share top 10</h3><button type="button" class="t10x" id="t10Close" aria-label="Close">&times;</button></div>'
      +'<div class="t10prev"><canvas id="t10Canvas"></canvas></div>'
      +'<div class="t10row">Format</div><div class="chips" id="t10Fmt"></div>'
      +'<div class="t10row">Style</div><div class="t10sw" id="t10Themes"></div>'
      +'<div class="t10acts"><button type="button" class="pri" id="t10Save">Save image</button><button type="button" id="t10Share" hidden>Share</button></div><div class="t10st" id="t10Status"></div></div>';
    document.body.appendChild(modal);
    canvas=$('t10Canvas');
    $('t10Fmt').innerHTML=Object.keys(FORMATS).map(function(k){return '<button type="button" data-f="'+k+'" aria-pressed="false">'+FORMATS[k].label+'</button>';}).join('');
    $('t10Themes').innerHTML=Object.keys(THEMES).map(function(k){return '<button type="button" data-t="'+k+'" aria-pressed="false" aria-label="'+THEMES[k].label+'" title="'+THEMES[k].label+'" style="background:'+THEMES[k].sw+'"></button>';}).join('');
    $('t10Fmt').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;st.format=b.dataset.f;syncControls();draw();});
    $('t10Themes').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;st.theme=b.dataset.t;syncControls();draw();});
    $('t10Close').addEventListener('click',close);
    modal.addEventListener('click',function(e){if(e.target===modal)close();});
    document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!modal.hidden)close();});
    $('t10Save').addEventListener('click',save);
    $('t10Share').addEventListener('click',share);
    try{var probe=new File([new Blob(['x'],{type:'image/png'})],'p.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[probe]}))$('t10Share').hidden=false;}catch(e){}
  }
  window.openTop10Card=function(c){
    card=c;build();status('');syncControls();
    modal.hidden=false;modal.scrollTop=0;document.body.style.overflow='hidden';
    loadAssets().then(draw);
  };
})();
</script>
</body>
