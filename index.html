/* TBT Hanzi: the one font family for every Chinese character on the site (KaiTi). Latin text, numbers and everything else keep their own fonts.
   The files are fetched only by a page that really shows one of these characters. KaiTi has all the Traditional characters the site uses (East, Green dragon and the closing character included).
   The font is the WOFF2 copy of KaiTi (5 MB), which every browser that loads web fonts can read.
   Declared once here; the pages carry no copies of their own. */
@font-face{font-family:"TBT Hanzi";font-style:normal;font-weight:100 900;font-display:swap;unicode-range:U+3400-4DBF,U+4E00-9FFF,U+F900-FAFF;src:url(/assets/f/KaiTi_1.woff2) format("woff2");}

<style>
:root{
  --bg:#FAF7F2; --surface:#FFFFFF; --text:#1B4332; --muted:#587263; --line:#E4DDCD;
  --field:#FBF9F4; --accent:#2D6A4F; --onaccent:#FAF7F2; --focus:#2D6A4F; --red:#B72323; --gold:#B8912E;
  --sans:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F2A20; --surface:#16382B; --text:#FAF7F2; --muted:#9DB8A9; --line:#26493B;
    --field:#12302A; --accent:#8FD0AE; --onaccent:#0F2A20; --focus:#8FD0AE; --red:#EA8888; --gold:#E0C171;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}

.wrap{max-width:1120px;margin:0 auto;padding:0 20px 60px}
.upd{font-size:12px;line-height:16px;color:var(--muted);margin-top:8px;min-height:16px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 16px;margin-bottom:12px;overflow:hidden}

.row:first-child{border-top:0}

.row.first .rn{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}

/* ranks 1 to 4: a quiet marker, never a box. Every row keeps the same shape; the place is shown by a slim bar
   and a faint tint, a ring round the number, and a small flat gem after the name:
   1 Diamond, 2 Ruby, 3 Jade, 4 Pearl. Tied players share the rank and so the gem. */
/* ranks 1 to 4 everywhere: 1 Diamond, 2 Ruby, 3 Jade, 4 Pearl. One set of colours for the ring, the bar, the tint and the gem. */
:root{--c1:#9FB8E8;--c2:#D62828;--c3:#2D6A4F;--c4:#C9BCA7;--t1:rgba(159,184,232,.16);--t2:rgba(214,40,40,.08);--t3:rgba(45,106,79,.12);--t4:rgba(201,188,167,.20);--g-d1:#6F90DB;--g-d2:#CFDEF9;--g-r1:#D62828;--g-r2:#FDE8E8;--g-j1:#2D6A4F;--g-j2:#B7D4C0;--g-p1:#EDE7DB;--g-p2:#B5A68B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c2:#E04646;--c3:#6FAE8E;--c4:#E8E1D8;--t1:rgba(159,184,232,.14);--t2:rgba(224,70,70,.12);--t3:rgba(111,174,142,.15);--t4:rgba(232,225,216,.10);--g-d1:#9FB8E8;--g-d2:#E8F1FF;--g-r1:#E04646;--g-j1:#6FAE8E;--g-j2:#E6F1E8;--g-p1:#E8E1D8;--g-p2:#C9BCA7}}
.gn{flex:none;display:inline-flex}.gn svg{width:15px;height:15px;display:block}
.gi-diamond .a{fill:var(--g-d1)}.gi-diamond .b{fill:var(--g-d2)}
.gi-ruby .a{fill:var(--g-r1)}.gi-ruby .b{fill:var(--g-r2);opacity:.5}
.gi-jade .a{fill:var(--g-j1)}.gi-jade .b{fill:var(--g-j2);opacity:.6}.gi-jade .c{fill:none;stroke:var(--g-j2);stroke-width:.9;stroke-linecap:round;opacity:.7}
.gi-pearl .a{fill:var(--g-p1);stroke:var(--g-p2);stroke-width:1.2}.gi-pearl .b{fill:#fff;opacity:.9}

.row{position:relative}
.row.m::before{content:"";position:absolute;left:-16px;right:-16px;top:0;bottom:0;background:linear-gradient(90deg,var(--mt),transparent 70%);opacity:.5;pointer-events:none}
.row.m::after{content:"";position:absolute;left:-16px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--mc)}
.row.m>*{position:relative;z-index:1}
.row.m .rn{background:transparent;border:2px solid var(--mc);color:var(--text)}
.row.r1{--mc:var(--c1);--mt:var(--t1)}

.row.r3{--mc:var(--c3);--mt:var(--t3)}

.rname .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* the same slim bar as the scoreboard: small logo and name on the left, a way into a table on the right */
.brandbar{border-bottom:1px solid var(--line);background:var(--surface)}
.brandin{max-width:1120px;margin:0 auto;padding:8px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}

.brandmark img{height:28px;width:auto;display:block;flex:none}
.brandname{font-family:var(--display);font-weight:900;font-size:14px;letter-spacing:.07em;text-transform:uppercase;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.backlink{display:inline-flex;align-items:center;gap:8px;min-height:40px;flex:none;color:var(--accent);font-size:14px;font-weight:500;text-decoration:none;white-space:nowrap}
/* a row of the board opens that player's page (only players who have an open page) */
.rlink,.row>.rlink,.row.m>.rlink{position:absolute;left:0;top:0;right:0;bottom:0;z-index:2;border-radius:12px}   /* .row.m>* makes the children of the top rows relative: this must win over it */

.rlink:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
/* small round choice buttons (used by the format choice of the share window) */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 4px}

.chips button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.n-o.on{background:var(--field);font-weight:500}.n-o .c{margin-left:auto;padding-left:12px;font-size:13px;color:var(--muted);font-weight:400}.n-o .ck{margin-left:10px;color:var(--accent);display:flex}

<div id="app"><div id="seo"><div class="h-kick" id="seoKick">Komunitas Mahjong Surabaya</div><h1 id="seoH1">Play. Learn. <em>Connect.</em><span class="h-h1s">The mahjong community in Surabaya: classes, open play and tournaments.</span></h1><p class="h-intro" id="seoIntro">Start from your first tile in a beginner class, come back every week for open play, and see every game you play land on the TBT leaderboard.</p></div></div>
<script type="application/json" id="homeText"></script>
<script>
var LOGO='/assets/i/cfad30e8e7.png';
var WINDS=[['\u6771','East'],['\u5357','South'],['\u897F','West'],['\u5317','North']];
var DATA={days:[],tables:[]};
var DEFAULT_MODE='default';   // the board opens on the Default mode and on the current season
var S={tab:'total',period:'',metric:'net',mode:DEFAULT_MODE,modeSet:false,dmode:'all',day:null,loaded:false,failed:false,updated:null,menu:null,from:'',to:'',cust:{open:false,err:''},autoDone:false};
// The rating (formerly League Score) is hidden until its formula is settled. Set SHOW_RATING to true to bring the toggle back.
var SHOW_RATING=false,RATING_LABEL='TBT Rating';
var MODE_LABEL={casual:'Casual','default':'Default',tournament:'Tournament',custom:'Custom',mcr4:'MCR-4',mcr8:'MCR-8',mcrc:'MCR-Custom'};
var MODE_ORDER=['default','casual','tournament','custom','mcr4','mcr8','mcrc'];
function isMcrMode(k){return k==='mcr4'||k==='mcr8'||k==='mcrc';}
// Which mode filter a table answers to. "All modes" leaves the MCR modes out (their scores are on another scale, so mixing
// them in would make the ranking meaningless); "MCR" is both MCR modes added together; MCR-4 and MCR-8 stand alone.
function modeMatch(t,m){var k=modeOf(t);return m==='all'?!isMcrMode(k):m==='mcr'?isMcrMode(k):k===m;}
function filterLabel(m){return m==='all'?'All modes':m==='mcr'?'MCR':(MODE_LABEL[m]||m);}
function modeOf(t){return t.mode||'casual';}
// one short line describing how a table was played
function rulesLine(t){
  var r=t.rules;if(!r)return '';
  if(r.base!=null){var q=[MODE_LABEL[modeOf(t)]||'MCR','base '+r.base,'min '+r.minPoint+' pts','dealer never repeats'];if(r.seatRotation)q.push('seat rotation');return q.join(' \u00b7 ');}   // an MCR table
  var p=[MODE_LABEL[modeOf(t)]||'Casual',r.minPoint+'+ pts to win','streak '+r.maxStreak,r.start==null?'no start score':'start '+r.start];
  if(r.bankrupt)p.push('bankrupt');
  if(r.seatRotation)p.push('seat rotation');
  if(r.deadwall)p.push('deadwall');
  return p.join(' \u00b7 ');
}

// ---- dates and periods ----
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function pad2(n){return ('0'+n).slice(-2);}
function localISO(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function todayStr(){return window.TBT_TODAY||localISO(new Date());}   // TBT_TODAY: a fixed date, used by tests
function currentSeason(){return todayStr().slice(0,7);}   // a season is a calendar month for now
function monthLabel(ym){return (MONTHS[+ym.slice(5,7)-1]||ym)+' '+ym.slice(0,4);}
function shortDate(ds,withYear){return (+ds.slice(8,10))+' '+MONTHS[+ds.slice(5,7)-1].slice(0,3)+(withYear?' '+ds.slice(0,4):'');}
function daysInMonth(ym){return new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate();}
function addDays(ds,n){var d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+n);return localISO(d);}
function mondayOf(ds){var d=new Date(ds+'T00:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return localISO(d);}   // weeks start on Monday
function periodOk(ds){
  var p=S.period;
  if(p==='all')return true;
  if(p==='today')return ds===todayStr();
  if(p==='yesterday')return ds===addDays(todayStr(),-1);
  if(p==='week'){var m=mondayOf(todayStr());return ds>=m&&ds<=addDays(m,6);}
  if(p==='lastweek'){var m0=mondayOf(todayStr());return ds>=addDays(m0,-7)&&ds<=addDays(m0,-1);}   // the Monday to Sunday before this one
  if(p==='custom')return (!S.from||ds>=S.from)&&(!S.to||ds<=S.to);
  return ds.slice(0,7)===p;
}
function seasons(){   // months that have games, newest first, and always the current one
  var seen={};seen[currentSeason()]=1;
  DATA.tables.forEach(function(t){if(t.events>0){var d=dayOf(t.day_id);if(d&&/^\d{4}-\d{2}/.test(d.date))seen[d.date.slice(0,7)]=1;}});
  return Object.keys(seen).sort().reverse();
}
function periodLabel(){
  var p=S.period;
  if(p==='all')return 'All time';if(p==='today')return 'Today';if(p==='yesterday')return 'Yesterday';if(p==='week')return 'This week';if(p==='lastweek')return 'Last week';
  if(p==='custom'){return shortDate(S.from,S.from.slice(0,4)!==S.to.slice(0,4))+' \u2013 '+shortDate(S.to,true);}
  return monthLabel(p);
}
function periodParam(){return S.period==='custom'?S.from+'_'+S.to:S.period;}
function setPeriodParam(v){
  if(v==='all'||v==='today'||v==='yesterday'||v==='week'||v==='lastweek'){S.period=v;return true;}
  if(/^\d{4}-(0[1-9]|1[0-2])$/.test(v)){S.period=v;return true;}
  var m=/^(\d{4}-\d{2}-\d{2})_(\d{4}-\d{2}-\d{2})$/.exec(v);
  if(m&&m[1]<=m[2]){S.period='custom';S.from=m[1];S.to=m[2];return true;}
  return false;
}
// ---- modes ----
function modesInData(){var seen={};DATA.tables.forEach(function(t){if(t.events>0)seen[modeOf(t)]=true;});return MODE_ORDER.filter(function(k){return seen[k];});}
function effMode(){var ms=modesInData();if(ms.length<2)return ms.length&&isMcrMode(ms[0])?'mcr':'all';return S.mode;}   // with a single mode played there is nothing to filter
function modeOk(t){return modeMatch(t,effMode());}
function modeLabel(){return filterLabel(effMode());}
// the Default mode may have no games yet in the period: open on all modes rather than on an empty board
function autoMode(){
  if(!S.loaded||S.modeSet||S.mode!==DEFAULT_MODE)return;
  var inP=DATA.tables.filter(function(t){var d=dayOf(t.day_id);return t.events>0&&d&&periodOk(d.date);});
  if(inP.some(function(t){return modeOf(t)==='default';}))return;
  // nothing in Default: all modes, unless only MCR tables were played in the period, which is then what opens
  S.mode=(!inP.some(function(t){return !isMcrMode(modeOf(t));})&&inP.some(function(t){return isMcrMode(modeOf(t));}))?'mcr':'all';
}
// ---- the address keeps the filters, so a shared link opens the same view ----
function readUrl(){
  try{
    var q=new URLSearchParams(location.search);
    S.tab='total';S.day=null;S.menu=null;
    if(q.get('sesi')){S.tab='sessions';S.day=q.get('sesi');S.dmode='all';}
    else if(q.get('tab')==='sessions')S.tab='sessions';
    S.period=currentSeason();var p=q.get('p');if(p)setPeriodParam(p);
    S.mode=DEFAULT_MODE;S.modeSet=false;var m=q.get('m');if(m&&(m==='all'||m==='mcr'||MODE_LABEL[m])){S.mode=m;S.modeSet=true;}
  }catch(e){S.period=currentSeason();}
}
readUrl();
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function keyOf(n){return String(n).trim().toLowerCase().replace(/\s+/g,' ');}
function fmtDate(d){try{return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});}catch(e){return d;}}
function fmtNet(n){var r=Math.round(n*10)/10;return (r>0?'+':r<0?'\u2212':'')+Math.abs(r);}
function fmtLg(n){return (Math.round(n*10)/10).toFixed(1);}
function dayOf(id){for(var i=0;i<DATA.days.length;i++)if(DATA.days[i].id===id)return DATA.days[i];return null;}
// one entry per person across the given tables; names match ignoring case and extra spaces
function aggregate(tables){
  var map={};
  tables.forEach(function(t){
    var d=dayOf(t.day_id),date=d?d.date:'';
    t.players.forEach(function(p){
      if(p.placeholder||p.guest)return;   // an unnamed seat and a guest (not in the player registry) are not on the per-person board
      var k=p.key||keyOf(p.name),m=map[k]||(map[k]={name:p.name,stamp:date,games:0,net:0,lg:0,firsts:0,wins:0,hands:0,wf:0,winds:0,nofx:false,pid:''});
      if(date>m.stamp){m.name=p.name;m.stamp=date;}   // show the spelling from the latest session
      m.games++;m.net+=p.netTotal;m.lg+=p.leagueScore;m.wins+=p.wins;if(p.rank===1)m.firsts++;
      if(p.reg)m.pid=p.key;   // a registered player whose page is open: the key is the id that opens it
      if(p.windFirsts===undefined||t.winds===undefined)m.nofx=true;else{m.hands+=t.hands;m.wf+=p.windFirsts;m.winds+=t.winds;}   // a table whose statistics are not renewed yet has no wind-round facts
    });
  });
  return Object.keys(map).map(function(k){var m=map[k];return {name:m.name,games:m.games,net:m.net,league:m.lg/m.games,firsts:m.firsts,wins:m.wins,hands:m.hands,windFirsts:m.wf,winds:m.winds,facts:!m.nofx,pid:m.pid};});
}
// On the main board: the wind rounds a player has played and how many of them they finished first.
// (A table whose statistics are not renewed yet has no wind-round facts: it shows the old games line until its turn comes.)
function totalSub(p){
  if(p.facts&&p.winds)return p.winds+(p.winds===1?' wind round':' wind rounds')+' \u00b7 '+p.windFirsts+(p.windFirsts===1?' first place':' first places');
  return p.games+(p.games===1?' game':' games')+' \u00b7 '+p.firsts+(p.firsts===1?' first place':' first places');
}
// On a session's board: in how many of the wind rounds the player finished first, and the share of hands won.
function sessionSub(p){
  if(!p.facts||!p.winds||!p.hands)return '';
  return '1st in '+p.windFirsts+'/'+p.winds+' rounds \u00b7 '+Math.round(p.wins/p.hands*100)+'% win rate';
}
function rankList(list){
  var key=(SHOW_RATING&&S.metric==='league')?'league':'net',other=key==='net'?'league':'net';
  var sorted=list.slice().sort(function(a,b){return b[key]-a[key]||b[other]-a[other]||a.name.localeCompare(b.name);});
  var prev=null,prevRank=0;
  return sorted.map(function(p,i){var v=Math.round(p[key]*10)/10,rank=(prev!==null&&v===prev)?prevRank:i+1;prev=v;prevRank=rank;return {p:p,v:v,rank:rank,key:key};});
}
// Ranks 1 to 4 stand out with a coloured bar and tint and a small gem after the name: Diamond, Ruby, Jade, Pearl. Tied players share the rank and so the look.
// the readable part of a player's address: the nickname as plain letters, numbers and hyphens (only the id after it matters)
// the four rank gems (1 Diamond, 2 Ruby, 3 Jade, 4 Pearl): the small icon next to a name, and the same shapes drawn on a card
var TBTGEM = (function () {
  var NAME = { 1: 'Diamond', 2: 'Ruby', 3: 'Jade', 4: 'Pearl' }, KEY = { 1: 'diamond', 2: 'ruby', 3: 'jade', 4: 'pearl' };
  // shapes on a 24 by 24 grid: ['p', path, class] or ['e', cx, cy, rx, ry, rotation, class]
  var SHAPES = {
    diamond: [['p', 'M6.5 4h11L22 9.5 12 20.5 2 9.5z', 'a'], ['p', 'M6.5 4h11l-2.6 5.5H9.1z', 'b']],
    ruby: [['p', 'M20.8 15.6L15.6 20.8H8.4L3.2 15.6V8.4L8.4 3.2h7.2l5.2 5.2z', 'a'], ['p', 'M16.6 13.9L13.9 16.6h-3.8l-2.7-2.7v-3.8l2.7-2.7h3.8l2.7 2.7z', 'b']],
    jade: [['p', 'M10 3.5h4A4 4 0 0 1 18 7.5v9a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4v-9A4 4 0 0 1 10 3.5z', 'a'], ['p', 'M11.2 7.5h1.6A2 2 0 0 1 14.8 9.5v5a2 2 0 0 1-2 2h-1.6A2 2 0 0 1 9.2 14.5v-5A2 2 0 0 1 11.2 7.5z', 'b'], ['p', 'M7.3 5.3L9.4 7.7M16.7 5.3L14.6 7.7M7.3 18.7L9.4 16.3M16.7 18.7L14.6 16.3', 'c']],
    pearl: [['p', 'M12 3.4a8.6 8.6 0 1 0 0 17.2 8.6 8.6 0 1 0 0-17.2z', 'a'], ['e', 9, 8.8, 3, 2, -30, 'b']]
  };
  // colours for a drawn card: [on a light card, on a dark card]
  var COL = {
    diamond: { a: ['#6F90DB', '#9FB8E8'], b: ['#CFDEF9', '#E8F1FF'], bo: 1 },
    ruby: { a: ['#D62828', '#E04646'], b: ['#FDE8E8', '#FDE8E8'], bo: .5 },
    jade: { a: ['#2D6A4F', '#6FAE8E'], b: ['#B7D4C0', '#E6F1E8'], bo: .6, c: ['#B7D4C0', '#E6F1E8'], co: .7 },
    pearl: { a: ['#EDE7DB', '#E8E1D8'], b: ['#FFFFFF', '#FFFFFF'], bo: .9, s: ['#B5A68B', '#C9BCA7'] }
  };
  var RING = { light: ['#9FB8E8', '#D62828', '#2D6A4F', '#C9BCA7'], dark: ['#9FB8E8', '#E04646', '#6FAE8E', '#E8E1D8'] };
  function esc(s) { return String(s).replace(/"/g, '&quot;'); }
  function svgShapes(key) { return SHAPES[key].map(function (s) { return s[0] === 'p' ? '<path class="' + s[2] + '" d="' + s[1] + '"/>' : '<ellipse class="' + s[6] + '" cx="' + s[1] + '" cy="' + s[2] + '" rx="' + s[3] + '" ry="' + s[4] + '" transform="rotate(' + s[5] + ' ' + s[1] + ' ' + s[2] + ')"/>'; }).join(''); }
  // the small icon after a name (nothing for ranks below 4)
  function icon(rank) { var k = KEY[rank]; if (!k) return ''; return '<span class="gn" role="img" aria-label="' + esc(NAME[rank]) + '"><svg class="gi gi-' + k + '" viewBox="0 0 24 24" aria-hidden="true">' + svgShapes(k) + '</svg></span>'; }
  // the same gem on a canvas, centred on cx, cy and size px wide
  function draw(ctx, cx, cy, size, rank, light) {
    var k = KEY[rank]; if (!k) return; var i = light ? 0 : 1, c = COL[k];
    ctx.save(); ctx.translate(cx - size / 2, cy - size / 2); ctx.scale(size / 24, size / 24); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    SHAPES[k].forEach(function (s) {
      var cl = s[0] === 'p' ? s[2] : s[6]; ctx.save();
      if (cl === 'c') { ctx.globalAlpha = c.co; ctx.strokeStyle = c.c[i]; ctx.lineWidth = .9; ctx.stroke(new Path2D(s[1])); ctx.restore(); return; }
      ctx.globalAlpha = cl === 'b' ? c.bo : 1; ctx.fillStyle = c[cl][i];
      if (s[0] === 'p') { var p = new Path2D(s[1]); ctx.fill(p); if (cl === 'a' && c.s) { ctx.strokeStyle = c.s[i]; ctx.lineWidth = 1.2; ctx.stroke(p); } }
      else { ctx.beginPath(); ctx.ellipse(s[1], s[2], s[3], s[4], s[5] * Math.PI / 180, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
    });
    ctx.restore();
  }
  return { icon: icon, draw: draw, name: function (r) { return NAME[r] || ''; }, ring: function (rank, light) { return RING[light ? 'light' : 'dark'][rank - 1] || null; } };
})();

// shared header (leaderboard, All players, a player's page): the brand name, find your name, the menu with Admin last, My page
var TBTNAV = (function () {
  var ME_KEY = 'tbt-me', MODES = { 'default': 'Default', casual: 'Casual', tournament: 'Tournament', custom: 'Custom', mcr4: 'MCR-4', mcr8: 'MCR-8', mcrc: 'MCR-Custom' };
  var ST = { q: '', hide: false, idx: null, status: 'idle', cbs: [], searching: false }, CFG = { inView: null, onMe: null, rerender: null }, BOUND = false, LAST = { active: 'lb', o: {} };
  var P = 'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
  var IC = {
    search: '<svg viewBox="0 0 24 24" ' + P + '><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
    home: '<svg viewBox="0 0 24 24" ' + P + '><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>',
    ticket: '<svg viewBox="0 0 24 24" ' + P + '><path d="M3 8a2 2 0 0 0 2-2h14a2 2 0 0 0 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 0-2 2H5a2 2 0 0 0-2-2v-2a2 2 0 0 0 0-4z"/><path d="M14 6v12" stroke-dasharray="2 2"/></svg>',
    menu: '<svg viewBox="0 0 24 24" ' + P + '><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
    close: '<svg viewBox="0 0 24 24" ' + P + '><path d="M6 6l12 12M18 6L6 18"/></svg>',
    board: '<svg viewBox="0 0 24 24" ' + P + '><path d="M7 21V11M12 21V4M17 21v-7"/></svg>',
    people: '<svg viewBox="0 0 24 24" ' + P + '><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.4 3.2-5.5 6.5-5.5s5.9 2.1 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c2 .7 3.2 2.4 3.5 5.2"/></svg>',
    code: '<svg viewBox="0 0 24 24" ' + P + '><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>',
    me: '<svg viewBox="0 0 24 24" ' + P + '><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4 3.8-6.5 8-6.5s7.2 2.5 8 6.5"/></svg>',
    cal: '<svg viewBox="0 0 24 24" ' + P + '><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    shield: '<svg viewBox="0 0 24 24" ' + P + '><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/></svg>',
    down: '<svg viewBox="0 0 24 24" ' + P + '><path d="M6 9l6 6 6-6"/></svg>',
    go: '<svg class="tn-go" viewBox="0 0 24 24" ' + P + '><path d="M9 6l6 6-6 6"/></svg>',
    quiz: '<svg viewBox="0 0 24 24" ' + P + '><rect x="6" y="3" width="12" height="18" rx="3"/><circle cx="10" cy="11" r=".6"/><circle cx="14" cy="11" r=".6"/><path d="M10 15c.6.7 3.4.7 4 0"/></svg>',
    signup: '<svg viewBox="0 0 24 24" ' + P + '><circle cx="10" cy="8" r="4"/><path d="M2.5 21c.8-4 3.4-6.5 7.5-6.5 1.6 0 3 .4 4.2 1.1"/><path d="M19 14v6M16 17h6"/></svg>',
    check: '<svg viewBox="0 0 24 24" width="18" height="18" ' + P + '><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
  };
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function fold(s) { return String(s).toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, ''); }
  function slug(n) { return String(n).toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 24) || 'player'; }
  function href(p) { return '/players/' + encodeURIComponent(p.id) + '/' + slug(p.name); }
  function dateText(d) { try { return new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); } catch (e) { return d; } }
  // who this device says it is (kept on the device only)
  function me() {
    try { var v = JSON.parse(localStorage.getItem(ME_KEY) || 'null'); return v && typeof v.id === 'string' && typeof v.name === 'string' && /^[A-Za-z0-9_-]{4,80}$/.test(v.id) ? { id: v.id, name: String(v.name).slice(0, 40) } : null; } catch (e) { return null; }
  }
  function canStore() { try { localStorage.setItem('tbt-t', '1'); localStorage.removeItem('tbt-t'); return true; } catch (e) { return false; } }
  function setMe(id, name) { try { localStorage.setItem(ME_KEY, JSON.stringify({ id: id, name: name })); return true; } catch (e) { return false; } }
  function clearMe() { try { localStorage.removeItem(ME_KEY); } catch (e) { } }
  // ---- the navigation: the menu on phones and tablets, the tabs from 1280px
  function links(o) { return [['hm', 'Home', '/', IC.home], ['ev', 'Events', '/events', IC.ticket], ['lb', 'Leaderboard', '/leaderboard', IC.board], ['pl', 'Players', (o && o.players) || '/players', IC.people], ['tc', 'Table code', '/masuk.html', IC.code], ['tq', 'Tile Quiz', '/quiz', IC.quiz]].concat(ST.su ? [['su', 'Sign up', '/daftar.html', IC.signup]] : []); }
  var ADMIN = [['Events', '/admin-events', IC.ticket], ['Sessions', '/admin-daily.html', IC.cal], ['Players', '/admin-pemain.html', IC.people], ['Host desk', '/host.html', IC.code]];
  function panel(active, o) {
    var m = me(), h = links(o).map(function (i) { return '<a href="' + esc(i[2]) + '"' + (i[0] === active ? ' aria-current="page"' : '') + '>' + i[3] + '<span>' + i[1] + '</span>' + IC.go + '</a>'; }).join('');
    if (m) h += '<a href="' + esc(href(m)) + '"' + (active === 'me' ? ' aria-current="page"' : '') + '>' + IC.me + '<span>My page \u00b7 <b>' + esc(m.name) + '</b></span>' + IC.go + '</a>';
    return h + '<div class="tn-adm"><h4>Admin and hosts</h4>' + ADMIN.map(function (i) { return '<a href="' + esc(i[1]) + '">' + i[2] + '<span>' + i[0] + '</span>' + IC.go + '</a>'; }).join('') + '</div>';
  }
  // o: { logo, name, players }  (the page gives its own logo and brand name)
  function header(active, o) {

  var d=new Date(s.day.date+'T00:00:00');
  return '<div class="h-feat">'+peeks+'<div class="h-card"><div class="h-card-k">Latest session</div><div class="h-top"><div class="h-cal"><span>'+DAYS3[d.getDay()]+'</span><b>'+d.getDate()+'</b><span>'+MONTHS[d.getMonth()].slice(0,3)+'</span></div><div style="min-width:0"><h2>'+esc(s.day.label)+'</h2><div class="s">'+tablesWord(s.tables)+'</div></div></div>'
    +(s.top?'<div class="h-win"><span><span class="s">Top of the session</span><br><b>'+esc(s.top)+'</b></span><span class="v">'+fmtNet(s.topNet)+'</span></div>':'')
    +'<a class="h-btn" href="/leaderboard?sesi='+encodeURIComponent(s.day.id)+'">See the results</a></div></div>';
}
function comingHtml(){
  var list=upcomingSessions().slice(1,5);
  var rows=list.length?list.map(function(x){var e=x.e,s=x.s;
    return '<a class="h-it" href="'+evHref(e)+'"><span class="h-d"><b>'+(+s.start.slice(8,10))+'</b><span>'+MON3[+s.start.slice(5,7)-1]+'</span></span><span class="h-m"><b>'+esc(e.title)+'</b><span>'+sDay(s.start)+' '+s.start.slice(11,16)+' \u00b7 '+lvlsS(s.levels)+'</span></span><span class="h-r"><span class="h-etag'+(e.type==='tour'?' gold':'')+'">'+(EVT[e.type]||'Event')+'</span><br>'+(s.left?s.left+' left':'<span style="color:var(--red);font-weight:700">Full</span>')+'</span></a>';}).join('')
    :'<div class="h-empty">More events are on the way. Follow @tiles.by.tiles to hear first.</div>';
  return '<div class="h-sec"><h2>Coming up</h2><a href="/events">All events</a></div><div class="h-list">'+rows+'</div>'
    +'<div class="h-new">'+rotImg('n1')+'<div><b>Never played before?</b><span>Start with a First timer class. We bring the tiles, you bring a friend.</span></div><a class="h-btn" href="/events?type=cls">Find a class</a></div>';
}
function sessionsHtml(){
  if(upcomingSessions().length)return comingHtml();
  var list=HS.loaded?latestSessions().slice(1,5):[];
  var rows=!HS.loaded?'<div class="h-empty">'+(HS.failed?'Can’t load the sessions right now.':'Loading…')+'</div>'
    :(list.length?list.map(function(s){var d=s.day.date;
      return '<a class="h-it" href="/leaderboard?sesi='+encodeURIComponent(s.day.id)+'"><span class="h-d"><b>'+(+d.slice(8,10))+'</b><span>'+MONTHS[+d.slice(5,7)-1].slice(0,3)+'</span></span><span class="h-m"><b>'+esc(s.day.label)+'</b><span>'+tablesWord(s.tables)+'</span></span>'+(s.top?'<span class="h-r"><b>'+esc(s.top)+'</b>'+fmtNet(s.topNet)+'</span>':'')+'</a>';}).join('')
      :'<div class="h-empty">Earlier sessions show here.</div>');
  return '<div class="h-sec"><h2>Latest sessions</h2><a href="/leaderboard?tab=sessions">All sessions</a></div><div class="h-list">'+rows+'</div>'
    +'<div class="h-new">'+rotImg('n1')+'<div><b>Never played before?</b><span>Follow @tiles.by.tiles on Instagram to catch the next beginner class.</span></div><a class="h-btn" href="https://www.instagram.com/tiles.by.tiles/" target="_blank" rel="noopener">'+HI.ig+'Follow</a></div>';
}
function boardHtml(){
  var head='<div class="h-sec"><h2>Leaderboard</h2><a href="/leaderboard">Full leaderboard</a></div>';
  if(!HS.loaded)return head+'<div class="card h-lb"><p class="empty">'+(HS.failed?'Can’t load the leaderboard right now.':'Loading…')+'</p></div>';
  var sd=seasonDays(),ts=played(function(t){var d=dayOf(t.day_id);return d&&periodOk(d.date)&&modeOk(t);}),agg=aggregate(ts);
  var rows=rankList(agg).slice(0,6).map(function(r){var p=r.p,rank=r.rank,v=r.v;
    return '<div class="row'+(rank<=4?' m r'+rank:'')+(p.pid?' lk':'')+'"><div class="rn">'+rank+'</div><div class="rm"><div class="rname"><span class="nm">'+esc(p.name)+'</span>'+TBTGEM.icon(rank)+'</div><div class="rsub">'+totalSub(p)+'</div></div><div class="rv'+(v<0?' neg':'')+'">'+fmtNet(p.net)+'</div>'+(p.pid?'<a class="rlink" href="/players/'+encodeURIComponent(p.pid)+'/'+slugOf(p.name)+'" aria-label="Open '+esc(p.name)+'’s page"></a>':'')+'</div>';}).join('');
  return head+'<div class="card h-lb"><div class="h-lbh"><span class="h-pill">'+esc(monthLabel(currentSeason()))+'</span><span class="h-pill">'+esc(modeLabel())+'</span><span class="h-day">Day '+sd.d+' of '+sd.n+'</span></div><div class="h-prog"><i style="width:'+Math.round(sd.d/sd.n*100)+'%"></i></div>'
    +(rows||'<p class="empty">No games this season yet.</p>')+'</div>';
}
// The Tile Quiz card, the same one as under the leaderboard (table code is in the menu, find your name in the header)
function tableHtml(){
  return '<div class="qz-wrap" style="padding:20px 0 24px"><div class="qz-pl"><div class="qz-pl-art" aria-hidden="true">'+rotImg('q1')+rotImg('q2')+rotImg('q3')+'</div><div class="qz-pl-tx"><b>Kamu tile yang mana?</b><span>16 pertanyaan, 3 menit. Ketemu tile kamu, partner main, dan rival bebuyutanmu.</span></div><a class="qz-pl-b" href="/quiz">Ikut quiz</a></div></div>';
}
function render(){
  document.getElementById('app').innerHTML=TBTNAV.header('hm',{logo:LOGO,name:'Tiles by Tiles',players:'/players'})
    +'<main><section class="h-hero"><div class="wrap h-hero-in" style="padding-bottom:28px"><div class="h-copy"><div class="h-kick">'+esc(HOME.kick)+'</div><h1>'+headlineHtml(HOME)+'</h1><p class="h-intro">'+esc(HOME.intro)+'</p>'
    +'<div class="h-acts">'+(upcomingSessions().length?'<a class="h-btn pri" href="/events">'+HI.ticket+'See events</a><a class="h-link" href="/leaderboard">Leaderboard '+HI.go+'</a>':'<a class="h-btn pri" href="/leaderboard">'+HI.board+'Leaderboard</a><a class="h-link" href="/players">All players '+HI.go+'</a>')+'</div><div class="h-facts">'+factsHtml()+'</div></div>'
    +featureHtml()+'</div></section>'
    +'<div class="wrap" style="padding-bottom:0"><div class="h-grid"><section>'+sessionsHtml()+'</section><section>'+boardHtml()+'</section></div>'+tableHtml()+'</div></main>';
  rotStart();
}
function load(){
  return fetch('/api/overview').then(function(r){if(!r.ok)throw new Error('bad');return r.json();}).then(function(o){
    DATA=o;HS.loaded=true;HS.failed=false;
    if(!S.autoDone){S.autoDone=true;S.loaded=true;autoMode();}
    render();
  }).catch(function(){HS.failed=true;if(!HS.loaded)render();});
}
function loadEvents(){return fetch('/api/events').then(function(r){return r.ok?r.json():null;}).then(function(d){if(d&&d.events){HS.events=d.events;render();}}).catch(function(){});}
TBTNAV.boot({});
render();load();loadEvents();
setInterval(function(){if(!document.hidden){load();loadEvents();}},60000);
</script>
</body>
</html>
