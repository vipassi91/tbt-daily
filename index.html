<style>
:root{
  --bg:#FAF7F2; --surface:#FFFFFF; --text:#1B4332; --muted:#587263; --line:#E4DDCD;
  --field:#FBF9F4; --accent:#2D6A4F; --onaccent:#FAF7F2; --focus:#2D6A4F; --red:#B72323; --gold:#B8912E;
  --sans:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --kai:KaiTi,"Kaiti SC",STKaiti,BiauKai,"KaiTi_GB2312","TBT Hanzi",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F2A20; --surface:#16382B; --text:#FAF7F2; --muted:#9DB8A9; --line:#26493B;
    --field:#12302A; --accent:#8FD0AE; --onaccent:#0F2A20; --focus:#8FD0AE; --red:#EA8888; --gold:#E0C171;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;color:var(--text);font-variant-numeric:lining-nums}
button{font:inherit;cursor:pointer;color:inherit}
a{color:inherit}
.han{font-family:var(--kai);font-weight:400;-webkit-text-stroke:.03em currentColor;color:var(--red)}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px 60px}
.upd{font-size:12px;color:var(--muted);margin-top:6px;min-height:15px}
.seg{display:flex;gap:6px;margin:14px 0}
.seg button{flex:1;border-radius:999px;padding:10px 12px;border:1px solid var(--line);background:transparent;font-weight:500;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 16px;margin-bottom:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.rn{width:32px;height:32px;flex:none;border-radius:999px;display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-variant-numeric:tabular-nums lining-nums;font-weight:700;background:var(--field);border:1px solid var(--line)}
.row.first .rn{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.rm{flex:1;min-width:0}
.rname{display:flex;align-items:center;gap:7px;min-width:0;font-weight:700}
.rsub{font-size:13px;color:var(--muted);margin-top:2px}
.rv{font-family:var(--display);font-weight:900;font-size:22px;font-variant-numeric:lining-nums tabular-nums}
.neg{color:var(--red)}
.empty{color:var(--muted);text-align:center;padding:26px 0;font-size:15px}
.dcard{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.dname{font-family:var(--display);font-weight:700;font-size:18px;font-variant-numeric:lining-nums}
.dmeta{font-size:13px;color:var(--muted);margin-top:2px}
.chev{font-size:24px;color:var(--muted)}
.back{background:none;border:0;color:var(--accent);font-weight:700;padding:6px 0;margin-bottom:6px}
.dtitle{font-size:26px;font-weight:900}
.sub{font-size:18px;margin:18px 0 10px}
.tcard{padding:14px 16px}
.thead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.tname{font-family:var(--display);font-weight:700;font-size:18px;font-variant-numeric:lining-nums}
.tprog{font-size:13px;color:var(--muted);text-align:right}
.prow{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:15px}
.prow:first-of-type{border-top:0}
.mbadge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:2px 8px;margin-left:8px;vertical-align:middle}
.pr{width:22px;color:var(--muted);font-family:var(--sans);font-weight:700;font-variant-numeric:tabular-nums lining-nums}
.pn{flex:1}
.pv{font-family:var(--display);font-weight:700;font-variant-numeric:lining-nums tabular-nums}
.btn{display:inline-block;margin-top:10px;border-radius:999px;padding:9px 18px;border:1px solid var(--line);background:transparent;text-decoration:none;font-weight:500;font-size:14px}
.btn.primary{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:700}

/* ranks 1 to 4: a quiet marker, never a box. Every row keeps the same shape; the place is shown by a slim bar
   and a faint tint in the medal colour, a ring round the number (filled for first place) and a small crown
   beside the champion's name. Gold, silver, bronze and the brand green. */
:root{--m2:#8E98A6;--m3:#A8703E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--m2:#BAC3CF;--m3:#D49A66}}
.row{position:relative}
.row.m::before{content:"";position:absolute;left:-16px;right:-16px;top:0;bottom:0;background:linear-gradient(90deg,var(--mt),transparent 70%);pointer-events:none}
.row.m::after{content:"";position:absolute;left:-16px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--mc)}
.row.m>*{position:relative;z-index:1}
.row.m .rn{background:transparent;border:2px solid var(--mc);color:var(--text)}
.row.r1{--mc:var(--gold);--mt:rgba(201,162,74,.16)}
.row.r2{--mc:var(--m2);--mt:rgba(150,160,176,.15)}
.row.r3{--mc:var(--m3);--mt:rgba(190,122,66,.15)}
.row.r4{--mc:var(--accent);--mt:rgba(95,180,138,.13)}
.row.r1 .rn{background:var(--mc);color:#2B2108}
.rname .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rname .crown{flex:none;width:16px;height:11px;color:var(--gold)}
#t10Modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:16px}
#t10Modal[hidden]{display:none}
.t10box{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:18px;width:100%;max-width:460px;padding:16px}
.t10head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.t10head h3{font-size:20px}
.t10x{border:0;background:transparent;font-size:28px;line-height:1;padding:2px 8px}
.t10prev{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:12px}
.t10prev canvas{display:block;width:100%;height:auto;border-radius:8px}
.t10row{margin:12px 0 6px;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.t10sw{display:flex;gap:10px;flex-wrap:wrap}
.t10sw button{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);padding:0}
.t10sw button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.t10acts{display:flex;gap:10px;margin-top:16px}
.t10acts button{flex:1;border-radius:999px;padding:13px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.t10acts button.pri{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.t10acts button[hidden]{display:none}
.t10st{min-height:18px;font-size:13px;color:var(--muted);text-align:center;margin-top:8px}
.back{display:inline-flex;align-items:center;min-height:40px;padding:0;margin-bottom:4px}

/* the same slim bar as the scoreboard: small logo and name on the left, a way into a table on the right */
.brandbar{border-bottom:1px solid var(--line);background:var(--surface)}
.brandin{max-width:1120px;margin:0 auto;padding:9px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brandmark{display:flex;align-items:center;gap:10px;min-width:0;min-height:40px;text-decoration:none;color:inherit}
.brandmark img{height:28px;width:auto;display:block;flex:none}
.brandname{font-family:var(--display);font-weight:900;font-size:14px;letter-spacing:.07em;text-transform:uppercase;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.backlink{display:inline-flex;align-items:center;gap:7px;min-height:40px;flex:none;color:var(--accent);font-size:14px;font-weight:700;text-decoration:none;white-space:nowrap}
/* a row of the board opens that player's page (only players who have an open page) */
.rlink{position:absolute;left:0;top:0;right:0;bottom:0;border-radius:12px}
.rlink:hover{background:rgba(127,127,127,.07)}
.rlink:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
/* small round choice buttons (used by the format choice of the share window) */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 4px}
.chips button{border-radius:999px;padding:10px 14px;min-height:44px;border:1px solid var(--line);background:var(--field);font-size:14px}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:700}
.chips button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
/* header: title on the left, the two filters on the right (under the title on phones) */
.n-head{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"t f";align-items:start;gap:14px;padding:20px 0 12px}
.n-head .t{grid-area:t}.n-head h1{font-size:30px;font-weight:900}
.n-filters{grid-area:f;display:flex;gap:10px}
.n-anchor{position:relative;display:block}
.n-dd{display:inline-flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:44px;padding:0 12px 0 14px;border-radius:999px;border:1px solid var(--line);background:var(--field);font-size:14px;font-weight:600;white-space:nowrap}
.n-dd .l{display:flex;align-items:center;gap:8px;min-width:0}.n-dd .l span{overflow:hidden;text-overflow:ellipsis}
.n-dd.act{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.n-dd:focus-visible,.n-o:focus-visible,.n-tabs button:focus-visible,.n-share:focus-visible,.n-ls:focus-visible,.dcard:focus-visible,.n-cust .go:focus-visible,.n-cust input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.n-clear{position:fixed;left:0;top:0;right:0;bottom:0;z-index:19}
.n-menu{position:absolute;right:0;top:50px;width:310px;max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.45);padding:8px;z-index:20}.n-menu.md{width:270px}
.n-g{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:10px 12px 4px;font-weight:700}
.n-o{display:flex;align-items:center;width:100%;min-height:44px;padding:0 12px;border:0;background:none;border-radius:10px;font-size:15px;text-align:left}
.n-o.on{background:var(--field);font-weight:700}.n-o .c{margin-left:auto;padding-left:12px;font-size:12.5px;color:var(--muted);font-weight:400}.n-o .ck{margin-left:10px;color:var(--accent);display:flex}
.n-cur{font-size:11px;font-weight:700;color:var(--accent);border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin-left:8px}
.n-sep{height:1px;background:var(--line);margin:6px 8px}
.n-cust{padding:6px 12px 10px}.n-cust .r{display:grid;grid-template-columns:1fr 1fr;gap:10px}.n-cust label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.n-cust input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--text);padding:0 10px;font:inherit;font-size:15px;color-scheme:light dark}
.n-cust .err{margin-top:8px;font-size:13px;color:var(--red)}.n-cust .go{margin-top:12px;width:100%;min-height:46px;border-radius:12px;border:0;background:var(--accent);color:var(--onaccent);font-weight:700;font-size:15px}
.n-dim{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.58);z-index:30}
.n-sheet{position:fixed;left:0;right:0;bottom:0;max-height:85vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;border-top:1px solid var(--line);padding:10px 14px calc(24px + env(safe-area-inset-bottom,0px));z-index:31}
.n-grab{width:42px;height:4px;border-radius:9px;background:var(--line);margin:2px auto 8px}.n-st{font-family:var(--display);font-weight:900;font-size:19px;padding:6px 12px 2px}
/* season progress, the numbers strip, tabs */
.n-prog{margin:0 0 14px}.n-prog .bar{height:4px;border-radius:9px;background:var(--line);overflow:hidden}.n-prog .bar i{display:block;height:100%;border-radius:9px;background:var(--accent)}
.n-prog .lab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:6px}
.n-strip{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.n-strip>div{padding:10px 6px 9px;text-align:center;border-left:1px solid var(--line);min-width:0}.n-strip>div:first-child{border-left:0}
.n-strip b{display:block;font-family:var(--display);font-weight:900;font-size:21px;line-height:1.1;font-variant-numeric:lining-nums tabular-nums}.n-strip span{display:block;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.25}
.n-tabs{display:flex;gap:24px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.n-tabs button{background:none;border:0;padding:0 2px;min-height:44px;font-size:15px;font-weight:600;color:var(--muted);position:relative}
.n-tabs button.on{color:var(--text)}.n-tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:var(--accent)}
.n-ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 2px 8px;font-size:13px;color:var(--muted)}
.n-share{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:13px;font-weight:600;color:var(--text);flex:none}
/* sessions and the side column */
.n-dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}.n-dl .dcard{margin:0}
.n-side .card{padding:14px 16px}.n-side h3{font-size:16px;margin:0 0 4px}
.n-ls{display:flex;align-items:center;gap:12px;width:100%;padding:11px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left}.n-side h3+.n-ls{border-top:0}
.n-ls .d{flex:none;width:46px;text-align:center;font-size:12px;color:var(--muted);line-height:1.2}.n-ls .d b{display:block;font-family:var(--display);font-size:20px;color:var(--text);font-weight:900;font-variant-numeric:lining-nums}
.n-ls .t{flex:1;min-width:0}.n-ls .t b{display:block;font-size:15px}.n-ls .t span{font-size:12.5px;color:var(--muted)}.n-ls .w{font-size:12.5px;color:var(--muted);text-align:right;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.n-ls .w b{display:block;color:var(--text);font-size:14px;overflow:hidden;text-overflow:ellipsis}
.n-dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}.n-dhead .n-filters{min-width:170px}
@media(max-width:979px){.n-head{grid-template-columns:minmax(0,1fr);grid-template-areas:"t" "f"}.n-filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr))}.n-side{display:none}.n-dhead .n-filters{display:block}}
@media(min-width:980px){.n-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}.n-grid.one{display:block}.n-grid.d{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.n-side{position:sticky;top:16px}}
@media(max-width:380px){.n-strip b{font-size:19px}.n-strip span{font-size:10.5px}}
</style>

<body>
<div id="app"></div>
<script>
var LOGO='/assets/i/cfad30e8e7.png';
var WINDS=[['\u6771','East'],['\u5357','South'],['\u897F','West'],['\u5317','North']];
var DATA={days:[],tables:[]};
var DEFAULT_MODE='default';   // the board opens on the Default mode and on the current season
var S={tab:'total',period:'',metric:'net',mode:DEFAULT_MODE,modeSet:false,dmode:'all',day:null,loaded:false,failed:false,updated:null,menu:null,from:'',to:'',cust:{open:false,err:''},autoDone:false};
// The rating (formerly League Score) is hidden until its formula is settled. Set SHOW_RATING to true to bring the toggle back.
var SHOW_RATING=false,RATING_LABEL='TBT Rating';
var MODE_LABEL={casual:'Casual','default':'Default',tournament:'Tournament',custom:'Custom'};
var MODE_ORDER=['default','casual','tournament','custom'];
function modeOf(t){return t.mode||'casual';}
// one short line describing how a table was played
function rulesLine(t){
  var r=t.rules;if(!r)return '';
  var p=[MODE_LABEL[modeOf(t)]||'Casual',r.minPoint+'+ pts to win','streak '+r.maxStreak,r.start==null?'no start score':'start '+r.start];
  if(r.bankrupt)p.push('bankrupt');
  if(r.seatRotation)p.push('seat rotation');
  if(r.deadwall)p.push('deadwall');
  return p.join(' \u00b7 ');
}

// ---- dates and periods ----
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function pad2(n){return ('0'+n).slice(-2);}
function localISO(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function todayStr(){return window.TBT_TODAY||localISO(new Date());}   // TBT_TODAY: a fixed date, used by tests
function currentSeason(){return todayStr().slice(0,7);}   // a season is a calendar month for now
function monthLabel(ym){return (MONTHS[+ym.slice(5,7)-1]||ym)+' '+ym.slice(0,4);}
function shortDate(ds,withYear){return (+ds.slice(8,10))+' '+MONTHS[+ds.slice(5,7)-1].slice(0,3)+(withYear?' '+ds.slice(0,4):'');}
function daysInMonth(ym){return new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate();}
function addDays(ds,n){var d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+n);return localISO(d);}
function mondayOf(ds){var d=new Date(ds+'T00:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return localISO(d);}   // weeks start on Monday
function periodOk(ds){
  var p=S.period;
  if(p==='all')return true;
  if(p==='today')return ds===todayStr();
  if(p==='week'){var m=mondayOf(todayStr());return ds>=m&&ds<=addDays(m,6);}
  if(p==='custom')return (!S.from||ds>=S.from)&&(!S.to||ds<=S.to);
  return ds.slice(0,7)===p;
}
function seasons(){   // months that have games, newest first, and always the current one
  var seen={};seen[currentSeason()]=1;
  DATA.tables.forEach(function(t){if(t.events>0){var d=dayOf(t.day_id);if(d&&/^\d{4}-\d{2}/.test(d.date))seen[d.date.slice(0,7)]=1;}});
  return Object.keys(seen).sort().reverse();
}
function periodLabel(){
  var p=S.period;
  if(p==='all')return 'All time';if(p==='today')return 'Today';if(p==='week')return 'This week';
  if(p==='custom'){return shortDate(S.from,S.from.slice(0,4)!==S.to.slice(0,4))+' \u2013 '+shortDate(S.to,true);}
  return monthLabel(p);
}
function periodParam(){return S.period==='custom'?S.from+'_'+S.to:S.period;}
function setPeriodParam(v){
  if(v==='all'||v==='today'||v==='week'){S.period=v;return true;}
  if(/^\d{4}-(0[1-9]|1[0-2])$/.test(v)){S.period=v;return true;}
  var m=/^(\d{4}-\d{2}-\d{2})_(\d{4}-\d{2}-\d{2})$/.exec(v);
  if(m&&m[1]<=m[2]){S.period='custom';S.from=m[1];S.to=m[2];return true;}
  return false;
}
// ---- modes ----
function modesInData(){var seen={};DATA.tables.forEach(function(t){if(t.events>0)seen[modeOf(t)]=true;});return MODE_ORDER.filter(function(k){return seen[k];});}
function effMode(){return modesInData().length<2?'all':S.mode;}   // with a single mode played there is nothing to filter
function modeOk(t){var m=effMode();return m==='all'||modeOf(t)===m;}
function modeLabel(){var m=effMode();return m==='all'?'All modes':(MODE_LABEL[m]||m);}
// the Default mode may have no games yet in the period: open on all modes rather than on an empty board
function autoMode(){
  if(!S.loaded||S.modeSet||S.mode!==DEFAULT_MODE)return;
  var has=DATA.tables.some(function(t){var d=dayOf(t.day_id);return t.events>0&&modeOf(t)==='default'&&d&&periodOk(d.date);});
  if(!has)S.mode='all';
}
// ---- the address keeps the filters, so a shared link opens the same view ----
function readUrl(){
  try{
    var q=new URLSearchParams(location.search);
    S.tab='total';S.day=null;S.menu=null;
    if(q.get('sesi')){S.tab='sessions';S.day=q.get('sesi');S.dmode='all';}
    else if(q.get('tab')==='sessions')S.tab='sessions';
    S.period=currentSeason();var p=q.get('p');if(p)setPeriodParam(p);
    S.mode=DEFAULT_MODE;S.modeSet=false;var m=q.get('m');if(m&&(m==='all'||MODE_LABEL[m])){S.mode=m;S.modeSet=true;}
  }catch(e){S.period=currentSeason();}
}
readUrl();
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function keyOf(n){return String(n).trim().toLowerCase().replace(/\s+/g,' ');}
function fmtDate(d){try{return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});}catch(e){return d;}}
function fmtNet(n){var r=Math.round(n*10)/10;return (r>0?'+':r<0?'\u2212':'')+Math.abs(r);}
function fmtLg(n){return (Math.round(n*10)/10).toFixed(1);}
function dayOf(id){for(var i=0;i<DATA.days.length;i++)if(DATA.days[i].id===id)return DATA.days[i];return null;}
// one entry per person across the given tables; names match ignoring case and extra spaces
function aggregate(tables){
  var map={};
  tables.forEach(function(t){
    var d=dayOf(t.day_id),date=d?d.date:'';
    t.players.forEach(function(p){
      if(p.placeholder||p.guest)return;   // an unnamed seat and a guest (not in the player registry) are not on the per-person board
      var k=p.key||keyOf(p.name),m=map[k]||(map[k]={name:p.name,stamp:date,games:0,net:0,lg:0,firsts:0,wins:0,hands:0,wf:0,winds:0,nofx:false,pid:''});
      if(date>m.stamp){m.name=p.name;m.stamp=date;}   // show the spelling from the latest session
      m.games++;m.net+=p.netTotal;m.lg+=p.leagueScore;m.wins+=p.wins;if(p.rank===1)m.firsts++;
      if(p.reg)m.pid=p.key;   // a registered player whose page is open: the key is the id that opens it
      if(p.windFirsts===undefined||t.winds===undefined)m.nofx=true;else{m.hands+=t.hands;m.wf+=p.windFirsts;m.winds+=t.winds;}   // a table whose statistics are not renewed yet has no wind-round facts
    });
  });
  return Object.keys(map).map(function(k){var m=map[k];return {name:m.name,games:m.games,net:m.net,league:m.lg/m.games,firsts:m.firsts,wins:m.wins,hands:m.hands,windFirsts:m.wf,winds:m.winds,facts:!m.nofx,pid:m.pid};});
}
// On the main board: the wind rounds a player has played and how many of them they finished first.
// (A table whose statistics are not renewed yet has no wind-round facts: it shows the old games line until its turn comes.)
function totalSub(p){
  if(p.facts&&p.winds)return p.winds+(p.winds===1?' wind round':' wind rounds')+' \u00b7 '+p.windFirsts+(p.windFirsts===1?' first place':' first places');
  return p.games+(p.games===1?' game':' games')+' \u00b7 '+p.firsts+(p.firsts===1?' first place':' first places');
}
// On a session's board: in how many of the wind rounds the player finished first, and the share of hands won.
function sessionSub(p){
  if(!p.facts||!p.winds||!p.hands)return '';
  return '1st in '+p.windFirsts+'/'+p.winds+' rounds \u00b7 '+Math.round(p.wins/p.hands*100)+'% win rate';
}
function rankList(list){
  var key=(SHOW_RATING&&S.metric==='league')?'league':'net',other=key==='net'?'league':'net';
  var sorted=list.slice().sort(function(a,b){return b[key]-a[key]||b[other]-a[other]||a.name.localeCompare(b.name);});
  var prev=null,prevRank=0;
  return sorted.map(function(p,i){var v=Math.round(p[key]*10)/10,rank=(prev!==null&&v===prev)?prevRank:i+1;prev=v;prevRank=rank;return {p:p,v:v,rank:rank,key:key};});
}
var CROWN='<svg class="crown" viewBox="0 0 100 70" aria-hidden="true"><path fill="currentColor" stroke="currentColor" stroke-width="6" stroke-linejoin="round" d="M8 48L4 20L28 38L50 8L72 38L96 20L92 48Z"/><circle cx="4" cy="18" r="6" fill="currentColor"/><circle cx="50" cy="5" r="6" fill="currentColor"/><circle cx="96" cy="18" r="6" fill="currentColor"/><rect x="8" y="55" width="84" height="11" rx="4" fill="currentColor"/></svg>';
// Ranks 1 to 4 stand out: gold with a crown, silver, bronze, jade. Tied players share the rank and so the look.
// the readable part of a player's address: the nickname as plain letters, numbers and hyphens (only the id after it matters)
function slugOf(n){return String(n).toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,24)||'player';}
function board(list,session){
  if(!list.length)return '<p class="empty">No games recorded yet.</p>';
  var html='';
  rankList(list).forEach(function(r){
    var p=r.p,v=r.v,rank=r.rank,key=r.key;
    html+='<div class="row'+(rank<=4?' m r'+rank:'')+'"><div class="rn">'+rank+'</div><div class="rm"><div class="rname"><span class="nm">'+esc(p.name)+'</span>'+(rank===1?CROWN:'')+'</div><div class="rsub">'+((session&&sessionSub(p))||totalSub(p))+'</div></div><div class="rv'+(key==='net'&&v<0?' neg':'')+'">'+(key==='net'?fmtNet(p.net):fmtLg(p.league))+'</div>'+(p.pid?'<a class="rlink" href="/player/'+slugOf(p.name)+'-'+esc(p.pid)+'" aria-label="Open '+esc(p.name)+'\u2019s page"></a>':'')+'</div>';
  });
  return '<div class="card">'+html+'</div>';
}

function setCard(list,sub,sub2,session){
  if(!list.length){S.card=null;return false;}
  S.card={title:'Top 10',sub:sub,sub2:sub2,rows:rankList(list).slice(0,10).map(function(r){var p=r.p;return {name:p.name,games:p.games,firsts:p.firsts,meta:session?sessionSub(p):totalSub(p),rank:r.rank,text:r.key==='net'?fmtNet(p.net):fmtLg(p.league),neg:r.key==='net'&&r.v<0};})};
  return true;
}
var ICON={
  cal:'<svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  mode:'<svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></svg>',
  chev:'<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  check:'<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
  share:'<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg>'
};
function shareBtn(){return S.card?'<button type="button" class="n-share" data-share="1">'+ICON.share+'Share top 10</button>':'';}
function seg(name,opts,cur){return '<div class="seg">'+opts.map(function(o){return '<button type="button" data-set="'+name+'" data-v="'+o[0]+'" aria-pressed="'+(cur===o[0])+'">'+o[1]+'</button>';}).join('')+'</div>';}
function played(fn){return DATA.tables.filter(function(t){return t.events>0&&fn(t);});}
function progress(t){
  if(!t.events)return 'Not started';
  if(t.locked)return 'Final \u2713';
  if(t.progress.done)return 'Finished';
  var w=WINDS[t.progress.wind];
  return 'In progress \u00b7 <span class="han">'+w[0]+'</span> '+w[1];
}

function tableCard(t){
  var h='<div class="card tcard"><div class="thead"><div class="tname">'+esc(t.label)+'<span class="mbadge">'+esc(MODE_LABEL[modeOf(t)]||'Casual')+'</span></div><div class="tprog">'+progress(t)+'</div></div>';
  if(t.rules)h+='<div class="dmeta" style="margin-bottom:6px">'+esc(rulesLine(t))+'</div>';
  if(t.events){
    t.players.slice().sort(function(a,b){return a.rank-b.rank||b.netTotal-a.netTotal;}).forEach(function(p){
      h+='<div class="prow"><span class="pr">'+p.rank+'</span><span class="pn">'+esc(p.name)+(p.guest?' <span class="mbadge">guest</span>':'')+'</span><span class="pv'+(p.netTotal<0?' neg':'')+'">'+fmtNet(p.netTotal)+'</span></div>';
    });
  }else h+='<div class="dmeta">'+t.players.map(function(p){return esc(p.name);}).join(', ')+'</div>';
  if(t.view_code)h+='<a class="btn primary" href="scoreboard.html?view='+encodeURIComponent(t.view_code)+'&from='+encodeURIComponent(t.day_id)+'">Open table</a>';
  return h+'</div>';
}

function isWide(){try{if(window.matchMedia)return window.matchMedia('(min-width:980px)').matches;}catch(e){}return window.innerWidth>=980;}
// ---- the two filter menus: a small menu under the button on wide screens, a sheet from the bottom on phones ----
function optBtn(opt,label,on,extra){
  return '<button type="button" role="option" class="n-o'+(on?' on':'')+'" data-opt="'+esc(opt)+'" aria-selected="'+(on?'true':'false')+'"><span>'+label+'</span>'+(extra?'<span class="c">'+extra+'</span>':'')+(on?'<span class="ck">'+ICON.check+'</span>':'')+'</button>';
}
function tablesWord(n){return n+(n===1?' table':' tables');}
function periodMenu(){
  var cur=currentSeason(),html='<div class="n-g">Season</div>';
  seasons().forEach(function(ym){html+=optBtn('period|'+ym,esc(monthLabel(ym))+(ym===cur?' <span class="n-cur">Current</span>':''),S.period===ym);});
  html+='<div class="n-g">Quick range</div>'+optBtn('period|today','Today',S.period==='today')+optBtn('period|week','This week',S.period==='week')+optBtn('period|all','All time',S.period==='all');
  html+='<div class="n-g">Custom</div>';
  if(!S.cust.open)html+='<button type="button" class="n-o'+(S.period==='custom'?' on':'')+'" data-cust="1"><span>Custom range\u2026</span><span class="c">\u203A</span></button>';
  else{var t=todayStr();html+='<div class="n-cust"><div class="r"><div><label for="cFrom">From</label><input type="date" id="cFrom" value="'+esc(S.from||'')+'" max="'+t+'"></div><div><label for="cTo">To</label><input type="date" id="cTo" value="'+esc(S.to||'')+'" max="'+t+'"></div></div>'+(S.cust.err?'<div class="err" role="alert">'+esc(S.cust.err)+'</div>':'')+'<button type="button" class="go" data-apply="1">Apply range</button></div>';}
  return html;
}
function modeMenu(){   // counts follow the period that is selected
  var inP=DATA.tables.filter(function(t){var d=dayOf(t.day_id);return t.events>0&&d&&periodOk(d.date);});
  var html='';
  modesInData().forEach(function(k){var n=inP.filter(function(t){return modeOf(t)===k;}).length;html+=optBtn('mode|'+k,esc(MODE_LABEL[k]),S.mode===k,tablesWord(n));});
  return html+'<div class="n-sep"></div>'+optBtn('mode|all','All modes',S.mode==='all',tablesWord(inP.length));
}
function dayModeMenu(id){
  var ts=DATA.tables.filter(function(t){return t.day_id===id&&t.events>0;});var html='';
  MODE_ORDER.filter(function(k){return ts.some(function(t){return modeOf(t)===k;});}).forEach(function(k){html+=optBtn('dmode|'+k,esc(MODE_LABEL[k]),S.dmode===k,tablesWord(ts.filter(function(t){return modeOf(t)===k;}).length));});
  return html+'<div class="n-sep"></div>'+optBtn('dmode|all','All modes',S.dmode==='all',tablesWord(ts.length));
}
var MENU_TITLE={period:'Period',mode:'Mode',dmode:'Mode'};
function menuInner(which){return which==='period'?periodMenu():(which==='mode'?modeMenu():dayModeMenu(S.day));}
function menuPop(which){
  return '<div class="n-clear" data-close="1"></div><div class="n-menu'+(which==='period'?'':' md')+'" role="listbox" aria-label="'+MENU_TITLE[which]+'">'+menuInner(which)+'</div>';
}
function menuSheet(which){
  return '<div class="n-dim" data-close="1"></div><div class="n-sheet" role="listbox" aria-label="'+MENU_TITLE[which]+'"><div class="n-grab"></div><div class="n-st">'+MENU_TITLE[which]+'</div>'+menuInner(which)+'</div>';
}
function ddButton(which,label,icon,active){
  return '<span class="n-anchor"><button type="button" class="n-dd'+(active?' act':'')+'" data-menu="'+which+'" aria-haspopup="listbox" aria-expanded="'+(S.menu===which)+'"><span class="l">'+icon+'<span>'+esc(label)+'</span></span>'+ICON.chev+'</button>'+(S.menu===which&&isWide()?menuPop(which):'')+'</span>';
}
// ---- the page ----
function statsOf(ts){
  var pl={},ds={},winds=0;
  ts.forEach(function(t){
    ds[t.day_id]=1;
    winds+=t.winds!==undefined?t.winds:(t.progress&&t.progress.done?4:((t.progress&&t.progress.wind)||0)+1);   // a table not renewed yet: estimated from where it stands
    t.players.forEach(function(p){if(!p.placeholder)pl[p.key||keyOf(p.name)]=1;});   // guests count here; the board ranks registered players only
  });
  return {winds:winds,sessions:Object.keys(ds).length,tables:ts.length,players:Object.keys(pl).length};
}
function stripHtml(st){
  function c(n,l){return '<div><b>'+n+'</b><span>'+l+'</span></div>';}
  return '<div class="n-strip">'+c(st.winds,'Wind rounds')+c(st.sessions,'Sessions')+c(st.tables,'Tables')+c(st.players,'Players')+'</div>';
}
function seasonBar(){   // only for the season that is running now: how far through it we are, in days
  var cur=currentSeason();if(S.period!==cur)return '';
  var d=+todayStr().slice(8,10),n=daysInMonth(cur);
  return '<div class="n-prog"><div class="bar" role="progressbar" aria-label="Season progress" aria-valuemin="1" aria-valuemax="'+n+'" aria-valuenow="'+d+'"><i style="width:'+Math.round(d/n*100)+'%"></i></div><div class="lab"><span>Day '+d+' of '+n+'</span><span>Ends '+shortDate(cur+'-'+pad2(n))+'</span></div></div>';
}
function headHtml(){
  var upd=S.updated?'Updated '+pad2(S.updated.getHours())+':'+pad2(S.updated.getMinutes()):'';
  var f=ddButton('period',periodLabel(),ICON.cal,false);
  if(S.loaded&&modesInData().length>=2)f+=ddButton('mode',modeLabel(),ICON.mode,effMode()!=='all');
  return '<div class="n-head"><div class="t"><h1>Leaderboard</h1><div class="upd">'+upd+'</div></div><div class="n-filters">'+f+'</div></div>';
}
function tabsHtml(){return '<div class="n-tabs" role="tablist">'+[['total','Total'],['sessions','Sessions']].map(function(o){return '<button type="button" role="tab" data-set="tab" data-v="'+o[0]+'" aria-selected="'+(S.tab===o[0])+'" class="'+(S.tab===o[0]?'on':'')+'">'+o[1]+'</button>';}).join('')+'</div>';}
function sideCard(ts){
  var by={};ts.forEach(function(t){(by[t.day_id]=by[t.day_id]||[]).push(t);});
  var ds=Object.keys(by).map(dayOf).filter(Boolean).sort(function(a,b){return b.date.localeCompare(a.date)||a.label.localeCompare(b.label);}).slice(0,5);
  if(!ds.length)return '';
  return '<aside class="n-side"><div class="card"><h3>Latest sessions</h3>'+ds.map(function(d){
    var x=by[d.id],net={};x.forEach(function(t){t.players.forEach(function(p){if(!p.placeholder&&!p.guest)net[p.name]=(net[p.name]||0)+p.netTotal;});});
    var w=Object.keys(net).sort(function(a,b){return net[b]-net[a];})[0];
    return '<button type="button" class="n-ls" data-day="'+esc(d.id)+'"><div class="d"><b>'+(+d.date.slice(8,10))+'</b>'+MONTHS[+d.date.slice(5,7)-1].slice(0,3)+'</div><div class="t"><b>'+esc(d.label)+'</b><span>'+tablesWord(x.length)+'</span></div>'+(w?'<div class="w"><b>'+esc(w)+'</b>'+fmtNet(net[w])+'</div>':'')+'</button>';
  }).join('')+'</div></aside>';
}
function sessionsGrid(ts){
  var by={};ts.forEach(function(t){(by[t.day_id]=by[t.day_id]||[]).push(t);});
  // sessions that have not started yet stay listed (in the period), so a table can still be found before its first hand
  DATA.days.forEach(function(d){
    if(by[d.id]||!periodOk(d.date))return;
    var mine=DATA.tables.filter(function(t){return t.day_id===d.id;});
    if(mine.length&&!mine.some(function(t){return t.events>0;}))by[d.id]=[];
  });
  var ds=Object.keys(by).map(dayOf).filter(Boolean).sort(function(a,b){return b.date.localeCompare(a.date)||a.label.localeCompare(b.label);});
  if(!ds.length)return '<p class="empty">No sessions in this period and mode yet.<br>Try another period or mode.</p>';
  return '<div class="n-dl">'+ds.map(function(d){
    var n=by[d.id].length;
    return '<button type="button" class="dcard" data-day="'+esc(d.id)+'"><div><div class="dname">'+esc(d.label)+'</div><div class="dmeta">'+esc(fmtDate(d.date))+' \u00b7 '+(n?tablesWord(n):'Not started')+'</div></div><span class="chev">\u203A</span></button>';
  }).join('')+'</div>';
}
function viewMain(){
  var ts=played(function(t){var d=dayOf(t.day_id);return d&&periodOk(d.date)&&modeOk(t);});
  var st=statsOf(ts),inner,side='';
  if(S.tab==='total'){
    var agg=aggregate(ts);setCard(agg,periodLabel(),modeLabel()+(SHOW_RATING&&S.metric==='league'?' \u00b7 '+RATING_LABEL:''));
    inner=ts.length?'<div class="n-ch"><span>Ranked by net points \u00b7 registered players</span>'+shareBtn()+'</div>'+(SHOW_RATING?seg('metric',[['net','Net points'],['league',RATING_LABEL]],S.metric):'')+board(agg):'<p class="empty">No games in this period and mode yet.<br>Try another period or mode.</p>';
    side=sideCard(ts);
  }else inner=sessionsGrid(ts);
  return seasonBar()+'<div class="n-grid'+(S.tab==='total'&&side?'':' one')+'"><div>'+stripHtml(st)+tabsHtml()+inner+'</div>'+side+'</div>';
}
function viewDay(id){
  var d=dayOf(id),back='<button type="button" class="back" data-back="1">\u2039 All sessions</button>';
  if(!d)return back+'<p class="empty">Session not found.</p>';
  var ts=DATA.tables.filter(function(t){return t.day_id===id;}),pl=ts.filter(function(t){return t.events>0;});
  var many=MODE_ORDER.filter(function(k){return pl.some(function(t){return modeOf(t)===k;});}).length>=2,dm=many?S.dmode:'all';
  var dl=aggregate(pl.filter(function(t){return dm==='all'||modeOf(t)===dm;}));
  setCard(dl,d.label,fmtDate(d.date)+(dm==='all'?'':' \u00b7 '+(MODE_LABEL[dm]||dm)),true);
  return back+'<div class="n-dhead"><div><h2 class="dtitle">'+esc(d.label)+'</h2><div class="dmeta">'+esc(fmtDate(d.date))+'</div></div>'+(many?'<div class="n-filters one">'+ddButton('dmode',dm==='all'?'All modes':MODE_LABEL[dm],ICON.mode,dm!=='all')+'</div>':'')+'</div>'
    +'<div class="n-grid d"><div><div class="n-ch"><span>Ranked by net points \u00b7 registered players</span>'+shareBtn()+'</div>'+(SHOW_RATING?seg('metric',[['net','Net points'],['league',RATING_LABEL]],S.metric):'')+board(dl,true)+'</div>'
    +'<div><h3 class="sub" style="margin-top:0">Tables</h3>'+(ts.length?ts.map(tableCard).join(''):'<p class="empty">No tables yet.</p>')+'</div></div>';
}
var NAV=false;   // set when the visitor moves to another view, so Back can step back through the views
function viewUrl(){
  if(S.tab==='sessions'&&S.day)return '?sesi='+encodeURIComponent(S.day);
  var qs=[];
  if(S.tab==='sessions')qs.push('tab=sessions');
  if(S.period!==currentSeason())qs.push('p='+periodParam());
  if(S.modeSet&&S.mode!==DEFAULT_MODE&&modesInData().length>=2)qs.push('m='+S.mode);   // only a mode the visitor chose; the automatic fallback leaves the address clean
  return qs.length?'?'+qs.join('&'):location.pathname;
}
function render(){
  var body;
  if(!S.loaded&&S.failed)body='<div class="n-head"><div class="t"><h1>Leaderboard</h1></div></div><p class="empty">Can\u2019t load the leaderboard right now.</p><div style="text-align:center"><button type="button" class="btn primary" data-refresh="1">Try again</button></div>';
  else if(!S.loaded)body='<div class="n-head"><div class="t"><h1>Leaderboard</h1></div></div><p class="empty">Loading\u2026</p>';
  else if(S.tab==='sessions'&&S.day)body=viewDay(S.day);
  else body=headHtml()+viewMain();
  var sheet=(S.menu&&!isWide()&&S.loaded)?menuSheet(S.menu):'';
  document.getElementById('app').innerHTML='<header class="brandbar"><div class="brandin"><a class="brandmark" href="index.html" aria-label="Tiles by Tiles leaderboard"><img src="'+LOGO+'" alt="" width="23" height="28"><span class="brandname">Tiles by Tiles</span></a><a class="backlink" href="masuk.html"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>Enter table code</a></div></header><div class="wrap n">'+body+'</div>'+sheet;
  // the page scroll is locked only while the sheet is open, and only unlocked by whoever locked it (the share card has its own lock)
  if(sheet&&!S.locked){document.body.style.overflow='hidden';S.locked=true;}else if(!sheet&&S.locked){document.body.style.overflow='';S.locked=false;}
  try{var nu=viewUrl();if(NAV&&nu!==location.pathname+location.search)history.pushState({v:1},'',nu);else history.replaceState(history.state,'',nu);}catch(e){}
  NAV=false;
}
function focusMenu(sel){setTimeout(function(){var el=sel?document.querySelector(sel):(document.querySelector('.n-menu [aria-selected="true"], .n-sheet [aria-selected="true"]')||document.querySelector('.n-menu .n-o, .n-sheet .n-o'));if(el&&el.focus)el.focus();},0);}
function closeMenu(){var w=S.menu;S.menu=null;S.cust.open=false;S.cust.err='';render();if(w){var b=document.querySelector('[data-menu="'+w+'"]');if(b&&b.focus)b.focus();}}
function toggleMenu(w){if(S.menu===w){closeMenu();return;}S.menu=w;S.cust.open=false;S.cust.err='';render();focusMenu();}
function pickOpt(v){
  var i=v.indexOf('|'),k=v.slice(0,i),val=v.slice(i+1);
  if(k==='period')S.period=val;
  else if(k==='mode'){S.mode=val;S.modeSet=true;}
  else if(k==='dmode')S.dmode=val;
  closeMenu();
}
function applyCustom(){
  var f=document.getElementById('cFrom'),t=document.getElementById('cTo'),a=f?f.value:'',b=t?t.value:'';
  S.from=a;S.to=b;
  if(!a||!b){S.cust.err='Pick a start and an end date.';render();focusMenu(a?'#cTo':'#cFrom');return;}
  if(a>b){S.cust.err='The start date is after the end date.';render();focusMenu('#cFrom');return;}
  S.period='custom';closeMenu();
}
document.getElementById('app').addEventListener('click',function(e){
  var t=e.target;
  if(t.closest&&t.closest('[data-close]')){closeMenu();return;}
  var b=t.closest?t.closest('button'):null;if(!b)return;
  if(b.dataset.menu){toggleMenu(b.dataset.menu);return;}
  if(b.dataset.opt){pickOpt(b.dataset.opt);return;}
  if(b.dataset.cust){S.cust.open=true;S.cust.err='';render();focusMenu('#cFrom');return;}
  if(b.dataset.apply){applyCustom();return;}
  if(b.dataset.set){var moved=(b.dataset.set==='tab'&&S.tab!==b.dataset.v);S[b.dataset.set]=b.dataset.v;if(b.dataset.set==='tab')S.day=null;NAV=moved;render();}
  else if(b.dataset.day){S.day=b.dataset.day;S.tab='sessions';S.dmode='all';NAV=true;render();window.scrollTo(0,0);}
  else if(b.dataset.back){if(history.state&&history.state.v)history.back();else{S.day=null;render();}}
  else if(b.dataset.share){if(window.openTop10Card&&S.card)window.openTop10Card(S.card);}
  else if(b.dataset.refresh){load();}
});
document.addEventListener('keydown',function(e){
  if(!S.menu)return;
  if(e.key==='Escape'){e.preventDefault();closeMenu();return;}
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    var os=[].slice.call(document.querySelectorAll('.n-menu .n-o, .n-sheet .n-o'));if(!os.length)return;
    e.preventDefault();var i=os.indexOf(document.activeElement);i=e.key==='ArrowDown'?(i+1)%os.length:(i-1+os.length)%os.length;os[i].focus();
  }
});
window.addEventListener('resize',function(){if(S.menu)render();});
function load(){
  return fetch('/api/overview').then(function(r){if(!r.ok)throw new Error('bad');return r.json();}).then(function(o){
    DATA=o;S.loaded=true;S.failed=false;S.updated=new Date();
    if(!S.autoDone){S.autoDone=true;autoMode();}
    if(!S.menu)render();   // an open menu stays as it is; the new numbers show when it closes
  }).catch(function(){S.failed=true;if(!S.loaded)render();});
}
window.addEventListener('popstate',function(){readUrl();autoMode();render();window.scrollTo(0,0);});
render();load();
setInterval(function(){if(!document.hidden)load();},30000);   // stays fresh on a venue screen
</script>

    cream:{label:'Cream',light:true,bg1:'#FAF7F2',bg2:'#EBE1CE',text:'#1B4332',muted:'rgba(27,67,50,.7)',line:'rgba(45,106,79,.4)',loss:RED,wm:.075,bloom:'rgba(255,255,255,.6)',vig:'rgba(110,80,30,.16)',grain:.09,sw:'linear-gradient(160deg,#FAF7F2,#EBE1CE)'}
  };
  // ranks 1 to 4: gold, silver, bronze, jade (the same colours as the board on the page)
  var MEDAL=[null,
    {a:'#F6DE9A',b:'#C9962B',ink:'#3A2804',edge:'#E5B84C'},
    {a:'#F1F4F8',b:'#8D97A6',ink:'#222A33',edge:'#C3CAD5'},
    {a:'#E9B98A',b:'#9C5E2B',ink:'#3A1F0A',edge:'#CF8A55'},
    {a:'#9BD9B6',b:'#2D6A4F',ink:'#0B2A1B',edge:'#5FB48A'}];
  var st={format:'story',theme:'forest'};
  var card=null,modal=null,canvas=null,ctx=null,logoImg=null,assets=null,W=1080,H=1920,NOISE=null;

  function $(id){return document.getElementById(id);}
  function rgba(hex,a){var n=parseInt(hex.slice(1),16);return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')';}
  function spacing(px){if(ctx&&'letterSpacing' in ctx)ctx.letterSpacing=px+'px';}
  function fit(text,maxW,weight,fam,start,min){
    var s=start;
    while(s>min){ctx.font=weight+' '+s+'px '+fam;if(ctx.measureText(text).width<=maxW)break;s-=2;}
    ctx.font=weight+' '+s+'px '+fam;
    return s;
  }
  function rr(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
  }
  function crown(cx,top,w,color){
    var s=w/100;
    ctx.save();
    ctx.translate(cx-w/2,top);ctx.scale(s,s);
    ctx.fillStyle=color;ctx.strokeStyle=color;ctx.lineJoin='round';ctx.lineWidth=6;
    ctx.beginPath();
    ctx.moveTo(8,48);ctx.lineTo(4,20);ctx.lineTo(28,38);ctx.lineTo(50,8);
    ctx.lineTo(72,38);ctx.lineTo(96,20);ctx.lineTo(92,48);ctx.closePath();
    ctx.fill();ctx.stroke();
    [[4,18],[50,5],[96,18]].forEach(function(p){ctx.beginPath();ctx.arc(p[0],p[1],6,0,Math.PI*2);ctx.fill();});
    rr(8,55,84,11,4);ctx.fill();
    ctx.restore();
  }
  // KaiTi, semibold: regular weight plus a fine same-colour stroke, so the look holds on every device
  function kai(glyph,x,y,size,color,align,base){
    ctx.save();
    ctx.font='400 '+size+'px '+KAI;
    ctx.textAlign=align||'left';ctx.textBaseline=base||'alphabetic';
    ctx.fillStyle=color;ctx.strokeStyle=color;ctx.lineWidth=size*0.03;ctx.lineJoin='round';
    spacing(0);
    ctx.strokeText(glyph,x,y);ctx.fillText(glyph,x,y);
    ctx.restore();
  }
  function hline(x1,x2,y,color,w,alpha){
    ctx.save();ctx.globalAlpha=alpha==null?1:alpha;ctx.strokeStyle=color;ctx.lineWidth=w;
    ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x2,y);ctx.stroke();ctx.restore();
  }
  function noisePattern(){
    if(NOISE)return NOISE;
    var c=document.createElement('canvas');c.width=c.height=256;
    var x=c.getContext('2d'),d=x.createImageData(256,256),s=12345;
    for(var i=0;i<d.data.length;i+=4){
      s=(s*1664525+1013904223)>>>0;
      var v=s>>>24;
      d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;
    }
    x.putImageData(d,0,0);
    NOISE=ctx.createPattern(c,'repeat');
    return NOISE;
  }
  function background(t){
    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,t.bg1);g.addColorStop(1,t.bg2);
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    var b=ctx.createRadialGradient(W/2,120,0,W/2,120,1000);
    b.addColorStop(0,t.bloom);b.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=b;ctx.fillRect(0,0,W,H);
    var v=ctx.createRadialGradient(W/2,H*0.46,H*0.28,W/2,H*0.46,H*0.82);
    v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,t.vig);
    ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
    // all four winds, huge and barely there, bleeding off the corners: the backdrop of the whole-game scoreboard
    var wc=document.createElement('canvas');wc.width=W;wc.height=H;
    var sv=ctx;ctx=wc.getContext('2d');
    var px=[.84,.84,.16,.16],py=[.78,.22,.22,.78];
    WINDS.forEach(function(w,i){kai(w,W*px[i],H*py[i],860*(H/1920),t.text,'center','middle');});
    ctx=sv;
    ctx.save();ctx.globalAlpha=t.wm;ctx.drawImage(wc,0,0);ctx.restore();
    ctx.save();ctx.globalCompositeOperation='overlay';ctx.globalAlpha=t.grain;
    ctx.fillStyle=noisePattern();ctx.fillRect(0,0,W,H);
    ctx.restore();
  }

  function draw(){
    if(!card||!canvas)return;
    var fm=FORMATS[st.format]||FORMATS.story;
    W=fm.W;H=fm.H;
    if(canvas.width!==W)canvas.width=W;
    if(canvas.height!==H)canvas.height=H;
    ctx=canvas.getContext('2d');
    var t=THEMES[st.theme]||THEMES.forest;
    var isStory=st.format==='story';
    var rows=card.rows.slice(0,10),n=rows.length,mx=90,x1=W-mx,cx=W/2;
    background(t);
    ctx.textBaseline='alphabetic';ctx.textAlign='left';spacing(0);

    // the same frame as the scoreboard card: header pinned to the top safe zone, footer to the bottom
    var TOP=isStory?256:64,tH=isStory?176:122,headerGap=isStory?38:26;
    var footLh=isStory?72:48,FOOT_TOP=isStory?1500:H-(footLh+58+56);   // a slimmer header and footer give the ten rows room to breathe
    var tW=tH*LOGO_ASPECT;
    if(logoImg)ctx.drawImage(logoImg,mx,TOP,tW,tH);
    var tx=mx+tW+(isStory?44:34),tmax=W-mx-tx;
    var title=card.title||'Top 10',sub=card.sub||'',sub2=card.sub2||'';
    if(isStory){
      var b1=TOP+60,b2=TOP+114,b3=TOP+160;
      fit(title,tmax,900,PLAY,66,34);
      ctx.fillStyle=t.text;ctx.fillText(title,tx,b1);
      var ly=b2;
      if(sub){fit(sub,tmax,400,PLAY,30,20);ctx.fillStyle=t.muted;ctx.fillText(sub,tx,b2);ly=b3;}
      if(sub2){fit(sub2,tmax,400,PLAY,30,20);ctx.fillStyle=sub?t.text:t.muted;ctx.fillText(sub2,tx,ly);}
    }else{
      var ts=fit(title,tmax,900,PLAY,60,26);
      var lh2=ts+30,by2=TOP+tH/2-lh2/2+ts*0.78;
      ctx.fillStyle=t.text;ctx.fillText(title,tx,by2);
      var line2=[sub,sub2].filter(Boolean).join('   \u00b7   ');
      if(line2){fit(line2,tmax,400,PLAY,34,18);ctx.fillStyle=t.muted;ctx.fillText(line2,tx,by2+lh2*0.62);}
    }

    // the ranking: a fixed row height so the card always has the same rhythm, centred when fewer than ten
    var zoneTop=TOP+tH+headerGap,zoneBottom=FOOT_TOP-(isStory?30:24);
    hline(mx,x1,zoneTop-14,t.text,2.5,.95);
    var rowH=Math.min(100,Math.floor((zoneBottom-zoneTop-12)/10));
    var by=zoneTop+6+Math.max(0,((zoneBottom-zoneTop-12)-rowH*n)/2);
    var pal=t.light?['#B8912E','#8A94A3','#A8703E','#2D6A4F']:['#E5C36B','#C7CFDA','#D79B68','#7CCBA0'];
    rows.forEach(function(r,i){
      var y=by+i*rowH,cy=y+rowH/2,offN=Math.round(rowH*0.155),offM=Math.round(rowH*0.225),top4=r.rank<=4,col=top4?pal[r.rank-1]:null,bx=mx+34,br=25;
      // the same hairline between every row
      if(i>0)hline(mx,x1,y,t.text,2,.14);
      if(top4){
        // a slim bar and a faint tint in the medal colour: marks the place without boxing the row
        var gt=ctx.createLinearGradient(mx-16,0,x1+16,0);
        gt.addColorStop(0,rgba(col,t.light?.17:.14));gt.addColorStop(.75,rgba(col,0));
        ctx.fillStyle=gt;ctx.fillRect(mx-16,y+2,(x1-mx)+32,rowH-4);
        ctx.fillStyle=col;rr(mx-16,y+13,5,rowH-26,2.5);ctx.fill();
      }
      // rank ring, filled for first place
      ctx.beginPath();ctx.arc(bx,cy,br,0,Math.PI*2);
      if(top4){if(r.rank===1){ctx.fillStyle=col;ctx.fill();}ctx.lineWidth=3;ctx.strokeStyle=col;ctx.stroke();}
      else{ctx.lineWidth=2.5;ctx.strokeStyle=t.line;ctx.stroke();}
      ctx.textAlign='center';ctx.textBaseline='middle';spacing(0);
      ctx.font='700 '+(r.rank>=10?24:28)+'px '+INTER;
      ctx.fillStyle=r.rank===1?'#2B2108':(top4?t.text:t.muted);
      ctx.fillText(String(r.rank),bx,cy+1);
      // net score at the right, name and games to its left, a small crown after the champion's name
      var nx=bx+br+32;
      ctx.textAlign='right';ctx.textBaseline='middle';
      ctx.font='700 40px '+INTER;
      var sw=ctx.measureText(r.text).width;
      ctx.fillStyle=r.neg?t.loss:t.text;ctx.fillText(r.text,x1-8,cy);
      var maxW=(x1-8-sw)-nx-36-(r.rank===1?44:0);
      var meta=r.meta||(r.games+(r.games===1?' game':' games')+' \u00b7 '+r.firsts+(r.firsts===1?' first place':' first places'));
      ctx.textAlign='left';
      fit(r.name,maxW,700,INTER,34,20);
      var nw=ctx.measureText(r.name).width;
      ctx.fillStyle=t.text;ctx.fillText(r.name,nx,cy-offN);
      if(r.rank===1)crown(nx+nw+24,cy-offN-10,30,col);
      fit(meta,maxW,400,INTER,22,15);
      ctx.fillStyle=t.muted;ctx.fillText(meta,nx,cy+offM);
    });

    // footer, as on the scoreboard card
    if(isStory){
      if(logoImg)ctx.drawImage(logoImg,cx-72*LOGO_ASPECT/2,FOOT_TOP,72*LOGO_ASPECT,72);
      ctx.textAlign='center';ctx.textBaseline='middle';
      if(HANDLE){ctx.font='400 32px '+INTER;spacing(2);ctx.fillStyle=t.text;ctx.fillText(HANDLE,cx,FOOT_TOP+72+38);spacing(0);}
      if(TAGLINE){fit(TAGLINE,W-2*mx,400,INTER,30,20);ctx.fillStyle=t.muted;ctx.fillText(TAGLINE,cx,FOOT_TOP+72+80);}
    }else{
      ctx.font='400 34px '+INTER;spacing(2);
      var fw=HANDLE?ctx.measureText(HANDLE).width:0,gapL=HANDLE?16:0,lw=footLh*LOGO_ASPECT,rowW=lw+gapL+fw,x0=cx-rowW/2;
      if(logoImg)ctx.drawImage(logoImg,x0,FOOT_TOP,lw,footLh);
      if(HANDLE){ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillStyle=t.text;ctx.fillText(HANDLE,x0+lw+gapL,FOOT_TOP+footLh/2);}
      spacing(0);
      if(TAGLINE){ctx.textAlign='center';ctx.textBaseline='middle';fit(TAGLINE,W-2*mx,400,INTER,28,18);ctx.fillStyle=t.muted;ctx.fillText(TAGLINE,cx,FOOT_TOP+footLh+30);}
    }
  }

  /* ---------- loading what the card needs: the fonts and the logo ---------- */
  function loadAssets(){
    if(assets)return assets;
    var fonts=(document.fonts&&document.fonts.load)?Promise.all([
      document.fonts.load('900 76px "Playfair Display"'),document.fonts.load('700 40px "Playfair Display"'),document.fonts.load('400 34px "Playfair Display"'),
      document.fonts.load('400 34px "Inter Tight"'),document.fonts.load('700 34px "Inter Tight"'),
      document.fonts.load('400 48px "TBT Hanzi"',WINDS.join(''))
    ]).catch(function(){}):Promise.resolve();
    var logo=new Promise(function(res){
      var im=new Image(),done=false;
      function fin(v){if(!done){done=true;res(v);}}
      im.onload=function(){fin(im);};im.onerror=function(){fin(null);};
      setTimeout(function(){fin(im.complete&&im.naturalWidth?im:null);},2500);
      im.src=LOGO;
    });
    assets=Promise.all([fonts,logo]).then(function(r){logoImg=r[1];});
    return assets;
  }

  /* ---------- the window ---------- */
  function status(msg){var el=$('t10Status');if(el)el.textContent=msg||'';}
  function toBlob(){return new Promise(function(res){try{canvas.toBlob(function(b){res(b);},'image/png');}catch(e){res(null);}});}
  function isIOS(){return /iP(hone|ad|od)/.test(navigator.userAgent||'')||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);}
  // Save goes straight to the phone: a download on Android and desktop, the share sheet on iPhone and iPad
  // (that is where "Save Image" puts it in Photos), a new tab only when the browser blocks the download.
  async function save(){
    status('');
    var blob=await toBlob();
    if(!blob){status('Could not create the image. Try again.');return;}
    var file=null;
    try{file=new File([blob],'top10.png',{type:'image/png'});}catch(e){file=null;}
    if(isIOS()&&file&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file]});return;}
      catch(err){if(err&&err.name==='AbortError')return;}
    }
    var url=URL.createObjectURL(blob);
    try{
      var a=document.createElement('a');
      a.href=url;a.download='top10.png';
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      setTimeout(function(){URL.revokeObjectURL(url);},4000);
      status('Saved. Check your gallery or Downloads.');
    }catch(err){
      var opened=null;
      try{opened=window.open(url,'_blank');}catch(e){opened=null;}
      if(opened){status('Opened the image in a new tab. Press and hold it, then choose Save or Download image.');setTimeout(function(){URL.revokeObjectURL(url);},60000);}
      else{status('Could not save the image here. Try the Share button instead.');URL.revokeObjectURL(url);}
    }
  }
  async function share(){
    status('');
    try{
      var blob=await toBlob();
      if(!blob){status('Could not create the image. Try again.');return;}
      var file=new File([blob],'top10.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file]});
      else status('Sharing is not available here. Use Save image instead.');
    }catch(err){
      if(err&&err.name==='AbortError')return;
      status('Sharing is not available here. Use Save image instead.');
    }
  }
  function syncControls(){
    Array.prototype.forEach.call(document.querySelectorAll('#t10Fmt button'),function(b){b.setAttribute('aria-pressed',b.dataset.f===st.format?'true':'false');});
    Array.prototype.forEach.call(document.querySelectorAll('#t10Themes button'),function(b){b.setAttribute('aria-pressed',b.dataset.t===st.theme?'true':'false');});
  }
  function close(){if(modal){modal.hidden=true;document.body.style.overflow='';}}
  function build(){
    if(modal)return;
    modal=document.createElement('div');modal.id='t10Modal';modal.hidden=true;
    modal.innerHTML='<div class="t10box" role="dialog" aria-label="Share top 10"><div class="t10head"><h3>Share top 10</h3><button type="button" class="t10x" id="t10Close" aria-label="Close">&times;</button></div>'
      +'<div class="t10prev"><canvas id="t10Canvas"></canvas></div>'
      +'<div class="t10row">Format</div><div class="chips" id="t10Fmt"></div>'
      +'<div class="t10row">Style</div><div class="t10sw" id="t10Themes"></div>'
      +'<div class="t10acts"><button type="button" class="pri" id="t10Save">Save image</button><button type="button" id="t10Share" hidden>Share</button></div><div class="t10st" id="t10Status"></div></div>';
    document.body.appendChild(modal);
    canvas=$('t10Canvas');
    $('t10Fmt').innerHTML=Object.keys(FORMATS).map(function(k){return '<button type="button" data-f="'+k+'" aria-pressed="false">'+FORMATS[k].label+'</button>';}).join('');
    $('t10Themes').innerHTML=Object.keys(THEMES).map(function(k){return '<button type="button" data-t="'+k+'" aria-pressed="false" aria-label="'+THEMES[k].label+'" title="'+THEMES[k].label+'" style="background:'+THEMES[k].sw+'"></button>';}).join('');
    $('t10Fmt').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;st.format=b.dataset.f;syncControls();draw();});
    $('t10Themes').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;st.theme=b.dataset.t;syncControls();draw();});
    $('t10Close').addEventListener('click',close);
    modal.addEventListener('click',function(e){if(e.target===modal)close();});
    document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!modal.hidden)close();});
    $('t10Save').addEventListener('click',save);
    $('t10Share').addEventListener('click',share);
    try{var probe=new File([new Blob(['x'],{type:'image/png'})],'p.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[probe]}))$('t10Share').hidden=false;}catch(e){}
  }
  window.openTop10Card=function(c){
    card=c;build();status('');syncControls();
    modal.hidden=false;modal.scrollTop=0;document.body.style.overflow='hidden';
    loadAssets().then(draw);
  };
})();
</script>
</body>
