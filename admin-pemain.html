@font-face{font-family:"Playfair Display";font-style:normal;font-weight:400;font-display:swap;src:url(/assets/f/8a53e5ecdb.woff2) format("woff2");}
@font-face{font-family:"Playfair Display";font-style:normal;font-weight:700;font-display:swap;src:url(/assets/f/9401d0214a.woff2) format("woff2");}

<style>
:root{
  --bg:#FAF7F2; --surface:#FFFFFF; --text:#1B4332; --muted:#587263; --line:#E4DDCD;
  --field:#FBF9F4; --accent:#2D6A4F; --onaccent:#FAF7F2; --focus:#2D6A4F; --red:#B72323;
  --sans:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F2A20; --surface:#16382B; --text:#FAF7F2; --muted:#9DB8A9; --line:#26493B;
    --field:#12302A; --accent:#8FD0AE; --onaccent:#0F2A20; --focus:#8FD0AE; --red:#EA8888;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;color:var(--text);font-weight:700}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
.topbar{border-bottom:1px solid var(--line);padding:14px 0}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tb{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.06em;color:var(--accent)}
.tb img{width:26px;height:auto}
.lnk{background:none;border:0;color:var(--muted);font-size:13px;padding:4px 6px}
.lnk:hover{color:var(--red)}
main{padding:22px 0 70px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-bottom:6px}
.field input{font:inherit;font-size:16px;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.field input:focus-visible,button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.frow{display:flex;gap:12px;flex-wrap:wrap}
.frow .field{flex:1;min-width:130px}
.btn{display:inline-block;border-radius:999px;padding:9px 18px;border:1px solid var(--line);background:transparent;font-weight:500;text-decoration:none;color:var(--text);font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:700}
.btn.sm{padding:6px 12px;font-size:13px}
.dayrow{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;gap:10px}
.dayrow:hover strong{color:var(--accent)}
.meta{font-size:13px;color:var(--muted);margin-top:2px}
.tcard{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:var(--field)}
.th{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}
.cr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.cl{width:64px;font-size:13px;color:var(--muted)}
.code{font-family:var(--display);font-weight:900;font-size:20px;letter-spacing:.06em;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px 10px}
.login{max-width:300px;margin:90px auto;text-align:center}
.login img{width:48px;margin-bottom:12px}
.login input{font:inherit;font-size:16px;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--text);margin:14px 0;text-align:center}
.err{color:var(--red);font-size:13px;margin:6px 0}
.mb{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--accent);color:var(--onaccent);padding:10px 18px;border-radius:999px;font-size:14px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

.prow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.prow:first-child{border-top:0}
.pname{font-weight:700}
.tag{display:inline-block;font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.sug,.dsug{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--field)}
.sug .pair,.dsug .pair{font-weight:700}
.sug .acts,.dsug .acts{margin-top:8px}
.search{font:inherit;font-size:16px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--text);margin-bottom:6px}
.mergebox{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px;margin:0 0 8px;border:1px dashed var(--line);border-radius:12px}
.mergebox select{font:inherit;font-size:15px;flex:1;min-width:160px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--text)}
.note{font-size:13px;color:var(--muted);margin:4px 0 12px;line-height:1.5}

.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;margin:10px 0;border:1px dashed var(--line);border-radius:12px}
.form .full{grid-column:1/-1}
.form label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.form input{font:inherit;font-size:16px;width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--text)}
.form .addname{display:flex;gap:8px;margin-top:6px}
.prow a,.meta a{color:var(--accent)}
@media (max-width:520px){.form{grid-template-columns:1fr}}

.pickbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 8px}
.pk{width:20px;height:20px;margin:0 10px 0 0;vertical-align:middle;accent-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}

.split{margin:6px 0 10px;padding:12px;border:1px dashed var(--line);border-radius:12px}
.seatrow{padding:10px 0;border-top:1px solid var(--line)}
.seatrow:first-of-type{border-top:0;padding-top:0}
.seatrow select{width:100%;font:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--text)}
.ckrow{display:flex;gap:8px;align-items:center;font-size:14px}
.ckrow input{width:18px;height:18px;accent-color:var(--accent)}

/* navigation: the same bar on every admin page, with the current page marked */
.tbrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tbrow .lnk{padding:10px 6px;min-height:40px}
.anav{display:flex;gap:8px;margin-top:10px}
.anav a{flex:1;display:flex;align-items:center;justify-content:center;min-height:40px;border-radius:999px;border:1px solid var(--line);text-decoration:none;color:var(--text);font-size:14px;font-weight:500;white-space:nowrap}
.anav a[aria-current="page"]{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:700}
.btn.sm{padding:8px 14px;min-height:36px;display:inline-flex;align-items:center;justify-content:center}
.back{display:inline-flex;align-items:center;min-height:38px}
.topbar .wrap{display:block}
main .lnk,main .back{display:inline-flex;align-items:center;min-height:38px;padding:8px}
main .meta .lnk{padding:8px 6px!important}
main .meta a{display:inline-flex;align-items:center;min-height:38px}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
var LOGO='/assets/i/cfad30e8e7.png';
var password=sessionStorage.getItem('tbt-admin-pw')||'';
var authed=false,data=null,loginError='',q='',form=null,linkFor=null,picked={},splitFor=null;

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function H(){return {'Authorization':'Bearer '+password,'Content-Type':'application/json'};}
function fmtDate(d){if(!d)return '-';try{return new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});}catch(e){return d;}}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('show');},1800);}
function val(id){var el=document.getElementById(id);return el?el.value:'';}
function req(id){var r=data.signup&&data.signup.requests||[];for(var i=0;i<r.length;i++)if(r[i].id===id)return r[i];return null;}
function reg(id){for(var i=0;i<data.registered.length;i++)if(data.registered[i].id===id)return data.registered[i];return null;}
function guest(key){for(var i=0;i<data.guests.length;i++)if(data.guests[i].key===key)return data.guests[i];return null;}

function load(){
  return fetch('/api/admin/players',{headers:H()}).then(function(r){
    if(r.status===401){authed=false;sessionStorage.removeItem('tbt-admin-pw');throw new Error('auth');}
    if(!r.ok)throw new Error('server');
    return r.json();
  }).then(function(d){data=d;authed=true;if(!pageChecked){pageChecked=true;checkPages();}});
}
// Once per visit: can the server open the page of a registered player? If not, say why, so a missing file is not a mystery.
var pageChecked=false,pageCheck=null;
function checkPages(){
  var p=(data.registered||[]).filter(function(x){return !x.hidden;})[0];
  if(!p)return;
  fetch('/api/player/'+encodeURIComponent(p.id),{cache:'no-store'}).then(function(r){
    if(r.status===200)return;
    return r.text().then(function(tx){var j=null;try{j=JSON.parse(tx);}catch(e){}pageCheck={status:r.status,own:!!(j&&j.error)};render();});
  }).catch(function(){});
}
function post(body){
  return fetch('/api/admin/players',{method:'POST',headers:H(),body:JSON.stringify(body)}).then(function(r){
    return r.json().catch(function(){return {};}).then(function(j){return {ok:r.ok,status:r.status,body:j};});
  });
}
function reload(){return load().then(render).catch(function(){render();});}
function act(body,okMsg,onOk){
  return post(body).then(function(r){
    if(!r.ok){alert(r.body&&r.body.message||r.body&&r.body.error||'Gagal. Coba lagi.');return null;}
    if(onOk)onOk(r.body);
    toast(okMsg||'Tersimpan');return reload();
  }).catch(function(){alert('Tidak ada koneksi. Coba lagi.');});
}
function needSetup(){if(!data.ready){alert('Aktifkan registry pemain dulu.');return true;}return false;}

function viewSetup(){
  if(!data.ready)return '<div class="card"><h3 style="margin-bottom:6px">Registry pemain belum aktif</h3><p class="note">Registry adalah daftar pemain resmi yang diisi admin: nama lengkap, nama panggilan (yang tampil di leaderboard), WhatsApp, dan Instagram. Nama yang tidak terdaftar menjadi guest dan tidak masuk leaderboard. Daftar nama di bawah sudah bisa dipakai untuk memeriksa nama. Aktifkan satu kali, aman kalau terpencet lagi.</p><button class="btn primary" data-a="setup">Aktifkan registry pemain</button></div>';
  var h='<div class="card"><h3 style="margin-bottom:6px">Registry pemain</h3>'+(data.seatsReady?'':'<p class="note" style="margin-top:0">Fitur pisah per game belum aktif di registry ini. <button class="btn sm" data-a="setup">Perbarui registry</button></p>')+(data.pageReady===false?'<p class="note" style="margin-top:0">Halaman pemain belum aktif di registry ini: database perlu satu pembaruan kecil. <button class="btn sm" data-a="setup">Perbarui registry</button></p>':'')+(pageCheck?'<p class="note" style="margin-top:0;color:var(--red)">Halaman pemain belum bisa dibuka dari server (kode '+pageCheck.status+(pageCheck.own?', server tidak mengenali pemain ini':', jawabannya bukan dari layanan halaman pemain')+'). '+(pageCheck.own?'Hubungi pembuat situs dengan kode ini.':'Pastikan file functions/api/player/[id].js ikut terunggah ke GitHub, lalu tunggu deploy selesai.')+'</p>':'')+'<p class="note" style="margin-bottom:8px">'+data.registered.length+' pemain terdaftar &middot; '+data.guests.length+' guest &middot; '+data.played+' meja yang sudah dimainkan.</p>';
  h+=data.ruleOn
    ?'<p class="note" style="margin-top:0">Hanya pemain terdaftar yang masuk leaderboard. Guest tetap tampil di meja dan sesinya, dan nama ganda (memuat "/", "&amp;", "+" atau "dan") juga guest.</p>'
    :'<p class="note" style="margin-top:0">Aturan guest belum berlaku karena belum ada pemain terdaftar, jadi semua nama masih dihitung di leaderboard. Begitu ada satu pemain terdaftar, hanya pemain terdaftar yang masuk leaderboard. Centang nama yang mau didaftarkan di daftar guest di bawah. Yang tidak dicentang tetap guest.</p>';
  h+='<div class="acts"><button class="btn" data-a="newplayer">Tambah pemain baru</button></div>';
  if(form&&form.mode==='new')h+=viewForm();
  return h+'</div>';
}
function viewForm(){
  var f=form,isEdit=f.mode==='edit',isReq=f.mode==='request',p=isEdit?reg(f.id):null,rq=isReq?req(f.id):null;
  if((isEdit&&!p)||(isReq&&!rq)){form=null;return '';}
  var v=isReq?{nick:rq.nickname,full:rq.fullName,wa:rq.whatsapp,ig:rq.instagram}:{nick:isEdit?p.nickname:(f.name||''),full:isEdit?p.fullName:'',wa:isEdit?p.whatsapp:'',ig:isEdit?p.instagram:''};
  var h='<div class="form">'+(isReq?'<div class="full note" style="margin:0">'+(rq.tableName?'Mengaku sebagai guest &quot;'+esc(rq.tableName)+'&quot;'+(rq.claim?' ('+rq.claim.games+' game, terakhir '+fmtDate(rq.claim.last)+').':'.'):'Tidak memilih nama dari daftar guest.')+' Periksa datanya, lalu setujui.</div>':'')+'<div><label for="fNick">Nama panggilan (tampil di leaderboard) *</label><input id="fNick" maxlength="30" autocomplete="off" value="'+esc(v.nick)+'"></div>'
    +'<div><label for="fFull">Nama lengkap</label><input id="fFull" maxlength="60" autocomplete="off" value="'+esc(v.full)+'"></div>'
    +'<div><label for="fWa">Nomor WhatsApp</label><input id="fWa" inputmode="tel" placeholder="0812..." autocomplete="off" value="'+esc(v.wa)+'"></div>'
    +'<div><label for="fIg">Username Instagram</label><input id="fIg" placeholder="username" autocomplete="off" value="'+esc(v.ig)+'"></div>';
  if(isEdit){
    h+='<div class="full"><label>Ejaan yang dikenali di meja</label>';
    p.names.forEach(function(k){h+='<span class="tag" style="margin:0 6px 4px 0">'+esc(k)+(k===p.nickname.toLowerCase().replace(/\s+/g,' ')?'':' <button class="lnk" data-a="rmname" data-id="'+esc(p.id)+'" data-v="'+esc(k)+'">hapus</button>')+'</span>';});
    h+='<div class="addname"><input id="fAlias" placeholder="Tambah ejaan lain, misalnya salah ketik" autocomplete="off"><button class="btn sm" data-a="addname" data-id="'+esc(p.id)+'">Tambah</button></div></div>';
  }
  if(isReq&&rq.tableName)h+='<div class="full"><label class="ckrow"><input type="checkbox" id="fLink"'+(rq.claimTakenBy?'':' checked')+'> Tautkan nama &quot;'+esc(rq.tableName)+'&quot; ke pemain ini</label>'+(rq.claimTakenBy?'<div class="meta" style="margin:4px 0 0">Nama ini sudah dipakai '+esc(rq.claimTakenBy)+'. Setujui tanpa menautkan, lalu atur game-nya satu per satu lewat &quot;Pisah per game&quot;.</div>':'')+'</div>';
  h+='<div class="full note" style="margin:0">WhatsApp dan Instagram hanya terlihat oleh admin, tidak pernah tampil di halaman publik.</div>';
  h+='<div class="full acts"><button class="btn primary" data-a="save">'+(isReq?'Setujui dan daftarkan':'Simpan')+'</button><button class="btn" data-a="cancelform">Batal</button></div></div>';
  return h;
}
function matches(needle,parts){if(!needle)return true;return parts.some(function(s){return String(s||'').toLowerCase().indexOf(needle)>=0;});}
function viewSignup(){
  if(!data.ready)return '';
  var sg=data.signup;
  if(!sg||!sg.ready)return '<div class="card"><h3 style="margin-bottom:6px">Pendaftaran lewat link</h3><p class="note">Pemain bisa mendaftar sendiri lewat satu link yang kamu bagikan. Pendaftaran masuk ke daftar tunggu dan baru jadi pemain setelah kamu setujui.</p><button class="btn primary" data-a="setup">Aktifkan pendaftaran lewat link</button></div>';
  var link=sg.token?location.origin+'/daftar.html?t='+sg.token:'';
  var h='<div class="card"><h3 style="margin-bottom:6px">Pendaftaran lewat link'+(sg.token?'<span class="tag">'+(sg.enabled?'aktif':'dimatikan')+'</span>':'')+'</h3>';
  if(!sg.token)h+='<p class="note">Buat satu link, lalu bagikan ke pemain (misalnya di grup WhatsApp). Pendaftaran masuk ke daftar tunggu dan baru jadi pemain setelah kamu setujui.</p><button class="btn primary" data-a="sgenable">Buat link pendaftaran</button>';
  else h+='<input class="search" id="sgLink" readonly value="'+esc(link)+'"><div class="acts"><button class="btn sm primary" data-a="sgcopy">Salin link</button>'+(sg.enabled?'<button class="btn sm" data-a="sgdisable">Matikan link</button>':'<button class="btn sm" data-a="sgenable">Aktifkan lagi</button>')+'<button class="btn sm" data-a="sgreset">Buat link baru</button></div><p class="note" style="margin-top:10px">Siapa pun yang punya link bisa mengirim pendaftaran, tapi tidak ada yang tampil di leaderboard sebelum kamu setujui. Kalau link bocor, buat link baru: link lama langsung tidak berlaku.</p>';
  h+='</div>';
  var rs=sg.requests||[];
  if(sg.token||rs.length){
    h+='<div class="card"><h3 style="margin-bottom:10px">Menunggu persetujuan ('+rs.length+')</h3>';
    if(!rs.length)h+='<div class="empty">Belum ada pendaftaran baru.</div>';
    rs.forEach(function(x){
      var contact=['WhatsApp <a href="https://wa.me/'+esc(x.whatsapp)+'" target="_blank" rel="noopener">'+esc(x.whatsapp)+'</a>'];
      if(x.instagram)contact.push('Instagram <a href="https://instagram.com/'+esc(x.instagram)+'" target="_blank" rel="noopener">@'+esc(x.instagram)+'</a>');
      var info=x.tableName?'Mengaku sebagai guest &quot;'+esc(x.tableName)+'&quot;'+(x.claim?' ('+x.claim.games+' game, terakhir '+fmtDate(x.claim.last)+')':' (belum ada game dengan nama itu)'):'Tidak memilih nama dari daftar guest';
      var warn=(x.claimTakenBy?'<div class="meta" style="color:var(--red)">Nama &quot;'+esc(x.tableName)+'&quot; sudah terdaftar atas nama '+esc(x.claimTakenBy)+', jadi tidak bisa disetujui. Cek dulu orangnya.</div>':'')+(x.nicknameTakenBy?'<div class="meta" style="color:var(--red)">Nama panggilan ini sudah dipakai '+esc(x.nicknameTakenBy)+'. Ubah dulu saat menyetujui.</div>':'');
      h+='<div class="prow"><div style="min-width:0"><span class="pname">'+esc(x.nickname)+'</span><div class="meta">'+(x.fullName?esc(x.fullName)+' &middot; ':'')+contact.join(' &middot; ')+'</div><div class="meta">'+info+'</div>'+warn+'</div><div class="acts"><button class="btn sm primary" data-a="rqopen" data-id="'+esc(x.id)+'">Tinjau dan setujui</button><button class="btn sm" data-a="rqreject" data-id="'+esc(x.id)+'">Tolak</button></div></div>';
      if(form&&form.mode==='request'&&form.id===x.id)h+=viewForm();
    });
    h+='</div>';
  }
  return h;
}
function seatPanel(seats){
  var opts=data.registered.map(function(p){return [p.id,p.nickname];});
  var h='<div class="split"><p class="note" style="margin:0 0 10px">'+(seats.length===1?'Game ini tertaut karena namanya. Kalau yang main orang lain, pilih Guest atau pemain yang benar. &quot;Ikuti nama&quot; mengembalikannya ke tautan awal. Game aslinya tidak diubah.':'Pilih siapa yang main di tiap game. &quot;Ikuti nama&quot; berarti mengikuti nama yang tertulis di meja. Game aslinya tidak diubah.')+'</p>';
  seats.forEach(function(s){
    var sel='<option value=""'+(s.override===''?' selected':'')+'>Ikuti nama</option><option value="guest"'+(s.override==='guest'?' selected':'')+'>Guest (tidak dihitung)</option>'+opts.map(function(o){return '<option value="'+esc(o[0])+'"'+(s.override===o[0]?' selected':'')+'>'+esc(o[1])+'</option>';}).join('');
    h+='<div class="seatrow"><div class="meta" style="margin:0 0 6px"><b>'+esc(s.session||'-')+'</b> &middot; '+esc(s.table)+' &middot; '+fmtDate(s.date)+' &middot; hasil '+(s.net>0?'+':'')+s.net+'<br>Main bareng: '+(s.with.length?s.with.map(esc).join(', '):'-')+'<br>Ditulis sebagai &quot;'+esc(s.typed)+'&quot; &middot; sekarang dihitung untuk: <b>'+(s.owner?esc(s.owner):'guest')+'</b></div><select data-a="seatsel" data-t="'+esc(s.tableId)+'" data-s="'+s.seat+'">'+sel+'</select></div>';
  });
  return h+'</div>';
}
function viewGuests(){
  var needle=q.trim().toLowerCase();
  var list=data.guests.filter(function(g){return matches(needle,[g.name,g.key]);});
  if(!data.guests.length)return '<div class="empty">Tidak ada guest. Semua nama sudah terdaftar.</div>';
  if(!list.length)return '<div class="empty">Tidak ada guest yang cocok.</div>';
  return list.map(function(g){
    var hasSeats=g.seats&&g.seats.length;
    var sims=g.similar.map(function(s){return '<div class="meta">Mirip &quot;'+esc(s.nickname)+'&quot; ('+esc(s.reason)+') <button class="lnk" data-a="simlink" data-id="'+esc(s.id)+'" data-name="'+esc(g.name)+'">tautkan ke '+esc(s.nickname)+'</button></div>';}).join('');
    var tags='<span class="tag">guest</span>'+(g.two?'<span class="tag">dua nama?</span>':'')+(g.mapped?'<span class="tag">diatur per game</span>':'');
    var btns=(g.mapped?'':'<button class="btn sm primary" data-a="reg" data-k="'+esc(g.key)+'">Daftarkan</button><button class="btn sm" data-a="linkopen" data-k="'+esc(g.key)+'">Tautkan ke...</button>')+(hasSeats?'<button class="btn sm" data-a="splitopen" data-k="'+esc(g.key)+'">Pisah per game</button>':'');
    var row='<div class="prow"><div style="min-width:0">'+((g.two||g.mapped)?'':'<input type="checkbox" class="pk" data-a="pick" data-k="'+esc(g.key)+'" aria-label="Pilih '+esc(g.name)+'"'+(picked[g.key]?' checked':'')+'>')+'<span class="pname">'+esc(g.name)+'</span>'+tags
      +'<div class="meta">'+g.games+' game &middot; terakhir '+fmtDate(g.last)+(g.two?' &middot; nama ganda, tetap guest':'')+(g.mapped?' &middot; namanya terdaftar, tapi game ini diatur manual':'')+'</div>'+sims+'</div>'
      +'<div class="acts">'+btns+'</div></div>';
    if(form&&form.mode==='register'&&form.key===g.key)row+=viewForm();
    if(splitFor&&splitFor.kind==='guest'&&splitFor.key===g.key&&hasSeats)row+=seatPanel(g.seats);
    if(linkFor===g.key){
      var opts=data.registered.map(function(p){return '<option value="'+esc(p.id)+'">'+esc(p.nickname)+'</option>';}).join('');
      row+=data.registered.length?'<div class="mergebox"><span class="meta" style="margin:0">&quot;'+esc(g.name)+'&quot; adalah ejaan lain dari:</span><select id="lt">'+opts+'</select><button class="btn sm primary" data-a="linkgo" data-k="'+esc(g.key)+'">Tautkan</button><button class="btn sm" data-a="linkcancel">Batal</button></div>':'<div class="note">Belum ada pemain terdaftar untuk ditautkan.</div>';
    }
    return row;
  }).join('');
}
function slugOf(n){return String(n).toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,24)||'player';}
function viewRegistered(){
  var needle=q.trim().toLowerCase();
  var list=data.registered.filter(function(p){return matches(needle,[p.nickname,p.fullName,p.instagram,p.whatsapp].concat(p.names));});
  if(!data.registered.length)return '<div class="empty">Belum ada pemain terdaftar.</div>';
  if(!list.length)return '<div class="empty">Tidak ada pemain yang cocok.</div>';
  return list.map(function(p){
    var contact=[];
    if(p.whatsapp)contact.push('WhatsApp <a href="https://wa.me/'+esc(p.whatsapp)+'" target="_blank" rel="noopener">'+esc(p.whatsapp)+'</a>');
    if(p.instagram)contact.push('Instagram <a href="https://instagram.com/'+esc(p.instagram)+'" target="_blank" rel="noopener">@'+esc(p.instagram)+'</a>');
    var spell=p.names.length>1?' &middot; ejaan: '+p.names.map(esc).join(', '):'';
    var hasSeats=p.seats&&p.seats.length;
    var row='<div class="prow"><div style="min-width:0"><span class="pname">'+esc(p.nickname)+'</span>'+(p.incomplete?'<span class="tag">data belum lengkap</span>':'')+(p.hidden?'<span class="tag">halaman disembunyikan</span>':'')
      +'<div class="meta">'+(p.fullName?esc(p.fullName)+' &middot; ':'')+p.games+' game &middot; terakhir '+fmtDate(p.last)+spell+'</div>'
      +(contact.length?'<div class="meta">'+contact.join(' &middot; ')+'</div>':'')+'</div>'
      +'<div class="acts"><button class="btn sm" data-a="edit" data-id="'+esc(p.id)+'">Edit</button>'+(p.hidden?'':'<a class="btn sm" href="/player/'+encodeURIComponent(p.id)+'/'+esc(slugOf(p.nickname))+'" target="_blank" rel="noopener">Halaman</a>')+(data.pageReady===false?'':'<button class="btn sm" data-a="hide" data-id="'+esc(p.id)+'" data-v="'+(p.hidden?'0':'1')+'">'+(p.hidden?'Tampilkan halaman':'Sembunyikan halaman')+'</button>')+(hasSeats?'<button class="btn sm" data-a="splitreg" data-id="'+esc(p.id)+'">'+(p.games<2?'Atur game':'Pisah per game')+'</button>':'')+'<button class="btn sm" data-a="remove" data-id="'+esc(p.id)+'">Hapus</button></div></div>';
    if(form&&form.mode==='edit'&&form.id===p.id)row+=viewForm();
    if(splitFor&&splitFor.kind==='reg'&&splitFor.id===p.id&&hasSeats)row+=seatPanel(p.seats);
    return row;
  }).join('');
}
function pickedKeys(){
  return Object.keys(picked).filter(function(k){var g=guest(k);return picked[k]&&g&&!g.two&&!g.mapped;});
}
function updatePick(){
  var n=pickedKeys().length,btn=document.getElementById('pickGo');
  if(btn){btn.textContent='Daftarkan yang dipilih ('+n+')';btn.disabled=!n;}
}
function pickBar(){
  return '<div class="pickbar"><button class="btn sm" data-a="pickall">Pilih semua yang tampil</button><button class="btn sm" data-a="pickclear">Kosongkan</button><button class="btn sm primary" id="pickGo" data-a="pickgo" disabled>Daftarkan yang dipilih (0)</button></div><p class="note" style="margin-top:0">Yang tidak dicentang tetap guest dan tidak masuk leaderboard. Nama ganda tidak bisa dicentang.</p>';
}
function render(){
  var app=document.getElementById('app');
  if(!authed){
    app.innerHTML='<div class="login"><img src="'+LOGO+'" alt=""><h2>Admin</h2><input id="pw" type="password" placeholder="Password">'+(loginError?'<div class="err">'+loginError+'</div>':'')+'<button class="btn primary" style="width:100%" data-a="login">Masuk</button></div>';
    var pw=document.getElementById('pw');pw.onkeydown=function(e){if(e.key==='Enter')doLogin();};
    return;
  }
  app.innerHTML='<div class="topbar"><div class="wrap"><div class="tbrow"><div class="tb"><img src="'+LOGO+'" alt="">TBT ADMIN</div><button class="lnk" data-a="logout">Keluar</button></div><nav class="anav" aria-label="Admin"><a href="/admin-daily.html">Sesi</a><a href="/admin-pemain.html" aria-current="page">Pemain</a><a href="/index.html" target="_blank" rel="noopener">Leaderboard &#8599;</a></nav></div></div>'
    +'<main class="wrap">'+viewSetup()+viewSignup()
    +'<div class="card"><input class="search" id="q" placeholder="Cari nama, nama lengkap, atau Instagram" value="'+esc(q)+'"></div>'
    +'<div class="card"><h3 style="margin-bottom:10px">Guest, belum terdaftar ('+data.guests.length+')</h3>'+(data.guests.length?pickBar():'')+'<div id="glist">'+viewGuests()+'</div></div>'
    +'<div class="card"><h3 style="margin-bottom:10px">Pemain terdaftar ('+data.registered.length+')</h3><div id="rlist">'+viewRegistered()+'</div></div></main>';
  updatePick();
  var qi=document.getElementById('q');qi.oninput=function(){q=this.value;document.getElementById('glist').innerHTML=viewGuests();document.getElementById('rlist').innerHTML=viewRegistered();};
}
function doLogin(){
  password=document.getElementById('pw').value;
  sessionStorage.setItem('tbt-admin-pw',password);
  load().then(function(){loginError='';render();}).catch(function(){loginError='Password salah.';authed=false;render();});
}
document.addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('[data-a]'):null;if(!b)return;
  var a=b.dataset.a,p,g;
  if(a==='login'){doLogin();}
  else if(a==='logout'){sessionStorage.removeItem('tbt-admin-pw');password='';authed=false;data=null;render();}
  else if(a==='hide'){p=reg(b.dataset.id);if(!p)return;var hide=b.dataset.v==='1';if(hide&&!window.confirm('Sembunyikan halaman "'+p.nickname+'"?\n\nNamanya tetap tampil di leaderboard, tetapi halaman pribadinya tertutup untuk semua orang.'))return;act({action:'setHidden',id:p.id,hidden:hide},hide?'Halaman disembunyikan':'Halaman ditampilkan');}
    else if(a==='setup'){post({action:'setup'}).then(function(r){if(!r.ok){alert(r.body&&r.body.error||'Gagal mengaktifkan.');return;}toast('Registry aktif');return reload();});}
  else if(a==='newplayer'){if(needSetup())return;form={mode:'new'};linkFor=null;render();}
  else if(a==='reg'){if(needSetup())return;g=guest(b.dataset.k);if(!g)return;form={mode:'register',key:g.key,name:g.name};linkFor=null;render();}
  else if(a==='edit'){form={mode:'edit',id:b.dataset.id};linkFor=null;render();}
  else if(a==='cancelform'){form=null;render();}
  else if(a==='save'){
    var body={nickname:val('fNick'),fullName:val('fFull'),whatsapp:val('fWa'),instagram:val('fIg')};
    if(!body.nickname.trim()){alert('Nama panggilan wajib diisi.');return;}
    if(form.mode==='edit'){body.action='update';body.id=form.id;}
    else if(form.mode==='request'){body.action='requestApprove';body.id=form.id;var lk=document.getElementById('fLink');if(lk&&!lk.checked)body.linkName=false;}
    else{body.action='register';if(form.key)body.fromGuest=form.key;}
    act(body,'Tersimpan',function(){form=null;});
  }
  else if(a==='pick'){picked[b.dataset.k]=b.checked;updatePick();}
  else if(a==='pickall'){
    var needle=q.trim().toLowerCase();
    data.guests.forEach(function(x){if(!x.two&&!x.mapped&&matches(needle,[x.name,x.key]))picked[x.key]=true;});
    document.getElementById('glist').innerHTML=viewGuests();updatePick();
  }
  else if(a==='pickclear'){picked={};document.getElementById('glist').innerHTML=viewGuests();updatePick();}
  else if(a==='pickgo'){
    var keys=pickedKeys();if(!keys.length)return;
    if(needSetup())return;
    if(!window.confirm('Daftarkan '+keys.length+' nama sebagai pemain?\n\nNama panggilannya sama dengan ejaan yang tercatat dan bisa diubah lewat Edit. Nama yang tidak dicentang tetap guest.'))return;
    post({action:'registerAll',keys:keys}).then(function(r){
      if(!r.ok){alert(r.body&&r.body.error||'Gagal. Coba lagi.');return;}
      var msg='Terdaftar: '+r.body.created+' pemain.';
      if(r.body.skippedTwo)msg+=' Dilewati karena nama ganda: '+r.body.skippedTwo+'.';
      if(r.body.skippedOther)msg+=' Dilewati karena nama panggilan sudah dipakai: '+r.body.skippedOther+'.';
      picked={};alert(msg);return reload();
    });
  }
  else if(a==='sgenable'){act({action:'signupEnable'},'Link aktif');}
  else if(a==='sgdisable'){act({action:'signupDisable'},'Link dimatikan');}
  else if(a==='sgreset'){if(!window.confirm('Buat link baru?\n\nLink lama langsung tidak berlaku, jadi link yang sudah dibagikan perlu dikirim ulang.'))return;act({action:'signupReset'},'Link baru dibuat');}
  else if(a==='sgcopy'){
    var box=document.getElementById('sgLink');if(!box)return;
    var done=function(){toast('Link disalin');},manual=function(){box.select();toast('Tekan lama lalu salin');};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(box.value).then(done,manual);else manual();
  }
  else if(a==='rqopen'){form={mode:'request',id:b.dataset.id};linkFor=null;render();}
  else if(a==='rqreject'){
    var rq=req(b.dataset.id);if(!rq)return;
    if(!window.confirm('Tolak pendaftaran "'+rq.nickname+'"?\n\nData yang dikirim langsung dihapus.'))return;
    act({action:'requestReject',id:rq.id},'Ditolak');
  }
  else if(a==='splitopen'){splitFor=(splitFor&&splitFor.kind==='guest'&&splitFor.key===b.dataset.k)?null:{kind:'guest',key:b.dataset.k};form=null;linkFor=null;render();}
  else if(a==='splitreg'){splitFor=(splitFor&&splitFor.kind==='reg'&&splitFor.id===b.dataset.id)?null:{kind:'reg',id:b.dataset.id};form=null;linkFor=null;render();}
  else if(a==='linkopen'){if(needSetup())return;linkFor=b.dataset.k;form=null;render();}
  else if(a==='linkcancel'){linkFor=null;render();}
  else if(a==='linkgo'){g=guest(b.dataset.k);var sel=document.getElementById('lt');if(!g||!sel)return;act({action:'addname',id:sel.value,name:g.name},'Ditautkan',function(){linkFor=null;});}
  else if(a==='simlink'){if(needSetup())return;act({action:'addname',id:b.dataset.id,name:b.dataset.name},'Ditautkan');}
  else if(a==='addname'){var nm=val('fAlias');if(!nm.trim())return;act({action:'addname',id:b.dataset.id,name:nm},'Ejaan ditambah');}
  else if(a==='rmname'){act({action:'removename',id:b.dataset.id,key:b.dataset.v},'Ejaan dihapus');}
  else if(a==='remove'){
    p=reg(b.dataset.id);if(!p)return;
    if(!window.confirm('Hapus "'+p.nickname+'" dari registry?\n\nGame tidak diubah. Namanya jadi guest lagi dan tidak masuk leaderboard. Game yang diatur manual untuk pemain ini juga jadi guest.'))return;
    act({action:'remove',id:p.id},'Dihapus',function(){form=null;});
  }
});
document.addEventListener('change',function(e){
  var s=e.target;if(!s||!s.dataset||s.dataset.a!=='seatsel')return;
  act({action:'seatAssign',tableId:s.dataset.t,seat:+s.dataset.s,to:s.value},'Tersimpan').then(function(r){if(r===null)reload();});
});
if(password){load().then(render).catch(function(){render();});}else{render();}
</script>
</body>
</html>
