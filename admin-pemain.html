<html lang="en">

@font-face{font-family:"Playfair Display";font-style:normal;font-weight:400;font-display:swap;src:url(/assets/f/8a53e5ecdb.woff2) format("woff2");}
@font-face{font-family:"Playfair Display";font-style:normal;font-weight:700;font-display:swap;src:url(/assets/f/9401d0214a.woff2) format("woff2");}
@font-face{font-family:"Playfair Display";font-style:normal;font-weight:900;font-display:swap;src:url(/assets/f/0ba66220fb.woff2) format("woff2");}
@font-face{font-family:"Inter Tight";font-style:normal;font-weight:400;font-display:swap;src:url(/assets/f/2c20035257.woff2) format("woff2");}
@font-face{font-family:"Inter Tight";font-style:normal;font-weight:500;font-display:swap;src:url(/assets/f/5ab688ca8c.woff2) format("woff2");}
@font-face{font-family:"Inter Tight";font-style:normal;font-weight:700;font-display:swap;src:url(/assets/f/9e38e04780.woff2) format("woff2");}

<style>
:root{
  --bg:#FAF7F2; --surface:#FFFFFF; --text:#1B4332; --muted:#587263; --line:#E4DDCD;
  --field:#FBF9F4; --accent:#2D6A4F; --onaccent:#FAF7F2; --focus:#2D6A4F; --red:#B72323;
  --sans:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F2A20; --surface:#16382B; --text:#FAF7F2; --muted:#9DB8A9; --line:#26493B;
    --field:#12302A; --accent:#8FD0AE; --onaccent:#0F2A20; --focus:#8FD0AE; --red:#EA8888;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;color:var(--text);font-weight:700}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
.topbar{border-bottom:1px solid var(--line);padding:14px 0}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tb{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.06em;color:var(--accent)}
.tb img{width:26px;height:auto}
.lnk{background:none;border:0;color:var(--muted);font-size:13px;padding:4px 6px}
.lnk:hover{color:var(--red)}
main{padding:22px 0 70px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-bottom:6px}
.field input{font:inherit;font-size:16px;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.field input:focus-visible,button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.frow{display:flex;gap:12px;flex-wrap:wrap}
.frow .field{flex:1;min-width:130px}
.btn{display:inline-block;border-radius:999px;padding:9px 18px;border:1px solid var(--line);background:transparent;font-weight:500;text-decoration:none;color:var(--text);font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:700}
.btn.sm{padding:6px 12px;font-size:13px}
.dayrow{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;gap:10px}
.dayrow:hover strong{color:var(--accent)}
.meta{font-size:13px;color:var(--muted);margin-top:2px}
.tcard{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:var(--field)}
.th{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}
.cr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.cl{width:64px;font-size:13px;color:var(--muted)}
.code{font-family:var(--display);font-weight:900;font-size:20px;letter-spacing:.06em;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px 10px}
.login{max-width:300px;margin:90px auto;text-align:center}
.login img{width:48px;margin-bottom:12px}
.login input{font:inherit;font-size:16px;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--text);margin:14px 0;text-align:center}
.err{color:var(--red);font-size:13px;margin:6px 0}
.mb{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--accent);color:var(--onaccent);padding:10px 18px;border-radius:999px;font-size:14px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

.prow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.prow:first-child{border-top:0}
.pname{font-weight:700}
.tag{display:inline-block;font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.sug,.dsug{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--field)}
.sug .pair,.dsug .pair{font-weight:700}
.sug .acts,.dsug .acts{margin-top:8px}
.search{font:inherit;font-size:16px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--text);margin-bottom:6px}
.mergebox{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px;margin:0 0 8px;border:1px dashed var(--line);border-radius:12px}
.mergebox select{font:inherit;font-size:15px;flex:1;min-width:160px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--text)}
.note{font-size:13px;color:var(--muted);margin:4px 0 12px;line-height:1.5}

.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;margin:10px 0;border:1px dashed var(--line);border-radius:12px}
.form .full{grid-column:1/-1}
.form label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.form input{font:inherit;font-size:16px;width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--text)}
.form .addname{display:flex;gap:8px;margin-top:6px}
.prow a,.meta a{color:var(--accent)}
@media (max-width:520px){.form{grid-template-columns:1fr}}

.pickbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 8px}
.pk{width:20px;height:20px;margin:0 10px 0 0;vertical-align:middle;accent-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.tag.host{color:var(--accent);border-color:var(--accent)}
.btn.hostbtn{border-color:var(--accent);color:var(--accent);font-weight:600}
.nowa{width:100%;margin:2px 0 0}
.wamsg{text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--field);padding:10px 12px;font-size:13px;line-height:1.45;margin:0 0 12px;white-space:pre-wrap}
a.tq-b{display:inline-flex;align-items:center;text-decoration:none}

.split{margin:6px 0 10px;padding:12px;border:1px dashed var(--line);border-radius:12px}
.seatrow{padding:10px 0;border-top:1px solid var(--line)}
.seatrow:first-of-type{border-top:0;padding-top:0}
.seatrow select{width:100%;font:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--text)}
.ckrow{display:flex;gap:8px;align-items:center;font-size:14px}
.ckrow input{width:18px;height:18px;accent-color:var(--accent)}

/* navigation: the same bar on every admin page, with the current page marked */
.tbrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tbrow .lnk{padding:10px 6px;min-height:40px}
.anav{display:flex;gap:8px;margin-top:10px}
.anav a{flex:1;display:flex;align-items:center;justify-content:center;min-height:40px;border-radius:999px;border:1px solid var(--line);text-decoration:none;color:var(--text);font-size:14px;font-weight:500;white-space:nowrap}
.anav a[aria-current="page"]{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:700}
.btn.sm{padding:8px 14px;min-height:36px;display:inline-flex;align-items:center;justify-content:center}
.back{display:inline-flex;align-items:center;min-height:38px}
.topbar .wrap{display:block}
main .lnk,main .back{display:inline-flex;align-items:center;min-height:38px;padding:8px}
main .meta .lnk{padding:8px 6px!important}
main .meta a{display:inline-flex;align-items:center;min-height:38px}
</style>
<style>
.tq-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;display:flex;align-items:flex-end;justify-content:center}
.tq-sheet{background:var(--surface,#fff);color:var(--text,#111);width:100%;max-width:460px;border-radius:20px 20px 0 0;padding:20px 18px 22px;max-height:94vh;overflow:auto;text-align:center;font-family:var(--sans,sans-serif)}
@media(min-width:600px){.tq-ov{align-items:center}.tq-sheet{border-radius:20px}}
.tq-sheet h3{font-family:var(--display,serif);font-size:20px;margin:0 0 4px}
.tq-note{font-size:13.5px;color:var(--muted,#666);margin:0 0 12px;line-height:1.45}
.tq-chip{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 10px;margin-bottom:8px;border:1px solid}
.tq-ok{color:var(--accent,#2d6a4f);border-color:color-mix(in srgb,var(--accent,#2d6a4f) 40%,transparent);background:color-mix(in srgb,var(--accent,#2d6a4f) 12%,transparent)}
.tq-warn{color:var(--red,#b00);border-color:color-mix(in srgb,var(--red,#b00) 40%,transparent);background:color-mix(in srgb,var(--red,#b00) 11%,transparent)}
.tq-box{display:inline-block;background:#fff;padding:8px;border-radius:14px;border:1px solid var(--line,#ddd);line-height:0}
.tq-box svg{width:min(210px,60vw);height:auto;display:block}
.tq-cd{font:700 26px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.18em;margin:12px 0 2px;padding-left:.18em}
.tq-url{font-size:11.5px;color:var(--muted,#666);margin:4px 0 10px;line-height:1.4}.tq-url span{display:block;overflow-wrap:anywhere}
.tq-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.tq-b{font:inherit;font-size:13px;min-height:38px;padding:8px 14px;border-radius:999px;border:1px solid var(--line,#ddd);background:transparent;color:var(--text,#111);cursor:pointer}
.tq-b.tq-p{background:var(--accent,#2d6a4f);color:var(--onaccent,#fff);border-color:var(--accent,#2d6a4f);font-weight:700}
.tq-b:focus-visible{outline:2px solid var(--focus,#2d6a4f);outline-offset:2px}
.tq-printroot{display:none}
.tq-card{width:105mm;max-width:100%;min-height:148mm;margin:0 auto;background:#fff;color:#1B4332;padding:9mm 8mm;text-align:center;font-family:var(--sans,sans-serif);display:flex;flex-direction:column;align-items:center;justify-content:space-between;box-sizing:border-box}
.tq-card .tq-br{font:700 12px var(--sans,sans-serif);letter-spacing:.2em;text-transform:uppercase}
.tq-card .tq-tn{font:900 34px/1.1 var(--display,serif);margin:6px 0 2px}
.tq-card .tq-scan{font-size:14px;color:#587263;margin:0 0 10px}
.tq-card .tq-box{border-color:#E4DDCD;padding:6px}.tq-card .tq-box svg{width:62mm}
.tq-card .tq-cd{color:#1B4332;font-size:30px}
.tq-card .tq-how{font-size:12px;color:#587263;line-height:1.4;margin:0}.tq-card .tq-site{font-size:11px;color:#587263;margin-top:8px}
@media print{body.tq-printing>*:not(.tq-printroot){display:none!important}body.tq-printing .tq-printroot{display:block}@page{margin:8mm}}

</style>
</head>

var LOGO='/assets/i/cfad30e8e7.png';
var password=sessionStorage.getItem('tbt-admin-pw')||'';
var authed=false,data=null,loginError='',q='',form=null,linkFor=null,picked={},splitFor=null;

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function H(){return {'Authorization':'Bearer '+password,'Content-Type':'application/json'};}
function fmtDate(d){if(!d)return '-';try{return new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});}catch(e){return d;}}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('show');},1800);}
function val(id){var el=document.getElementById(id);return el?el.value:'';}
function req(id){var r=data.signup&&data.signup.requests||[];for(var i=0;i<r.length;i++)if(r[i].id===id)return r[i];return null;}
function reg(id){for(var i=0;i<data.registered.length;i++)if(data.registered[i].id===id)return data.registered[i];return null;}
function guest(key){for(var i=0;i<data.guests.length;i++)if(data.guests[i].key===key)return data.guests[i];return null;}

function load(){
  return fetch('/api/admin/players',{headers:H()}).then(function(r){
    if(r.status===401){authed=false;sessionStorage.removeItem('tbt-admin-pw');throw new Error('auth');}
    if(!r.ok)throw new Error('server');
    return r.json();
  }).then(function(d){data=d;authed=true;if(!pageChecked){pageChecked=true;checkPages();}});
}
// Once per visit: can the server open the page of a registered player? If not, say why, so a missing file is not a mystery.
var pageChecked=false,pageCheck=null,pageReport=null;
// On request: ask the server for every open player page, one after another, and report which ones cannot be opened and which are empty.
function checkAll(){
  if(pageReport&&pageReport.running)return;
  var ps=(data.registered||[]).filter(function(x){return !x.hidden;});
  pageReport={running:true,done:0,total:ps.length,fails:[],empty:[],skipped:[]};render();
  var i=0;
  function next(){
    if(i>=ps.length){pageReport.running=false;render();return;}
    var p=ps[i++];
    fetch('/api/overview?player='+encodeURIComponent(p.id),{headers:H(),cache:'no-store'}).then(function(r){
      return r.text().then(function(tx){
        var j=null;try{j=JSON.parse(tx);}catch(e){}
        if(r.status===200&&j&&j.player){if(!j.games.length)pageReport.empty.push(p.nickname);if(j.skipped)pageReport.skipped.push(p.nickname+' ('+j.skipped+')');}
        else pageReport.fails.push(p.nickname+' (code '+r.status+(j&&(j.reason||j.detail)?': '+(j.reason||j.detail):'')+')');
      });
    },function(){pageReport.fails.push(p.nickname+' (no connection)');}).then(function(){pageReport.done++;if(pageReport.done%6===0||pageReport.done===pageReport.total)render();next();});
  }
  next();
}
function pageReportHtml(){
  var r=pageReport;if(!r)return '';
  if(r.running)return '<p class="note" style="margin-top:0">Checking player pages\u2026 '+r.done+' of '+r.total+'</p>';
  var ok=r.total-r.fails.length,h='<p class="note" style="margin-top:0'+(r.fails.length?';color:var(--red)':'')+'"><b>'+ok+' of '+r.total+' player pages can be opened.</b>';
  if(r.fails.length)h+=' Failed: '+r.fails.map(esc).join(', ')+'.';
  if(r.empty.length)h+=' No games yet (the page is empty): '+r.empty.map(esc).join(', ')+'.';
  if(r.skipped.length)h+=' Some games were skipped because their data could not be read: '+r.skipped.map(esc).join(', ')+'.';
  return h+'</p>';
}
function pageCheckText(){
  var c=pageCheck,code=' (code: '+c.status+(c.reason?'/'+c.reason:c.old?'/old':'')+')';
  if(c.old)return 'Player pages are not active on the server yet: functions/api/overview.js and functions/_players.js are not the latest version. Upload both, then wait for the deploy to finish.'+code;
  if(c.reason==='not_found')return 'The server cannot find this player in the registry (ID '+c.id+', the registry holds '+c.n+' players). Send this code to the site builder.'+code;
  if(c.reason==='registry_not_ready')return 'The server thinks the registry is not active in the database. Send this code to the site builder.'+code;
  if(c.reason==='hidden')return 'The server records this player page as hidden, although it is not hidden in the admin list. Send this code to the site builder.'+code;
  if(c.reason==='bad_id')return 'The server rejects the form of ID '+c.id+'. Send this code to the site builder.'+code;
  return 'The player page cannot be opened from the server yet'+code+'. Make sure all the latest files are uploaded to GitHub, then wait for the deploy to finish.';
}
function checkPages(){
  var p=(data.registered||[]).filter(function(x){return !x.hidden;})[0];
  if(!p)return;
  fetch('/api/overview?player='+encodeURIComponent(p.id),{headers:H(),cache:'no-store'}).then(function(r){
    return r.text().then(function(tx){
      var j=null;try{j=JSON.parse(tx);}catch(e){}
      if(r.status===200&&j&&j.player)return;
      pageCheck={status:r.status,id:p.id,reason:j&&j.reason||'',n:j&&j.registryPlayers,old:r.status===200&&!(j&&j.player),own:!!(j&&j.error)};render();
    });
  }).catch(function(){});
}
function post(body){
  return fetch('/api/admin/players',{method:'POST',headers:H(),body:JSON.stringify(body)}).then(function(r){
    return r.json().catch(function(){return {};}).then(function(j){return {ok:r.ok,status:r.status,body:j};});
  });
}
function reload(){return load().then(render).catch(function(){render();});}
function act(body,okMsg,onOk){
  return post(body).then(function(r){
    if(!r.ok){alert(r.body&&r.body.message||r.body&&r.body.error||'Failed. Please try again.');return null;}
    if(onOk)onOk(r.body);
    toast(okMsg||'Saved');return reload();
  }).catch(function(){alert('No connection. Please try again.');});
}
function needSetup(){if(!data.ready){alert('Turn on the player registry first.');return true;}return false;}

function viewSetup(){
  if(!data.ready)return '<div class="card"><h3 style="margin-bottom:6px">Player registry is not active</h3><p class="note">The registry is the official list of players, filled in by the admin: full name, nickname (shown on the leaderboard), WhatsApp and Instagram. Names that are not registered become guests and stay off the leaderboard. The name list below can already be used to check names. Turn it on once; pressing it again is safe.</p><button class="btn primary" data-a="setup">Turn on the player registry</button></div>';
  var h='<div class="card"><h3 style="margin-bottom:6px">Player registry</h3>'+(data.seatsReady?'':'<p class="note" style="margin-top:0">Splitting by game is not active in this registry. <button class="btn sm" data-a="setup">Update registry</button></p>')+(data.pageReady===false?'<p class="note" style="margin-top:0">Player pages are not active in this registry: the database needs one small update. <button class="btn sm" data-a="setup">Update registry</button></p>':'')+(pageCheck?'<p class="note" style="margin-top:0;color:var(--red)">'+pageCheckText()+'</p>':'')+(data.registered.length?'<p class="note" style="margin-top:0"><button class="btn sm" data-a="checkpages">Check player pages</button> Checks the pages of all players who have not hidden theirs.</p>':'')+pageReportHtml()+'<p class="note" style="margin-bottom:8px">'+data.registered.length+' registered players &middot; '+data.guests.length+' guests &middot; '+data.played+' tables played.</p>';
  h+=data.ruleOn
    ?'<p class="note" style="margin-top:0">Only registered players appear on the leaderboard. Guests still show at their table and session, and double names (containing "/", "&amp;", "+" or the word "dan") are guests too.</p>'
    :'<p class="note" style="margin-top:0">The guest rule does not apply yet because no player is registered, so every name still counts on the leaderboard. As soon as one player is registered, only registered players appear on the leaderboard. Tick the names you want to register in the guest list below. Names left unticked stay guests.</p>';
  h+='<div class="acts"><button class="btn" data-a="newplayer">Add a new player</button></div>';
  if(form&&form.mode==='new')h+=viewForm();
  return h+'</div>';
}
function viewForm(){
  var f=form,isEdit=f.mode==='edit',isReq=f.mode==='request',p=isEdit?reg(f.id):null,rq=isReq?req(f.id):null;
  if((isEdit&&!p)||(isReq&&!rq)){form=null;return '';}
  var v=isReq?{nick:rq.nickname,full:rq.fullName,wa:rq.whatsapp,ig:rq.instagram}:{nick:isEdit?p.nickname:(f.name||''),full:isEdit?p.fullName:'',wa:isEdit?p.whatsapp:'',ig:isEdit?p.instagram:''};
  var h='<div class="form">'+(isReq?'<div class="full note" style="margin:0">'+(rq.tableName?'Says they are the guest &quot;'+esc(rq.tableName)+'&quot;'+(rq.claim?' ('+rq.claim.games+' games, last '+fmtDate(rq.claim.last)+').':'.'):'Did not pick a name from the guest list.')+' Check the details, then approve.</div>':'')+'<div><label for="fNick">Nickname (shown on the leaderboard) *</label><input id="fNick" maxlength="30" autocomplete="off" value="'+esc(v.nick)+'"></div>'
    +'<div><label for="fFull">Full name</label><input id="fFull" maxlength="60" autocomplete="off" value="'+esc(v.full)+'"></div>'
    +'<div><label for="fWa">WhatsApp number</label><input id="fWa" inputmode="tel" placeholder="0812..." autocomplete="off" value="'+esc(v.wa)+'"></div>'
    +'<div><label for="fIg">Instagram username</label><input id="fIg" placeholder="username" autocomplete="off" value="'+esc(v.ig)+'"></div>';
  if(isEdit){
    h+='<div class="full"><label>Spellings recognised at the table</label>';
    p.names.forEach(function(k){h+='<span class="tag" style="margin:0 6px 4px 0">'+esc(k)+(k===p.nickname.toLowerCase().replace(/\s+/g,' ')?'':' <button class="lnk" data-a="rmname" data-id="'+esc(p.id)+'" data-v="'+esc(k)+'">remove</button>')+'</span>';});
    h+='<div class="addname"><input id="fAlias" placeholder="Add another spelling, for example a typo" autocomplete="off"><button class="btn sm" data-a="addname" data-id="'+esc(p.id)+'">Add</button></div></div>';
  }
  if(isReq&&rq.tableName)h+='<div class="full"><label class="ckrow"><input type="checkbox" id="fLink"'+(rq.claimTakenBy?'':' checked')+'> Link the name &quot;'+esc(rq.tableName)+'&quot; to this player</label>'+(rq.claimTakenBy?'<div class="meta" style="margin:4px 0 0">This name is already used by '+esc(rq.claimTakenBy)+'. Approve without linking, then set up its games one by one with &quot;Split by game&quot;.</div>':'')+'</div>';
  h+='<div class="full note" style="margin:0">WhatsApp and Instagram are only visible to the admin and never shown on a public page.</div>';
  h+='<div class="full acts"><button class="btn primary" data-a="save">'+(isReq?'Approve and register':'Save')+'</button><button class="btn" data-a="cancelform">Cancel</button></div></div>';
  return h;
}
function matches(needle,parts){if(!needle)return true;return parts.some(function(s){return String(s||'').toLowerCase().indexOf(needle)>=0;});}
function viewSignup(){
  if(!data.ready)return '';
  var sg=data.signup;
  if(!sg||!sg.ready)return '<div class="card"><h3 style="margin-bottom:6px">Sign-up by link</h3><p class="note">Players can sign up themselves through one link that you share. Sign-ups go to a waiting list and only become players after you approve them.</p><button class="btn primary" data-a="setup">Turn on sign-up by link</button></div>';
  var link=sg.token?location.origin+'/daftar.html?t='+sg.token:'';
  var h='<div class="card"><h3 style="margin-bottom:6px">Sign-up by link'+(sg.token?'<span class="tag">'+(sg.enabled?'on':'off')+'</span>':'')+'</h3>';
  if(!sg.token)h+='<p class="note">Create one link, then share it with players (for example in a WhatsApp group). Sign-ups go to a waiting list and only become players after you approve them.</p><button class="btn primary" data-a="sgenable">Create sign-up link</button>';
  else h+='<input class="search" id="sgLink" readonly value="'+esc(link)+'"><div class="acts"><button class="btn sm primary" data-a="sgcopy">Copy link</button>'+(sg.enabled?'<button class="btn sm" data-a="sgdisable">Turn the link off</button>':'<button class="btn sm" data-a="sgenable">Turn it on again</button>')+'<button class="btn sm" data-a="sgreset">Create a new link</button></div><p class="note" style="margin-top:10px">Anyone with the link can send a sign-up, but nobody appears on the leaderboard before you approve them. If the link leaks, create a new link: the old one stops working at once.</p>';
  h+='</div>';
  var rs=sg.requests||[];
  if(sg.token||rs.length){
    h+='<div class="card"><h3 style="margin-bottom:10px">Waiting for approval ('+rs.length+')</h3>';
    if(!rs.length)h+='<div class="empty">No new sign-ups yet.</div>';
    rs.forEach(function(x){
      var contact=['WhatsApp <a href="https://wa.me/'+esc(x.whatsapp)+'" target="_blank" rel="noopener">'+esc(x.whatsapp)+'</a>'];
      if(x.instagram)contact.push('Instagram <a href="https://instagram.com/'+esc(x.instagram)+'" target="_blank" rel="noopener">@'+esc(x.instagram)+'</a>');
      var info=x.tableName?'Says they are the guest &quot;'+esc(x.tableName)+'&quot;'+(x.claim?' ('+x.claim.games+' games, last '+fmtDate(x.claim.last)+')':' (no games with that name yet)'):'Did not pick a name from the guest list';
      var warn=(x.claimTakenBy?'<div class="meta" style="color:var(--red)">The name &quot;'+esc(x.tableName)+'&quot; is already registered under '+esc(x.claimTakenBy)+', so it cannot be approved. Check the person first.</div>':'')+(x.nicknameTakenBy?'<div class="meta" style="color:var(--red)">This nickname is already used by '+esc(x.nicknameTakenBy)+'. Change it when approving.</div>':'');
      h+='<div class="prow"><div style="min-width:0"><span class="pname">'+esc(x.nickname)+'</span><div class="meta">'+(x.fullName?esc(x.fullName)+' &middot; ':'')+contact.join(' &middot; ')+'</div><div class="meta">'+info+'</div>'+warn+'</div><div class="acts"><button class="btn sm primary" data-a="rqopen" data-id="'+esc(x.id)+'">Review and approve</button><button class="btn sm" data-a="rqreject" data-id="'+esc(x.id)+'">Reject</button></div></div>';
      if(form&&form.mode==='request'&&form.id===x.id)h+=viewForm();
    });
    h+='</div>';
  }
  return h;
}
function seatPanel(seats){
  var opts=data.registered.map(function(p){return [p.id,p.nickname];});
  var h='<div class="split"><p class="note" style="margin:0 0 10px">'+(seats.length===1?'This game is linked because of its name. If someone else played, choose Guest or the right player. &quot;Follow the name&quot; puts it back to the original link. The original game is not changed.':'Choose who played in each game. &quot;Follow the name&quot; means following the name written at the table. The original game is not changed.')+'</p>';
  seats.forEach(function(s){
    var sel='<option value=""'+(s.override===''?' selected':'')+'>Follow the name</option><option value="guest"'+(s.override==='guest'?' selected':'')+'>Guest (not counted)</option>'+opts.map(function(o){return '<option value="'+esc(o[0])+'"'+(s.override===o[0]?' selected':'')+'>'+esc(o[1])+'</option>';}).join('');
    h+='<div class="seatrow"><div class="meta" style="margin:0 0 6px"><b>'+esc(s.session||'-')+'</b> &middot; '+esc(s.table)+' &middot; '+fmtDate(s.date)+' &middot; result '+(s.net>0?'+':'')+s.net+'<br>Played with: '+(s.with.length?s.with.map(esc).join(', '):'-')+'<br>Written as &quot;'+esc(s.typed)+'&quot; &middot; now counted for: <b>'+(s.owner?esc(s.owner):'guest')+'</b></div><select data-a="seatsel" data-t="'+esc(s.tableId)+'" data-s="'+s.seat+'">'+sel+'</select></div>';
  });
  return h+'</div>';
}
function viewGuests(){
  var needle=q.trim().toLowerCase();
  var list=data.guests.filter(function(g){return matches(needle,[g.name,g.key]);});
  if(!data.guests.length)return '<div class="empty">No guests. Every name is registered.</div>';
  if(!list.length)return '<div class="empty">No matching guests.</div>';
  return list.map(function(g){
    var hasSeats=g.seats&&g.seats.length;
    var sims=g.similar.map(function(s){return '<div class="meta">Similar to &quot;'+esc(s.nickname)+'&quot; ('+esc(s.reason)+') <button class="lnk" data-a="simlink" data-id="'+esc(s.id)+'" data-name="'+esc(g.name)+'">link to '+esc(s.nickname)+'</button></div>';}).join('');
    var tags='<span class="tag">guest</span>'+(g.two?'<span class="tag">two names?</span>':'')+(g.mapped?'<span class="tag">set per game</span>':'');
    var btns=(g.mapped?'':'<button class="btn sm primary" data-a="reg" data-k="'+esc(g.key)+'">Register</button><button class="btn sm" data-a="linkopen" data-k="'+esc(g.key)+'">Link to...</button>')+(hasSeats?'<button class="btn sm" data-a="splitopen" data-k="'+esc(g.key)+'">Split by game</button>':'');
    var row='<div class="prow"><div style="min-width:0">'+((g.two||g.mapped)?'':'<input type="checkbox" class="pk" data-a="pick" data-k="'+esc(g.key)+'" aria-label="Select '+esc(g.name)+'"'+(picked[g.key]?' checked':'')+'>')+'<span class="pname">'+esc(g.name)+'</span>'+tags
      +'<div class="meta">'+g.games+(g.games===1?' game':' games')+' &middot; last '+fmtDate(g.last)+(g.two?' &middot; double name, stays a guest':'')+(g.mapped?' &middot; the name is registered, but this game is set manually':'')+'</div>'+sims+'</div>'
      +'<div class="acts">'+btns+'</div></div>';
    if(form&&form.mode==='register'&&form.key===g.key)row+=viewForm();
    if(splitFor&&splitFor.kind==='guest'&&splitFor.key===g.key&&hasSeats)row+=seatPanel(g.seats);
    if(linkFor===g.key){
      var opts=data.registered.map(function(p){return '<option value="'+esc(p.id)+'">'+esc(p.nickname)+'</option>';}).join('');
      row+=data.registered.length?'<div class="mergebox"><span class="meta" style="margin:0">&quot;'+esc(g.name)+'&quot; is another spelling of:</span><select id="lt">'+opts+'</select><button class="btn sm primary" data-a="linkgo" data-k="'+esc(g.key)+'">Link</button><button class="btn sm" data-a="linkcancel">Cancel</button></div>':'<div class="note">No registered players to link to yet.</div>';
    }
    return row;
  }).join('');
}
function slugOf(n){return String(n).toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,24)||'player';}

// ---- hosts: registered players who log in to make sessions and tables
function hostOf(id){var l=(data&&data.hosts)||[];for(var i=0;i<l.length;i++)if(l[i].id===id)return l[i];return null;}
function postHosts(body){
  return fetch('/api/admin/hosts',{method:'POST',headers:H(),body:JSON.stringify(body)}).then(function(r){
    return r.json().catch(function(){return {};}).then(function(j){return {ok:r.ok,status:r.status,body:j};});
  });
}
function hostMeta(h){
  if(h.firstUnused)return h.firstExpired?'First password not used and expired. Press Reset password.':'First password not used yet';
  return 'Last login '+(h.lastLogin?fmtDate(h.lastLogin.slice(0,10)):'never')+' &middot; '+h.tablesMade+(h.tablesMade===1?' table':' tables')+' made';
}
function viewHosts(){
  if(!data.ready)return '';
  var l=data.hosts||[];
  return '<div class="card" id="hostscard"><h3 style="margin-bottom:6px">Hosts</h3><p class="note" style="margin-top:0">A host is a registered player who logs in with a personal password to make sessions and tables, and to get their codes and QR codes without you. Up to 24 tables a day each. Press Make host on a player below.</p>'
    +(l.length?l.map(function(h){return '<div class="prow"><div style="min-width:0"><span class="pname">'+esc(h.nickname)+'</span><span class="tag host">Host</span><div class="meta">'+hostMeta(h)+'</div></div><div class="acts"><button class="btn sm" data-a="hreset" data-id="'+esc(h.id)+'">Reset password</button><button class="btn sm" data-a="hrevoke" data-id="'+esc(h.id)+'">Revoke host</button></div></div>';}).join(''):'<div class="empty">No hosts yet.</div>')+'</div>';
}
function hostTag(p){return hostOf(p.id)?'<span class="tag host">Host</span>':'';}
function hostBtns(p){
  if(hostOf(p.id))return '<button class="btn sm" data-a="hreset" data-id="'+esc(p.id)+'">Reset password</button><button class="btn sm" data-a="hrevoke" data-id="'+esc(p.id)+'">Revoke host</button>';
  return '<button class="btn sm hostbtn" data-a="hgrant" data-id="'+esc(p.id)+'"'+(p.whatsapp?'':' disabled aria-describedby="nowa-'+esc(p.id)+'"')+'>Make host</button>';
}
function hostNote(p){return !p.whatsapp&&!hostOf(p.id)?'<div class="nowa meta" id="nowa-'+esc(p.id)+'">Add a WhatsApp number first to make this player a host.</div>':'';}
function hostMsg(nick,reset){return (reset?'Hi '+nick+', your host password has been reset. ':'Hi '+nick+', you can now make sessions and tables for Tiles by Tiles. ')+'Log in at '+location.origin+'/host with your nickname ('+nick+') and the last 6 digits of this WhatsApp number as your first password. You will be asked to choose your own password right after. The first password works for 7 days.';}
// the login details to send: a message and a QR for the login page (neither holds a secret)
function hostSent(nick,wa,reset){
  var prev=document.activeElement,ov=document.createElement('div');ov.className='tq-ov';var msg=hostMsg(nick,reset);
  ov.innerHTML='<div class="tq-sheet" role="dialog" aria-modal="true" aria-labelledby="hsh"><h3 id="hsh">'+(reset?'Password reset for '+esc(nick):esc(nick)+' is now a host')+'</h3><p class="tq-note">Send the login details. There is no secret in this message or in the QR.</p><div class="wamsg">'+esc(msg)+'</div><div class="tq-box">'+TBTQR.svg(location.origin+'/host')+'</div><div class="tq-url" style="margin-top:6px">QR for the login page</div><div class="tq-acts"><a class="tq-b tq-p" data-hs="wa" href="https://wa.me/'+esc(wa)+'?text='+encodeURIComponent(msg)+'" target="_blank" rel="noopener">Send on WhatsApp</a><button type="button" class="tq-b" data-hs="copy">Copy message</button><button type="button" class="tq-b" data-hs="done">Done</button></div></div>';
  function close(){document.removeEventListener('keydown',key,true);ov.remove();if(prev&&prev.focus)prev.focus();toast(reset?'Password reset':nick+' is now a host');}
  function key(e){if(e.key==='Escape'){e.stopPropagation();close();}}
  ov.addEventListener('click',function(e){if(e.target===ov)return close();var b=e.target.closest?e.target.closest('[data-hs]'):null;if(!b)return;var h=b.getAttribute('data-hs');if(h==='done')close();else if(h==='copy')TBTQR.copy(msg,function(ok){b.textContent=ok?'Message copied':'Copy failed';setTimeout(function(){b.textContent='Copy message';},1600);});});
  document.addEventListener('keydown',key,true);document.body.appendChild(ov);ov.querySelector('.tq-p').focus();
}
function hostAction(a,id){
  var p=reg(id);if(!p)return;var nick=p.nickname;
  if(a==='hgrant')TBTQR.ask({title:'Make '+nick+' a host?',text:nick+' will be able to make sessions and tables, up to 24 tables a day. The first password is the last 6 digits of the WhatsApp number. '+nick+' must choose a personal password at the first login, and you never see it.',ok:'Make host'}).then(function(v){if(!v)return;postHosts({action:'grant',id:id}).then(function(r){if(!r.ok){alert(r.body.error||'Failed. Please try again.');return;}reload().then(function(){hostSent(nick,r.body.whatsapp||p.whatsapp,false);});});});
  else if(a==='hreset')TBTQR.ask({title:'Reset '+nick+'\'s password?',text:'The password goes back to the last 6 digits of the WhatsApp number, valid for 7 days, and the phones '+nick+' is logged in on are signed out. Sessions and tables stay as they are.',ok:'Reset password'}).then(function(v){if(!v)return;postHosts({action:'reset',id:id}).then(function(r){if(!r.ok){alert(r.body.error||'Failed. Please try again.');return;}reload().then(function(){hostSent(nick,r.body.whatsapp||p.whatsapp,true);});});});
  else if(a==='hrevoke')TBTQR.ask({title:'Revoke '+nick+' as host?',text:nick+' is signed out everywhere and can no longer log in. Sessions and tables already made stay as they are.',ok:'Revoke'}).then(function(v){if(!v)return;postHosts({action:'revoke',id:id}).then(function(r){if(!r.ok){alert(r.body.error||'Failed. Please try again.');return;}toast('Host revoked');reload();});});
}
function viewRegistered(){
  var needle=q.trim().toLowerCase();
  var list=data.registered.filter(function(p){return matches(needle,[p.nickname,p.fullName,p.instagram,p.whatsapp].concat(p.names));});
  if(!data.registered.length)return '<div class="empty">No registered players yet.</div>';
  if(!list.length)return '<div class="empty">No matching players.</div>';
  return list.map(function(p){
    var contact=[];
    if(p.whatsapp)contact.push('WhatsApp <a href="https://wa.me/'+esc(p.whatsapp)+'" target="_blank" rel="noopener">'+esc(p.whatsapp)+'</a>');
    if(p.instagram)contact.push('Instagram <a href="https://instagram.com/'+esc(p.instagram)+'" target="_blank" rel="noopener">@'+esc(p.instagram)+'</a>');
    var spell=p.names.length>1?' &middot; spellings: '+p.names.map(esc).join(', '):'';
    var hasSeats=p.seats&&p.seats.length;
    var row='<div class="prow"><div style="min-width:0"><span class="pname">'+esc(p.nickname)+'</span>'+hostTag(p)+(p.incomplete?'<span class="tag">incomplete data</span>':'')+(p.hidden?'<span class="tag">page hidden</span>':'')
      +'<div class="meta">'+(p.fullName?esc(p.fullName)+' &middot; ':'')+p.games+(p.games===1?' game':' games')+' &middot; last '+fmtDate(p.last)+spell+'</div>'
      +(contact.length?'<div class="meta">'+contact.join(' &middot; ')+'</div>':'')+'</div>'
      +'<div class="acts"><button class="btn sm" data-a="edit" data-id="'+esc(p.id)+'">Edit</button>'+hostBtns(p)+(p.hidden?'':'<a class="btn sm" href="/players/'+encodeURIComponent(p.id)+'/'+esc(slugOf(p.nickname))+'" target="_blank" rel="noopener">Page</a>')+(data.pageReady===false?'':'<button class="btn sm" data-a="hide" data-id="'+esc(p.id)+'" data-v="'+(p.hidden?'0':'1')+'">'+(p.hidden?'Show page':'Hide page')+'</button>')+(hasSeats?'<button class="btn sm" data-a="splitreg" data-id="'+esc(p.id)+'">'+(p.games<2?'Set up games':'Split by game')+'</button>':'')+'<button class="btn sm" data-a="remove" data-id="'+esc(p.id)+'">Delete</button></div>'+hostNote(p)+'</div>';
    if(form&&form.mode==='edit'&&form.id===p.id)row+=viewForm();
    if(splitFor&&splitFor.kind==='reg'&&splitFor.id===p.id&&hasSeats)row+=seatPanel(p.seats);
    return row;
  }).join('');
}
function pickedKeys(){
  return Object.keys(picked).filter(function(k){var g=guest(k);return picked[k]&&g&&!g.two&&!g.mapped;});
}
function updatePick(){
  var n=pickedKeys().length,btn=document.getElementById('pickGo');
  if(btn){btn.textContent='Register the selected ('+n+')';btn.disabled=!n;}
}
function pickBar(){
  return '<div class="pickbar"><button class="btn sm" data-a="pickall">Select all shown</button><button class="btn sm" data-a="pickclear">Clear</button><button class="btn sm primary" id="pickGo" data-a="pickgo" disabled>Register the selected (0)</button></div><p class="note" style="margin-top:0">Names left unticked stay guests and stay off the leaderboard. Double names cannot be ticked.</p>';
}
function render(){
  var app=document.getElementById('app');
  if(!authed){
    app.innerHTML='<div class="login"><img src="'+LOGO+'" alt=""><h2>Admin</h2><input id="pw" type="password" placeholder="Password">'+(loginError?'<div class="err">'+loginError+'</div>':'')+'<button class="btn primary" style="width:100%" data-a="login">Sign in</button></div>';
    var pw=document.getElementById('pw');pw.onkeydown=function(e){if(e.key==='Enter')doLogin();};
    return;
  }
  app.innerHTML='<div class="topbar"><div class="wrap"><div class="tbrow"><div class="tb"><img src="'+LOGO+'" alt="">TBT ADMIN</div><button class="lnk" data-a="logout">Sign out</button></div><nav class="anav" aria-label="Admin"><a href="/admin-daily.html">Sessions</a><a href="/admin-pemain.html" aria-current="page">Players</a><a href="/index.html" target="_blank" rel="noopener">Leaderboard &#8599;</a></nav></div></div>'
    +'<main class="wrap">'+viewSetup()+viewSignup()+viewHosts()
    +'<div class="card"><input class="search" id="q" placeholder="Search by nickname, full name or Instagram" value="'+esc(q)+'"></div>'
    +'<div class="card"><h3 style="margin-bottom:10px">Guests, not registered ('+data.guests.length+')</h3>'+(data.guests.length?pickBar():'')+'<div id="glist">'+viewGuests()+'</div></div>'
    +'<div class="card"><h3 style="margin-bottom:10px">Registered players ('+data.registered.length+')</h3><div id="rlist">'+viewRegistered()+'</div></div></main>';
  updatePick();
  var qi=document.getElementById('q');qi.oninput=function(){q=this.value;document.getElementById('glist').innerHTML=viewGuests();document.getElementById('rlist').innerHTML=viewRegistered();};
}
function doLogin(){
  password=document.getElementById('pw').value;
  sessionStorage.setItem('tbt-admin-pw',password);
  load().then(function(){loginError='';render();}).catch(function(){loginError='Password salah.';authed=false;render();});
}
document.addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('[data-a]'):null;if(!b)return;
  var a=b.dataset.a,p,g;
  if(a==='login'){doLogin();}
  else if(a==='hgrant'||a==='hreset'||a==='hrevoke'){hostAction(a,b.dataset.id);}
  else if(a==='logout'){sessionStorage.removeItem('tbt-admin-pw');password='';authed=false;data=null;render();}
  else if(a==='checkpages'){checkAll();}
    else if(a==='hide'){p=reg(b.dataset.id);if(!p)return;var hide=b.dataset.v==='1';if(hide&&!window.confirm('Hide the page of "'+p.nickname+'"?\n\nThe name still shows on the leaderboard, but the personal page is closed to everyone.'))return;act({action:'setHidden',id:p.id,hidden:hide},hide?'Page hidden':'Page shown');}
    else if(a==='setup'){post({action:'setup'}).then(function(r){if(!r.ok){alert(r.body&&r.body.error||'Could not turn it on.');return;}toast('Registry is on');return reload();});}
  else if(a==='newplayer'){if(needSetup())return;form={mode:'new'};linkFor=null;render();}
  else if(a==='reg'){if(needSetup())return;g=guest(b.dataset.k);if(!g)return;form={mode:'register',key:g.key,name:g.name};linkFor=null;render();}
  else if(a==='edit'){form={mode:'edit',id:b.dataset.id};linkFor=null;render();}
  else if(a==='cancelform'){form=null;render();}
  else if(a==='save'){
    var body={nickname:val('fNick'),fullName:val('fFull'),whatsapp:val('fWa'),instagram:val('fIg')};
    if(!body.nickname.trim()){alert('Nickname is required.');return;}
    if(form.mode==='edit'){body.action='update';body.id=form.id;}
    else if(form.mode==='request'){body.action='requestApprove';body.id=form.id;var lk=document.getElementById('fLink');if(lk&&!lk.checked)body.linkName=false;}
    else{body.action='register';if(form.key)body.fromGuest=form.key;}
    act(body,'Saved',function(){form=null;});
  }
  else if(a==='pick'){picked[b.dataset.k]=b.checked;updatePick();}
  else if(a==='pickall'){
    var needle=q.trim().toLowerCase();
    data.guests.forEach(function(x){if(!x.two&&!x.mapped&&matches(needle,[x.name,x.key]))picked[x.key]=true;});
    document.getElementById('glist').innerHTML=viewGuests();updatePick();
  }
  else if(a==='pickclear'){picked={};document.getElementById('glist').innerHTML=viewGuests();updatePick();}
  else if(a==='pickgo'){
    var keys=pickedKeys();if(!keys.length)return;
    if(needSetup())return;
    if(!window.confirm('Register '+keys.length+' names as players?\n\nTheir nicknames are the same as the recorded spelling and can be changed with Edit. Names left unticked stay guests.'))return;
    post({action:'registerAll',keys:keys}).then(function(r){
      if(!r.ok){alert(r.body&&r.body.error||'Failed. Please try again.');return;}
      var msg='Registered: '+r.body.created+' players.';
      if(r.body.skippedTwo)msg+=' Skipped because of double names: '+r.body.skippedTwo+'.';
      if(r.body.skippedOther)msg+=' Skipped because the nickname is already used: '+r.body.skippedOther+'.';
      picked={};alert(msg);return reload();
    });
  }
  else if(a==='sgenable'){act({action:'signupEnable'},'Link is on');}
  else if(a==='sgdisable'){act({action:'signupDisable'},'Link is off');}
  else if(a==='sgreset'){if(!window.confirm('Create a new link?\n\nThe old link stops working at once, so a link that was already shared has to be sent again.'))return;act({action:'signupReset'},'New link created');}
  else if(a==='sgcopy'){
    var box=document.getElementById('sgLink');if(!box)return;
    var done=function(){toast('Link copied');},manual=function(){box.select();toast('Press and hold, then copy');};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(box.value).then(done,manual);else manual();
  }
  else if(a==='rqopen'){form={mode:'request',id:b.dataset.id};linkFor=null;render();}
  else if(a==='rqreject'){
    var rq=req(b.dataset.id);if(!rq)return;
    if(!window.confirm('Reject the sign-up of "'+rq.nickname+'"?\n\nThe data that was sent is deleted at once.'))return;
    act({action:'requestReject',id:rq.id},'Rejected');
  }
  else if(a==='splitopen'){splitFor=(splitFor&&splitFor.kind==='guest'&&splitFor.key===b.dataset.k)?null:{kind:'guest',key:b.dataset.k};form=null;linkFor=null;render();}
  else if(a==='splitreg'){splitFor=(splitFor&&splitFor.kind==='reg'&&splitFor.id===b.dataset.id)?null:{kind:'reg',id:b.dataset.id};form=null;linkFor=null;render();}
  else if(a==='linkopen'){if(needSetup())return;linkFor=b.dataset.k;form=null;render();}
  else if(a==='linkcancel'){linkFor=null;render();}
  else if(a==='linkgo'){g=guest(b.dataset.k);var sel=document.getElementById('lt');if(!g||!sel)return;act({action:'addname',id:sel.value,name:g.name},'Linked',function(){linkFor=null;});}
  else if(a==='simlink'){if(needSetup())return;act({action:'addname',id:b.dataset.id,name:b.dataset.name},'Linked');}
  else if(a==='addname'){var nm=val('fAlias');if(!nm.trim())return;act({action:'addname',id:b.dataset.id,name:nm},'Spelling added');}
  else if(a==='rmname'){act({action:'removename',id:b.dataset.id,key:b.dataset.v},'Spelling removed');}
  else if(a==='remove'){
    p=reg(b.dataset.id);if(!p)return;
    if(!window.confirm('Delete "'+p.nickname+'" from the registry?\n\nGames are not changed. The name becomes a guest again and stays off the leaderboard. Games set manually for this player also become guest games.'))return;
    act({action:'remove',id:p.id},'Deleted',function(){form=null;});
  }
});
document.addEventListener('change',function(e){
  var s=e.target;if(!s||!s.dataset||s.dataset.a!=='seatsel')return;
  act({action:'seatAssign',tableId:s.dataset.t,seat:+s.dataset.s,to:s.value},'Saved').then(function(r){if(r===null)reload();});
});
if(password){load().then(render).catch(function(){render();});}else{render();}
</script>
</body>
</html>
