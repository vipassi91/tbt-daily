<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F2A20" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Sign in | Tiles by Tiles</title>
<link rel="icon" type="image/png" href="/assets/i/0ba6198a03.png">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/assets/f/0ba66220fb.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/assets/f/2c20035257.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/assets/f/9e38e04780.woff2">
<style>
@font-face{font-family:"Playfair Display";font-style:normal;font-weight:400;font-display:swap;src:url(/assets/f/8a53e5ecdb.woff2) format("woff2");}
@font-face{font-family:"Playfair Display";font-style:normal;font-weight:700;font-display:swap;src:url(/assets/f/9401d0214a.woff2) format("woff2");}
@font-face{font-family:"Playfair Display";font-style:normal;font-weight:900;font-display:swap;src:url(/assets/f/0ba66220fb.woff2) format("woff2");}
@font-face{font-family:"Inter Tight";font-style:normal;font-weight:400;font-display:swap;src:url(/assets/f/2c20035257.woff2) format("woff2");}
@font-face{font-family:"Inter Tight";font-style:normal;font-weight:500;font-display:swap;src:url(/assets/f/5ab688ca8c.woff2) format("woff2");}
@font-face{font-family:"Inter Tight";font-style:normal;font-weight:700;font-display:swap;src:url(/assets/f/9e38e04780.woff2) format("woff2");}
</style>
<style>
:root{
  --bg:#FAF7F2; --surface:#FFFFFF; --text:#1B4332; --muted:#587263; --line:#E4DDCD;
  --field:#FBF9F4; --accent:#2D6A4F; --onaccent:#FAF7F2; --focus:#2D6A4F; --red:#B72323;
  --sans:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F2A20; --surface:#16382B; --text:#FAF7F2; --muted:#9DB8A9; --line:#26493B;
    --field:#12302A; --accent:#8FD0AE; --onaccent:#0F2A20; --focus:#8FD0AE; --red:#EA8888;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;justify-content:center;padding:24px 20px}
h1{font-family:var(--display);margin:0 0 8px;color:var(--text);font-weight:900;font-size:28px;line-height:1.15}
.box{max-width:420px;width:100%}
.box>img{display:block;width:52px;height:auto;margin:0 auto 16px}
.brand{text-align:center;font-size:12px;letter-spacing:.16em;font-weight:700;color:var(--accent);margin-bottom:16px}
h1,.hint{text-align:center}
.hint{font-size:14px;color:var(--muted);margin:0 0 24px;line-height:20px}
.f label{display:block;font-size:13px;font-weight:700;margin:16px 0 4px}
.f .sub{font-size:12px;color:var(--muted);margin:0 0 8px;line-height:16px}
.f input[type=text],.f input[type=tel],.f input[type=password]{font:inherit;font-size:16px;width:100%;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--text)}
.f input:focus{outline:none;border-color:var(--accent)}
.f .rule{font-size:12px;color:var(--muted);margin:4px 0 0;line-height:16px}
.who{display:flex;align-items:center;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:12px;background:var(--field);font-weight:700;margin-top:8px}
.ck,.f .ck{display:flex;gap:12px;align-items:flex-start;margin:16px 0 0;font-size:13px;font-weight:400;color:var(--muted);line-height:1.45}
.ck input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--accent)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
button{font:inherit;width:100%;margin-top:24px;border-radius:16px;padding:12px;border:none;background:var(--accent);color:var(--onaccent);font-weight:500;font-size:15px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.err{color:var(--red);font-size:13px;margin-top:12px;min-height:16px;text-align:center}
.done{text-align:center;padding:24px 8px;line-height:1.55}
.done b{display:block;font-family:var(--display);font-size:22px;margin-bottom:8px}
.done span{color:var(--muted);font-size:14px}
.lk{display:flex;align-items:center;justify-content:center;min-height:44px;margin-top:16px;color:var(--accent);font-size:14px;font-weight:500;text-decoration:none}
</style>
</head>
<body>
<div class="box">
  <img src="/assets/i/cfad30e8e7.png" alt="">
  <div class="brand">TILES BY TILES</div>
  <h1 id="h">Sign in</h1>
  <p class="hint" id="hint"></p>
  <div id="view"></div>
</div>
<script>
// /claim?t=<token>: the link the admin sent to the player's WhatsApp. It lets the player choose a password (and signs them in).
// /claim: signing in with the nickname and the password.
var T=new URLSearchParams(location.search).get('t')||'';
var view=document.getElementById('view'),h=document.getElementById('h'),hint=document.getElementById('hint');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function slug(n){return String(n||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,24)||'player';}
function post(url,body){return fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-tbt':'player'},body:JSON.stringify(body)}).then(function(r){return r.json().catch(function(){return {};}).then(function(j){return {ok:r.ok,status:r.status,body:j};});});}
function done(j){
  // the shortcut "My page" in the menu follows the player who signed in
  try{localStorage.setItem('tbt-me',JSON.stringify({id:j.id,name:j.nickname}));}catch(e){}
  location.replace('/players/'+encodeURIComponent(j.id)+'/'+slug(j.nickname));
}
function bad(msg){h.hidden=true;hint.hidden=true;view.innerHTML='<div class="done"><b>This link does not work</b><span>'+esc(msg)+'</span><a class="lk" href="/claim">Sign in</a><a class="lk" href="/index.html" style="margin-top:0">View leaderboard</a></div>';}
function val(id){return document.getElementById(id).value;}
function setPassword(nick){
  h.textContent='Set your password';hint.textContent='This link was made for '+nick+'. Pick a password you will remember: you use it with your nickname to sign in.';
  view.innerHTML='<div class="f"><label for="n">Nickname</label><div class="who" id="n">'+esc(nick)+'</div>'
    +'<label for="p1">New password</label><input id="p1" type="password" autocomplete="new-password" maxlength="200"><p class="rule">At least 8 characters, and not part of your phone number.</p>'
    +'<label for="p2">Repeat it</label><input id="p2" type="password" autocomplete="new-password" maxlength="200">'
    +'<button id="go" type="button">Save and continue</button><div class="err" id="err" role="alert"></div></div>';
  document.getElementById('go').addEventListener('click',function(){
    var err=document.getElementById('err'),btn=document.getElementById('go');err.textContent='';
    if(val('p1').length<8){err.textContent='Use at least 8 characters.';return;}
    if(val('p1')!==val('p2')){err.textContent='The two passwords are not the same.';return;}
    btn.disabled=true;
    post('/api/player/claim',{t:T,password:val('p1')}).then(function(r){
      if(!r.ok){err.textContent=r.body.error||'Could not save. Please try again.';btn.disabled=false;return;}
      done(r.body);
    }).catch(function(){err.textContent='No connection. Please try again.';btn.disabled=false;});
  });
  document.getElementById('p1').focus();
}
function signIn(){
  h.textContent='Sign in';hint.textContent='Sign in to edit your profile.';
  view.innerHTML='<div class="f"><label for="nick">Nickname</label><input id="nick" type="text" maxlength="40" autocomplete="username" autocapitalize="none">'
    +'<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" maxlength="200">'
    +'<button id="go" type="button">Sign in</button><div class="err" id="err" role="alert"></div>'
    +'<div class="done" style="padding:8px 0 0"><span style="font-size:13px">No password yet, or forgot it? Open your player page and tap \u201cWant to edit your profile?\u201d to get a new link on WhatsApp.</span></div></div>';
  function go(){
    var err=document.getElementById('err'),btn=document.getElementById('go');err.textContent='';
    if(!val('nick').trim()||!val('pw')){err.textContent='Enter your nickname and password.';return;}
    btn.disabled=true;
    post('/api/player/login',{nickname:val('nick'),password:val('pw')}).then(function(r){
      if(!r.ok){err.textContent=r.body.error||'Could not sign in. Please try again.';btn.disabled=false;return;}
      done(r.body);
    }).catch(function(){err.textContent='No connection. Please try again.';btn.disabled=false;});
  }
  document.getElementById('go').addEventListener('click',go);
  view.addEventListener('keydown',function(e){if(e.key==='Enter')go();});
}
if(T){
  fetch('/api/player/claim?t='+encodeURIComponent(T)).then(function(r){return r.json().then(function(j){return {ok:r.ok,body:j};});})
    .then(function(r){if(r.ok&&r.body.ok)setPassword(r.body.nickname);else bad(r.body.error||'Ask for a new one on your page.');})
    .catch(function(){bad('Could not check the link. Please try again.');});
}else signIn();
</script>
</body>
</html>
